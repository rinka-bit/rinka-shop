0 3px 10px

.cart-btn{

#cartCount{

position:absolute;

right:-8px;

background:#ff5c7a;

color:white;

font-size:12px;

padding:2px 6px;

border-radius:20px;

}

.overlay{

position:fixed;

inset:0;

background:rgba(0,0,0,.35);

z-index:999;

opacity:1;

transition:.25s;

}

.overlay.hidden{

opacity:0;

pointer-events:none;

}

top:0;

left:0;

width:280px;

background:#fff;

z-index:1000;

box-shadow:0 0 30px rgba(0,0,0,.15);

transform:translateX(-100%);

transition:.3s ease;

}

.side-menu.open{

}

.menu-header{

}

.side-menu a{

padding:18px 24px;

}

.side-menu a:hover{

}

.back-btn{

<body>

<header class="page-header">

</div>

<a href="home.html">🏠 หน้าแรก</a>

<h1>
📦 ค้นหาออเดอร์
</h1>

<h3>
📧 ค้นหาด้วยอีเมล
</h3>

<input
id="email"
placeholder="กรอกอีเมลที่ใช้สั่งซื้อ">

<h3>
🐦 ค้นหาด้วย Twitter/X
</h3>

<input
id="social"
placeholder="@username">

<button
onclick="searchOrders()">

ค้นหา

</button>

<br><br>

<div id="result"></div>

<script>

const API =
"https://script.google.com/macros/s/AKfycbxKjVvn8AXrK0wDvKqN-A9yS2Vk8R-w25ar1b9ftiIdUgUvFaShunLnFnAyIDuaTWj76w/exec";

async function searchOrders(){

const email =
document
.getElementById("email")
.value
.trim();

const social =
document
.getElementById("social")
.value
.trim();

if(
!email &&
!social
){

alert(
"กรุณากรอกอีเมลหรือ Twitter/X"
);

return;

}
  
let url = "";

if(email){

url =

API +

"?action=ordersByEmail&email=" +

encodeURIComponent(email);

}
else{

url =

API +

"?action=ordersBySocial&social=" +

encodeURIComponent(social);

}

const response =
await fetch(url);

const result =
await response.json();

let html = "";

if(
!result.orders ||
result.orders.length === 0
){

html =
`
<div class="card">

ไม่พบออเดอร์

</div>
`;

}
else{

result.orders.forEach(order=>{

html += `
<div class="card">

<h3>

${order.order_id}

</h3>

<p>

สถานะ:
${order.status}

</p>

<p>

การชำระเงิน:
${order.payment_status}

</p>

<p>

ยอดรวม:
${order.total}
บาท

</p>

<a href="order.html?id=${order.order_id}">

ดูรายละเอียด

</a>

</div>
`;

});

}

document
.getElementById("result")
.innerHTML = html;

}

updateCartCount();

function updateCartCount(){

const cart =

JSON.parse(
localStorage.getItem(
"cart"
) || "[]"
);

const count =

cart.reduce(

(sum,item)=>

sum +
Number(item.qty || 0),

0

);

const cartCount =
document.getElementById(
"cartCount"
);

if(cartCount){

cartCount.textContent =
count;

}

}

</script>

<script src="menu.js"></script>
  
</body>
