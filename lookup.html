<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1">

<title>
ค้นหาออเดอร์
</title>

<style>

body{
font-family:Arial,sans-serif;
max-width:800px;
margin:auto;
padding:20px;
}

.card{
background:white;
padding:20px;
border-radius:12px;
margin-bottom:15px;
box-shadow:0 2px 8px rgba(0,0,0,.08);
}

input{
width:100%;
padding:12px;
box-sizing:border-box;
margin-bottom:10px;
}

button{
padding:12px 20px;
border:none;
border-radius:8px;
background:#4f46e5;
color:white;
cursor:pointer;
}

</style>

</head>

<body>

<h1>
📦 ค้นหาออเดอร์
</h1>

<input
id="email"
placeholder="กรอกอีเมลที่ใช้สั่งซื้อ">

<button
onclick="searchOrders()">

ค้นหา

</button>

<br><br>

<div id="result"></div>

<script>

const API =
"https://script.google.com/macros/s/AKfycbxKjVvn8AXrK0wDvKqN-A9yS2Vk8R-w25ar1b9ftiIdUgUvFaShunLnFnAyIDuaTWj76w/exec";

async function searchOrders(){

const email =
document
.getElementById("email")
.value
.trim();

if(!email){

alert(
"กรุณากรอกอีเมล"
);

return;

}

const response =
await fetch(

API +

"?action=ordersByEmail&email=" +

encodeURIComponent(email)

);

const result =
await response.json();

let html = "";

if(
!result.orders ||
result.orders.length === 0
){

html =
`
<div class="card">

ไม่พบออเดอร์

</div>
`;

}
else{

result.orders.forEach(order=>{

html += `
<div class="card">

<h3>

${order.order_id}

</h3>

<p>

สถานะ:
${order.status}

</p>

<p>

การชำระเงิน:
${order.payment_status}

</p>

<p>

ยอดรวม:
${order.total}
บาท

</p>

<a href="order.html?id=${order.order_id}">

ดูรายละเอียด

</a>

</div>
`;

});

}

document
.getElementById("result")
.innerHTML = html;

}

</script>

</body>

</html>
