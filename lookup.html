<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>เช็กออเดอร์ | Rinka Shop</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f6fbfe;color:#334b5b;font-family:Kodchasan,Arial,sans-serif}
main{max-width:850px;margin:auto;padding:28px 16px 60px}
.card{background:#fff;border:1px solid #dcebf3;border-radius:20px;padding:18px;box-shadow:0 8px 24px rgba(75,126,158,.08)}
h1{margin:0 0 8px;color:#3f6078} .muted{color:#7890a0;font-size:13px}
.search{display:flex;gap:10px;margin-top:18px} input{flex:1;padding:13px 14px;border:1px solid #d7e6ef;border-radius:13px;font:inherit}
button{border:0;border-radius:13px;padding:12px 18px;background:#75bce6;color:white;font-weight:700;cursor:pointer}
#result{display:grid;gap:14px;margin-top:18px}
.order{background:#fff;border:1px solid #dcebf3;border-radius:18px;padding:16px}
.head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start} .id{font-weight:800;color:#365f7b;overflow-wrap:anywhere}
.source{font-size:11px;padding:5px 9px;border-radius:999px;background:#edf7fd;color:#397aa4;font-weight:700}
.meta{display:flex;flex-wrap:wrap;gap:7px;margin:10px 0} .badge{font-size:11px;padding:5px 9px;border-radius:999px;background:#f2f6f8}
.items{border-top:1px solid #edf2f5;margin-top:12px;padding-top:10px;display:grid;gap:8px}
.item{display:flex;justify-content:space-between;gap:12px;font-size:13px} .option{color:#8295a2;font-size:11px}
.money{margin-top:12px;border-top:1px solid #edf2f5;padding-top:10px;display:grid;gap:5px}
.row{display:flex;justify-content:space-between;gap:10px} .total{font-size:17px;font-weight:800;color:#347aa6}
.state{text-align:center;padding:28px;color:#7890a0}
@media(max-width:600px){.search{flex-direction:column}.head{flex-direction:column}}
</style>
</head>
<body>
<main>
<section class="card">
<h1>🔎 เช็กออเดอร์</h1>
<div class="muted">กรอก Twitter / X ที่ใช้สั่งซื้อ ระบบจะรวมออเดอร์จากหน้าเว็บ, DM Invoice และออเดอร์เก่าให้ในที่เดียว</div>
<div class="search">
<input id="twitter" placeholder="@username" autocomplete="off">
<button onclick="searchOrders()">ค้นหาออเดอร์</button>
</div>
<div class="muted" style="margin-top:10px">หน้านี้ไม่แสดง Email, เบอร์โทร, ที่อยู่ หรือสลิปการชำระเงิน</div>
</section>
<div id="result"></div>
</main>
<script>
const API="https://script.google.com/macros/s/AKfycbxKjVvn8AXrK0wDvKqN-A9yS2Vk8R-w25ar1b9ftiIdUgUvFaShunLnFnAyIDuaTWj76w/exec";
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
const money=v=>"฿"+Number(v||0).toLocaleString("th-TH",{minimumFractionDigits:0,maximumFractionDigits:2});
const norm=v=>String(v||"").trim().replace(/^https?:\/\/(www\.)?(twitter\.com|x\.com)\//i,"").replace(/^@/,"").split(/[/?#]/)[0].trim();
const sourceLabel=s=>s==="web"?"Web Order":s==="dm"?"DM Invoice":"Legacy";
const statusLabel=s=>({pending:"รอกดสั่งสินค้า",pending_order:"รอกดสั่งสินค้า",china_arrived:"กดสั่งสินค้าแล้ว",shipping_to_th:"กำลังมาไทย",ready_to_ship:"เตรียมจัดส่ง",shipped:"จัดส่งแล้ว",completed:"เสร็จสิ้น",paid:"ชำระแล้ว",unpaid:"ยังไม่ชำระ",submitted:"แจ้งชำระแล้ว",payment_submitted:"แจ้งชำระแล้ว",partial:"ชำระบางส่วน"}[String(s||"").toLowerCase()]||s||"-");
function fmtDate(v){if(!v)return "-";const d=new Date(v);return isNaN(d)?esc(v):d.toLocaleString("th-TH",{dateStyle:"medium",timeStyle:"short"})}
async function searchOrders(){
 const twitter=norm(document.getElementById("twitter").value);
 const box=document.getElementById("result");
 if(!twitter){box.innerHTML='<div class="state">กรุณากรอก Twitter / X</div>';return}
 box.innerHTML='<div class="state">⏳ กำลังค้นหาออเดอร์...</div>';
 try{
  const q=new URLSearchParams({action:"publicUnifiedOrderLookup",twitter});
  const r=await fetch(API+"?"+q.toString());
  const data=await r.json();
  if(!data||data.success!==true)throw new Error(data?.error||"ค้นหาไม่สำเร็จ");
  const orders=Array.isArray(data.orders)?data.orders:[];
  if(!orders.length){box.innerHTML='<div class="state">ไม่พบออเดอร์ของ @'+esc(twitter)+'</div>';return}
  box.innerHTML=orders.map(renderOrder).join("");
 }catch(e){box.innerHTML='<div class="state">โหลดข้อมูลไม่สำเร็จ<br>'+esc(e.message||e)+'</div>'}
}
function renderOrder(o){
 const items=Array.isArray(o.items)?o.items:[];
 const itemHtml=items.length?items.map(i=>`<div class="item"><div><b>${esc(i.name||"สินค้า")}</b>${i.option?`<div class="option">${esc(i.option)}</div>`:""}<div class="option">จำนวน ${Number(i.qty||0)} ชิ้น</div></div><div>${Number(i.unit_price||0)>0?money(Number(i.total||0)||Number(i.unit_price||0)*Number(i.qty||0)):""}</div></div>`).join(""):'<div class="muted">ไม่มีรายละเอียดสินค้าในข้อมูลเดิม</div>';
 const fees=[];
 if(Number(o.import_fee||0))fees.push(`<div class="row"><span>ค่านำเข้า</span><span>${money(o.import_fee)}</span></div>`);
 if(Number(o.crate_fee||0))fees.push(`<div class="row"><span>ค่าตีลัง</span><span>${money(o.crate_fee)}</span></div>`);
 if(Number(o.domestic_shipping_fee||0))fees.push(`<div class="row"><span>ค่าส่งในไทย</span><span>${money(o.domestic_shipping_fee)}</span></div>`);
 return `<article class="order"><div class="head"><div><div class="id">${esc(o.order_id)}</div><div class="muted">${fmtDate(o.created_at)}</div></div><span class="source">${sourceLabel(o.source)}</span></div><div class="meta"><span class="badge">${esc(statusLabel(o.status))}</span><span class="badge">${esc(statusLabel(o.payment_status))}</span>${o.tracking_no?`<span class="badge">${esc(o.courier||"Tracking")}: ${esc(o.tracking_no)}</span>`:""}</div><div class="items">${itemHtml}</div><div class="money"><div class="row"><span>ยอดสินค้า</span><span>${money(o.subtotal)}</span></div>${fees.join("")}<div class="row total"><span>ยอดรวม</span><span>${money(o.total)}</span></div></div></article>`;
}
document.getElementById("twitter").addEventListener("keydown",e=>{if(e.key==="Enter")searchOrders()});
</script>
</body>
</html>
