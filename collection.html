<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1">

<title>Collection</title>

<link rel="stylesheet" href="style.css">

<style>

.container{
max-width:1200px;
margin:auto;
padding:15px;
}

.banner{
background:white;
padding:16px;
border-radius:16px;
margin-bottom:20px;
box-shadow:0 2px 8px rgba(0,0,0,.05);
}

.banner h1{
font-size:32px;
margin:0 0 10px;
}

.collection-desc{
font-size:14px;
color:#666;
margin-bottom:10px;
}

.deadline{
color:#ef4444;
font-weight:700;
font-size:14px;
}

.collection-banner{
width:100%;
border-radius:12px;
margin-bottom:15px;
}

.grid{
display:grid;
grid-template-columns:
repeat(2,1fr);
gap:12px;
}

.card{
background:white;
border-radius:12px;
overflow:hidden;
cursor:pointer;
box-shadow:0 2px 8px rgba(0,0,0,.05);
transition:.2s;
}

.card:hover{
transform:translateY(-3px);
}

.card img{
width:100%;
height:170px;
object-fit:cover;
}

.card-body{
padding:10px;
}

.card h3{
font-size:15px;
line-height:1.4;
margin:0 0 8px;
}

.price{
font-size:15px;
font-weight:bold;
color:#4f46e5;
}

.price-box{
display:flex;
align-items:center;
gap:8px;
flex-wrap:wrap;
}

.sale-price{
font-size:16px;
font-weight:700;
color:#ef4444;
}

.old-price{
font-size:13px;
color:#94a3b8;
text-decoration:line-through;
}

.normal-price{
font-size:15px;
font-weight:700;
color:#4f46e5;
}

.topbar{

display:flex;

justify-content:
space-between;

align-items:center;

margin-bottom:15px;

}

.topbar button,
.topbar a{

width:44px;
height:44px;

border:none;

border-radius:999px;

background:white;

display:flex;
align-items:center;
justify-content:center;

text-decoration:none;

font-size:20px;

box-shadow:
0 2px 8px rgba(0,0,0,.08);

cursor:pointer;

}

</style>

</head>

<body>

<div class="topbar">

<button
onclick="history.back()">

←

</button>

<a href="cart.html">

🛒

</a>

</div>
  
<div class="container">

<div
id="collectionInfo"
class="banner">
</div>

<input
id="collectionSearch"
type="text"
placeholder="🔍 ค้นหาสินค้าใน Collection..."
style="
width:100%;
padding:12px;
margin:20px 0;
border:1px solid #ddd;
border-radius:12px;
box-sizing:border-box;
font-size:15px;
">

<div
id="productGrid"
class="grid">
</div>

</div>

<script>

const API =
"https://script.google.com/macros/s/AKfycbxKjVvn8AXrK0wDvKqN-A9yS2Vk8R-w25ar1b9ftiIdUgUvFaShunLnFnAyIDuaTWj76w/exec";

const params =
new URLSearchParams(
window.location.search
);

const collectionId =
params.get("id");

let allProducts = [];
  
loadCollection();

async function loadCollection(){

  try{

    const collectionResponse =
      await fetch(
        API +
        "?action=collection&id=" +
        encodeURIComponent(
          collectionId
        )
      );

    const collectionResult =
      await collectionResponse.json();

    const collection =
      collectionResult.collection ||
      collectionResult;

    const productResponse =
      await fetch(
        API +
        "?action=collectionProducts&id=" +
        encodeURIComponent(
          collectionId
        )
      );

    const productResult =
      await productResponse.json();

    const products =
      Array.isArray(productResult)
        ? productResult
        : Array.isArray(productResult.products)
          ? productResult.products
          : [];

    renderCollection(
      collection,
      products.length
    );

    allProducts =
      products;

    renderProducts(
      allProducts
    );

  }catch(error){

    console.error(
      "loadCollection error",
      error
    );

    document.getElementById(
      "collectionInfo"
    ).innerHTML =
      "<p>โหลดข้อมูล Collection ไม่สำเร็จ</p>";

  }

}

function renderCollection(
data,
productCount
){

let daysLeft = "";

if(
data.preorder_deadline
){

const deadline =
new Date(
data.preorder_deadline
);

const today =
new Date();

const diff =
Math.ceil(
(deadline - today)
/
(1000*60*60*24)
);

if(diff > 0){

daysLeft =
`เหลืออีก ${diff} วัน`;

}

}

document.getElementById(
"collectionInfo"
).innerHTML = `

${data.banner_image ? `
<img
src="${data.banner_image}"
class="collection-banner">
` : ""}

<h1>
${data.name}
</h1>

<p class="collection-desc">
${data.description || ""}
</p>

${daysLeft ? `
<div class="deadline">
${daysLeft}
</div>
` : ""}

<p
style="
margin-top:10px;
font-weight:600;
color:#666;
">

${productCount}
รายการ

</p>

`;

}

function renderProducts(products){

let html = "";

products.forEach(product=>{

html += `

<div
class="card"
onclick="
window.location.href=
'product.html?id=${product.product_id}'
">

<img
src="${product.image}">

<div class="card-body">

<h3>
${product.name}
</h3>

<div class="price-box">

${
  product.on_sale

  ?

  `

  <div class="sale-price">

  ฿${Number(
    product.price || 0
  ).toLocaleString()}

  </div>

  <div class="old-price">

  ฿${Number(
    product.old_price || 0
  ).toLocaleString()}

  </div>

  `

  :

  `

  <div class="normal-price">

  ฿${Number(
    product.price || 0
  ).toLocaleString()}

  </div>

  `

}

</div>

</div>

</div>

`;

});

document.getElementById(
"productGrid"
).innerHTML = html;

}

document.addEventListener(
"input",
e=>{

if(
e.target.id !==
"collectionSearch"
){
return;
}

const keyword =

e.target.value
.toLowerCase()
.trim();

if(!keyword){

renderProducts(
allProducts
);

return;

}

const filtered =

allProducts.filter(
product =>

(product.name || "")
.toLowerCase()
.includes(
keyword
)

||

(product.fandom || "")
.toLowerCase()
.includes(
keyword
)

||

(product.sub_category || "")
.toLowerCase()
.includes(
keyword
)

);

renderProducts(
filtered
);

});
  
</script>

</body>

</html>
