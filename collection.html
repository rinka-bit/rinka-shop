<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Collection | Rinka Shop</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link
href="https://fonts.googleapis.com/css2?family=Kodchasan:wght@400;500;600;700&display=swap"
rel="stylesheet">

<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="cart-drawer.css">
<style>

:root{
  --collection-primary:#7dcfff;
  --collection-primary-dark:#4da6dc;
  --collection-background:#f6fbff;
  --collection-card:#ffffff;
  --collection-text:#334155;
  --collection-muted:#64748b;
  --collection-border:#dbe7f1;
  --collection-danger:#ef4444;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:'Kodchasan',sans-serif;
  color:var(--collection-text);
  background:
    linear-gradient(
      180deg,
      #f9fdff 0%,
      var(--collection-background) 100%
    );
}

button,
input,
a{
  font:inherit;
}

button{
  cursor:pointer;
}

.collection-topbar{
  position:sticky;
  top:0;
  z-index:100;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:14px 18px;
  background:rgba(255,255,255,.92);
  border-bottom:1px solid rgba(219,231,241,.9);
  backdrop-filter:blur(10px);
}

.collection-topbar button,
.collection-topbar a{
  width:46px;
  height:46px;
  border:none;
  border-radius:999px;
  background:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  text-decoration:none;
  color:var(--collection-text);
  font-size:21px;
  box-shadow:0 5px 16px rgba(71,85,105,.10);
}

.collection-topbar h1{
  margin:0;
  padding:0 12px;
  flex:1;
  text-align:center;
  font-size:20px;
  color:#3f6078;
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
}

.collection-cart{
  position:relative;
}

.collection-cart-count{
  position:absolute;
  top:-5px;
  right:-5px;
  min-width:20px;
  height:20px;
  padding:0 5px;
  border-radius:999px;
  background:#ff5c7a;
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:10px;
  font-weight:700;
}

.collection-container{
  width:min(1220px,100%);
  margin:auto;
  padding:22px 18px 48px;
}

.collection-banner-card{
  overflow:hidden;
  margin-bottom:18px;
  background:#fff;
  border:1px solid var(--collection-border);
  border-radius:24px;
  box-shadow:0 14px 38px rgba(86,142,178,.10);
}

.collection-banner-image{
  width:100%;
  max-height:430px;
  display:block;
  object-fit:cover;
  background:#edf7fc;
}

.collection-banner-content{
  padding:22px;
}

.collection-label{
  display:inline-flex;
  align-items:center;
  padding:5px 10px;
  border-radius:999px;
  background:#e0f2fe;
  color:#0369a1;
  font-size:12px;
  font-weight:700;
  margin-bottom:10px;
}

.collection-name{
  margin:0;
  font-size:clamp(26px,4vw,42px);
  line-height:1.35;
  color:#35556e;
  overflow-wrap:anywhere;
}

.collection-fandom{
  margin-top:8px;
  color:#4f84a5;
  font-weight:600;
}

.collection-desc{
  margin:13px 0 0;
  color:var(--collection-muted);
  line-height:1.75;
  white-space:pre-line;
}

.collection-meta{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  margin-top:18px;
}

.collection-meta-item{
  display:inline-flex;
  align-items:center;
  gap:6px;
  min-height:36px;
  padding:7px 11px;
  border-radius:999px;
  background:#f8fbfd;
  border:1px solid var(--collection-border);
  color:#49697f;
  font-size:13px;
  font-weight:600;
}

.collection-deadline{
  background:#fff7ed;
  border-color:#fed7aa;
  color:#c2410c;
}

.collection-deadline.today{
  background:#fef2f2;
  border-color:#fecaca;
  color:#b91c1c;
}

.collection-deadline.closed{
  background:#f1f5f9;
  border-color:#cbd5e1;
  color:#64748b;
}

.collection-toolbar{
  position:sticky;
  top:75px;
  z-index:40;
  margin:20px 0;
  padding:12px;
  display:flex;
  gap:10px;
  align-items:center;
  background:rgba(255,255,255,.94);
  border:1px solid var(--collection-border);
  border-radius:18px;
  box-shadow:0 8px 22px rgba(71,85,105,.08);
  backdrop-filter:blur(10px);
}

.collection-search-wrap{
  position:relative;
  flex:1;
}

.collection-search-wrap::before{
  content:"🔍";
  position:absolute;
  left:13px;
  top:50%;
  transform:translateY(-50%);
  pointer-events:none;
  font-size:15px;
}

#collectionSearch{
  width:100%;
  min-height:46px;
  padding:11px 42px 11px 42px;
  border:1px solid #d7e3ec;
  border-radius:13px;
  background:#fff;
  outline:none;
}

#collectionSearch:focus{
  border-color:var(--collection-primary-dark);
  box-shadow:0 0 0 3px rgba(125,207,255,.16);
}

.clear-search-button{
  position:absolute;
  top:50%;
  right:8px;
  transform:translateY(-50%);
  width:30px;
  height:30px;
  padding:0;
  border:none;
  border-radius:999px;
  background:#edf4f8;
  color:#526b7c;
  display:none;
}

.clear-search-button.show{
  display:block;
}

.collection-result-count{
  flex:0 0 auto;
  padding:0 5px;
  color:var(--collection-muted);
  font-size:13px;
  font-weight:600;
  white-space:nowrap;
}

.collection-grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:14px;
}

.collection-product-card{
  position:relative;
  min-width:0;
  overflow:hidden;
  background:#fff;
  border:1px solid var(--collection-border);
  border-radius:18px;
  cursor:pointer;
  transition:.22s ease;
  box-shadow:0 7px 20px rgba(86,142,178,.07);
}

.collection-product-card:hover{
  transform:translateY(-4px);
  box-shadow:0 15px 32px rgba(86,142,178,.14);
}

.collection-product-card:focus-visible{
  outline:3px solid rgba(77,166,220,.28);
  outline-offset:3px;
}

.collection-image-box{
  position:relative;
  aspect-ratio:1/1;
  overflow:hidden;
  background:#edf7fc;
}

.collection-image-box img{
  width:100%;
  height:100%;
  display:block;
  object-fit:cover;
  transition:.3s ease;
}

.collection-product-card:hover .collection-image-box img{
  transform:scale(1.04);
}

.collection-image-placeholder{
  width:100%;
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#94a3b8;
  font-size:13px;
}

.collection-card-badges{
  position:absolute;
  top:10px;
  left:10px;
  right:10px;
  display:flex;
  justify-content:space-between;
  gap:8px;
  pointer-events:none;
}

.collection-card-badge{
  display:inline-flex;
  align-items:center;
  min-height:24px;
  padding:4px 8px;
  border-radius:999px;
  font-size:10px;
  font-weight:700;
  box-shadow:0 4px 10px rgba(15,23,42,.10);
}

.badge-preorder{
  background:#ffedd5;
  color:#9a3412;
}

.badge-stock{
  background:#dcfce7;
  color:#166534;
}

.badge-sale{
  margin-left:auto;
  background:#ffe4e6;
  color:#9f1239;
}

.collection-card-body{
  padding:13px;
}

.collection-card-title{
  min-height:44px;
  margin:0;
  color:#334155;
  font-size:14px;
  line-height:1.5;
  display:-webkit-box;
  -webkit-line-clamp:2;
  -webkit-box-orient:vertical;
  overflow:hidden;
}

.collection-card-fandom{
  margin-top:6px;
  color:#7a8b99;
  font-size:12px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.collection-price-box{
  display:flex;
  align-items:flex-end;
  flex-wrap:wrap;
  gap:7px;
  margin-top:11px;
}

.collection-sale-price,
.collection-normal-price{
  color:#347fb4;
  font-size:19px;
  font-weight:700;
}

.collection-sale-price{
  color:#e84a68;
}

.collection-old-price{
  color:#94a3b8;
  font-size:12px;
  text-decoration:line-through;
}

.collection-card-deadline{
  margin-top:10px;
  color:#ea580c;
  font-size:12px;
  font-weight:600;
}

.collection-state{
  min-height:350px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:11px;
  text-align:center;
  padding:32px 18px;
  background:#fff;
  border:1px solid var(--collection-border);
  border-radius:22px;
}

.collection-state h2,
.collection-state p{
  margin:0;
}

.collection-state p{
  color:var(--collection-muted);
}

.collection-state-icon{
  font-size:52px;
}

.collection-spinner{
  width:38px;
  height:38px;
  border:4px solid #dff2fc;
  border-top-color:var(--collection-primary-dark);
  border-radius:50%;
  animation:collectionSpin .8s linear infinite;
}

@keyframes collectionSpin{
  to{transform:rotate(360deg)}
}

.collection-state-button{
  border:none;
  border-radius:999px;
  padding:11px 18px;
  background:var(--collection-primary);
  color:#fff;
  font-weight:700;
  text-decoration:none;
}

.hidden{
  display:none !important;
}

@media(min-width:720px){

  .collection-grid{
    grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
    gap:18px;
  }

  .collection-card-title{
    font-size:15px;
  }

}

@media(max-width:640px){

  .collection-topbar{
    padding:11px 12px;
  }

  .collection-topbar h1{
    font-size:17px;
  }

  .collection-container{
    padding:14px 12px 34px;
  }

  .collection-banner-card{
    border-radius:19px;
  }

  .collection-banner-content{
    padding:16px;
  }

  .collection-toolbar{
    top:68px;
    align-items:stretch;
    flex-direction:column;
    border-radius:15px;
  }

  .collection-result-count{
    padding:0 3px 2px;
  }

  .collection-grid{
    gap:10px;
  }

  .collection-card-body{
    padding:10px;
  }

  .collection-card-title{
    font-size:13px;
    min-height:40px;
  }

  .collection-sale-price,
  .collection-normal-price{
    font-size:17px;
  }

}

@media(max-width:640px){

  .collection-container{
    padding:
      12px
      10px
      30px;
  }

  .collection-banner-card{
    margin-bottom:14px;
  }

  .collection-banner-content{
    padding:14px;
  }

  .collection-name{
    font-size:23px;
  }

  .collection-fandom{
    font-size:12px;
  }

  .collection-desc{
    font-size:12px;
    line-height:1.65;
  }

  .collection-meta{
    gap:7px;
    margin-top:13px;
  }

  .collection-meta-item{
    min-height:32px;
    padding:6px 9px;
    font-size:11px;
  }

  .collection-toolbar{
    margin:14px 0;
    padding:9px;
  }

  #collectionSearch{
    min-height:43px;
    font-size:13px;
  }

  .collection-grid{
    gap:9px;
  }

  .collection-product-card{
    border-radius:14px;
  }

  .collection-card-body{
    padding:9px;
  }

  .collection-card-title{
    min-height:38px;
    font-size:12px;
  }

  .collection-card-fandom{
    margin-top:4px;
    font-size:10px;
  }

  .collection-price-box{
    margin-top:8px;
  }

  .collection-sale-price,
  .collection-normal-price{
    font-size:16px;
  }

  .collection-card-deadline{
    margin-top:7px;
    font-size:10px;
  }

}

</style>

</head>

<body>

<header class="collection-topbar">

<button
type="button"
aria-label="กลับหน้าก่อนหน้า"
onclick="goCollectionBack()">
←
</button>

<h1 id="collectionPageTitle">
Collection
</h1>

<button
type="button"
class="collection-cart"
onclick="openCartDrawer()"
aria-label="เปิดตะกร้าสินค้า">

  <span>🛒</span>

  <span
  id="collectionCartCount"
  class="collection-cart-count">
    0
  </span>

</button>

</header>

<main class="collection-container">

<section
id="collectionInfo"
class="collection-state">

<div
class="collection-spinner"
aria-hidden="true">
</div>

<h2>กำลังโหลด Collection</h2>

<p>กำลังเตรียมข้อมูลสินค้าให้ค่ะ</p>

</section>

<section
id="collectionProductsSection"
class="hidden">

<div class="collection-toolbar">

<div class="collection-search-wrap">

<input
id="collectionSearch"
type="search"
placeholder="ค้นหาสินค้าใน Collection..."
autocomplete="off"
aria-label="ค้นหาสินค้าใน Collection">

<button
id="clearCollectionSearch"
type="button"
class="clear-search-button"
aria-label="ล้างคำค้น"
onclick="clearCollectionSearch()">
✕
</button>

</div>

<div
id="collectionResultCount"
class="collection-result-count">
0 รายการ
</div>

</div>

<div
id="productGrid"
class="collection-grid">
</div>

<div
id="collectionEmptyState"
class="collection-state hidden">

<div class="collection-state-icon">
🔍
</div>

<h2>ไม่พบสินค้า</h2>

<p>
ลองเปลี่ยนคำค้น หรือเคลียร์ช่องค้นหาดูนะคะ
</p>

<button
type="button"
class="collection-state-button"
onclick="clearCollectionSearch()">
ล้างคำค้น
</button>

</div>

</section>

</main>

<script src="catalog.js?v=20260819-2"></script>

<script>

const API =
"https://script.google.com/macros/s/AKfycbxKjVvn8AXrK0wDvKqN-A9yS2Vk8R-w25ar1b9ftiIdUgUvFaShunLnFnAyIDuaTWj76w/exec";

const params =
  new URLSearchParams(
    window.location.search
  );

const collectionId =
  params.get("id");

let allProducts = [];
let currentCollection = null;
let collectionSearchTimer = null;

document.addEventListener(
  "DOMContentLoaded",
  ()=>{

    updateCollectionCartCount();

    const searchInput =
      document.getElementById(
        "collectionSearch"
      );

    if(searchInput){

      searchInput.addEventListener(
        "input",
        handleCollectionSearch
      );

    }

    loadCollection();

  }
);

async function loadCollection(){

  if(!collectionId){

    renderCollectionError(
      "ไม่พบรอบพรีออเดอร์",
      "ลิงก์ Collection นี้ไม่สมบูรณ์"
    );

    return;

  }


  renderCollectionLoading();


  try{

    const catalog =
      await RinkaCatalog.load();


    /*
    =========================================
    COLLECTION
    =========================================
    */

    const collections =
      Array.isArray(
        catalog.collections
      )
        ? catalog.collections
        : [];


    const collection =
      collections.find(
        item =>
          String(
            item.collection_id || ""
          ).trim() ===
          String(
            collectionId || ""
          ).trim()
      );


    if(!collection){

      renderCollectionNotFound();

      return;

    }


    /*
    =========================================
    PRODUCTS
    =========================================
    */

    const products =
      (
        Array.isArray(
          catalog.products
        )
          ? catalog.products
          : []
      ).filter(
        product =>
          String(
            product.collection_id || ""
          ).trim() ===
          String(
            collectionId || ""
          ).trim()
      );


    /*
    =========================================
    STORE PAGE STATE
    =========================================
    */

    currentCollection =
      collection;


    allProducts =
      products;


    /*
    =========================================
    PAGE TITLE
    =========================================
    */

    const title =
      String(
        collection.name ||
        "Collection"
      );


    document
      .getElementById(
        "collectionPageTitle"
      )
      .textContent =
        title;


    document.title =
      title +
      " | Rinka Shop";


    /*
    =========================================
    RENDER
    =========================================
    */

    renderCollectionInfo(
      collection,
      products.length
    );


    renderCollectionProducts(
      products
    );


    const productsSection =
      document.getElementById(
        "collectionProductsSection"
      );


    if(productsSection){

      productsSection
        .classList
        .remove(
          "hidden"
        );

    }


    console.log(
      "COLLECTION CATALOG:",
      catalog.source,
      collectionId,
      products.length,
      "products"
    );


  }catch(error){

    console.error(
      "loadCollection error:",
      error
    );


    renderCollectionError(
      "โหลด Collection ไม่สำเร็จ",
      error.message ||
      "กรุณาลองใหม่อีกครั้ง"
    );

  }

}

function renderCollectionLoading(){

  const info =
    document.getElementById(
      "collectionInfo"
    );

  const productsSection =
    document.getElementById(
      "collectionProductsSection"
    );

  if(productsSection){

    productsSection.classList.add(
      "hidden"
    );

  }

  if(info){

    info.className =
      "collection-state";

    info.innerHTML = `

<div
class="collection-spinner"
aria-hidden="true">
</div>

<h2>กำลังโหลด Collection</h2>

<p>กำลังเตรียมข้อมูลสินค้าให้ค่ะ</p>

`;

  }

}

function renderCollectionNotFound(){

  const info =
    document.getElementById(
      "collectionInfo"
    );

  info.className =
    "collection-state";

  info.innerHTML = `

<div class="collection-state-icon">
📦
</div>

<h2>ไม่พบ Collection</h2>

<p>
Collection นี้อาจถูกปิดหรือไม่มีอยู่แล้ว
</p>

<a
href="browse.html"
class="collection-state-button">
ดูสินค้าทั้งหมด
</a>

`;

}

function renderCollectionError(
  title,
  message
){

  const info =
    document.getElementById(
      "collectionInfo"
    );

  info.className =
    "collection-state";

  info.innerHTML = `

<div class="collection-state-icon">
⚠️
</div>

<h2>
${escapeCollectionHtml(title)}
</h2>

<p>
${escapeCollectionHtml(message)}
</p>

<button
type="button"
class="collection-state-button"
onclick="loadCollection()">
ลองใหม่
</button>

`;

}

function renderCollectionInfo(
  data,
  productCount
){

  const deadline =
    getCollectionDeadline(
      data.preorder_deadline
    );

  const info =
    document.getElementById(
      "collectionInfo"
    );

  info.className =
    "collection-banner-card";

  info.innerHTML = `

${
  data.banner_image
    ? `

<img
src="${escapeCollectionAttribute(data.banner_image)}"
alt="${escapeCollectionAttribute(data.name || "Collection")}"
class="collection-banner-image">

`
    : ""
}

<div class="collection-banner-content">

  <span class="collection-label">
    COLLECTION
  </span>

  <h1 class="collection-name">
    ${escapeCollectionHtml(
      data.name ||
      "Collection"
    )}
  </h1>

  ${
    data.fandom
      ? `

<div class="collection-fandom">
  ${escapeCollectionHtml(data.fandom)}
</div>

`
      : ""
  }

  ${
    data.description
      ? `

<div class="collection-desc">
  ${escapeCollectionHtml(data.description)}
</div>

`
      : ""
  }

  <div class="collection-meta">

    <div class="collection-meta-item">
      📦
      ${Number(
        productCount || 0
      ).toLocaleString("th-TH")}
      รายการ
    </div>

    ${
      deadline.text
        ? `

<div
class="collection-meta-item collection-deadline ${escapeCollectionAttribute(deadline.state)}">
  ${escapeCollectionHtml(deadline.text)}
</div>

`
        : ""
    }

  </div>

</div>

`;

}

function renderCollectionProducts(
  products
){

  const grid =
    document.getElementById(
      "productGrid"
    );

  const empty =
    document.getElementById(
      "collectionEmptyState"
    );

  const count =
    document.getElementById(
      "collectionResultCount"
    );

  if(count){

    count.textContent =
      `${Number(products.length).toLocaleString("th-TH")} รายการ`;

  }

  if(!products.length){

    grid.innerHTML = "";

    empty.classList.remove(
      "hidden"
    );

    return;

  }

  empty.classList.add(
    "hidden"
  );

  grid.innerHTML =
    products.map(
      createCollectionProductCard
    ).join("");

}

function createCollectionProductCard(
  product
){

  const priceMode =
  String(
    product.price_mode ||
    "fixed"
  )
    .trim()
    .toLowerCase();


const price =
  getCollectionProductPrice(
    product
  );


const minPrice =
  Number(
    product.min_price ??
    price
  );


const maxPrice =
  Number(
    product.max_price ??
    minPrice
  );


const oldPrice =
  Number(
    product.old_price ??
    product.price ??
    0
  );


const onSale =
  priceMode !== "option" &&
  normalizeCollectionBool(
    product.on_sale
  );

  const type =
    String(
      product.product_type ||
      "preorder"
    )
      .trim()
      .toLowerCase();

  const deadline =
    getCollectionDeadline(
      product.preorder_deadline
    );

  const productUrl =
    "product.html?id=" +
    encodeURIComponent(
      product.product_id || ""
    );

  return `

<article
class="collection-product-card"
tabindex="0"
role="link"
aria-label="เปิดสินค้า ${escapeCollectionAttribute(product.name || "")}"
onclick='window.location.href=${JSON.stringify(productUrl)}'
onkeydown="handleCollectionCardKey(event,this)">

  <div class="collection-image-box">

    ${
      product.image
        ? `

<img
src="${escapeCollectionAttribute(product.image)}"
alt="${escapeCollectionAttribute(product.name || "")}"
loading="lazy">

`
        : `

<div class="collection-image-placeholder">
  ไม่มีรูปสินค้า
</div>

`
    }

    <div class="collection-card-badges">

      <span
      class="collection-card-badge ${
        type === "instock"
          ? "badge-stock"
          : "badge-preorder"
      }">

        ${
          type === "instock"
            ? "พร้อมส่ง"
            : "PREORDER"
        }

      </span>

      ${
        onSale
          ? `

<span class="collection-card-badge badge-sale">
  SALE
</span>

`
          : ""
      }

    </div>

  </div>

  <div class="collection-card-body">

    <h3 class="collection-card-title">
      ${escapeCollectionHtml(
        product.name ||
        "สินค้า"
      )}
    </h3>

    ${
      product.fandom
        ? `

<div class="collection-card-fandom">
  ${escapeCollectionHtml(product.fandom)}
</div>

`
        : ""
    }

  <div class="collection-price-box">

  ${
    priceMode === "option"
      ? `

<div class="collection-normal-price">

  ${
    minPrice > 0 ||
    maxPrice > 0
      ? (
          minPrice === maxPrice
            ? `฿${minPrice.toLocaleString(
                "th-TH"
              )}`
            : (
                `฿${minPrice.toLocaleString(
                  "th-TH"
                )}` +
                `–฿${maxPrice.toLocaleString(
                  "th-TH"
                )}`
              )
        )
      : "รอกำหนดราคา"
  }

</div>

`
      : onSale
        ? `

<div class="collection-sale-price">
  ฿${price.toLocaleString(
    "th-TH"
  )}
</div>

<div class="collection-old-price">
  ฿${oldPrice.toLocaleString(
    "th-TH"
  )}
</div>

`
        : `

<div class="collection-normal-price">
  ฿${price.toLocaleString(
    "th-TH"
  )}
</div>

`
  }

</div>

    ${
      deadline.text &&
      deadline.state !== "closed"
        ? `

<div class="collection-card-deadline">
  ${escapeCollectionHtml(deadline.text)}
</div>

`
        : ""
    }

  </div>

</article>

`;

}

function handleCollectionSearch(
  event
){

  const keyword =
    String(
      event.target.value || ""
    )
      .trim()
      .toLowerCase();

  const clearButton =
    document.getElementById(
      "clearCollectionSearch"
    );

  clearButton.classList.toggle(
    "show",
    Boolean(keyword)
  );

  clearTimeout(
    collectionSearchTimer
  );

  collectionSearchTimer =
    setTimeout(
      ()=>{

        if(!keyword){

          renderCollectionProducts(
            allProducts
          );

          return;

        }

        const filtered =
          allProducts.filter(
            product=>{

              const haystack = [

                product.name,
                product.fandom,
                product.description,
                product.main_category,
                product.sub_category,
                product.round,
                product.search_keywords

              ]
                .join(" ")
                .toLowerCase();

              if(
                haystack.includes(
                  keyword
                )
              ){

                return true;

              }

              const options =
                Array.isArray(
                  product.options
                )
                  ? product.options
                  : [];

              return options.some(
                option=>
                  String(
                    option.option_value ||
                    ""
                  )
                    .toLowerCase()
                    .includes(
                      keyword
                    )
              );

            }
          );

        renderCollectionProducts(
          filtered
        );

      },
      180
    );

}

function clearCollectionSearch(){

  const input =
    document.getElementById(
      "collectionSearch"
    );

  const button =
    document.getElementById(
      "clearCollectionSearch"
    );

  if(input){

    input.value = "";
    input.focus();

  }

  if(button){

    button.classList.remove(
      "show"
    );

  }

  renderCollectionProducts(
    allProducts
  );

}

function getCollectionDeadline(
  value
){

  if(
    !value ||
    String(value).trim() ===
    "N/A"
  ){

    return {
      text:"",
      state:""
    };

  }

  const end =
    new Date(value);

  if(
    Number.isNaN(
      end.getTime()
    )
  ){

    return {
      text:"",
      state:""
    };

  }

  const now =
    new Date();

  const today =
    new Date(
      now.getFullYear(),
      now.getMonth(),
      now.getDate()
    );

  const deadlineDate =
    new Date(
      end.getFullYear(),
      end.getMonth(),
      end.getDate()
    );

  const diff =
    Math.ceil(
      (
        deadlineDate -
        today
      ) /
      (
        1000 *
        60 *
        60 *
        24
      )
    );

  if(diff < 0){

    return {
      text:"ปิดรับพรีแล้ว",
      state:"closed"
    };

  }

  if(diff === 0){

    return {
      text:"🔥 ปิดรับวันนี้",
      state:"today"
    };

  }

  if(diff === 1){

    return {
      text:"⏰ เหลือ 1 วัน",
      state:""
    };

  }

  return {
    text:
      `⏰ เหลือ ${diff} วัน`,
    state:""
  };

}

function getCollectionProductPrice(
  product
){

  const value =
    Number(
      product.final_price ??
      product.price ??
      0
    );

  return Number.isFinite(value)
    ? value
    : 0;

}

function normalizeCollectionBool(
  value
){

  return (
    value === true ||
    value === 1 ||
    [
      "true",
      "yes",
      "1",
      "active"
    ].includes(
      String(
        value || ""
      )
        .trim()
        .toLowerCase()
    )
  );

}

function updateCollectionCartCount(){

  let cart = [];

  try{

    const stored =
      JSON.parse(
        localStorage.getItem(
          "cart"
        ) || "[]"
      );

    cart =
      Array.isArray(stored)
        ? stored
        : [];

  }catch(error){

    console.warn(
      "อ่านตะกร้าไม่สำเร็จ:",
      error
    );

  }

  const total =
    cart.reduce(
      (sum,item)=>
        sum +
        Number(item.qty || 0),
      0
    );

  const count =
    document.getElementById(
      "collectionCartCount"
    );

  if(count){

    count.textContent =
      total > 99
        ? "99+"
        : String(total);

  }

}

function handleCollectionCardKey(
  event,
  element
){

  if(
    event.key === "Enter" ||
    event.key === " "
  ){

    event.preventDefault();
    element.click();

  }

}

function goCollectionBack(){

  if(
    document.referrer &&
    document.referrer !==
    window.location.href
  ){

    history.back();

  }else{

    window.location.href =
      "browse.html";

  }

}

function escapeCollectionHtml(
  value
){

  return String(
    value ?? ""
  )
    .replaceAll(
      "&",
      "&amp;"
    )
    .replaceAll(
      "<",
      "&lt;"
    )
    .replaceAll(
      ">",
      "&gt;"
    )
    .replaceAll(
      '"',
      "&quot;"
    )
    .replaceAll(
      "'",
      "&#039;"
    );

}

function escapeCollectionAttribute(
  value
){

  return escapeCollectionHtml(
    value
  );

}

</script>
