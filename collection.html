<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>คอลเลกชัน | Rinka Shop</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;600;700&family=Noto+Serif+Thai:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="site-header"></div>

<div id="collection-banner"></div>

<section class="section">
  <div class="wrap">
    <div class="section-head"><div><span class="eyebrow">Items in this manifest</span><h2 id="collection-title">กำลังโหลด...</h2></div></div>
    <div id="products-grid" class="grid"><div class="spinner"></div></div>
  </div>
</section>

<div id="site-footer"></div>
<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/cart.js"></script>
<script src="js/common.js"></script>
<script>
function productCard(p){
  const img = p.image || "https://placehold.co/400x400?text=Rinka+Shop";
  const priceHtml = p.on_sale ? money(p.price) + `<span class="old">${money(p.old_price)}</span>` : money(p.price);
  return `
  <div class="product-card">
    <a href="product.html?id=${encodeURIComponent(p.product_id)}">
      <div class="product-thumb">
        ${p.product_type === 'preorder' ? `<span class="stamp-badge">Preorder</span>` : ""}
        <img src="${img}" alt="${p.name}" loading="lazy">
      </div>
      <div class="product-info">
        <div class="product-fandom">${p.fandom || ""}</div>
        <div class="product-name">${p.name}</div>
        <div class="product-price">${priceHtml}</div>
      </div>
    </a>
  </div>`;
}

async function load(){
  const id = qs("id");
  if(!id){ document.getElementById("collection-title").textContent = "ไม่พบคอลเลกชัน"; return; }
  try{
    const [col, products] = await Promise.all([
      RinkaAPI.getCollection(id),
      RinkaAPI.getCollectionProducts(id)
    ]);

    if(col){
      document.getElementById("collection-title").textContent = col.name;
      document.title = col.name + " | Rinka Shop";
      if(col.banner_image){
        document.getElementById("collection-banner").innerHTML = `
          <div style="height:220px;background:url('${col.banner_image}') center/cover;"></div>`;
      }
    }

    const mount = document.getElementById("products-grid");
    mount.innerHTML = Array.isArray(products) && products.length
      ? products.map(productCard).join("")
      : `<div class="empty-state"><div class="icon">📦</div>ยังไม่มีสินค้าในคอลเลกชันนี้</div>`;
  }catch(e){ toast("โหลดข้อมูลไม่สำเร็จ", true); }
}
load();
</script>
</body>
</html>
