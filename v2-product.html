<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Rinka Shop V2 — Product DEV</title>
<link href="https://fonts.googleapis.com/css2?family=Kodchasan:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light}*{box-sizing:border-box}body{font-family:Kodchasan,sans-serif;margin:0;background:#f5faff;color:#183c63}header{background:#d9ecff;padding:18px max(18px,calc((100vw - 1050px)/2));display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}a{color:#1666a4;text-decoration:none}.tag{font-size:12px;border:1px solid #9ac4ed;background:#fff;border-radius:25px;padding:6px 11px}.wrap{max-width:1050px;margin:24px auto;padding:0 16px 60px}.panel{background:white;border:1px solid #d4e5f7;border-radius:20px;padding:22px}.layout{display:grid;grid-template-columns:minmax(220px,1fr) minmax(280px,1.3fr);gap:28px}.photo{min-height:320px;background:#e9f3ff;border-radius:15px;display:grid;place-items:center;color:#7192b3;overflow:hidden}.photo img{width:100%;height:100%;object-fit:contain}h1{margin:0 0 12px;font-size:25px}.desc{white-space:pre-wrap;line-height:1.8;color:#567392}.group{margin:22px 0}.group h2{font-size:16px;margin:0 0 10px}.choices{display:flex;gap:9px;flex-wrap:wrap}.choice{font-family:inherit;border:1px solid #b6d2eb;border-radius:10px;background:#fff;color:#245d8a;padding:10px 14px;cursor:pointer}.choice[aria-pressed=true]{background:#d7ebff;border-color:#287ec4;font-weight:700}.choice:disabled{opacity:.4;cursor:not-allowed}.summary{border-top:1px solid #dce9f7;margin-top:20px;padding-top:18px}.price{font-size:25px;font-weight:700;color:#1168ae}.muted{color:#6383a3;font-size:13px}.warning{margin-top:20px;border:1px solid #ffdfab;background:#fff8e9;color:#855a1a;padding:13px;border-radius:12px}.error{padding:20px;background:#fff0f0;color:#a52727;border-radius:12px}.small{font-size:12px;word-break:break-all}.qty{display:flex;gap:12px;align-items:center;margin-top:16px}.qty button{width:36px;height:36px;border:1px solid #b6d2eb;border-radius:8px;background:#f4f9ff;cursor:pointer}.qty button:disabled{opacity:.4;cursor:not-allowed}.addcart{margin-top:14px;border:0;background:#237ac0;color:white;padding:12px 18px;border-radius:11px;font:inherit;cursor:pointer}.addcart:disabled{opacity:.45;cursor:not-allowed}.inactive{opacity:.65}@media(max-width:700px){.layout{grid-template-columns:1fr}.photo{min-height:220px}.panel{padding:15px}}
</style></head><body>
<header><strong>☁️ Rinka Shop V2</strong><span class="tag">DEV Preview · ไม่รับคำสั่งซื้อ</span><a href="v2-home.html">← กลับหน้า Home V2</a><a href="v2-cart.html">🛒 ตะกร้า <span id="cart-count">0</span></a></header>
<main class="wrap"><div id="status" role="status">กำลังโหลดรายละเอียดสินค้า…</div><section id="detail" class="panel" hidden></section></main>
<script src="rinka-v2-api.js"></script><script src="rinka-v2-cart.js"></script>
<script>
'use strict';
const el=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const baht=n=>'฿'+Number(n).toLocaleString('th-TH');
let product=null, selections=new Map(), quantity=1;
const now=()=>Date.now();
function effectivePrice(v){const sale=v.sale_price_thb!=null&&(!v.sale_start||Date.parse(v.sale_start)<=now())&&(!v.sale_end||Date.parse(v.sale_end)>=now());return Number(sale?v.sale_price_thb:v.price_thb)}
function variantValues(id){return new Set((product.variant_option_values||[]).filter(link=>link.variant_id===id).map(link=>link.option_value_id))}
function matchedVariant(){const required=(product.option_groups||[]).filter(g=>g.pricing_mode==='variant');if(required.some(g=>!selections.has(g.id)))return null;const ids=[...selections.values()];return (product.product_variants||[]).find(v=>{const values=variantValues(v.id);return ids.every(id=>values.has(id))&&required.every(g=>g.option_values.some(o=>values.has(o.id)))})||null}
function availableOption(group,value){if(group.pricing_mode!=='variant')return true;const current=new Map(selections);current.set(group.id,value.id);return (product.product_variants||[]).some(v=>{const vals=variantValues(v.id);return [...current.values()].every(id=>vals.has(id))})}
function render(){const groups=product.option_groups||[];const v=matchedVariant();const hasGroups=groups.length>0;const prices=(product.product_variants||[]).map(effectivePrice).filter(Number.isFinite);const display=v?baht(effectivePrice(v)):prices.length?baht(Math.min(...prices))+(Math.min(...prices)!==Math.max(...prices)?' – '+baht(Math.max(...prices)):''):'ยังไม่มีราคา';const img=product.product_images?.[0]?.image_url;const soldOut=v&&Number(v.stock_quantity)<=0;
el('detail').innerHTML=`<div class="layout"><div class="photo">${img?`<img src="${esc(img)}" alt="${esc(product.name)}">`:'ยังไม่มีรูปสินค้า'}</div><div><h1>${esc(product.name)}</h1><div class="muted">${product.product_type==='preorder'?'พรีออเดอร์':'พร้อมส่ง'} · ${esc(product.availability_mode)}</div><p class="desc">${esc(product.description||'')}</p><div id="groups">${groups.map(g=>`<div class="group"><h2>${esc(g.name)}${g.is_required?' *':''}</h2><div class="choices">${g.option_values.map(o=>`<button type="button" class="choice" data-group="${esc(g.id)}" data-value="${esc(o.id)}" aria-pressed="${selections.get(g.id)===o.id}" ${availableOption(g,o)?'':'disabled'}>${esc(o.label)}</button>`).join('')}</div></div>`).join('')}</div><div class="summary"><div class="price">${display}</div><div class="muted">${v?`Variant: ${esc(v.label)} · สต็อก ${Number(v.stock_quantity)} ชิ้น`:hasGroups?'เลือกตัวเลือกสินค้าเพื่อดูราคาและสต็อก':'ราคาเริ่มต้น'}</div><div class="qty"><button id="minus" type="button" ${quantity<=1?'disabled':''}>−</button><strong>${quantity}</strong><button id="plus" type="button" ${!v||soldOut||quantity>=Number(v.stock_quantity)?'disabled':''}>+</button></div>${soldOut?'<p class="muted">สินค้ารูปแบบนี้หมดสต็อก</p>':''}</div><button type="button" id="addcart" class="addcart" ${!v||soldOut||quantity>Number(v.stock_quantity)?'disabled':''}>🛒 เพิ่มลงตะกร้า V2</button><div id="cart-message" role="status" class="muted"></div><div class="warning">🔒 DEV Preview: ตะกร้าแยกจาก Production และยังไม่เปิด Checkout</div><div class="muted small" style="margin-top:12px">Product ID: ${esc(product.id)}</div></div></div>`;
el('detail').querySelectorAll('[data-group]').forEach(btn=>btn.addEventListener('click',()=>{selections.set(btn.dataset.group,btn.dataset.value);quantity=1;render()}));
el('addcart').addEventListener('click',()=>{if(!v)return;const existing=RinkaV2Cart.read().find(i=>i.slug===product.slug&&i.variantId===v.id)?.quantity||0;if(existing+quantity>Number(v.stock_quantity)){el('cart-message').textContent='จำนวนรวมในตะกร้าเกินสต็อกล่าสุด';return;}try{RinkaV2Cart.add({slug:product.slug,variantId:v.id,quantity});el('cart-count').textContent=RinkaV2Cart.count();el('cart-message').innerHTML='เพิ่มแล้ว ✓ <a href="v2-cart.html">ดูตะกร้า</a>'}catch(e){el('cart-message').textContent='เพิ่มสินค้าไม่สำเร็จ: '+e.message}});el('minus').addEventListener('click',()=>{quantity=Math.max(1,quantity-1);render()});el('plus').addEventListener('click',()=>{if(v)quantity=Math.min(Number(v.stock_quantity),quantity+1);render()});}
async function init(){const slug=new URLSearchParams(location.search).get('slug');if(!slug||!window.RinkaV2API){el('status').innerHTML='<div class="error">ไม่พบ Slug หรือ API Client</div>';return}try{product=await RinkaV2API.productBySlug(slug);el('status').textContent='';el('detail').hidden=false;render()}catch(e){el('status').innerHTML='<div class="error">โหลดรายละเอียดสินค้าไม่สำเร็จ: '+esc(e.message)+'</div>'}}
el('cart-count').textContent=RinkaV2Cart.count();init();
</script></body></html>
