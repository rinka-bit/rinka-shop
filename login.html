<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>เข้าสู่ระบบ | Rinka Shop</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;600;700&family=Noto+Serif+Thai:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="site-header"></div>

<section class="section">
  <div class="wrap" style="max-width:420px;">
    <h2 class="center">เข้าสู่ระบบ</h2>
    <form id="loginForm" class="panel stack">
      <div class="field"><label>อีเมล หรือ Twitter/X *</label><input name="identity" required></div>
      <div class="field"><label>รหัสผ่าน *</label><input type="password" name="password" required></div>
      <button class="btn btn-primary btn-block" id="loginBtn">เข้าสู่ระบบ</button>
    </form>
    <p class="center hint">ยังไม่มีบัญชี? <a href="register.html" style="font-weight:700;">สมัครสมาชิก</a></p>
  </div>
</section>

<div id="site-footer"></div>
<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/cart.js"></script>
<script src="js/common.js"></script>
<script>
document.getElementById("loginForm").addEventListener("submit", async e => {
  e.preventDefault();
  const fd = new FormData(e.target);
  const btn = document.getElementById("loginBtn");
  btn.disabled = true; btn.textContent = "กำลังเข้าสู่ระบบ...";
  try{
    const res = await RinkaAPI.loginCustomer({ identity: fd.get("identity"), password: fd.get("password") });
    if(res && res.success){
      RinkaAuth.set(res);
      toast("เข้าสู่ระบบสำเร็จ");
      location.href = "account.html";
    } else {
      toast(res.error || "เข้าสู่ระบบไม่สำเร็จ", true);
      btn.disabled = false; btn.textContent = "เข้าสู่ระบบ";
    }
  }catch(e){ toast("เกิดข้อผิดพลาด", true); btn.disabled = false; btn.textContent = "เข้าสู่ระบบ"; }
});
</script>
</body>
</html>
