<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>สินค้า</title>

<link rel="stylesheet" href="style.css">

<style>

.product-page{
  max-width:1000px;
  margin:auto;
  padding:20px;
}

.product-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:30px;
}

.product-image img{
  width:100%;
  border-radius:12px;
}

.thumb-list{

display:flex;

flex-wrap:wrap;

gap:10px;

margin-top:10px;

}

.thumb-list img{

width:60px;
height:60px;

object-fit:cover;

border-radius:8px;

cursor:pointer;

border:1px solid #ddd;

}

#mainImage{

width:100%;

max-width:500px;

height:auto;

}

.old-price{
  text-decoration:line-through;
  color:#888;
}

.sale-price{
  color:red;
  font-size:24px;
  font-weight:bold;
}

.actions{
  margin-top:20px;
  display:flex;
  gap:10px;
}

button{
  padding:12px 20px;
  cursor:pointer;
}

@media (max-width:768px){

.product-grid{

display:block;

}

.product-image{

margin-bottom:20px;

}

}
  
</style>

</head>

<body>

<div class="product-page">

<div id="product"></div>

</div>

<script>

const API =
"https://script.google.com/macros/s/AKfycbxKjVvn8AXrK0wDvKqN-A9yS2Vk8R-w25ar1b9ftiIdUgUvFaShunLnFnAyIDuaTWj76w/exec";

const params =
new URLSearchParams(
window.location.search
);

const productId =
params.get("id");

loadProduct();

async function loadProduct(){

const response =
await fetch(
`${API}?action=product&id=${productId}`
);

const product =
await response.json();

renderProduct(product);

}

function renderProduct(product){

  window.currentProduct =
  product;

document.getElementById(
"product"
).innerHTML = `

<div class="product-grid">

<div class="product-image">

<img
id="mainImage"
src="${product.images[0]}">

<div class="thumb-list">

${product.images.map(image => `
<img
src="${image}"
onclick="
document.getElementById(
'mainImage'
).src='${image}'
">
`).join("")}

</div>

</div>

<div>

<h1>
${product.name}
</h1>

<p>
${product.description || ""}
</p>

${
product.on_sale
?
`
<div class="old-price">
฿${product.old_price}
</div>

<div class="sale-price">
฿${product.price}
</div>
`
:
`
<div class="sale-price">
฿${product.price}
</div>
`
}

<hr>

<p>
รอบพรี :
${product.round || "-"}
</p>

<p>
กำหนดเข้า :
${product.estimated_arrival || "-"}
</p>

<p>
แฟนด้อม :
${product.fandom || "-"}
</p>

<p>
หมวด :
${product.sub_category || "-"}
</p>

<div class="actions">

<button onclick="buyNow()">
ซื้อเลย
</button>

<button onclick="addToCart()">
เพิ่มลงตะกร้า
</button>

<button onclick="history.back()">
กลับ
</button>

</div>

</div>

</div>

`;

}

function addToCart(){

  let cart =
    JSON.parse(
      localStorage.getItem(
        "cart"
      ) || "[]"
    );

  const found =
    cart.find(
      p =>
      p.product_id ===
      window.currentProduct.product_id
    );

  if(found){

    found.qty++;

  }else{

    cart.push({

      ...window.currentProduct,

      qty:1

    });

  }

  localStorage.setItem(

    "cart",

    JSON.stringify(cart)

  );

  alert(
    "เพิ่มลงตะกร้าแล้ว"
  );

}

function buyNow(){

localStorage.setItem(

"buyNowCart",

JSON.stringify([

{

...window.currentProduct,

qty:1

}

])

);

window.location.href =

"checkout.html";

}

</script>

</body>
</html>
