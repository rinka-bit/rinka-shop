<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>สินค้า</title>

<link rel="stylesheet" href="style.css">

<style>

.product-page{
  max-width:1000px;
  margin:auto;
  padding:20px;
}

.product-grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:30px;
}

#mainImage{
width:100%;
max-width:600px;
height:auto;
border-radius:12px;
}

.thumb-list{
display:flex;
flex-wrap:wrap;
gap:10px;
margin-top:10px;
}

.thumb-list img{
width:70px;
height:70px;
object-fit:cover;
border-radius:8px;
cursor:pointer;
border:1px solid #ddd;
}

@media (max-width:768px){

.product-grid{
display:block;
}

.product-image{
margin-bottom:20px;
}

}
  
.old-price{
  text-decoration:line-through;
  color:#888;
}

.sale-price{
  color:red;
  font-size:24px;
  font-weight:bold;
}

.actions{
  margin-top:20px;
  display:flex;
  gap:10px;
}

.actions button{

flex:1;

padding:14px;

border:none;

border-radius:12px;

font-weight:700;

cursor:pointer;

}

.product-topbar{

position:fixed;

top:15px;
left:15px;
right:15px;

display:flex;
justify-content:space-between;

z-index:999;

}

.product-topbar button,
.product-topbar a{

width:46px;
height:46px;

border:none;

border-radius:999px;

background:white;

display:flex;
align-items:center;
justify-content:center;

text-decoration:none;

font-size:22px;

box-shadow:
0 3px 12px
rgba(
0,
0,
0,
0.15
);

cursor:pointer;

}
  
</style>

</head>

<body>

<div class="product-topbar">

<button
onclick="history.back()">

←

</button>

<a
href="cart.html"
id="floatingCart">

🛒

</a>

</div>
  
<div class="product-page">

<div id="product"></div>

</div>
  
<script>

const API =
"https://script.google.com/macros/s/AKfycbxKjVvn8AXrK0wDvKqN-A9yS2Vk8R-w25ar1b9ftiIdUgUvFaShunLnFnAyIDuaTWj76w/exec";

const params =
new URLSearchParams(
window.location.search
);

const productId =
params.get("id");

loadProduct();

async function loadProduct(){

const response =
await fetch(
`${API}?action=product&id=${productId}`
);

const product =
await response.json();

renderProduct(product);

}

function renderProduct(product){

window.currentProduct =
product;

const images =

product.images &&
product.images.length

? product.images

: [product.image];

const mainImage =
images[0];

const optionGroups = {};

(product.options || []).forEach(option=>{

if(
!optionGroups[
option.option_name
]
){

optionGroups[
option.option_name
] = [];

}

optionGroups[
option.option_name
].push(option);

});

let optionsHtml = "";

Object.keys(
optionGroups
).forEach(group=>{

optionsHtml += `

<h3>

${group}

</h3>

`;

optionGroups[group]
.forEach(option=>{

const inputType =

option.selection_type ===
"multiple"

?

"checkbox"

:

"radio";

optionsHtml += `

<label
style="
display:block;
margin-bottom:8px;
"
>

<input
type="${inputType}"
name="${group}"
value="${option.option_value}"
>

${option.option_value}

</label>

`;

});

});

document.getElementById(
"product"
).innerHTML = `

<div class="product-grid">

<div class="product-image">

<img
id="mainImage"
src="${mainImage}">

<div class="thumb-list">

${images.map(image => `
<img
src="${image}"
onclick="
document.getElementById('mainImage').src='${image}'
">
`).join("")}

</div>

</div>

<div>

<h1>
${product.name}
</h1>

<p>
${product.description || ""}
</p>

${
product.on_sale
?
`
<div class="old-price">
฿${product.old_price}
</div>

<div class="sale-price">
฿${product.price}
</div>
`
:
`
<div class="sale-price">
฿${product.price}
</div>
`
}

<hr>

<p>
รอบพรี :
${product.round || "-"}
</p>

<p>
กำหนดเข้า :
${product.estimated_arrival || "-"}
</p>

<p>
แฟนด้อม :
${product.fandom || "-"}
</p>

<p>
หมวด :
${product.sub_category || "-"}
</p>

${optionsHtml}

<div class="actions">

<button onclick="buyNow()">
ซื้อเลย
</button>

<button onclick="addToCart()">
เพิ่มลงตะกร้า
</button>

<button onclick="history.back()">
กลับ
</button>

</div>

</div>

</div>

`;

}

function addToCart(){

  const selectedOptions = {};

  document
  .querySelectorAll(
    'input[type="radio"]:checked'
  )
  .forEach(input=>{

    selectedOptions[
      input.name
    ] = input.value;

  });

  document
  .querySelectorAll(
    'input[type="checkbox"]:checked'
  )
  .forEach(input=>{

    if(
      !selectedOptions[
        input.name
      ]
    ){

      selectedOptions[
        input.name
      ] = [];

    }

    selectedOptions[
      input.name
    ].push(
      input.value
    );

  });

  let cart =

  JSON.parse(
    localStorage.getItem(
      "cart"
    ) || "[]"
  );

  const found =

  cart.find(item =>

    item.product_id ===
    window.currentProduct.product_id

    &&

    JSON.stringify(
      item.selected_options || {}
    )

    ===

    JSON.stringify(
      selectedOptions
    )

  );

 let qty = 1;

Object.values(
  selectedOptions
)
.forEach(value=>{

  if(
    Array.isArray(value)
  ){

    qty +=
    value.length - 1;

  }

});

if(found){

  found.qty += qty;

}
else{

  cart.push({

    ...window.currentProduct,

    selected_options:
    selectedOptions,

    qty:qty

  });

} 

  localStorage.setItem(

    "cart",

    JSON.stringify(cart)

  );

  updateCartCount();

  alert(

    "เพิ่มลงตะกร้าแล้ว\n\n"

    +

    Object.entries(
      selectedOptions
    )

    .map(
      ([k,v])=>
      `${k}: ${
        Array.isArray(v)
        ? v.join(", ")
        : v
      }`
    )

    .join("\n")

  );

}
  
function buyNow(){

localStorage.setItem(

"buyNowCart",

JSON.stringify([

{

...window.currentProduct,

qty:1

}

])

);

window.location.href =

"checkout.html";

}

updateCartCount();

function updateCartCount(){

const cart =

JSON.parse(
localStorage.getItem(
"cart"
) || "[]"
);

const count =

cart.reduce(

(sum,item)=>

sum +
Number(item.qty || 0),

0

);

const cartLink =
document.getElementById(
"floatingCart"
);

if(cartLink){

cartLink.textContent =

`🛒 ${count}`;

}

}
  
</script>

</body>
</html>
