<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>สินค้า | Rinka Shop</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;600;700&family=Noto+Serif+Thai:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style>
.pd-wrap{display:grid; grid-template-columns:1fr 1fr; gap:40px; padding:40px 0;}
@media(max-width:860px){.pd-wrap{grid-template-columns:1fr;}}
.pd-main-img{aspect-ratio:1/1; border-radius:var(--radius); overflow:hidden; background:var(--mist); border:1px solid var(--mist-dark);}
.pd-main-img img{width:100%; height:100%; object-fit:cover;}
.pd-thumbs{display:flex; gap:10px; margin-top:10px;}
.pd-thumbs img{width:64px; height:64px; object-fit:cover; border-radius:8px; cursor:pointer; border:2px solid transparent;}
.pd-thumbs img.active{border-color:var(--stamp);}
.option-group{margin-bottom:18px;}
.option-group-label{font-weight:700; font-size:.88rem; margin-bottom:8px;}
.option-pills{display:flex; gap:8px; flex-wrap:wrap;}
.option-pill{
  padding:8px 16px; border-radius:999px; border:1px solid var(--mist-dark);
  background:var(--paper); cursor:pointer; font-size:.86rem; font-weight:600;
}
.option-pill.selected{background:var(--plum); color:#fff; border-color:var(--plum);}
.option-pill.disabled{opacity:.4; cursor:not-allowed; text-decoration:line-through;}
.crate-box{display:flex; align-items:center; gap:10px; padding:12px 14px; border:1px dashed var(--mist-dark); border-radius:10px; margin-bottom:18px;}
.qty-box{display:flex; align-items:center; gap:10px; margin-bottom:20px;}
.qty-box button{width:34px; height:34px; border-radius:8px; border:1px solid var(--mist-dark); background:var(--cream); font-weight:700; cursor:pointer;}
.info-strip{display:flex; gap:18px; flex-wrap:wrap; margin:18px 0; font-size:.84rem; color:var(--ink-soft);}
.info-strip div{display:flex; align-items:center; gap:6px;}
</style>
</head>
<body>
<div id="site-header"></div>

<div class="wrap pd-wrap" id="pd-root">
  <div class="spinner"></div>
</div>

<div id="site-footer"></div>
<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/cart.js"></script>
<script src="js/common.js"></script>
<script>
let PRODUCT = null;
let SELECTED = {};   // { group: value }
let CRATE_ON = false;
let QTY = 1;

function groupOptions(options){
  const groups = {};
  (options || []).forEach(o => {
    if(!groups[o.option_name]) groups[o.option_name] = [];
    groups[o.option_name].push(o);
  });
  return groups;
}

function currentUnitPrice(){
  let price = Number(PRODUCT.price);
  Object.values(SELECTED).forEach(opt => { price += Number(opt.additional_price || 0); });
  return price;
}

function render(){
  const p = PRODUCT;
  const images = (p.images && p.images.length ? p.images : [p.image]).filter(Boolean);
  const groups = groupOptions(p.options);

  document.title = p.name + " | Rinka Shop";

  document.getElementById("pd-root").innerHTML = `
    <div>
      <div class="pd-main-img"><img id="mainImg" src="${images[0] || 'https://placehold.co/600x600'}" alt="${p.name}"></div>
      ${images.length > 1 ? `<div class="pd-thumbs">${images.map((im,i)=>`<img src="${im}" class="${i===0?'active':''}" onclick="switchImg(this,'${im}')">`).join("")}</div>` : ""}
    </div>
    <div>
      <div class="product-fandom">${p.fandom || p.main_category || ""}</div>
      <h1 style="font-size:1.6rem;margin:6px 0 10px;">${p.name}</h1>
      <div class="product-price" style="font-size:1.5rem;margin-bottom:10px;" id="priceDisplay">
        ${money(p.price)}${p.on_sale ? `<span class="old">${money(p.old_price)}</span>` : ""}
      </div>

      <div class="info-strip">
        ${p.preorder_deadline ? `<div>⏳ ปิดรับออเดอร์: <b>&nbsp;${p.preorder_deadline}</b></div>` : ""}
        ${p.estimated_arrival ? `<div>📦 คาดว่าถึงไทย: <b>&nbsp;${p.estimated_arrival}</b></div>` : ""}
        <div>📊 คงเหลือ: <b>&nbsp;${p.stock}</b> ชิ้น</div>
      </div>

      <div id="optionGroups"></div>

      ${p.crate_available ? `
      <label class="crate-box">
        <input type="checkbox" id="crateCheck" onchange="onCrateToggle(this.checked)">
        <span>แพ็คแบบลัง (Crate) — เพิ่ม ${money(p.crate_fee)}</span>
      </label>` : ""}

      <div class="qty-box">
        <button onclick="changeQty(-1)">−</button>
        <span id="qtyVal" style="min-width:24px;text-align:center;font-weight:700;">1</span>
        <button onclick="changeQty(1)">+</button>
      </div>

      <button class="btn btn-primary btn-block" id="addBtn" onclick="addToCart()">เพิ่มลงตะกร้า</button>

      ${p.description ? `<div style="margin-top:26px;"><h3 style="font-size:1rem;">รายละเอียดสินค้า</h3><p class="muted" style="white-space:pre-line;">${p.description}</p></div>` : ""}
    </div>
  `;

  const groupMount = document.getElementById("optionGroups");
  Object.entries(groups).forEach(([groupName, opts]) => {
    const div = document.createElement("div");
    div.className = "option-group";
    div.innerHTML = `<div class="option-group-label">${groupName}</div>
      <div class="option-pills">
        ${opts.map(o => `
          <span class="option-pill ${Number(o.stock) <= 0 ? 'disabled' : ''}"
                data-group="${groupName}" data-value="${o.option_value}"
                onclick="${Number(o.stock) <= 0 ? '' : `selectOption('${groupName.replace(/'/g,"\\'")}', ${JSON.stringify(o).replace(/"/g,'&quot;')})`}">
            ${o.option_value}${o.additional_price ? ` (+${money(o.additional_price)})` : ""}
          </span>`).join("")}
      </div>`;
    groupMount.appendChild(div);
  });
}

function switchImg(el, src){
  document.getElementById("mainImg").src = src;
  document.querySelectorAll(".pd-thumbs img").forEach(i => i.classList.remove("active"));
  el.classList.add("active");
}

function selectOption(group, opt){
  SELECTED[group] = opt;
  document.querySelectorAll(`.option-pill[data-group="${CSS.escape(group)}"]`).forEach(el => {
    el.classList.toggle("selected", el.dataset.value === opt.option_value);
  });
  updatePriceDisplay();
}

function onCrateToggle(checked){ CRATE_ON = checked; updatePriceDisplay(); }

function changeQty(delta){
  QTY = Math.max(1, QTY + delta);
  document.getElementById("qtyVal").textContent = QTY;
  updatePriceDisplay();
}

function updatePriceDisplay(){
  const unit = currentUnitPrice() + (CRATE_ON ? Number(PRODUCT.crate_fee || 0) : 0);
  document.getElementById("priceDisplay").innerHTML = money(unit * QTY);
}

function addToCart(){
  const groups = groupOptions(PRODUCT.options);
  const missing = Object.keys(groups).filter(g => !SELECTED[g]);
  if(missing.length){
    toast("กรุณาเลือก " + missing.join(", "), true);
    return;
  }
  const optionValues = {};
  Object.entries(SELECTED).forEach(([g,o]) => optionValues[g] = o.option_value);

  RinkaCart.add({
    product_id: PRODUCT.product_id,
    name: PRODUCT.name,
    image: PRODUCT.image,
    price: currentUnitPrice(),
    qty: QTY,
    selected_options: optionValues,
    option_value: Object.values(optionValues).join(", "),
    crate_selected: CRATE_ON,
    crate_fee: PRODUCT.crate_fee || 0
  });
  toast("เพิ่มลงตะกร้าแล้ว 🛍️");
}

async function load(){
  const id = qs("id");
  if(!id){ document.getElementById("pd-root").innerHTML = `<div class="empty-state">ไม่พบสินค้า</div>`; return; }
  try{
    const p = await RinkaAPI.getProduct(id);
    if(!p){ document.getElementById("pd-root").innerHTML = `<div class="empty-state">ไม่พบสินค้านี้</div>`; return; }
    PRODUCT = p;
    render();
  }catch(e){
    document.getElementById("pd-root").innerHTML = `<div class="empty-state">โหลดสินค้าไม่สำเร็จ</div>`;
  }
}
load();
</script>
</body>
</html>
