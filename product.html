<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>สินค้า</title>

<link rel="stylesheet" href="style.css">

<style>

.product-page{
  max-width:1000px;
  margin:auto;
  padding:20px;
}

.product-grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:30px;
}

#mainImage{
width:100%;
max-width:600px;
height:auto;
border-radius:12px;
}

.thumb-list{
display:flex;
flex-wrap:wrap;
gap:10px;
margin-top:10px;
}

.thumb-list img{
width:70px;
height:70px;
object-fit:cover;
border-radius:8px;
cursor:pointer;
border:1px solid #ddd;
}

@media (max-width:768px){

.product-grid{
display:block;
}

.product-image{
margin-bottom:20px;
}

}
  
.old-price{
  text-decoration:line-through;
  color:#888;
}

.sale-price{
  color:red;
  font-size:24px;
  font-weight:bold;
}

.actions{
  margin-top:20px;
  display:flex;
  gap:10px;
}

.actions button{

flex:1;

padding:14px;

border:none;

border-radius:12px;

font-weight:700;

cursor:pointer;

}

.qty-selector{

display:flex;
align-items:center;
gap:10px;

margin:20px 0;

}

.qty-selector button{

width:42px;
height:42px;

border:none;
border-radius:10px;

background:#f3f3f3;

font-size:20px;
font-weight:bold;

cursor:pointer;

}

.qty-selector input{

width:70px;

text-align:center;

padding:10px;

border:1px solid #ddd;
border-radius:10px;

font-size:16px;

}
  
.product-topbar{

position:fixed;

top:15px;
left:15px;
right:15px;

display:flex;
justify-content:space-between;

z-index:999;

}

.product-topbar button,
.product-topbar a{

width:46px;
height:46px;

border:none;

border-radius:999px;

background:white;

display:flex;
align-items:center;
justify-content:center;

text-decoration:none;

font-size:22px;

box-shadow:
0 3px 12px
rgba(
0,
0,
0,
0.15
);

cursor:pointer;

}

.option-section{
  margin-top:20px;
}

.option-title{
  font-size:18px;
  font-weight:700;
  margin-bottom:10px;
}

.option-list{
  display:flex;
  flex-direction:column;
  gap:10px;
}

.option-row{
  display:flex;
  align-items:center;
  gap:12px;

  padding:10px;

  border:1px solid #e5e7eb;
  border-radius:14px;

  background:white;
}

.option-row.selected{
  border-color:#ff7a00;
  background:#fff7ed;
}

.option-row.soldout{
  opacity:.45;
  background:#f3f4f6;
}

.option-row img{
  width:46px;
  height:46px;
  object-fit:cover;
  border-radius:8px;
}

.option-info{
  flex:1;
}

.option-name{
  font-weight:700;
}

.option-price{
  font-size:13px;
  color:#666;
}

.option-qty{
  display:flex;
  align-items:center;
  gap:8px;
}

.option-qty button{
  width:30px;
  height:30px;
  border:none;
  border-radius:8px;
  background:#eef2ff;
  font-weight:700;
}

.option-qty span{
  min-width:20px;
  text-align:center;
}

.soldout-text{
  color:#999;
  font-size:13px;
  font-weight:700;
}
  
</style>

</head>

<body>

<div class="product-topbar">

<button
onclick="history.back()">

←

</button>

<a
href="cart.html"
id="floatingCart">

🛒

</a>

</div>
  
<div class="product-page">

<div id="product"></div>

</div>
  
<script>

const API =
"https://script.google.com/macros/s/AKfycbxKjVvn8AXrK0wDvKqN-A9yS2Vk8R-w25ar1b9ftiIdUgUvFaShunLnFnAyIDuaTWj76w/exec";

const params =
new URLSearchParams(
window.location.search
);

const productId =
params.get("id");
window.optionQty = {};

loadProduct();

async function loadProduct(){

const response =
await fetch(
`${API}?action=product&id=${productId}`
);

const product =
await response.json();

renderProduct(product);

}

function renderProduct(product){

window.currentProduct =
product;

const images =

product.images &&
product.images.length

? product.images

: [product.image];

const mainImage =
images[0];

const optionGroups = {};

(product.options || []).forEach(option=>{

if(
!optionGroups[
option.option_name
]
){

optionGroups[
option.option_name
] = [];

}

optionGroups[
option.option_name
].push(option);

});

let optionsHtml = "";

Object.keys(optionGroups).forEach(group=>{

optionsHtml += `

<div class="option-section">

<div class="option-title">
${group}
</div>

<div class="option-list">

`;

optionGroups[group].forEach(option=>{

const optionId =
option.option_id ||
`${group}_${option.option_value}`;

const stock =
Number(option.stock || 0);

const soldOut =
stock <= 0;

const image =
option.character_image ||
option.image ||
window.currentProduct.image;

const addPrice =
Number(option.additional_price || 0);

optionsHtml += `

<div
class="option-row ${soldOut ? "soldout" : ""}"
id="optionRow_${optionId}"
>

<img
src="${image}"
alt="${option.option_value}">

<div class="option-info">

<div class="option-name">
${option.option_value}
</div>

<div class="option-price">
+฿${addPrice}
</div>

</div>

${
soldOut
?
`
<div class="soldout-text">
สินค้าหมด
</div>
`
:
`
<div class="option-qty">

<button
type="button"
onclick="changeOptionQty('${optionId}','${group}','${option.option_value}',${addPrice},-1)"
>
-
</button>

<span id="optionQty_${optionId}">
0
</span>

<button
type="button"
onclick="changeOptionQty('${optionId}','${group}','${option.option_value}',${addPrice},1)"
>
+
</button>

</div>
`
}

</div>

`;

});

optionsHtml += `

</div>

</div>

`;

});

document.getElementById(
"product"
).innerHTML = `

<div class="product-grid">

<div class="product-image">

<img
id="mainImage"
src="${mainImage}">

<div class="thumb-list">

${images.map(image => `
<img
src="${image}"
onclick="
document.getElementById('mainImage').src='${image}'
">
`).join("")}

</div>

</div>

<div>

<h1>
${product.name}
</h1>

<p>
${product.description || ""}
</p>

${
product.on_sale
?
`
<div class="old-price">
฿${product.old_price}
</div>

<div class="sale-price">
฿${product.price}
</div>
`
:
`
<div class="sale-price">
฿${product.price}
</div>
`
}

<hr>

<p>
รอบพรี :
${product.round || "-"}
</p>

<p>
กำหนดเข้า :
${product.estimated_arrival || "-"}
</p>

<p>
แฟนด้อม :
${product.fandom || "-"}
</p>

<p>
หมวด :
${product.sub_category || "-"}
</p>

${optionsHtml}

<div
class="qty-selector"
style="${(product.options || []).length > 0 ? 'display:none;' : ''}"
>

<button
type="button"
onclick="changeProductQty(-1)"
>
-
</button>

<input
id="productQty"
type="number"
value="1"
min="1"
readonly
>

<button
type="button"
onclick="changeProductQty(1)"
>
+
</button>

</div>

<div class="actions">

<button onclick="buyNow()">
ซื้อเลย
</button>

<button onclick="addToCart()">
เพิ่มลงตะกร้า
</button>

<button onclick="history.back()">
กลับ
</button>

</div>

</div>

</div>

`;

}

function changeOptionQty(
optionId,
group,
value,
addPrice,
change
){

if(
!window.optionQty[optionId]
){

window.optionQty[optionId] = {
group:group,
value:value,
additional_price:Number(addPrice || 0),
qty:0
};

}

window.optionQty[optionId].qty += change;

if(window.optionQty[optionId].qty < 0){
window.optionQty[optionId].qty = 0;
}

const qty =
window.optionQty[optionId].qty;

document
.getElementById(
`optionQty_${optionId}`
)
.textContent = qty;

const row =
document.getElementById(
`optionRow_${optionId}`
);

if(row){

row.classList.toggle(
"selected",
qty > 0
);

}

}

function changeProductQty(
change
){

const input =

document.getElementById(
"productQty"
);

if(!input){
return;
}

let qty =

Number(
input.value
);

qty += change;

if(qty < 1){
qty = 1;
}

input.value = qty;

}

function addToCart(){

const selectedOptionItems =
Object.values(window.optionQty || {})
.filter(item=>item.qty > 0);

if(
(window.currentProduct.options || []).length > 0 &&
selectedOptionItems.length === 0
){

alert("กรุณาเลือกตัวเลือกสินค้าอย่างน้อย 1 รายการ");
return;

}

if(
(window.currentProduct.options || []).length === 0
){

const qty =
Number(
document.getElementById("productQty")?.value
) || 1;

let cart =
JSON.parse(
localStorage.getItem("cart") || "[]"
);

const found =
cart.find(item =>
item.product_id === window.currentProduct.product_id
);

if(found){
found.qty += qty;
}else{
cart.push({

  ...window.currentProduct,

  collection_id:
    window.currentProduct.collection_id ||
    "",

  selected_options:{},

  qty:qty

});
}

localStorage.setItem(
"cart",
JSON.stringify(cart)
);

updateCartCount();

alert("เพิ่มลงตะกร้าแล้ว");

return;

}
  
let cart =
JSON.parse(
localStorage.getItem("cart") || "[]"
);

selectedOptionItems.forEach(option=>{

const finalPrice =
Number(window.currentProduct.price || 0)
+
Number(option.additional_price || 0);

const found =
cart.find(item=>

item.product_id === window.currentProduct.product_id

&&

item.option_value === option.value

&&

item.option_group === option.group

);

if(found){

found.qty += option.qty;

}else{

cart.push({

  ...window.currentProduct,

  collection_id:
    window.currentProduct.collection_id ||
    "",

  price:
    finalPrice,

  option_group:
    option.group,

  option_value:
    option.value,

  selected_options:{
    [option.group]:
      option.value
  },

  qty:
    option.qty

});

}

});

localStorage.setItem(
"cart",
JSON.stringify(cart)
);

updateCartCount();

alert("เพิ่มลงตะกร้าแล้ว");

}
  
function buyNow(){

  const selectedOptionItems =
    Object.values(
      window.optionQty || {}
    )
    .filter(
      item =>
        item.qty > 0
    );

  const hasOptions =
    (
      window.currentProduct.options ||
      []
    ).length > 0;

  if(
    hasOptions &&
    selectedOptionItems.length === 0
  ){

    alert(
      "กรุณาเลือกตัวเลือกสินค้าอย่างน้อย 1 รายการ"
    );

    return;

  }

  let checkoutItems = [];

  if(!hasOptions){

    const qty =
      Number(
        document.getElementById(
          "productQty"
        )?.value
      ) || 1;

    checkoutItems.push({

      ...window.currentProduct,

      collection_id:
        window.currentProduct.collection_id ||
        "",

      selected_options:{},

      qty:
        qty

    });

  }
  else{

    checkoutItems =
      selectedOptionItems.map(
        option=>{

          const finalPrice =
            Number(
              window.currentProduct.price ||
              0
            )
            +
            Number(
              option.additional_price ||
              0
            );

          return {

            ...window.currentProduct,

            collection_id:
              window.currentProduct.collection_id ||
              "",

            price:
              finalPrice,

            option_group:
              option.group,

            option_value:
              option.value,

            selected_options:{
              [option.group]:
                option.value
            },

            qty:
              option.qty

          };

        }
      );

  }

  console.log(
    "BUY NOW ITEMS:",
    checkoutItems
  );

  localStorage.setItem(
    "buyNowCart",
    JSON.stringify(
      checkoutItems
    )
  );

  localStorage.setItem(
    "checkoutSource",
    "buyNow"
  );

  localStorage.removeItem(
    "checkoutCart"
  );

  window.location.href =
    "checkout.html";

}
  
function updateCartCount(){

const cart =

JSON.parse(
localStorage.getItem(
"cart"
) || "[]"
);

const count =

cart.reduce(

(sum,item)=>

sum +
Number(item.qty || 0),

0

);

const cartLink =
document.getElementById(
"floatingCart"
);

if(cartLink){

cartLink.textContent =

`🛒 ${count}`;

}

}
  
</script>

</body>
</html>
