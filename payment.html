<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ชำระเงิน | Rinka Shop</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;600;700&family=Noto+Serif+Thai:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style>
.bank-card{border:1px solid var(--mist-dark); border-radius:12px; padding:16px; margin-bottom:12px; display:flex; gap:14px; align-items:center;}
.bank-card img{width:70px; height:70px; object-fit:contain; border-radius:8px; background:var(--mist);}
</style>
</head>
<body>
<div id="site-header"></div>

<section class="section">
  <div class="wrap" style="max-width:640px;">
    <div class="dashed-panel center" style="margin-bottom:24px;">
      <div style="font-size:1.9rem;">📮</div>
      <h2 style="margin:8px 0 4px;">เลขที่ออเดอร์ <span id="orderIdText"></span></h2>
      <p class="muted mb-0">ยอดที่ต้องชำระ: <strong id="amountText" style="color:var(--stamp);"></strong></p>
    </div>

    <h3>ช่องทางการชำระเงิน</h3>
    <div id="banksList"></div>

    <h3 style="margin-top:24px;">แนบสลิปการโอนเงิน</h3>
    <div class="slip-drop" id="slipDrop" onclick="document.getElementById('slipInput').click()">
      <div id="slipPreview">
        <div style="font-size:2rem;">📎</div>
        <p class="mb-0 muted">คลิกเพื่อเลือกรูปสลิป (PNG / JPG / WEBP)</p>
      </div>
    </div>
    <input type="file" id="slipInput" accept="image/png,image/jpeg,image/jpg,image/webp" style="display:none;" onchange="onSlipSelected(this)">

    <button class="btn btn-primary btn-block" id="submitPaymentBtn" style="margin-top:20px;" onclick="submitPayment()">ยืนยันการชำระเงิน</button>
    <p class="hint center" style="margin-top:10px;">เมื่อยืนยันแล้ว ระบบจะส่งอีเมลยืนยันให้อัตโนมัติ</p>
  </div>
</section>

<div id="site-footer"></div>
<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/cart.js"></script>
<script src="js/common.js"></script>
<script>
let SLIP_BASE64 = "";
const orderId = qs("id");
const total = qs("total");

document.getElementById("orderIdText").textContent = orderId || "-";
document.getElementById("amountText").textContent = total ? money(total) : "-";

async function loadBanks(){
  try{
    const banks = await RinkaAPI.getBanks();
    const mount = document.getElementById("banksList");
    mount.innerHTML = Array.isArray(banks) && banks.length ? banks.map(b => `
      <div class="bank-card">
        ${b.qr_image ? `<img src="${b.qr_image}" alt="QR">` : `<div style="width:70px;height:70px;border-radius:8px;background:var(--mist);"></div>`}
        <div>
          <div style="font-weight:700;">${b.bank_name}</div>
          <div class="muted" style="font-size:.88rem;">${b.account_name}</div>
          <div style="font-family:monospace;font-weight:700;">${b.account_number}</div>
        </div>
      </div>`).join("") : `<p class="muted">ยังไม่มีบัญชีรับชำระเงิน</p>`;
  }catch(e){ /* silent */ }
}
loadBanks();

function onSlipSelected(input){
  const file = input.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    SLIP_BASE64 = reader.result;
    document.getElementById("slipPreview").innerHTML = `<img src="${SLIP_BASE64}" alt="สลิป">`;
  };
  reader.readAsDataURL(file);
}

async function submitPayment(){
  if(!orderId){ toast("ไม่พบเลขออเดอร์", true); return; }
  if(!SLIP_BASE64){ toast("กรุณาแนบสลิปก่อน", true); return; }

  const btn = document.getElementById("submitPaymentBtn");
  btn.disabled = true;
  btn.textContent = "กำลังส่งข้อมูล...";

  try{
    const res = await RinkaAPI.submitPayment({
      order_id: orderId,
      amount: Number(total || 0),
      slip_base64: SLIP_BASE64
    });
    if(res && res.success){
      toast("ยืนยันการชำระเงินสำเร็จ ✅");
      setTimeout(() => location.href = `track.html?id=${encodeURIComponent(orderId)}`, 1200);
    } else {
      toast(res.error || "ยืนยันการชำระเงินไม่สำเร็จ", true);
      btn.disabled = false;
      btn.textContent = "ยืนยันการชำระเงิน";
    }
  }catch(e){
    toast("เกิดข้อผิดพลาด กรุณาลองใหม่", true);
    btn.disabled = false;
    btn.textContent = "ยืนยันการชำระเงิน";
  }
}
</script>
</body>
</html>
