<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1">

<title>ชำระเงิน</title>

<link rel="stylesheet" href="style.css">

<style>

.container{
max-width:900px;
margin:auto;
padding:20px;
}

.card{
background:white;
padding:20px;
border-radius:12px;
margin-bottom:20px;
box-shadow:0 2px 8px rgba(0,0,0,.05);
}

button{
padding:12px 20px;
cursor:pointer;
border:none;
border-radius:8px;
background:#4f46e5;
color:white;
font-size:15px;
}

button:hover{
opacity:.9;
}

.bank-card{
border:1px solid #ddd;
border-radius:12px;
padding:14px;
margin-bottom:12px;
background:#fff;
}

.bank-option{
display:flex;
align-items:center;
gap:12px;
cursor:pointer;
}

.bank-option input[type="radio"]{
width:auto;
max-width:none;
padding:0;
margin:0;
flex:0 0 auto;
}

.bank-info{
display:block;
}

.bank-name{
font-size:16px;
font-weight:700;
word-break:break-word;
}

.bank-owner{
font-size:13px;
color:#666;
margin-top:4px;
word-break:break-word;
overflow-wrap:break-word;
}

.qr-image{
display:block;
width:100%;
max-width:320px;
margin:auto;
border-radius:12px;
}

.bank-detail{
margin-top:20px;
text-align:center;
}

.save-tip{
font-size:13px;
color:#666;
margin-top:10px;
}

.copy-btn{
margin-top:10px;
}

@media(max-width:600px){

.container{
padding:15px;
}

.card{
padding:15px;
}

button{
width:100%;
}

}

</style>
  
</head>

<body>

<div class="container">

<h1>
ชำระเงิน
</h1>

<div class="card">

<h2>
เลือกช่องทางชำระเงิน
</h2>

<div id="bankList"></div>

<div
id="bankDetail"
style="margin-top:20px;">
</div>

</div>

<div class="card">

<h2>
แนบสลิป
</h2>

<input
type="file"
id="slip">

</div>

<button
id="submitBtn"
onclick="submitOrder()">

ยืนยันการชำระเงิน

</button>
  
</div>

<script>

const API =
"https://script.google.com/macros/s/AKfycbxKjVvn8AXrK0wDvKqN-A9yS2Vk8R-w25ar1b9ftiIdUgUvFaShunLnFnAyIDuaTWj76w/exec";

let bankData = [];

loadBanks();

async function loadBanks(){

const response =
await fetch(
API + "?action=banks"
);

bankData =
await response.json();

console.log(bankData);

let html = "";

bankData.forEach((bank,index)=>{

html += `

<div class="bank-card">

<div class="bank-option">

<input
type="radio"
name="bank"

${index === 0 ? "checked" : ""}

onclick="showBankById('${bank.account_id}')">

<div class="bank-info">

<div class="bank-name">
${bank.bank_name}
</div>

<div class="bank-owner">
${bank.account_name || ""}
</div>

</div>

</div>

</div>

`;

});

document.getElementById(
"bankList"
).innerHTML = html;

if(
  bankData.length
){

  showBank(
    bankData[0]
  );

}

}
  
function showBankById(id){

  const bank =
    bankData.find(
      b => b.account_id === id
    );

  if(bank){

    showBank(bank);

  }

}

function showBank(bank){

let html = "";

if(bank.qr_image){

html = `

<div class="bank-detail">

<h3>
${bank.bank_name}
</h3>

<img
src="${bank.qr_image}"
class="qr-image">

<br>

<button
onclick="downloadQR('${bank.qr_image}')">

เปิด QR เต็มจอ

</button>

<p class="save-tip">

iPhone:
แตะรูปค้างไว้แล้วเลือก
"บันทึกรูปภาพ"

<br>

Android:
เปิดรูปแล้วกดดาวน์โหลดได้

</p>

</div>

`;

}else{

html = `

<div class="bank-detail">

<h3>
${bank.bank_name}
</h3>

<p>

ชื่อบัญชี :
<br>

<strong>
${bank.account_name}
</strong>

</p>

<p>

เลขบัญชี :
<br>

<strong>
${bank.account_number}
</strong>

</p>

<button
class="copy-btn"
onclick="
copyAccount(
'${bank.account_number}'
)">

คัดลอกเลขบัญชี

</button>

</div>

`;

}

document.getElementById(
"bankDetail"
).innerHTML = html;

}

function copyAccount(number){

  navigator.clipboard.writeText(
    number
  );

  alert(
    "คัดลอกเลขบัญชีแล้ว"
  );

}

function downloadQR(url){

window.open(
url,
"_blank"
);

}
  
async function submitOrder(){

let cart =

JSON.parse(
localStorage.getItem(
"checkoutCart"
) || "[]"
);

if(
cart.length === 0
){

cart =

JSON.parse(
localStorage.getItem(
"cart"
) || "[]"
);

}

  const btn =

document.getElementById(
"submitBtn"
);

btn.disabled = true;

btn.textContent =
"กำลังส่งข้อมูล...";

  const address =
    JSON.parse(
      localStorage.getItem(
        "checkoutAddress"
      ) || "{}"
    );

  const total =
    cart.reduce(
      (a,b)=>
      a +
      (
        Number(b.price)
        *
        Number(b.qty)
      ),
      0
    );

  const slip =
document.getElementById(
"slip"
);

if(!slip.files.length){

alert(
"กรุณาแนบสลิป"
);

return;

}

  const payload = {

  customer_name:
    address.receiver,

  email:
    address.email,

  phone:
    String(address.phone || ""),

  social:
    address.social,

  subtotal:
    total,

  total:
    total,

  items:
    cart,

  gifts:
    address.gifts || []

};

  const formData =
  new FormData();

formData.append(
  "action",
  "createOrder"
);

formData.append(
  "payload",
  JSON.stringify(
    payload
  )
);

  const response =
    await fetch(
      API,
      {
        method:"POST",
        body:formData
      }
    );

  const result =
    await response.json();

  if(result.success){

  const file =
  slip.files[0];

const base64 =
  await fileToBase64(file);

const paymentPayload = {

  order_id:
    result.order_id,

  amount:
    total,

  slip_base64:
    base64

};

  const paymentForm =
    new FormData();

  paymentForm.append(
    "action",
    "payment"
  );

  paymentForm.append(
    "payload",
    JSON.stringify(
      paymentPayload
    )
  );

  const paymentResponse =
    await fetch(
      API,
      {
        method:"POST",
        body:paymentForm
      }
    );

  const paymentResult =
    await paymentResponse.json();

  if(paymentResult.success){

    alert(
      "แจ้งชำระเงินเรียบร้อย"
    );
const fullCart =

JSON.parse(
localStorage.getItem(
"cart"
) || "[]"
);

const checkoutCart =

JSON.parse(
localStorage.getItem(
"checkoutCart"
) || "[]"
);

const remainCart =

fullCart.filter(item =>

!checkoutCart.some(checkoutItem =>

JSON.stringify(item)

===

JSON.stringify(checkoutItem)

)

);

localStorage.setItem(

"cart",

JSON.stringify(
remainCart
)

);

localStorage.removeItem(
"checkoutCart"
);

localStorage.removeItem(
"buyNowCart"
);
    window.location =
      "order.html?id="
      +
      result.order_id;

  }else{

    console.log(paymentResult);
alert(paymentResult.error);

  }

}

}

function fileToBase64(file){

  return new Promise(
    (resolve,reject)=>{

      const reader =
        new FileReader();

      reader.onload =
        () => resolve(
          reader.result
        );

      reader.onerror =
        reject;

      reader.readAsDataURL(
        file
      );

    }
  );

}
  
</script>

</body>

</html>
