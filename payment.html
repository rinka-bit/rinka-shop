<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1">

<title>ชำระเงิน</title>

<link rel="stylesheet" href="style.css">

<style>

.container{
max-width:900px;
margin:auto;
padding:20px;
}

.card{
background:white;
padding:20px;
border-radius:12px;
margin-bottom:20px;
box-shadow:0 2px 8px rgba(0,0,0,.05);
}

button{
padding:12px 20px;
cursor:pointer;
border:none;
border-radius:8px;
background:#4f46e5;
color:white;
font-size:15px;
}

button:hover{
opacity:.9;
}

.bank-card{
border:1px solid #ddd;
border-radius:12px;
padding:14px;
margin-bottom:12px;
background:#fff;
}

.bank-option{
display:flex;
align-items:flex-start;
gap:12px;
cursor:pointer;
width:100%;
}

.bank-info{
flex:1;
min-width:0;
}

.bank-name{
font-size:16px;
font-weight:700;
}

.bank-owner{
font-size:13px;
color:#666;
margin-top:4px;
word-break:break-word;
overflow-wrap:break-word;
}

.qr-image{
display:block;
width:100%;
max-width:320px;
margin:auto;
border-radius:12px;
}

.bank-detail{
margin-top:20px;
text-align:center;
}

.save-tip{
font-size:13px;
color:#666;
margin-top:10px;
}

.copy-btn{
margin-top:10px;
}

@media(max-width:600px){

.container{
padding:15px;
}

.card{
padding:15px;
}

button{
width:100%;
}

}

</style>
  
</head>

<body>

<div class="container">

<h1>
ชำระเงิน
</h1>

<div class="card">

<h2>
เลือกช่องทางชำระเงิน
</h2>

<div id="bankList"></div>

<div
id="bankDetail"
style="margin-top:20px;">
</div>

</div>

<div class="card">

<h2>
แนบสลิป
</h2>

<input
type="file"
id="slip">

</div>

<button
onclick="submitOrder()">

ยืนยันการชำระเงิน

</button>

</div>

<script>

const API =
"https://script.google.com/macros/s/AKfycbxKjVvn8AXrK0wDvKqN-A9yS2Vk8R-w25ar1b9ftiIdUgUvFaShunLnFnAyIDuaTWj76w/exec";

let bankData = [];

loadBanks();

async function loadBanks(){

const response =
await fetch(
API + "?action=banks"
);

bankData =
await response.json();

let html = "";

bankData.forEach(bank=>{

html += `

<div class="bank-card">

<label class="bank-option">

<input
type="radio"
name="bank"
onclick="showBankById('${bank.account_id}')">

<div class="bank-info">

<div class="bank-name">
${bank.bank_name}
</div>

<div class="bank-owner">
${bank.account_name || ""}
</div>

</div>

</label>

</div>

`;

});

document.getElementById(
"bankList"
).innerHTML = html;

}

function showBankById(id){

  const bank =
    bankData.find(
      b => b.account_id === id
    );

  if(bank){

    showBank(bank);

  }

}

function showBank(bank){

let html = "";

if(bank.qr_image){

html = `

<div class="bank-detail">

<h3>
${bank.bank_name}
</h3>

<img
src="${bank.qr_image}"
class="qr-image">

<br>

<button
onclick="downloadQR('${bank.qr_image}')">

เปิด QR เต็มจอ

</button>

<p class="save-tip">

iPhone:
แตะรูปค้างไว้แล้วเลือก
"บันทึกรูปภาพ"

<br>

Android:
เปิดรูปแล้วกดดาวน์โหลดได้

</p>

</div>

`;

}else{

html = `

<div class="bank-detail">

<h3>
${bank.bank_name}
</h3>

<p>

ชื่อบัญชี :
<br>

<strong>
${bank.account_name}
</strong>

</p>

<p>

เลขบัญชี :
<br>

<strong>
${bank.account_number}
</strong>

</p>

<button
class="copy-btn"
onclick="
copyAccount(
'${bank.account_number}'
)">

คัดลอกเลขบัญชี

</button>

</div>

`;

}

document.getElementById(
"bankDetail"
).innerHTML = html;

}

function copyAccount(number){

  navigator.clipboard.writeText(
    number
  );

  alert(
    "คัดลอกเลขบัญชีแล้ว"
  );

}

function downloadQR(url){

window.open(
url,
"_blank"
);

}

async function submitOrder(){

  function downloadQR(url){

window.open(
url,
"_blank"
);

}

  const cart =
    JSON.parse(
      localStorage.getItem(
        "buyNowCart"
      ) || "[]"
    );

  const address =
    JSON.parse(
      localStorage.getItem(
        "checkoutAddress"
      ) || "{}"
    );

  const total =
    cart.reduce(
      (a,b)=>
      a +
      (
        Number(b.price)
        *
        Number(b.qty)
      ),
      0
    );

  const slip =
document.getElementById(
"slip"
);

if(!slip.files.length){

alert(
"กรุณาแนบสลิป"
);

return;

}

  const payload = {

    customer_name:
      address.receiver,

    email:
      address.email,

    phone:
      address.phone,

    social:
      address.social,

    subtotal:
      total,

    total:
      total,

    items:
      cart

  };

  const formData =
    new FormData();

  formData.append(
    "payload",
    JSON.stringify(
      payload
    )
  );

  const response =
    await fetch(
      API,
      {
        method:"POST",
        body:formData
      }
    );

  const result =
    await response.json();

  if(result.success){

    alert(
      "สร้างคำสั่งซื้อเรียบร้อย"
    );

    window.location =
      "order.html?id="
      +
      result.order_id;

  }

}

</script>

</body>

</html>
