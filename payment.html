<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1">

<title>ชำระเงิน</title>

<link rel="stylesheet" href="style.css">

<style>

.container{
max-width:900px;
margin:auto;
padding:20px;
}

.card{
background:white;
padding:20px;
border-radius:12px;
margin-bottom:20px;
box-shadow:0 2px 8px rgba(0,0,0,.05);
}

button{
padding:12px 20px;
cursor:pointer;
border:none;
border-radius:8px;
background:#4f46e5;
color:white;
font-size:15px;
}

button:hover{
opacity:.9;
}

.bank-card{
border:1px solid #ddd;
border-radius:12px;
padding:14px;
margin-bottom:12px;
background:#fff;
}

.bank-option{
display:flex;
align-items:center;
gap:12px;
cursor:pointer;
}

.bank-option input[type="radio"]{
width:auto;
max-width:none;
padding:0;
margin:0;
flex:0 0 auto;
}

.bank-info{
display:block;
}

.bank-name{
font-size:16px;
font-weight:700;
word-break:break-word;
}

.bank-owner{
font-size:13px;
color:#666;
margin-top:4px;
word-break:break-word;
overflow-wrap:break-word;
}

.qr-image{
display:block;
width:100%;
max-width:320px;
margin:auto;
border-radius:12px;
}

.bank-detail{
margin-top:20px;
text-align:center;
}

.save-tip{
font-size:13px;
color:#666;
margin-top:10px;
}

.copy-btn{
margin-top:10px;
}

@media(max-width:600px){

.container{
padding:15px;
}

.card{
padding:15px;
}

button{
width:100%;
}

}

@keyframes spin{

from{
transform:rotate(0deg);
}

to{
transform:rotate(360deg);
}

}

.cat-track{

width:220px;
height:70px;

margin:auto;
margin-bottom:15px;

overflow:hidden;

position:relative;

}

.cat-loader{

position:absolute;

font-size:48px;

animation:
catRun 3s linear infinite;

transform:
scaleX(-1);

}

@keyframes catRun{

0%{

left:-80px;

}

100%{

left:240px;

}

}
  
</style>
  
</head>

<body>

<div class="container">

<h1>
ชำระเงิน
</h1>

<div class="card">

<h2>
เลือกช่องทางชำระเงิน
</h2>

<div id="bankList"></div>

<div
id="bankDetail"
style="margin-top:20px;">
</div>

</div>

<div class="card">

<h2>
แนบสลิป
</h2>

<input
type="file"
id="slip">

</div>

<button
id="submitBtn"
onclick="submitOrder()">

ยืนยันการชำระเงิน

</button>
  
</div>

<script>

const API =
"https://script.google.com/macros/s/AKfycbxKjVvn8AXrK0wDvKqN-A9yS2Vk8R-w25ar1b9ftiIdUgUvFaShunLnFnAyIDuaTWj76w/exec";

let bankData = [];

loadBanks();

async function loadBanks(){

  try{

    const response =
      await fetch(
        API + "?action=banks"
      );

    const result =
      await response.json();

    console.log("CreateOrder Result", result);

    bankData =
      Array.isArray(result)
        ? result
        : Array.isArray(result.banks)
          ? result.banks
          : [];

    let html = "";

    bankData.forEach((bank,index)=>{

      html += `

<div class="bank-card">

<div class="bank-option">

<input
type="radio"
name="bank"

${index===0?"checked":""}

onclick="
showBankById(
'${bank.account_id}'
)
">

<div class="bank-info">

<div class="bank-name">
${bank.bank_name || ""}
</div>

<div class="bank-owner">
${bank.account_name || ""}
</div>

</div>

</div>

</div>

`;

    });

    document.getElementById(
      "bankList"
    ).innerHTML =
      html;

    if(bankData.length){

      showBank(
        bankData[0]
      );

    }

  }catch(error){

    console.error(
      "loadBanks error",
      error
    );

    document.getElementById(
      "bankList"
    ).innerHTML =
      "<p>โหลดบัญชีธนาคารไม่สำเร็จ</p>";

  }

}
  
function showBankById(id){

  const bank =
    bankData.find(
      b => b.account_id === id
    );

  if(bank){

    showBank(bank);

  }

}

function showBank(bank){

let html = "";

if(bank.qr_image){

html = `

<div class="bank-detail">

<h3>
${bank.bank_name}
</h3>

<img
src="${bank.qr_image}"
class="qr-image">

<br>

<button
onclick="downloadQR('${bank.qr_image}')">

เปิด QR เต็มจอ

</button>

<p class="save-tip">

iPhone:
แตะรูปค้างไว้แล้วเลือก
"บันทึกรูปภาพ"

<br>

Android:
เปิดรูปแล้วกดดาวน์โหลดได้

</p>

</div>

`;

}else{

html = `

<div class="bank-detail">

<h3>
${bank.bank_name}
</h3>

<p>

ชื่อบัญชี :
<br>

<strong>
${bank.account_name}
</strong>

</p>

<p>

เลขบัญชี :
<br>

<strong>
${bank.account_number}
</strong>

</p>

<button
class="copy-btn"
onclick="
copyAccount(
'${bank.account_number}'
)">

คัดลอกเลขบัญชี

</button>

</div>

`;

}

document.getElementById(
"bankDetail"
).innerHTML = html;

}

function copyAccount(number){

  navigator.clipboard.writeText(
    number
  );

  alert(
    "คัดลอกเลขบัญชีแล้ว"
  );

}

function downloadQR(url){

window.open(
url,
"_blank"
);

}
  
async function submitOrder(){

  let cart =
    JSON.parse(
      localStorage.getItem(
        "checkoutCart"
      ) || "[]"
    );

  if(
    !Array.isArray(cart) ||
    cart.length === 0
  ){

    cart =
      JSON.parse(
        localStorage.getItem(
          "buyNowCart"
        ) || "[]"
      );

  }

  if(
    !Array.isArray(cart) ||
    cart.length === 0
  ){

    cart =
      JSON.parse(
        localStorage.getItem(
          "cart"
        ) || "[]"
      );

  }

  if(
    !Array.isArray(cart) ||
    cart.length === 0
  ){

    alert(
      "ไม่พบสินค้าในคำสั่งซื้อ"
    );

    return;

  }

  const btn =
    document.getElementById(
      "submitBtn"
    );

  const loadingOverlay =
    document.getElementById(
      "loadingOverlay"
    );

  if(btn.disabled){

    return;

  }

  const slip =
    document.getElementById(
      "slip"
    );

  if(
    !slip ||
    !slip.files ||
    !slip.files.length
  ){

    alert(
      "กรุณาแนบสลิป"
    );

    return;

  }

  btn.disabled =
    true;

  btn.textContent =
    "กำลังส่งข้อมูล...";

  if(loadingOverlay){

    loadingOverlay.style.display =
      "flex";

  }

  try{

    const address =
      JSON.parse(
        localStorage.getItem(
          "checkoutAddress"
        ) || "{}"
      );

    /*
    คำนวณยอดเบื้องต้นใหม่
    ไม่ใช้ item.final_price เก่าจาก Cart
    */

    const calculatedTotal =
      cart.reduce(
        (
          sum,
          item
        )=>{

          const quantity =
            Math.max(
              1,
              Math.floor(
                Number(
                  item.qty !== undefined
                    ? item.qty
                    : item.quantity
                ) || 1
              )
            );

          const unitPrice =
            Number(
              item.price !== undefined
                ? item.price
                : item.unit_price
            ) || 0;

          const crateFee =
            Number(
              item.crate_fee || 0
            ) || 0;

          return (
            sum +
            (
              unitPrice *
              quantity
            ) +
            crateFee
          );

        },
        0
      );

    if(
      !Number.isFinite(
        calculatedTotal
      ) ||
      calculatedTotal <= 0
    ){

      throw new Error(
        "ยอดรวมคำสั่งซื้อไม่ถูกต้อง"
      );

    }

    const payload = {

      customer_name:
        address.receiver || "",

      email:
        address.email || "",

      phone:
        String(
          address.phone || ""
        ),

      social:
        address.social || "",

      subtotal:
        calculatedTotal,

      total:
        calculatedTotal,

      items:
        cart,

      gifts:
        Array.isArray(
          address.gifts
        )
          ? address.gifts
          : []

    };

    /*
    สร้างออเดอร์
    */

    const formData =
      new FormData();

    formData.append(
      "action",
      "createOrder"
    );

    formData.append(
      "payload",
      JSON.stringify(
        payload
      )
    );

    const response =
      await fetch(
        API,
        {
          method:
            "POST",

          body:
            formData
        }
      );

    if(!response.ok){

      throw new Error(
        "สร้างออเดอร์ไม่สำเร็จ HTTP " +
        response.status
      );

    }

    const result =
      await response.json();

    if(!result.success){

      throw new Error(
        result.error ||
        "สร้างออเดอร์ไม่สำเร็จ"
      );

    }

    const orderId =
      String(
        result.order_id || ""
      ).trim();

    if(!orderId){

      throw new Error(
        "ระบบไม่ได้ส่งเลขออเดอร์กลับมา"
      );

    }

    /*
    ใช้ยอดที่ Backend คำนวณกลับมา
    ไม่ใช้ยอดจาก Cart หาก Backend มี total
    */

    const paymentAmount =
      Number(
        result.total
      );

    if(
      !Number.isFinite(
        paymentAmount
      ) ||
      paymentAmount <= 0
    ){

      throw new Error(
        "ยอดชำระเงินจากระบบไม่ถูกต้อง"
      );

    }

    const base64 =
      await fileToBase64(
        slip.files[0]
      );

    /*
    บันทึกการชำระเงิน
    */

    const paymentForm =
      new FormData();

    paymentForm.append(
      "action",
      "payment"
    );

    paymentForm.append(
      "payload",
      JSON.stringify({

        order_id:
          orderId,

        amount:
          paymentAmount,

        slip_base64:
          base64

      })
    );

    const paymentResponse =
      await fetch(
        API,
        {
          method:
            "POST",

          body:
            paymentForm
        }
      );

    if(!paymentResponse.ok){

      throw new Error(
        "แจ้งชำระเงินไม่สำเร็จ HTTP " +
        paymentResponse.status
      );

    }

    const paymentResult =
      await paymentResponse.json();

    console.log("Payment Payload",{
    order_id:result.order_id,
    amount:paymentAmount
});

    if(!paymentResult.success){

      throw new Error(
        paymentResult.error ||
        "แจ้งชำระเงินไม่สำเร็จ"
      );

    }

    alert(
      "แจ้งชำระเงินเรียบร้อย"
    );

    /*
    ลบสินค้าออกจากตะกร้า
    */

    const fullCart =
      JSON.parse(
        localStorage.getItem(
          "cart"
        ) || "[]"
      );

    const checkoutCart =
      JSON.parse(
        localStorage.getItem(
          "checkoutCart"
        ) || "[]"
      );

    if(
      Array.isArray(
        fullCart
      ) &&
      Array.isArray(
        checkoutCart
      ) &&
      checkoutCart.length
    ){

      const remainCart =
        fullCart.filter(
          item=>

            !checkoutCart.some(
              checkoutItem=>

                JSON.stringify(
                  item
                ) ===
                JSON.stringify(
                  checkoutItem
                )

            )

        );

      localStorage.setItem(
        "cart",
        JSON.stringify(
          remainCart
        )
      );

    }

    localStorage.removeItem(
      "checkoutCart"
    );

    localStorage.removeItem(
      "buyNowCart"
    );

    window.location.href =
      "order.html?id=" +
      encodeURIComponent(
        orderId
      );

  }catch(error){

    console.error(
      "submitOrder error",
      error
    );

    alert(
      error.message ||
      "เกิดข้อผิดพลาด กรุณาลองใหม่"
    );

  }finally{

    btn.disabled =
      false;

    btn.textContent =
      "ยืนยันการชำระเงิน";

    if(loadingOverlay){

      loadingOverlay.style.display =
        "none";

    }

  }

}

function fileToBase64(file){

  return new Promise(
    (resolve,reject)=>{

      const reader =
        new FileReader();

      reader.onload =
        () => resolve(
          reader.result
        );

      reader.onerror =
        reject;

      reader.readAsDataURL(
        file
      );

    }
  );

}
  
</script>

<div
id="loadingOverlay"
style="
display:none;
position:fixed;
inset:0;
background:rgba(0,0,0,.6);
z-index:9999;
justify-content:center;
align-items:center;
">

<div
style="
background:white;
padding:30px;
border-radius:20px;
text-align:center;
max-width:300px;
">

<div class="cat-track">

<div class="cat-loader">

📦🐈

</div>

</div>

<p>

เจ้าเหมียวกำลังส่งออเดอร์เข้าระบบ 📦🐈

<br><br>

กรุณารอสักครู่

</p>

</div>

</div>
  
</body>

</html>
