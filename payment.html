<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1">

<title>ชำระเงิน</title>

<link rel="stylesheet" href="style.css">

<style>

.container{
max-width:900px;
margin:auto;
padding:20px;
}

.card{
background:white;
padding:20px;
border-radius:12px;
margin-bottom:20px;
}

img{
max-width:250px;
}

button{
padding:12px 20px;
cursor:pointer;
}

</style>

</head>

<body>

<div class="container">

<h1>
ชำระเงิน
</h1>

<div class="card">

<h2>
เลือกช่องทางชำระเงิน
</h2>

<div id="bankList"></div>

<div
id="bankDetail"
style="margin-top:20px;">
</div>

</div>

<div class="card">

<h2>
แนบสลิป
</h2>

<input
type="file"
id="slip">

</div>

<button
onclick="submitOrder()">

ยืนยันการชำระเงิน

</button>

</div>

<script>

const API =
"https://script.google.com/macros/s/AKfycbxKjVvn8AXrK0wDvKqN-A9yS2Vk8R-w25ar1b9ftiIdUgUvFaShunLnFnAyIDuaTWj76w/exec";

let bankData = [];

loadBanks();

async function loadBanks(){

  const response =
    await fetch(
      API + "?action=banks"
    );

  bankData =
    await response.json();

  let html = "";

  bankData.forEach(bank=>{

    html += `
      <div style="
        border:1px solid #ddd;
        padding:15px;
        margin-bottom:10px;
        border-radius:10px;
      ">

        <label style="
          display:flex;
          align-items:center;
          gap:10px;
          cursor:pointer;
        ">

          <input
            type="radio"
            name="bank"
            onclick="showBankById('${bank.account_id}')">

          <span>
            ${bank.bank_name}
          </span>

        </label>

      </div>
    `;

  });

  document.getElementById(
    "bankList"
  ).innerHTML = html;

}

function showBankById(id){

  const bank =
    bankData.find(
      b => b.account_id === id
    );

  if(bank){

    showBank(bank);

  }

}

function showBank(bank){

  let html = "";

  if(bank.qr_image){

    html = `

      <h3>
        ${bank.bank_name}
      </h3>

      <img
        src="${bank.qr_image}"
        style="
          max-width:300px;
          width:100%;
          border-radius:10px;
        ">

      <br><br>

      <button
        onclick="
          downloadQR(
            '${bank.qr_image}'
          )
        ">
        บันทึกรูป QR
      </button>

    `;

  }else{

    html = `

      <h3>
        ${bank.bank_name}
      </h3>

      <p>
        ชื่อบัญชี :
        ${bank.account_name}
      </p>

      <p>
        เลขบัญชี :
        ${bank.account_number}
      </p>

      <button
        onclick="
          copyAccount(
            '${bank.account_number}'
          )
        ">
        คัดลอกเลขบัญชี
      </button>

    `;

  }

  document.getElementById(
    "bankDetail"
  ).innerHTML = html;

}

function copyAccount(number){

  navigator.clipboard.writeText(
    number
  );

  alert(
    "คัดลอกเลขบัญชีแล้ว"
  );

}

function downloadQR(url){

  const a =
    document.createElement("a");

  a.href = url;

  a.target = "_blank";

  a.click();

}

async function submitOrder(){

  const cart =
    JSON.parse(
      localStorage.getItem(
        "buyNowCart"
      ) || "[]"
    );

  const address =
    JSON.parse(
      localStorage.getItem(
        "checkoutAddress"
      ) || "{}"
    );

  const total =
    cart.reduce(
      (a,b)=>
      a +
      (
        Number(b.price)
        *
        Number(b.qty)
      ),
      0
    );

  const payload = {

    customer_name:
      address.receiver,

    email:
      address.email,

    phone:
      address.phone,

    social:
      address.social,

    subtotal:
      total,

    total:
      total,

    items:
      cart

  };

  const formData =
    new FormData();

  formData.append(
    "payload",
    JSON.stringify(
      payload
    )
  );

  const response =
    await fetch(
      API,
      {
        method:"POST",
        body:formData
      }
    );

  const result =
    await response.json();

  if(result.success){

    alert(
      "สร้างคำสั่งซื้อเรียบร้อย"
    );

    window.location =
      "order.html?id="
      +
      result.order_id;

  }

}

</script>

</body>

</html>
