<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">
<meta
name="viewport"
content="width=device-width,initial-scale=1">

<title>ชำระเงิน | Rinka Shop</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link
href="https://fonts.googleapis.com/css2?family=Kodchasan:wght@400;500;600;700&display=swap"
rel="stylesheet">

<link rel="stylesheet" href="style.css">

<style>

:root{
  --payment-primary:#7dcfff;
  --payment-primary-dark:#4aa4db;
  --payment-background:#f6fbff;
  --payment-card:#ffffff;
  --payment-text:#334155;
  --payment-muted:#64748b;
  --payment-border:#dbe7f1;
  --payment-danger:#be123c;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:'Kodchasan',sans-serif;
  color:var(--payment-text);
  background:
    linear-gradient(
      180deg,
      #fbfdff 0%,
      var(--payment-background) 100%
    );
}

button,
input,
a{
  font:inherit;
}

button{
  cursor:pointer;
}

button:disabled{
  opacity:.55;
  cursor:not-allowed;
}

.payment-topbar{
  position:sticky;
  top:0;
  z-index:100;
  min-height:68px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:11px 16px;
  background:rgba(255,255,255,.94);
  border-bottom:1px solid rgba(219,231,241,.95);
  box-shadow:0 5px 18px rgba(71,85,105,.07);
  backdrop-filter:blur(10px);
}

.payment-topbar button,
.payment-topbar a{
  width:46px;
  height:46px;
  border:none;
  border-radius:999px;
  background:#fff;
  color:var(--payment-text);
  display:flex;
  align-items:center;
  justify-content:center;
  text-decoration:none;
  font-size:21px;
  box-shadow:0 4px 14px rgba(71,85,105,.10);
}

.payment-topbar h1{
  flex:1;
  margin:0;
  padding:0 12px;
  text-align:center;
  color:#3f6078;
  font-size:20px;
}

.payment-cart{
  position:relative;
}

.payment-cart-count{
  position:absolute;
  top:-5px;
  right:-5px;
  min-width:20px;
  height:20px;
  padding:0 5px;
  border-radius:999px;
  background:#ff5c7a;
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:10px;
  font-weight:700;
}

.payment-container{
  width:min(1160px,100%);
  margin:auto;
  padding:22px 18px 130px;
}

.payment-layout{
  display:grid;
  grid-template-columns:minmax(0,1.5fr) minmax(300px,.75fr);
  gap:22px;
  align-items:start;
}

.payment-card{
  margin-bottom:18px;
  padding:18px;
  background:#fff;
  border:1px solid var(--payment-border);
  border-radius:21px;
  box-shadow:0 8px 25px rgba(86,142,178,.08);
}

.payment-card h2{
  margin:0 0 14px;
  color:#3f6078;
  font-size:19px;
}

.payment-section-note{
  margin:-6px 0 14px;
  color:var(--payment-muted);
  font-size:13px;
  line-height:1.6;
}

.payment-bank-list{
  display:grid;
  gap:10px;
}

.payment-bank-card{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  padding:13px;
  border:1px solid var(--payment-border);
  border-radius:16px;
  background:#fff;
  cursor:pointer;
  transition:.18s ease;
}

.payment-bank-card:hover{
  border-color:#9bdcff;
}

.payment-bank-card.selected{
  border-color:var(--payment-primary-dark);
  background:#eef9ff;
  box-shadow:0 0 0 2px rgba(125,207,255,.13);
}

.payment-bank-card input{
  position:absolute;
  opacity:0;
  pointer-events:none;
}

.payment-bank-main{
  display:flex;
  align-items:center;
  gap:11px;
  min-width:0;
}

.payment-bank-icon{
  width:44px;
  height:44px;
  border-radius:13px;
  background:#edf7fc;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:21px;
}

.payment-bank-name{
  font-weight:700;
}

.payment-bank-owner{
  margin-top:4px;
  color:var(--payment-muted);
  font-size:12px;
  overflow-wrap:anywhere;
}

.payment-bank-check{
  width:26px;
  height:26px;
  border-radius:999px;
  background:#dff2fc;
  color:#3d8fbe;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:700;
  opacity:0;
}

.payment-bank-card.selected .payment-bank-check{
  opacity:1;
}

.payment-detail-card{
  margin-top:15px;
  padding:16px;
  border:1px solid #d7ebf7;
  border-radius:17px;
  background:linear-gradient(135deg,#f4fbff,#fbfdff);
}

.payment-detail-head{
  display:flex;
  justify-content:space-between;
  gap:12px;
  align-items:flex-start;
}

.payment-detail-head h3{
  margin:5px 0 0;
  color:#355a73;
}

.payment-detail-label{
  color:var(--payment-muted);
  font-size:12px;
}

.payment-detail-icon{
  font-size:28px;
}

.payment-qr-wrap{
  width:min(330px,100%);
  margin:16px auto;
  padding:10px;
  border-radius:17px;
  background:#fff;
  border:1px solid var(--payment-border);
}

.payment-qr-image{
  width:100%;
  display:block;
  border-radius:12px;
}

.payment-account-line{
  display:flex;
  justify-content:space-between;
  gap:14px;
  padding:10px 0;
  border-bottom:1px solid #e8f0f5;
  color:var(--payment-muted);
  font-size:13px;
}

.payment-account-line strong{
  color:var(--payment-text);
  text-align:right;
  overflow-wrap:anywhere;
}

.payment-account-number{
  letter-spacing:.5px;
  font-size:16px;
}

.payment-secondary-button{
  width:100%;
  min-height:43px;
  margin-top:14px;
  border:1px solid #cce5f4;
  border-radius:999px;
  background:#eef8ff;
  color:#3476a2;
  font-weight:700;
}

.payment-save-tip{
  margin:10px 0 0;
  color:var(--payment-muted);
  text-align:center;
  font-size:11px;
  line-height:1.6;
}

.payment-slip-drop{
  position:relative;
  min-height:170px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:8px;
  padding:20px;
  border:2px dashed #bddceb;
  border-radius:17px;
  background:#fbfdff;
  text-align:center;
  transition:.18s ease;
}

.payment-slip-drop.dragging{
  border-color:var(--payment-primary-dark);
  background:#eef9ff;
}

.payment-slip-drop input{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  opacity:0;
  cursor:pointer;
}

.payment-slip-icon{
  font-size:42px;
}

.payment-slip-drop b{
  color:#3f6078;
}

.payment-slip-drop span{
  color:var(--payment-muted);
  font-size:12px;
}

.payment-slip-preview{
  margin-top:13px;
}

.payment-slip-preview.hidden{
  display:none;
}

.payment-slip-preview-card{
  display:grid;
  grid-template-columns:95px minmax(0,1fr);
  gap:12px;
  padding:12px;
  border:1px solid #d7ebf7;
  border-radius:15px;
  background:#f8fcff;
}

.payment-slip-preview-card img{
  width:95px;
  height:95px;
  object-fit:contain;
  border-radius:11px;
  background:#fff;
}

.payment-slip-preview-card div{
  min-width:0;
  display:flex;
  flex-direction:column;
  align-items:flex-start;
  gap:6px;
}

.payment-slip-preview-card b{
  overflow-wrap:anywhere;
}

.payment-slip-preview-card span{
  color:var(--payment-muted);
  font-size:12px;
}

.payment-slip-preview-card button{
  border:none;
  border-radius:999px;
  padding:7px 11px;
  background:#eaf6fc;
  color:#3476a2;
  font-weight:700;
}

.payment-summary{
  position:sticky;
  top:88px;
  padding:19px;
  background:#fff;
  border:1px solid var(--payment-border);
  border-radius:21px;
  box-shadow:0 11px 32px rgba(86,142,178,.11);
}

.payment-summary h2{
  margin:0 0 14px;
  color:#3f6078;
  font-size:19px;
}

.payment-summary-item{
  display:flex;
  justify-content:space-between;
  gap:12px;
  padding:10px 0;
  border-bottom:1px solid #edf2f6;
}

.payment-summary-item div{
  min-width:0;
}

.payment-summary-item b{
  display:block;
  font-size:13px;
  line-height:1.5;
  overflow-wrap:anywhere;
}

.payment-summary-item span{
  display:block;
  margin-top:4px;
  color:var(--payment-muted);
  font-size:11px;
}

.payment-summary-item strong{
  flex:0 0 auto;
  color:#347fb4;
  font-size:13px;
}

.payment-summary-row{
  display:flex;
  justify-content:space-between;
  gap:12px;
  padding:9px 0;
  color:var(--payment-muted);
  font-size:14px;
}

.payment-summary-row strong{
  color:var(--payment-text);
}

.payment-summary-total{
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  gap:12px;
  margin-top:8px;
  padding-top:15px;
  border-top:1px solid var(--payment-border);
}

.payment-summary-total span{
  font-weight:700;
}

.payment-summary-total strong{
  color:#2563eb;
  font-size:28px;
}

.payment-submit{
  width:100%;
  min-height:51px;
  margin-top:18px;
  border:none;
  border-radius:999px;
  background:linear-gradient(135deg,#7dcfff,#57b8ed);
  color:#fff;
  font-size:16px;
  font-weight:700;
  box-shadow:0 9px 22px rgba(87,184,237,.25);
}

.payment-back-link{
  display:block;
  margin-top:11px;
  color:#53748b;
  text-align:center;
  text-decoration:none;
  font-size:13px;
  font-weight:600;
}

.payment-loading-box,
.payment-empty-box{
  min-height:130px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:9px;
  padding:18px;
  text-align:center;
  border:1px dashed #cfdee7;
  border-radius:15px;
  background:#fbfdff;
  color:var(--payment-muted);
}

.payment-empty-box a{
  color:#3476a2;
  font-weight:700;
  text-decoration:none;
}

.payment-error-box{
  display:flex;
  flex-direction:column;
  gap:8px;
  padding:15px;
  border:1px solid #fecaca;
  border-radius:15px;
  background:#fff1f2;
  color:#9f1239;
}

.payment-error-box button{
  width:max-content;
  border:none;
  border-radius:999px;
  padding:8px 13px;
  background:#be123c;
  color:#fff;
  font-weight:700;
}

.payment-spinner{
  width:30px;
  height:30px;
  border:4px solid #dff2fc;
  border-top-color:var(--payment-primary-dark);
  border-radius:50%;
  animation:paymentSpin .8s linear infinite;
}

@keyframes paymentSpin{
  to{transform:rotate(360deg)}
}

.payment-state-icon{
  font-size:40px;
}

.payment-toast{
  position:fixed;
  left:50%;
  bottom:24px;
  z-index:3000;
  width:min(410px,calc(100% - 28px));
  padding:13px 16px;
  border-radius:14px;
  background:#18384e;
  color:#fff;
  text-align:center;
  font-weight:600;
  opacity:0;
  pointer-events:none;
  transform:translate(-50%,20px);
  transition:.2s ease;
  box-shadow:0 12px 30px rgba(15,23,42,.24);
}

.payment-toast.show{
  opacity:1;
  transform:translate(-50%,0);
}

.payment-toast.error{
  background:#991b1b;
}

.payment-success-state{
  position:fixed;
  inset:0;
  z-index:4000;
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:rgba(15,23,42,.64);
}

.payment-success-state.show{
  display:flex;
}

.payment-success-state > div{
  width:min(390px,100%);
  padding:28px;
  border-radius:22px;
  background:#fff;
  text-align:center;
  box-shadow:0 20px 50px rgba(15,23,42,.25);
}

.payment-success-state h2,
.payment-success-state p{
  margin:8px 0;
}

.payment-success-state p{
  color:var(--payment-muted);
}

.payment-success-icon{
  width:66px;
  height:66px;
  margin:auto;
  border-radius:999px;
  background:#dcfce7;
  color:#166534;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:34px;
  font-weight:700;
}

.loading-overlay{
  display:none;
  position:fixed;
  inset:0;
  z-index:3500;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:rgba(15,23,42,.65);
}

.loading-overlay-card{
  width:min(330px,100%);
  padding:27px;
  border-radius:22px;
  background:#fff;
  text-align:center;
  box-shadow:0 20px 50px rgba(15,23,42,.25);
}

.cat-track{
  width:220px;
  max-width:100%;
  height:70px;
  margin:auto auto 15px;
  overflow:hidden;
  position:relative;
}

.cat-loader{
  position:absolute;
  font-size:48px;
  animation:catRun 3s linear infinite;
  transform:scaleX(-1);
}

@keyframes catRun{
  0%{left:-80px}
  100%{left:240px}
}

@media(max-width:850px){

  .payment-layout{
    grid-template-columns:1fr;
  }

  .payment-summary{
    position:static;
  }

}

@media(max-width:600px){

  .payment-topbar{
    min-height:64px;
    padding:9px 11px;
  }

  .payment-topbar h1{
    font-size:17px;
  }

  .payment-container{
    padding:14px 10px 116px;
  }

  .payment-card{
    padding:14px;
    border-radius:18px;
  }

  .payment-slip-preview-card{
    grid-template-columns:76px minmax(0,1fr);
  }

  .payment-slip-preview-card img{
    width:76px;
    height:76px;
  }

}

</style>

</head>

<script>
const API =
"https://script.google.com/macros/s/AKfycbxKjVvn8AXrK0wDvKqN-A9yS2Vk8R-w25ar1b9ftiIdUgUvFaShunLnFnAyIDuaTWj76w/exec";

let bankData = [];


let selectedBankId = "";
let paymentSubmitting = false;
let paymentToastTimer = null;


/*
=========================================
REQUEST / IDEMPOTENCY
=========================================
*/

const PAYMENT_REQUEST_TIMEOUT =
  45000;


function getPaymentRequestId(){

  const storageKey =
    "rinka_checkout_request_id";


  let requestId =
    sessionStorage.getItem(
      storageKey
    );


  if(requestId){

    return requestId;

  }


  if(
    window.crypto &&
    typeof crypto.randomUUID ===
    "function"
  ){

    requestId =
      crypto.randomUUID();

  }else{

    requestId =
      "REQ-" +
      Date.now() +
      "-" +
      Math.random()
        .toString(36)
        .slice(2,10);

  }


  sessionStorage.setItem(
    storageKey,
    requestId
  );


  return requestId;

}


function clearPaymentRequestId(){

  sessionStorage.removeItem(
    "rinka_checkout_request_id"
  );

}


async function paymentFetch(
  url,
  options = {},
  timeout =
    PAYMENT_REQUEST_TIMEOUT
){

  const controller =
    new AbortController();


  const timer =
    setTimeout(
      ()=>{
        controller.abort();
      },
      timeout
    );


  try{

    return await fetch(
      url,
      {
        ...options,

        signal:
          controller.signal
      }
    );

  }catch(error){

    if(
      error &&
      error.name ===
      "AbortError"
    ){

      throw new Error(
        "การเชื่อมต่อใช้เวลานานกว่าปกติ กรุณารอสักครู่แล้วลองอีกครั้ง"
      );

    }


    throw error;


  }finally{

    clearTimeout(
      timer
    );

  }

}

document.addEventListener(
  "DOMContentLoaded",
  ()=>{

    renderPaymentSummary();
    updatePaymentCartCount();
    bindSlipInput();
    loadBanks();

  }
);

async function loadBanks(){

  const list =
    document.getElementById(
      "bankList"
    );

  const detail =
    document.getElementById(
      "bankDetail"
    );

  list.innerHTML = `

<div class="payment-loading-box">

  <span class="payment-spinner"></span>

  <span>
    กำลังโหลดช่องทางชำระเงิน...
  </span>

</div>

`;

  detail.innerHTML = "";

  try{

    const response =
      await fetch(
        API + "?action=banks"
      );

    if(!response.ok){

      throw new Error(
        "HTTP " +
        response.status
      );

    }

    const result =
      await response.json();

    if(
      result &&
      result.success === false
    ){

      throw new Error(
        result.error ||
        "โหลดบัญชีธนาคารไม่สำเร็จ"
      );

    }

    bankData =
      Array.isArray(result)
        ? result
        : Array.isArray(result.banks)
          ? result.banks
          : [];

    bankData =
      bankData.filter(
        bank=>
          normalizePaymentBoolean(
            bank.status === undefined
              ? true
              : bank.status
          )
      );

    if(!bankData.length){

      list.innerHTML = `

<div class="payment-empty-box">

  <div class="payment-state-icon">
    🏦

async function submitOrder(){

  let cart =
    JSON.parse(
      localStorage.getItem(
        "checkoutCart"
      ) || "[]"
    );

  if(
    !Array.isArray(cart) ||
    cart.length === 0
  ){

    cart =
      JSON.parse(
        localStorage.getItem(
          "buyNowCart"
        ) || "[]"
      );

  }

  if(
    !Array.isArray(cart) ||
    cart.length === 0
  ){

    cart =
      JSON.parse(
        localStorage.getItem(
          "cart"
        ) || "[]"
      );

  }

  if(
    !Array.isArray(cart) ||
    cart.length === 0
  ){

    alert(
      "ไม่พบสินค้าในคำสั่งซื้อ"
    );

    return;

  }

  const btn =
    document.getElementById(
      "submitBtn"
    );

  const loadingOverlay =
    document.getElementById(
      "loadingOverlay"
    );

  if(btn.disabled){

    return;

  }

  if(!selectedBankId){

    showPaymentToast(
      "กรุณาเลือกช่องทางชำระเงิน",
      true
    );

    return;

  }

  const slip =
    document.getElementById(
      "slip"
    );

  if(
    !slip ||
    !slip.files ||
    !slip.files.length
  ){

    showPaymentToast(
      "กรุณาแนบสลิป",
      true
    );

    return;

  }

  try{

    validatePaymentSlip(
      slip.files[0]
    );

  }catch(error){

    showPaymentToast(
      error.message ||
      String(error),
      true
    );

    return;

  }

  paymentSubmitting =
    true;

  btn.disabled =
    true;

  btn.textContent =
    "⏳ กำลังส่งข้อมูล...";

  if(loadingOverlay){

    loadingOverlay.style.display =
      "flex";

  }

  try{

    const address =
      JSON.parse(
        localStorage.getItem(
          "checkoutAddress"
        ) || "{}"
      );

    /*
    คำนวณยอดเบื้องต้นใหม่
    ไม่ใช้ item.final_price เก่าจาก Cart
    */

    const calculatedTotal =
      cart.reduce(
        (
          sum,
          item
        )=>{

          const quantity =
            Math.max(
              1,
              Math.floor(
                Number(
                  item.qty !== undefined
                    ? item.qty
                    : item.quantity
                ) || 1
              )
            );

          const unitPrice =
            Number(
              item.price !== undefined
                ? item.price
                : item.unit_price
            ) || 0;

          const crateFee =
            Number(
              item.crate_fee || 0
            ) || 0;

          return (
            sum +
            (
              unitPrice *
              quantity
            ) +
            crateFee
          );

        },
        0
      );

    if(
      !Number.isFinite(
        calculatedTotal
      ) ||
      calculatedTotal <= 0
    ){

      throw new Error(
        "ยอดรวมคำสั่งซื้อไม่ถูกต้อง"
      );

    }

   const requestId =
  getPaymentRequestId();


const payload = {

  request_id:
    requestId,

  customer_name:
    address.receiver || "",

  email:
    address.email || "",

  phone:
    String(
      address.phone || ""
    ),

  social:
    address.social || "",

  subtotal:
    calculatedTotal,

  total:
    calculatedTotal,

  items:
    cart,

  gifts:
    Array.isArray(
      address.gifts
    )
      ? address.gifts
      : []

};

    /*
    สร้างออเดอร์
    */

    const formData =
      new FormData();

    formData.append(
      "action",
      "createOrder"
    );

    formData.append(
      "payload",
      JSON.stringify(
        payload
      )
    );

   const response =
  await paymentFetch(
    API,
    {
      method:
        "POST",

      body:
        formData
    }
  );

    if(!response.ok){

      throw new Error(
        "สร้างออเดอร์ไม่สำเร็จ HTTP " +
        response.status
      );

    }

    const result =
      await response.json();

    if(!result.success){

      throw new Error(
        result.error ||
        "สร้างออเดอร์ไม่สำเร็จ"
      );

    }

    const orderId =
      String(
        result.order_id || ""
      ).trim();

    if(!orderId){

      throw new Error(
        "ระบบไม่ได้ส่งเลขออเดอร์กลับมา"
      );

    }

    /*
    ใช้ยอดที่ Backend คำนวณกลับมา
    ไม่ใช้ยอดจาก Cart หาก Backend มี total
    */

    const paymentAmount =
      Number(
        result.total
      );

    if(
      !Number.isFinite(
        paymentAmount
      ) ||
      paymentAmount <= 0
    ){

      throw new Error(
        "ยอดชำระเงินจากระบบไม่ถูกต้อง"
      );

    }

    const base64 =
      await fileToBase64(
        slip.files[0]
      );

    /*
    บันทึกการชำระเงิน
    */

    const paymentForm =
      new FormData();

    paymentForm.append(
      "action",
      "payment"
    );

   paymentForm.append(
  "payload",
  JSON.stringify({

    request_id:
      requestId +
      "-PAYMENT",

    order_id:
      orderId,

    amount:
      paymentAmount,

    slip_base64:
      base64

  })
);

   const paymentResponse =
  await paymentFetch(
    API,
    {
      method:
        "POST",

      body:
        paymentForm
    }
  );

    if(!paymentResponse.ok){

      throw new Error(
        "แจ้งชำระเงินไม่สำเร็จ HTTP " +
        paymentResponse.status
      );

    }

    const paymentResult =
      await paymentResponse.json();

    console.log("Payment Payload",{
    order_id:result.order_id,
    amount:paymentAmount
});

    if(!paymentResult.success){

      throw new Error(
        paymentResult.error ||
        "แจ้งชำระเงินไม่สำเร็จ"
      );

    }

    clearPaymentRequestId();

    showPaymentSuccess(
      orderId
    );

    /*
    ลบสินค้าออกจากตะกร้า
    */

    const fullCart =
      JSON.parse(
        localStorage.getItem(
          "cart"
        ) || "[]"
      );

    const checkoutCart =
      JSON.parse(
        localStorage.getItem(
          "checkoutCart"
        ) || "[]"
      );

    if(
      Array.isArray(
        fullCart
      ) &&
      Array.isArray(
        checkoutCart
      ) &&
      checkoutCart.length
    ){

      const remainCart =
        fullCart.filter(
          item=>

            !checkoutCart.some(
              checkoutItem=>

                JSON.stringify(
                  item
                ) ===
                JSON.stringify(
                  checkoutItem
                )

            )

        );

      localStorage.setItem(
        "cart",
        JSON.stringify(
          remainCart
        )
      );

    }

    localStorage.removeItem(
      "checkoutCart"
    );

    localStorage.removeItem(
      "buyNowCart"
    );

    setTimeout(
      ()=>{

        window.location.href =
          "order.html?id=" +
          encodeURIComponent(
            orderId
          );

      },
      1100
    );

  }catch(error){

    console.error(
      "submitOrder error",
      error
    );

    showPaymentToast(
      error.message ||
      "เกิดข้อผิดพลาด กรุณาลองใหม่",
      true
    );

  }finally{

    paymentSubmitting =
      false;

    btn.disabled =
      false;

    btn.textContent =
      "ยืนยันการชำระเงิน";

    updatePaymentButtonState();

    if(loadingOverlay){

      loadingOverlay.style.display =
        "none";

    }

  }

}

function fileToBase64(file){

  return new Promise(
    (resolve,reject)=>{

      const reader =
        new FileReader();

      reader.onload =
        () => resolve(
          reader.result
        );

      reader.onerror =
        reject;

      reader.readAsDataURL(
        file
      );

    }
  );

}

function bindSlipInput(){

  const input =
    document.getElementById(
      "slip"
    );

  const dropArea =
    document.getElementById(
      "paymentSlipDrop"
    );

  if(!input || !dropArea){
    return;
  }

  input.addEventListener(
    "change",
    handlePaymentSlipChange
  );

  [
    "dragenter",
    "dragover"
  ].forEach(
    eventName=>{

      dropArea.addEventListener(
        eventName,
        event=>{

          event.preventDefault();

          dropArea.classList.add(
            "dragging"
          );

        }
      );

    }
  );

  [
    "dragleave",
    "drop"
  ].forEach(
    eventName=>{

      dropArea.addEventListener(
        eventName,
        event=>{

          event.preventDefault();

          dropArea.classList.remove(
            "dragging"
          );

        }
      );

    }
  );

  dropArea.addEventListener(
    "drop",
    event=>{

      const file =
        event.dataTransfer &&
        event.dataTransfer.files &&
        event.dataTransfer.files[0];

      if(!file){
        return;
      }

      const transfer =
        new DataTransfer();

      transfer.items.add(file);

      input.files =
        transfer.files;

      handlePaymentSlipChange();

    }
  );

}


function handlePaymentSlipChange(){

  const input =
    document.getElementById(

function validatePaymentSlip(
  file
){

  if(!file){

    throw new Error(
      "กรุณาแนบสลิป"
    );

  }

  const allowed = [
    "image/jpeg",
    "image/png",
    "image/webp"
  ];

  if(
    file.type &&
    !allowed.includes(file.type)
  ){

    throw new Error(
      "รองรับเฉพาะไฟล์ JPG, PNG หรือ WEBP"
    );

  }

  if(
    Number(file.size || 0) >
    8 * 1024 * 1024
  ){

    throw new Error(
      "ไฟล์สลิปต้องมีขนาดไม่เกิน 8 MB"
    );

  }

  return true;

}

function getPaymentCheckoutCart(){

  const source =
    localStorage.getItem(
      "checkoutSource"
    );

  const checkoutCart =
    getPaymentStoredValue(
      "checkoutCart",
      []
    );

  const buyNowCart =
    getPaymentStoredValue(
      "buyNowCart",
      []
    );

  const normalCart =
    getPaymentStoredValue(
      "cart",
      []
    );

  if(
    source === "buyNow" &&
    Array.isArray(buyNowCart) &&
    buyNowCart.length
  ){

    return buyNowCart;

  }

  if(
    source === "cart" &&
    Array.isArray(checkoutCart) &&
    checkoutCart.length
  ){

    return checkoutCart;

  }

  if(
    Array.isArray(checkoutCart) &&
    checkoutCart.length
  ){

    return checkoutCart;

  }

  if(
    Array.isArray(buyNowCart) &&
    buyNowCart.length
  ){

    return buyNowCart;

  }

  return Array.isArray(normalCart)
    ? normalCart
    : [];

}

  const toast =
    document.getElementById(
      "paymentToast"

  if(!toast){

  }

  toast.textContent =

function getPaymentStoredValue(
  key,
  fallback
){

  try{

    const raw =
      localStorage.getItem(key);

    if(raw === null){

      return fallback;

    }

    return JSON.parse(raw);

  }catch(error){

    return fallback;

  }

}


function formatPaymentFileSize(
  bytes
){

  const size =
    Number(bytes || 0);

  if(size < 1024){

    return size + " B";

  }

  if(size < 1024 * 1024){

    return (
      size / 1024
    ).toFixed(1) + " KB";

  }

  return (
    size /
    1024 /
    1024
  ).toFixed(1) + " MB";

}


function normalizePaymentBoolean(
  value
){

  if(
    value === true ||
    value === 1
  ){

    return true;

  }

  const normalized =
    String(
      value || ""
    )
      .trim()
      .toLowerCase();

  if(!normalized){

    return true;

  }

  return [
    "true",
    "yes",
    "1",
    "active",
    "enabled"
  ].includes(
    normalized
  );

}


function escapePaymentHtml(
  value
){

  return String(
    value ?? ""
  )
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


function escapePaymentAttribute(
  value
){

  return escapePaymentHtml(
    value
  );

}


function goPaymentBack(){

  if(
    document.referrer &&
    document.referrer !==
    window.location.href
  ){

    history.back();

  }else{

    window.location.href =
      "checkout.html";

  }

}
