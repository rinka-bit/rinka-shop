<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fandom | Rinka Shop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kodchasan:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
.fandom-page{width:min(1180px,100%);margin:auto;padding:22px 16px 48px}.fandom-hero{padding:21px;border:1px solid var(--rk-border);border-radius:22px;background:linear-gradient(135deg,#f3fbff,#fff);box-shadow:var(--rk-shadow);margin-bottom:16px}.fandom-hero h2{margin:0;color:#355a73}.fandom-hero p{margin:8px 0 0;color:var(--rk-muted)}
.fandom-toolbar{display:flex;align-items:center;gap:10px;padding:12px;border:1px solid var(--rk-border);border-radius:17px;background:#fff;margin-bottom:16px}.fandom-toolbar input{flex:1;min-height:45px;padding:10px 13px;border:1px solid #d7e3ec;border-radius:13px;outline:none}.fandom-toolbar input:focus{border-color:var(--rk-primary-dark);box-shadow:0 0 0 3px rgba(125,207,255,.16)}.fandom-count{color:var(--rk-muted);font-size:13px;white-space:nowrap}
.product-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.state{min-height:330px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:24px;text-align:center;border:1px solid var(--rk-border);border-radius:20px;background:#fff}.state p{margin:0;color:var(--rk-muted)}.state button,.state a{border:none;border-radius:999px;padding:10px 16px;background:var(--rk-primary);color:#fff;text-decoration:none;font-weight:700}.spinner{width:36px;height:36px;border:4px solid #dff2fc;border-top-color:var(--rk-primary-dark);border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
@media(min-width:720px){.product-grid{grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:18px}}@media(max-width:600px){.fandom-page{padding:14px 10px 36px}.fandom-toolbar{align-items:stretch;flex-direction:column}.fandom-count{padding-left:3px}}
</style>
</head>
<body>
<header class="rk-page-header"><button class="rk-icon-button" type="button" onclick="goBack()">←</button><h1 id="topTitle">Fandom</h1><a href="cart.html" class="rk-cart-link">🛒<span id="cartCount">0</span></a></header>
<main class="fandom-page">
<section class="fandom-hero"><h2 id="fandomTitle">🎮 กำลังโหลด Fandom</h2><p id="fandomDescription">กำลังเตรียมรายการสินค้าให้ค่ะ</p></section>
<div class="fandom-toolbar"><input id="fandomSearch" type="search" placeholder="ค้นหาสินค้าใน Fandom..." autocomplete="off"><div id="productCount" class="fandom-count">0 รายการ</div></div>
<section id="products" class="state"><div class="spinner"></div><h2>กำลังโหลดสินค้า</h2><p>รอสักครู่นะคะ</p></section>
</main>
<script src="components.js"></script>
<script>
const API =
"https://script.google.com/macros/s/AKfycbxKjVvn8AXrK0wDvKqN-A9yS2Vk8R-w25ar1b9ftiIdUgUvFaShunLnFnAyIDuaTWj76w/exec?action=productCards";
const fandom=new URLSearchParams(location.search).get("name")||"";
let fandomProducts=[];
document.addEventListener("DOMContentLoaded",()=>{updateCartCount();document.getElementById("fandomSearch").addEventListener("input",filterProducts);loadProducts()});
async function loadProducts(){const box=document.getElementById("products");if(!fandom){renderState("ไม่พบ Fandom","ลิงก์นี้ไม่สมบูรณ์");return}try{const r=await fetch(API);if(!r.ok)throw new Error("HTTP "+r.status);const d=await r.json();if(d&&d.success===false)throw new Error(d.error||"โหลดสินค้าไม่สำเร็จ");const rows=Array.isArray(d)?d:Array.isArray(d.products)?d.products:[];fandomProducts=rows.filter(p=>String(p.fandom||"")===fandom);document.getElementById("fandomTitle").textContent="🎮 "+fandom;document.getElementById("fandomDescription").textContent="สินค้าทั้งหมดจาก "+fandom;document.getElementById("topTitle").textContent=fandom;document.title=fandom+" | Rinka Shop";renderProducts(fandomProducts)}catch(e){console.error(e);renderState("โหลดสินค้าไม่สำเร็จ",e.message||String(e),true)}}
function filterProducts(){const q=document.getElementById("fandomSearch").value.trim().toLowerCase();renderProducts(!q?fandomProducts:fandomProducts.filter(p=>[p.name,p.description,p.main_category,p.sub_category,p.search_keywords].join(" ").toLowerCase().includes(q)))}
function renderProducts(rows){const box=document.getElementById("products");document.getElementById("productCount").textContent=rows.length.toLocaleString("th-TH")+" รายการ";if(!rows.length){renderState("ไม่พบสินค้า",document.getElementById("fandomSearch").value?"ลองเปลี่ยนคำค้นดูนะคะ":"ยังไม่มีสินค้าใน Fandom นี้");return}box.className="product-grid";box.innerHTML=rows.map(createProductCard).join("")}
function renderState(t,m,retry){const b=document.getElementById("products");b.className="state";b.innerHTML=`<div style="font-size:48px">${retry?"⚠️":"📦"}</div><h2>${escapeComponentHtml(t)}</h2><p>${escapeComponentHtml(m)}</p>${retry?'<button onclick="loadProducts()">ลองใหม่</button>':'<a href="browse.html">ดูสินค้าทั้งหมด</a>'}`}
function goBack(){if(document.referrer&&document.referrer!==location.href)history.back();else location.href="home.html"}
function updateCartCount(){const cart=safeStorageArray("cart");const n=cart.reduce((s,i)=>s+Number(i.qty||0),0);document.getElementById("cartCount").textContent=n>99?"99+":String(n)}
</script>
</body>
</html>
