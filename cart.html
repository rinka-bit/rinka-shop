<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ตะกร้าสินค้า | Rinka Shop</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;600;700&family=Noto+Serif+Thai:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="site-header"></div>

<section class="section">
  <div class="wrap two-col">
    <div>
      <h2>ตะกร้าสินค้า</h2>
      <div id="cart-lines" class="panel"></div>
    </div>
    <div>
      <div class="panel">
        <h3 style="margin-top:0;">สรุปยอด</h3>
        <div class="summary-row"><span>ยอดสินค้า</span><span id="sumSubtotal">฿0</span></div>
        <p class="hint">ค่านำเข้า / ค่าจัดส่งในไทย จะแจ้งอีกครั้งเมื่อสินค้าถึงไทยแล้ว</p>
        <div class="summary-row total"><span>รวมชำระตอนสั่งซื้อ</span><span id="sumTotal">฿0</span></div>
        <a href="checkout.html" class="btn btn-primary btn-block" id="checkoutBtn" style="margin-top:16px;">ไปหน้าชำระเงิน</a>
      </div>
    </div>
  </div>
</section>

<div id="site-footer"></div>
<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/cart.js"></script>
<script src="js/common.js"></script>
<script>
function renderCart(){
  const items = RinkaCart.read();
  const mount = document.getElementById("cart-lines");

  if(!items.length){
    mount.innerHTML = `<div class="empty-state"><div class="icon">🛍️</div>ตะกร้ายังว่างอยู่<br><a href="index.html" class="btn btn-outline" style="margin-top:14px;">เลือกซื้อสินค้า</a></div>`;
    document.getElementById("checkoutBtn").style.pointerEvents = "none";
    document.getElementById("checkoutBtn").style.opacity = ".5";
  } else {
    mount.innerHTML = items.map(i => {
      const key = RinkaCart.lineKey(i);
      const lineTotal = (Number(i.price) + (i.crate_selected ? Number(i.crate_fee||0) : 0)) * i.qty;
      return `
      <div class="cart-line">
        <img src="${i.image || 'https://placehold.co/100x100'}" alt="${i.name}">
        <div class="cart-line-info">
          <div class="cart-line-name">${i.name}</div>
          ${i.option_value ? `<div class="cart-line-opt">${i.option_value}</div>` : ""}
          ${i.crate_selected ? `<div class="cart-line-opt">+ แพ็คลัง</div>` : ""}
          <div class="qty-control">
            <button onclick="RinkaCart.updateQty('${key}', ${i.qty - 1}); renderCart();">−</button>
            <span>${i.qty}</span>
            <button onclick="RinkaCart.updateQty('${key}', ${i.qty + 1}); renderCart();">+</button>
          </div>
          <span class="remove-link" onclick="RinkaCart.remove('${key}'); renderCart();">ลบออก</span>
        </div>
        <div style="font-weight:700;">${money(lineTotal)}</div>
      </div>`;
    }).join("");
  }

  const { subtotal } = RinkaCart.totals();
  document.getElementById("sumSubtotal").textContent = money(subtotal);
  document.getElementById("sumTotal").textContent = money(subtotal);
}
renderCart();
</script>
</body>
</html>
