<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1">

<title>
ตะกร้าสินค้า
</title>

<style>

body{

font-family:
'Kodchasan',
sans-serif;

background:#f6fbff;

padding:20px;

}

.navbar{

display:flex;

flex-wrap:wrap;

gap:12px;

padding:15px 20px;

margin-bottom:25px;

background:white;

border-radius:20px;

box-shadow:
0 3px 15px
rgba(
125,
207,
255,
0.15
);

}

.navbar a{

text-decoration:none;

font-weight:700;

color:#4a6fa5;

}

.cart-item{

background:white;

padding:15px;

margin-bottom:15px;

border-radius:20px;

display:flex;

gap:15px;

align-items:center;

box-shadow:
0 3px 15px
rgba(
125,
207,
255,
0.15
);

}

.cart-item img{

width:100px;

height:100px;

object-fit:cover;

border-radius:12px;

}

.total{

font-size:24px;

font-weight:700;

color:#2563eb;

margin-top:20px;

}

.checkout-btn{

margin-top:20px;

padding:15px 25px;

background:#7dcfff;

border:none;

border-radius:999px;

cursor:pointer;

font-size:16px;

font-weight:700;

}

.qty-btn{

width:32px;

height:32px;

border:none;

border-radius:999px;

background:#d9f2ff;

font-weight:700;

cursor:pointer;

}

.qty-control{

display:flex;

align-items:center;

gap:10px;

margin:10px 0;

}

.delete-btn{

background:#ffe4e6;

color:#dc2626;

border:none;

padding:8px 14px;

border-radius:999px;

cursor:pointer;

font-weight:700;

margin-top:10px;

}

</style>

</head>

<body>

<div class="navbar">

<a href="home.html">
🏠 หน้าแรก
</a>

<a href="categories.html">
🏷️ หมวดสินค้า
</a>

<a href="lookup.html">
📦 เช็กออเดอร์
</a>

<a href="change-address.html">
📍 เปลี่ยนที่อยู่
</a>

</div>

<h1>
🛒 ตะกร้าสินค้า
</h1>

<div id="cartItems">
</div>

<div
id="total"
class="total">
</div>

<button
class="checkout-btn"
onclick="
goCheckout()
">

สั่งซื้อสินค้า

</button>

<script>

loadCart();

function loadCart(){

const cart =

JSON.parse(
localStorage.getItem(
"cart"
) || "[]"
);

let total = 0;

if(
cart.length === 0
){

document
.getElementById(
"cartItems"
)
.innerHTML =

`
<h3>

🛒 ยังไม่มีสินค้าในตะกร้า

</h3>
`;

document
.getElementById(
"total"
)
.textContent = "";

return;

}

document
.getElementById(
"cartItems"
)
.innerHTML =

cart.map((item,index)=>{

total +=

Number(item.price)
*
Number(item.qty);

return `

<div class="cart-item">

<img
src="${item.image}">

<div>

<h3>
${item.name}
</h3>
${
item.selected_options

?

Object.entries(
item.selected_options
)

.map(

([key,value]) =>

`

<p
style="
margin:4px 0;
color:#4a6fa5;
font-size:14px;
"
>

${key} :
${value}

</p>

`

)

.join("")

:

""
}
<div>

<button
class="qty-btn"
onclick="
changeQty(
${index},
-1
)
">
−
</button>

${item.qty}

<button
class="qty-btn"
onclick="
changeQty(
${index},
1
)
">
+
</button>

</div>

<p>

฿${item.price}
x
${item.qty}

=
฿${item.price * item.qty}

</p>

<button
class="delete-btn"
onclick="
removeItem(
${index}
)
">
🗑️ ลบ
</button>

</div>

</div>

`;

}).join("");

document
.getElementById(
"total"
)
.textContent =

`ยอดรวม ฿${total}`;

}

function goCheckout(){

window.location.href =
"checkout.html";

}

function changeQty(
index,
change
){

let cart =

JSON.parse(
localStorage.getItem(
"cart"
) || "[]"
);

cart[index].qty += change;

if(
cart[index].qty <= 0
){

cart.splice(
index,
1
);

}

localStorage.setItem(

"cart",

JSON.stringify(cart)

);

loadCart();

}

function removeItem(
index
){

let cart =

JSON.parse(
localStorage.getItem(
"cart"
) || "[]"
);

cart.splice(
index,
1
);

localStorage.setItem(

"cart",

JSON.stringify(cart)

);

loadCart();

}
  
</script>

</body>

</html>
