<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Rinka Shop</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<header>

<h1>Rinka Shop</h1>

<p>Preorder & In Stock Goods</p>

</header>

<div class="topbar">

<button onclick="openCart()">
🛒 ตะกร้า
(<span id="cartCount">0</span>)
</button>

</div>

<div id="products" class="products"></div>

<div id="cartModal" class="cart-modal">

<div class="cart-box">

<h2>ตะกร้าสินค้า</h2>

<div id="cartItems"></div>

<h3 id="cartTotal">
รวม 0 บาท
</h3>

  <button onclick="checkout()">
สั่งซื้อ
</button>
  
<button onclick="closeCart()">
ปิด
</button>

</div>

</div>
<div id="productModal" class="cart-modal">

  <div class="cart-box">

    <div id="productDetail"></div>

    <button onclick="closeProduct()">
      ปิด
    </button>

  </div>

</div>
 <div id="checkoutPage" style="display:none;">

<h2>ข้อมูลผู้สั่งซื้อ</h2>

<input
id="customerName"
placeholder="ชื่อ">

<input
id="customerEmail"
placeholder="Email">

<input
id="customerPhone"
placeholder="เบอร์โทร">

<input
id="customerSocial"
placeholder="Twitter / Facebook / Discord">

<button onclick="nextToReview()">
ถัดไป
</button>

</div>
<h2>ที่อยู่จัดส่ง</h2>

<input
id="receiverName"
placeholder="ชื่อผู้รับ">

<textarea
id="address"
placeholder="ที่อยู่"></textarea>

<input
id="province"
placeholder="จังหวัด">

<input
id="postcode"
placeholder="รหัสไปรษณีย์">

<div id="orderSummary">

<h3>สรุปคำสั่งซื้อ</h3>

<div id="summaryItems"></div>

<h3 id="summaryTotal">
รวม 0 บาท
</h3>

</div>
  
<input
type="file"
id="slip">

<div
id="reviewPage"
style="
display:none;
margin-top:40px;
background:white;
padding:20px;
border-radius:12px;
">

<h2>
ตรวจสอบคำสั่งซื้อ
</h2>

<div id="reviewContent"></div>

<button onclick="confirmOrder()">
ยืนยันคำสั่งซื้อ
</button>

</div>  
  
<script src="app.js"></script>

</body>
</html>
