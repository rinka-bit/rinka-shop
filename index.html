<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Rinka Shop</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<header>

<h1>Rinka Shop</h1>

<p>Preorder & In Stock Goods</p>

</header>

<div class="topbar">

<button onclick="openCart()">
🛒 ตะกร้า
(<span id="cartCount">0</span>)
</button>

</div>

<div id="products" class="products"></div>

<div id="cartModal" class="cart-modal">

<div class="cart-box">

<h2>ตะกร้าสินค้า</h2>

<div id="cartItems"></div>

<h3 id="cartTotal">
รวม 0 บาท
</h3>

<button onclick="closeCart()">
ปิด
</button>

</div>

</div>
<div id="productModal" class="cart-modal">

  <div class="cart-box">

    <div id="productDetail"></div>

    <button onclick="closeProduct()">
      ปิด
    </button>

  </div>

</div>
<script src="app.js"></script>

</body>
</html>
<div id="checkoutPage">

<h2>ข้อมูลผู้สั่งซื้อ</h2>

<input
id="customerName"
placeholder="ชื่อ">

<input
id="customerEmail"
placeholder="Email">

<input
id="customerPhone"
placeholder="เบอร์โทร">

<input
id="customerSocial"
placeholder="Twitter / Facebook / Discord">

<button onclick="submitOrder()">
สั่งซื้อ
</button>

</div>
