<body>

<div class="product-topbar">

<button
onclick="history.back()">
←
</button>

<a
href="cart.html"
id="floatingCart">
🛒
</a>

</div>

<div class="container">

<h1>
ยืนยันคำสั่งซื้อ
</h1>

<div class="card">

<h2>
📍 ที่อยู่จัดส่ง
</h2>

<div id="selectedAddress"></div>

<button
onclick="
window.location.href=
'address-book.html?select=checkout'
">
เปลี่ยนที่อยู่
</button>
  

</div>

<div class="card">

<h2>
รายการสินค้า
</h2>

<div id="items"></div>

<div
id="giftSection">
</div>

<h3 id="total">
รวม 0 บาท
</h3>

</div>

onclick="goPayment()">
ไปชำระเงิน
</button>

</div>

<script>

const API =
"https://script.google.com/macros/s/AKfycbxKjVvn8AXrK0wDvKqN-A9yS2Vk8R-w25ar1b9ftiIdUgUvFaShunLnFnAyIDuaTWj76w/exec";

const customer =
JSON.parse(
  localStorage.getItem(
    "customer"
  ) || "{}"
);

if(!customer.email){

  window.location =
  "login.html";

}
  
let cart = [];

loadCheckout();

function loadCheckout(){

  const checkoutSource =
    localStorage.getItem(
      "checkoutSource"
    );

  const buyNowCart =
    JSON.parse(
      localStorage.getItem(
        "buyNowCart"
      ) || "[]"
    );

  const checkoutCart =
    JSON.parse(
      localStorage.getItem(
        "checkoutCart"
      ) || "[]"
    );

  const normalCart =
    JSON.parse(
      localStorage.getItem(
        "cart"
      ) || "[]"
    );

  if(
    checkoutSource === "buyNow" &&
    Array.isArray(buyNowCart) &&
    buyNowCart.length
  ){

    cart =
      buyNowCart;

    console.log(
      "CHECKOUT SOURCE:",
      "buyNowCart"
    );

  }
  else if(
    checkoutSource === "cart" &&
    Array.isArray(checkoutCart) &&
    checkoutCart.length
  ){

    cart =
      checkoutCart;

    console.log(
      "CHECKOUT SOURCE:",
      "checkoutCart"
    );

  }
  else if(
    Array.isArray(checkoutCart) &&
    checkoutCart.length
  ){

    cart =
      checkoutCart;

    console.log(
      "CHECKOUT SOURCE:",
      "checkoutCart fallback"
    );

  }
  else if(
    Array.isArray(buyNowCart) &&
    buyNowCart.length
  ){

    cart =
      buyNowCart;

    console.log(
      "CHECKOUT SOURCE:",
      "buyNowCart fallback"
    );

  }
  else if(
    Array.isArray(normalCart)
  ){

    cart =
      normalCart;

    console.log(
      "CHECKOUT SOURCE:",
      "cart fallback"
    );

  }
  else{

    cart = [];

  }

  console.log(
    "CHECKOUT CART:",
    cart
  );

  renderItems();

  loadDefaultAddress();

  loadGifts();

}

async function loadDefaultAddress(){

  let selectedAddress =
    JSON.parse(
      localStorage.getItem(
        "selectedCheckoutAddress"
      ) || "null"
    );

  try{

    if(!selectedAddress){

      const response =
        await fetch(
          API +
          "?action=customerAddresses&email=" +
          encodeURIComponent(
            customer.email
          )
        );

      const result =
        await response.json();

      const addresses =
        Array.isArray(result)
          ? result
          : Array.isArray(result.addresses)
            ? result.addresses
            : [];

      selectedAddress =
        addresses.find(
          address =>
            address.is_default === true ||
            String(
              address.is_default || ""
            ).toLowerCase() === "true" ||
            Number(
              address.is_default
            ) === 1
        ) ||
        addresses[0] ||
        null;

    }

    if(!selectedAddress){

      document.getElementById(
        "selectedAddress"
      ).innerHTML =
        "ยังไม่มีที่อยู่จัดส่ง กรุณาเพิ่มที่อยู่ก่อน";

      window.checkoutAddress =
        null;

      return;

    }

    window.checkoutAddress =
      selectedAddress;

    document.getElementById(
      "selectedAddress"
    ).innerHTML = `

      <div
      style="
      padding:12px;
      border:1px solid #eee;
      border-radius:12px;
      background:#f8fbff;
      line-height:1.7;
      ">

        <b>
          ${escapeHtml(
            selectedAddress.receiver || ""
          )}
        </b>

        <br>

        ${escapeHtml(
          selectedAddress.phone || ""
        )}

        <br>

        ${escapeHtml(
          selectedAddress.address || ""
        )}

        <br>

        ${escapeHtml(
          selectedAddress.subdistrict || ""
        )}

        ${escapeHtml(
          selectedAddress.district || ""
        )}

        <br>

        ${escapeHtml(
          selectedAddress.province || ""
        )}

        ${escapeHtml(
          selectedAddress.postcode || ""
        )}

      </div>

    `;

  }catch(error){

    console.error(
      "loadDefaultAddress error",
      error
    );

    window.checkoutAddress =
      null;

    document.getElementById(
      "selectedAddress"
    ).innerHTML =
      "โหลดที่อยู่จัดส่งไม่สำเร็จ กรุณาลองใหม่";

  }

}
  
function renderItems(){

  let html = "";
  let total = 0;

  if(!cart.length){

    document
      .getElementById(
        "items"
      )
      .innerHTML =
      "ไม่มีสินค้าในรายการสั่งซื้อ";

    document
      .getElementById(
        "total"
      )
      .textContent =
      "รวม 0 บาท";

    return;

  }

  cart.forEach(item=>{

    const price =
      Number(
        item.final_price ??
        item.price ??
        0
      );

    const qty =
      Math.max(
        1,
        Number(
          item.qty || 1
        )
      );

    const lineTotal =
      price * qty;

    total +=
      lineTotal;

    const optionText =
      item.selected_options
        ? Object.entries(
            item.selected_options
          )
          .map(([key,value])=>{

            const text =
              Array.isArray(value)
                ? value.join(", ")
                : value;

            return `
              ${escapeHtml(key)}:
              ${escapeHtml(text)}
            `;

          })
          .join("<br>")
        : "";

    html += `

      <div
      style="
      padding:12px;
      border:1px solid #eee;
      border-radius:12px;
      margin-bottom:12px;
      ">

        <div
        style="
        font-weight:700;
        margin-bottom:6px;
        ">

          ${escapeHtml(
            item.name || ""
          )}

        </div>

        <div
        style="
        font-size:13px;
        color:#666;
        margin-bottom:8px;
        ">

          ${optionText}

        </div>

        <div>

          ${qty} ชิ้น
          ×
          ฿${price.toLocaleString()}

          <br>

          รวม
          ฿${lineTotal.toLocaleString()}

        </div>

      </div>

    `;

  });

  document
    .getElementById(
      "items"
    )
    .innerHTML =
    html;

  document
    .getElementById(
      "total"
    )
    .textContent =
    `รวม ${total.toLocaleString()} บาท`;

}
  
function escapeHtml(
  value
){

  return String(
    value || ""
  )
    .replaceAll(
      "&",
      "&amp;"
    )
    .replaceAll(
      "<",
      "&lt;"
    )
    .replaceAll(
      ">",
      "&gt;"
    )
    .replaceAll(
      '"',
      "&quot;"
    )
    .replaceAll(
      "'",
      "&#039;"
    );

}


/*
=========================================
CHECKOUT GIFT ENGINE — SCHEMA 1.1
Campaign → Rule → Gift Item → Character
=========================================
*/

const checkoutGiftState = {
  campaigns:[],
  rules:[],
  items:[],
  characters:[],
  exclusions:[],
  collections:[],
  eligibleCampaigns:[],
  selections:{}
};


function normalizeGiftBoolean(
  value
){

  if(
    value === true ||
    value === 1
  ){
    return true;
  }

  return [
    "yes",
    "true",
    "1",
    "active"
  ].includes(
    String(
      value || ""
    )
      .trim()
      .toLowerCase()
  );

}


function normalizeGiftId(
  value
){

  return String(
    value || ""
  ).trim();

}


function getCartItemUnitPrice(
  item
){

  const value =
    Number(
      item.final_price ??
      item.price ??
      0
    );

  return Number.isFinite(value)
    ? Math.max(0,value)
    : 0;

}


function getCartItemQty(
  item
){

  const value =
    Number(
      item.qty || 0
    );

  return Number.isFinite(value)
    ? Math.max(0,value)
    : 0;

}


function getCartItemTotal(
  item
){

  return (
    getCartItemUnitPrice(item) *
    getCartItemQty(item)
  );

}


function getGiftResponseArray(
  result,
  keys = []
){

  if(Array.isArray(result)){
    return result;
  }

  for(const key of keys){

    if(
      result &&
      Array.isArray(
        result[key]
      )
    ){
      return result[key];
    }

  }

  return [];

}


async function fetchCheckoutGiftAction(
  action,
  parameters = {}
){

  const query =
    new URLSearchParams();

  query.set(
    "action",
    action
  );

  Object.entries(
    parameters || {}
  ).forEach(
    ([key,value])=>{

      if(
        value === undefined ||
        value === null ||
        value === ""
      ){
        return;
      }

      query.set(
        key,
        String(value)
      );

    }
  );

  const response =
    await fetch(
      API +
      "?" +
      query.toString()
    );

  if(!response.ok){

    throw new Error(
      "HTTP " +
      response.status
    );

  }

  const result =
    await response.json();

  if(
    result &&
    result.success === false
  ){

    throw new Error(
      result.error ||
      result.message ||
      "เรียก API ไม่สำเร็จ"
    );

  }

  return result;

}


async function fetchCheckoutGiftActionFallback(
  actions,
  keys
){

  let lastError = null;

  for(const action of actions){

    try{

      const result =
        await fetchCheckoutGiftAction(
          action
        );

      const rows =
        getGiftResponseArray(
          result,
          keys
        );

      if(
        rows.length ||
        (
          result &&
          result.success === true
        )
      ){
        return rows;
      }

    }catch(error){

      lastError = error;

      console.warn(
        "Gift API fallback:",
        action,
        error
      );

    }

  }

  if(lastError){
    throw lastError;
  }

  return [];

}

async function loadGifts(){

  const giftSection =
    document.getElementById(
      "giftSection"
    );

  if(!giftSection){
    return;
  }

  if(!cart.length){

    giftSection.innerHTML = "";

    return;

  }

  giftSection.innerHTML = `

<div class="gift-loading">
⏳ กำลังตรวจสอบสิทธิ์ของแถม...
</div>

`;

  try{

    console.log(
      "========== GIFT DEBUG START =========="
    );

    console.log(
      "CART:",
      cart
    );


    const [
      campaigns,
      rules,
      items,
      characters,
      exclusions,
      collections
    ] =
      await Promise.all([

        fetchCheckoutGiftActionFallback(
          [
            "getGiftCampaigns"
          ],
          [
            "campaigns"
          ]
        ),

        fetchCheckoutGiftActionFallback(
          [
            "getGiftRules"
          ],
          [
            "rules"
          ]
        ),

        fetchCheckoutGiftActionFallback(
          [
            "getGiftItems"
          ],
          [
            "items",
            "gifts"
          ]
        ),

        fetchCheckoutGiftActionFallback(
          [
            "getGiftCharacters"
          ],
          [
            "characters"
          ]
        ),

        fetchCheckoutGiftActionFallback(
          [
            "getGiftCampaignExclusions"
          ],
          [
            "exclusions"
          ]
        ),

        fetchCheckoutGiftActionFallback(
          [
            "getCollections",
            "collections"
          ],
          [
            "collections"
          ]
        ).catch(
          error => {

            console.warn(
              "โหลด Collections ไม่สำเร็จ ใช้ข้อมูลจาก Cart แทน",
              error
            );

            return [];

          }
        )

      ]);


    console.log(
      "RAW CAMPAIGNS:",
      campaigns
    );

    console.log(
      "RAW RULES:",
      rules
    );

    console.log(
      "RAW ITEMS:",
      items
    );

    console.log(
      "RAW CHARACTERS:",
      characters
    );

    console.log(
      "RAW EXCLUSIONS:",
      exclusions
    );

    console.log(
      "RAW COLLECTIONS:",
      collections
    );


    checkoutGiftState.campaigns =
      campaigns.filter(
        campaign =>
          normalizeGiftBoolean(
            campaign.active
          )
      );


    checkoutGiftState.rules =
      rules.filter(
        rule =>
          normalizeGiftBoolean(
            rule.active
          )
      );


    checkoutGiftState.items =
      items.filter(
        item =>
          normalizeGiftBoolean(
            item.active
          )
      );


    checkoutGiftState.characters =
      characters.filter(
        character =>
          normalizeGiftBoolean(
            character.active
          )
      );


    checkoutGiftState.exclusions =
      exclusions;


    checkoutGiftState.collections =
      collections;


    console.log(
      "ACTIVE CAMPAIGNS:",
      checkoutGiftState.campaigns
    );

    console.log(
      "ACTIVE RULES:",
      checkoutGiftState.rules
    );

    console.log(
      "ACTIVE ITEMS:",
      checkoutGiftState.items
    );

    console.log(
      "ACTIVE CHARACTERS:",
      checkoutGiftState.characters
    );


    checkoutGiftState.eligibleCampaigns =
      buildEligibleGiftCampaigns();


    console.log(
      "ELIGIBLE CAMPAIGNS:",
      checkoutGiftState.eligibleCampaigns
    );


    checkoutGiftState.campaigns.forEach(
      campaign=>{

        const campaignItems =
          getCampaignEligibleCartItems(
            campaign
          );

        const campaignTotal =
          campaignItems.reduce(
            (
              sum,
              item
            )=>
              sum +
              getCartItemTotal(
                item
              ),
            0
          );


        console.log(
          "CAMPAIGN CHECK:",
          {

            campaign_id:
              campaign.campaign_id,

            campaign_name:
              campaign.campaign_name,

            collection_id:
              campaign.collection_id,

            eligibility_scope:
              campaign.eligibility_scope,

            require_campaign_item:
              campaign.require_campaign_item,

            fandom:
              getCampaignFandom(
                campaign
              ),

            eligible_items:
              campaignItems,

            eligible_total:
              campaignTotal

          }
        );

      }
    );


    console.log(
      "========== GIFT DEBUG END =========="
    );


    renderCheckoutGiftEngine();


  }catch(error){

    console.error(
      "loadGifts error:",
      error
    );


    giftSection.innerHTML = `

<div class="gift-error">

โหลดข้อมูลของแถมไม่สำเร็จ

<br>

${escapeHtml(
  error.message ||
  String(error)
)}

</div>

`;

  }

}

function getCollectionById(
  collectionId
){

  const normalizedId =
    normalizeGiftId(
      collectionId
    );

  return (
    checkoutGiftState.collections.find(
      collection =>

        normalizeGiftId(
          collection.collection_id
        ) ===
        normalizedId

    ) ||
    null
  );

}


function getCampaignFandom(
  campaign
){

  const directFandom =
    String(
      campaign.fandom || ""
    ).trim();

  if(directFandom){
    return directFandom;
  }

  const collection =
    getCollectionById(
      campaign.collection_id
    );

  if(
    collection &&
    collection.fandom
  ){
    return String(
      collection.fandom
    ).trim();
  }

  const cartItem =
    cart.find(
      item =>

        normalizeGiftId(
          item.collection_id
        ) ===
        normalizeGiftId(
          campaign.collection_id
        )

    );

  return cartItem
    ? String(
        cartItem.fandom || ""
      ).trim()
    : "";

}


function getCampaignExcludedProductIds(
  campaignId
){

  const normalizedCampaignId =
    normalizeGiftId(
      campaignId
    );

  return new Set(

    checkoutGiftState.exclusions
      .filter(
        exclusion =>

          normalizeGiftId(
            exclusion.campaign_id
          ) ===
          normalizedCampaignId

      )
      .map(
        exclusion =>
          normalizeGiftId(
            exclusion.product_id
          )
      )
      .filter(Boolean)

  );

}

function getCampaignEligibleCartItems(
  campaign
){

  if(
    !campaign ||
    !Array.isArray(
      cart
    ) ||
    cart.length===0
  ){

    return [];

  }


  const campaignId =
    normalizeText(
      campaign.campaign_id ||
      campaign.gift_id
    );


  const collectionId =
    normalizeText(
      campaign.collection_id
    );


  const campaignFandom =
    normalizeText(
      getCampaignFandom(
        campaign
      )
    ).toLowerCase();


  const eligibilityScope =
    normalizeText(
      campaign.eligibility_scope ||
      "collection"
    ).toLowerCase();


  const requireCampaignItem =
    normalizeGiftBoolean(
      campaign.require_campaign_item
    );


  const excludedProductIds =
    new Set(
      (
        checkoutGiftState.exclusions ||
        []
      )
      .filter(
        exclusion=>{

          return (
            normalizeText(
              exclusion.campaign_id
            ) ===
            campaignId
          );

        }
      )
      .map(
        exclusion=>
          normalizeText(
            exclusion.product_id
          )
      )
      .filter(Boolean)
    );


  const matchedItems =
    cart.filter(
      item=>{

        const productId =
          normalizeText(
            item.product_id
          );


        if(
          productId &&
          excludedProductIds.has(
            productId
          )
        ){

          return false;

        }


        const itemCollectionId =
          normalizeText(
            item.collection_id
          );


        const itemFandom =
          normalizeText(
            item.fandom
          ).toLowerCase();


        /*
        =========================
        COLLECTION
        =========================
        */

        if(
          eligibilityScope ===
          "collection"
        ){

          if(!collectionId){

            return false;

          }

          return (
            itemCollectionId ===
            collectionId
          );

        }


        /*
        =========================
        FANDOM
        =========================
        */

        if(
          eligibilityScope ===
          "fandom"
        ){

          if(!campaignFandom){

            return false;

          }

          return (
            itemFandom ===
            campaignFandom
          );

        }


        /*
        =========================
        ALL
        =========================
        */

        if(
          eligibilityScope ===
          "all"
        ){

          return true;

        }


        /*
        fallback
        ถ้าค่าเก่าไม่มี scope ชัดเจน
        */

        if(collectionId){

          return (
            itemCollectionId ===
            collectionId
          );

        }


        if(campaignFandom){

          return (
            itemFandom ===
            campaignFandom
          );

        }


        return false;

      }
    );


  if(
    matchedItems.length===0
  ){

    return [];

  }


  /*
  ถ้า campaign กำหนดว่า
  ต้องมีสินค้าจาก campaign/collection นี้จริง ๆ
  */

  if(
    requireCampaignItem
  ){

    const hasCampaignItem =
      matchedItems.some(
        item=>{

          if(collectionId){

            return (
              normalizeText(
                item.collection_id
              ) ===
              collectionId
            );

          }

          if(campaignFandom){

            return (
              normalizeText(
                item.fandom
              ).toLowerCase() ===
              campaignFandom
            );

          }

          return false;

        }
      );


    if(!hasCampaignItem){

      return [];

    }

  }


  return matchedItems;

}

function campaignHasRequiredItem(
  campaign
){

  if(
    !normalizeGiftBoolean(
      campaign.require_campaign_item
    )
  ){
    return true;
  }

  const campaignCollectionId =
    normalizeGiftId(
      campaign.collection_id
    );

  const excludedProductIds =
    getCampaignExcludedProductIds(
      campaign.campaign_id
    );

  return cart.some(
    item => {

      const productId =
        normalizeGiftId(
          item.product_id
        );

      return (
        normalizeGiftId(
          item.collection_id
        ) ===
        campaignCollectionId &&
        !excludedProductIds.has(
          productId
        ) &&
        getCartItemQty(item) > 0
      );

    }
  );

}

function buildEligibleGiftCampaigns(){

  const result = [];

  const campaigns =
    checkoutGiftState.campaigns || [];

  const rules =
    checkoutGiftState.rules || [];


  campaigns.forEach(
    campaign=>{

      const campaignId =
        normalizeText(
          campaign.campaign_id ||
          campaign.gift_id
        );

      if(!campaignId){
        return;
      }


      const campaignRules =
        rules
          .filter(
            rule=>{

              return (
                normalizeText(
                  rule.campaign_id
                ) ===
                campaignId
              );

            }
          )
          .sort(
            (
              a,
              b
            )=>{

              return (
                Number(
                  a.min_amount || 0
                ) -
                Number(
                  b.min_amount || 0
                )
              );

            }
          );


      if(
        campaignRules.length===0
      ){

        console.warn(
          "Gift campaign ไม่มี rule:",
          campaignId
        );

        return;

      }


      const eligibleItems =
        getCampaignEligibleCartItems(
          campaign
        );


      if(
        eligibleItems.length===0
      ){

        return;

      }


      const eligibleTotal =
        eligibleItems.reduce(
          (
            sum,
            item
          )=>{

            return (
              sum +
              getCartItemTotal(
                item
              )
            );

          },
          0
        );


      if(
        !Number.isFinite(
          eligibleTotal
        ) ||
        eligibleTotal<=0
      ){

        return;

      }


      const matchedRules =
        campaignRules.filter(
          rule=>{

            const minAmount =
              Number(
                rule.min_amount || 0
              );

            return (
              Number.isFinite(
                minAmount
              ) &&
              eligibleTotal >=
                minAmount
            );

          }
        );


      if(
        matchedRules.length===0
      ){

        return;

      }


      /*
      ใช้ tier สูงสุดที่ลูกค้าถึง
      */

      const matchedRule =
        matchedRules[
          matchedRules.length-1
        ];


      const maxSelectRaw =
        Number(
          matchedRule.max_select || 0
        );

      const maxSelect =
        Number.isFinite(
          maxSelectRaw
        )
          ? Math.max(
              0,
              Math.floor(
                maxSelectRaw
              )
            )
          : 0;


      if(
        maxSelect<=0
      ){

        return;

      }


      const campaignGiftItems =
        (
          checkoutGiftState.items ||
          []
        )
        .filter(
          item=>{

            return (
              normalizeText(
                item.campaign_id
              ) ===
              campaignId
            );

          }
        )
        .sort(
          (
            a,
            b
          )=>{

            return (
              Number(
                a.sort_order || 0
              ) -
              Number(
                b.sort_order || 0
              )
            );

          }
        );


      if(
        campaignGiftItems.length===0
      ){

        console.warn(
          "Gift campaign ไม่มี GiftItems:",
          campaignId
        );

        return;

      }


      result.push({

        campaign,

        rule:
          matchedRule,

        rules:
          campaignRules,

        eligibleItems,

        eligibleTotal,

        maxSelect,

        giftItems:
          campaignGiftItems

      });

    }
  );


  return result;

}

function getCharactersForGiftItem(
  giftItemId
){

  const normalizedGiftItemId =
    normalizeGiftId(
      giftItemId
    );

  return checkoutGiftState.characters
    .filter(
      character =>

        normalizeGiftId(
          character.gift_item_id
        ) ===
        normalizedGiftItemId

    )
    .sort(
      (a,b) =>

        Number(
          a.sort_order || 0
        ) -
        Number(
          b.sort_order || 0
        )
    );

}


function getGiftRuleSelection(
  ruleId
){

  const normalizedRuleId =
    normalizeGiftId(
      ruleId
    );

  if(
    !checkoutGiftState.selections[
      normalizedRuleId
    ]
  ){

    checkoutGiftState.selections[
      normalizedRuleId
    ] = {};

  }

  return checkoutGiftState.selections[
    normalizedRuleId
  ];

}


function getGiftItemSelectionQty(
  ruleId,
  giftItemId
){

  const ruleSelection =
    getGiftRuleSelection(
      ruleId
    );

  const itemSelection =
    ruleSelection[
      normalizeGiftId(
        giftItemId
      )
    ];

  return itemSelection
    ? Math.max(
        0,
        Number(
          itemSelection.qty || 0
        )
      )
    : 0;

}


function getGiftRuleSelectedCount(
  ruleId
){

  const ruleSelection =
    getGiftRuleSelection(
      ruleId
    );

  return Object.values(
    ruleSelection
  ).reduce(
    (
      sum,
      selection
    ) =>
      sum +
      Math.max(
        0,
        Number(
          selection.qty || 0
        )
      ),
    0
  );

}

function escapeJsValue(
  value
){

  return String(
    value || ""
  )
    .replaceAll(
      "\\",
      "\\\\"
    )
    .replaceAll(
      "'",
      "\\'"
    )
    .replaceAll(
      "\r",
      "\\r"
    )
    .replaceAll(
      "\n",
      "\\n"
    );

}


function findGiftRule(
  ruleId
){

  const normalizedRuleId =
    normalizeGiftId(
      ruleId
    );

  for(
    const campaign
    of checkoutGiftState
      .eligibleCampaigns
  ){

    const rule =
      campaign.rules.find(
        item =>

          normalizeGiftId(
            item.rule_id
          ) ===
          normalizedRuleId

      );

    if(rule){

      return {
        campaign,
        rule
      };

    }

  }

  return null;

}


function findGiftItemInRule(
  rule,
  giftItemId
){

  const normalizedGiftItemId =
    normalizeGiftId(
      giftItemId
    );

  return rule.items.find(
    item =>

      normalizeGiftId(
        item.gift_item_id
      ) ===
      normalizedGiftItemId

  ) || null;

}


function toggleCheckoutGiftItem(
  checkbox
){

  const ruleId =
    checkbox.dataset
      .giftCheckboxRule;

  const giftItemId =
    checkbox.dataset
      .giftCheckboxItem;

  const found =
    findGiftRule(
      ruleId
    );

  if(!found){

    checkbox.checked = false;

    return;
  }

  const maxSelect =
    Math.max(
      1,
      Number(
        found.rule.max_select || 1
      )
    );

  const selectedCount =
    getGiftRuleSelectedCount(
      ruleId
    );

  if(
    checkbox.checked &&
    selectedCount >= maxSelect
  ){

    checkbox.checked = false;

    alert(
      `Rule นี้เลือกของแถมได้สูงสุด ${maxSelect} ชิ้น`
    );

    return;
  }

  setCheckoutGiftItemQty(
    ruleId,
    giftItemId,
    checkbox.checked
      ? 1
      : 0
  );

}


function changeCheckoutGiftQty(
  ruleId,
  giftItemId,
  change
){

  const found =
    findGiftRule(
      ruleId
    );

  if(!found){
    return;
  }

  const maxSelect =
    Math.max(
      1,
      Number(
        found.rule.max_select || 1
      )
    );

  const currentQty =
    getGiftItemSelectionQty(
      ruleId,
      giftItemId
    );

  const nextQty =
    Math.max(
      0,
      currentQty +
      Number(change || 0)
    );

  const selectedWithoutCurrent =
    getGiftRuleSelectedCount(
      ruleId
    ) -
    currentQty;

  if(
    nextQty +
    selectedWithoutCurrent >
    maxSelect
  ){

    alert(
      `Rule นี้เลือกของแถมได้สูงสุด ${maxSelect} ชิ้น`
    );

    return;
  }

  setCheckoutGiftItemQty(
    ruleId,
    giftItemId,
    nextQty
  );

}


function setCheckoutGiftItemQty(
  ruleId,
  giftItemId,
  qty
){

  const found =
    findGiftRule(
      ruleId
    );

  if(!found){
    return;
  }

  const item =
    findGiftItemInRule(
      found.rule,
      giftItemId
    );

  if(!item){
    return;
  }

  const normalizedRuleId =
    normalizeGiftId(
      ruleId
    );

  const normalizedGiftItemId =
    normalizeGiftId(
      giftItemId
    );

  const ruleSelection =
    getGiftRuleSelection(
      normalizedRuleId
    );

  const normalizedQty =
    Math.max(
      0,
      Math.floor(
        Number(qty || 0)
      )
    );

  if(normalizedQty <= 0){

    delete ruleSelection[
      normalizedGiftItemId
    ];

  }else{

    const previous =
      ruleSelection[
        normalizedGiftItemId
      ] || {};

    ruleSelection[
      normalizedGiftItemId
    ] = {
      qty:
        normalizedQty,
      characters:
        Array.isArray(
          previous.characters
        )
          ? previous.characters.slice(
              0,
              normalizedQty
            )
          : []
    };

  }

  refreshGiftItemUI(
    found.rule,
    item
  );

  refreshGiftRuleUI(
    found.rule
  );

}


function refreshAllGiftRuleUI(){

                  item

            refreshGiftRuleUI(
              rule

          }
        )

    );

      )
    );

  countBox.textContent =
    `เลือกแล้ว ${selectedCount} / ${maxSelect}`;

}

<span>
${escapeHtml(
  character.character_name ||
  characterId
)}
</span>

</label>

`;

      }
    );

    html += `

</div>

`;

  }

  box.innerHTML =
    html;

}


function selectCheckoutGiftCharacter(
  ruleId,
  giftItemId,
  itemIndex,
  characterId
){

  const ruleSelection =
    getGiftRuleSelection(
      ruleId
    );

  const itemSelection =
    ruleSelection[
      normalizeGiftId(
        giftItemId
      )
    ];

  if(!itemSelection){
    return;
  }

  if(
    !Array.isArray(
      itemSelection.characters
    )
  ){

    itemSelection.characters = [];

  }

  itemSelection.characters[
    Number(itemIndex)
  ] =
    normalizeGiftId(
      characterId
    );

}


function validateCheckoutGiftSelections(){

  for(
    const campaign
    of checkoutGiftState
      .eligibleCampaigns
  ){

    for(
      const rule
      of campaign.rules
    ){

      const selectedCount =
        getGiftRuleSelectedCount(
          rule.rule_id
        );

      const maxSelect =
        Math.max(
          1,
          Number(
            rule.max_select || 1
          )
        );

      if(
        selectedCount > maxSelect
      ){

        alert(
          `ของแถม ${rule.rule_name || ""} เลือกได้สูงสุด ${maxSelect} ชิ้น`
        );

        return false;
      }

      const ruleSelection =
        getGiftRuleSelection(
          rule.rule_id
        );

      for(
        const [
          giftItemId,
          selection
        ]
        of Object.entries(
          ruleSelection
        )
      ){

        const item =
          findGiftItemInRule(
            rule,
            giftItemId
          );

        if(!item){
          continue;
        }

        const qty =
          Math.max(
            0,
            Number(
              selection.qty || 0
            )
          );

        if(
          !normalizeGiftBoolean(
            item.has_character
          )
        ){
          continue;
        }

        const characters =
          getCharactersForGiftItem(
            giftItemId
          );

        if(!characters.length){

          alert(
            `ของแถม ${item.gift_name || ""} เปิดให้เลือกตัวละคร แต่ยังไม่มี Character ที่ใช้งานได้`
          );

          return false;
        }

        const selectedCharacters =
          Array.isArray(
            selection.characters
          )
            ? selection.characters
            : [];

        for(
          let index = 0;
          index < qty;
          index++
        ){

          if(
            !normalizeGiftId(
              selectedCharacters[
                index
              ]
            )
          ){

            alert(
              `กรุณาเลือกตัวละครของ ${item.gift_name || "ของแถม"} ชิ้นที่ ${index + 1}`
            );

            return false;
          }

        }

        const maxSameCharacter =
          Math.max(
            1,
            Number(
              item.max_same_character || 1
            )
          );

        const counts = {};

        selectedCharacters
          .slice(
            0,
            qty
          )
          .forEach(
            characterId => {

              const normalizedId =
                normalizeGiftId(
                  characterId
                );

              counts[
                normalizedId
              ] =
                (
                  counts[
                    normalizedId
                  ] || 0
                ) + 1;

            }
          );

        for(
          const [
            characterId,
            count
          ]
          of Object.entries(
            counts
          )
        ){

          if(
            count >
            maxSameCharacter
          ){

            const character =
              characters.find(
                item =>

                  normalizeGiftId(
                    item.character_id
                  ) ===
                  characterId

              );

            alert(
              `${character ? character.character_name : "ตัวละครเดียวกัน"} เลือกซ้ำได้สูงสุด ${maxSameCharacter} ชิ้น`
            );

            return false;
          }

        }

      }

    }

  }

  return true;

}


function collectCheckoutGiftSelections(){

  const gifts = [];

  checkoutGiftState
    .eligibleCampaigns
    .forEach(
      campaign => {

        campaign.rules.forEach(
          rule => {

            const ruleSelection =
              getGiftRuleSelection(
                rule.rule_id
              );

            Object.entries(
              ruleSelection
            ).forEach(
              ([
                giftItemId,
                selection
              ]) => {

                const item =
                  findGiftItemInRule(
                    rule,
                    giftItemId
                  );

                if(!item){
                  return;
                }

                const qty =
                  Math.max(
                    0,
                    Number(
                      selection.qty || 0
                    )
                  );

                const characters =
                  getCharactersForGiftItem(
                    giftItemId
                  );

                for(
                  let index = 0;
                  index < qty;
                  index++
                ){

                  const characterId =
                    normalizeGiftId(
                      selection.characters &&
                      selection.characters[
                        index
                      ]
                    );

                  const character =
                    characters.find(
                      row =>

                        normalizeGiftId(
                          row.character_id
                        ) ===
                        characterId

                    );

                  gifts.push({

                    campaign_id:
                      normalizeGiftId(
                        campaign.campaign_id
                      ),

                    campaign_name:
                      campaign.campaign_name ||
                      "",

                    rule_id:
                      normalizeGiftId(
                        rule.rule_id
                      ),

                    rule_name:
                      rule.rule_name ||
                      "",

                    tier_name:
                      rule.rule_name ||
                      "",

                    gift_item_id:
                      giftItemId,

                    gift_id:
                      giftItemId,

                    gift_name:
                      item.gift_name ||
                      "",

                    character_id:
                      characterId,

                    character_name:
                      character
                        ? character.character_name || ""
                        : "",

                    collection_id:
                      normalizeGiftId(
                        campaign.collection_id
                      )

                  });

                }

              }
            );

          }
        );

      }
    );

  return gifts;

}


function goPayment(){

  const addressData =
    window.checkoutAddress;

  if(!addressData){

    alert(
      "กรุณาเลือกที่อยู่จัดส่งก่อน"
    );

    return;

  }

  if(
    !addressData.receiver ||
    !addressData.phone ||
    !addressData.address ||
    !addressData.province ||
    !addressData.postcode
  ){

    alert(
      "ข้อมูลที่อยู่จัดส่งไม่ครบ กรุณาเลือกหรือแก้ไขที่อยู่ใหม่"
    );

    return;

  }

  if(
    !validateCheckoutGiftSelections()
  ){
    return;
  }

  const gifts =
    collectCheckoutGiftSelections();

  const checkoutData = {

    ...addressData,

    email:
      addressData.email ||
      customer.email ||
      "",

    gifts:
      gifts

  };

  console.log(
    "CHECKOUT GIFTS:",
    gifts
  );

  window.checkoutAddress =
    checkoutData;

  localStorage.setItem(
    "checkoutAddress",
    JSON.stringify(
      checkoutData
    )
  );

  window.location.href =
    "payment.html";

}
