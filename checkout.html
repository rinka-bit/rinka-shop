<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">
<meta
name="viewport"
content="width=device-width, initial-scale=1">

<title>ยืนยันคำสั่งซื้อ | Rinka Shop</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link
href="https://fonts.googleapis.com/css2?family=Kodchasan:wght@400;500;600;700&display=swap"
rel="stylesheet">

<link
rel="stylesheet"
href="style.css">

<style>

:root{
  --checkout-primary:#7dcfff;
  --checkout-primary-dark:#4aa4db;
  --checkout-background:#f6fbff;
  --checkout-card:#ffffff;
  --checkout-text:#334155;
  --checkout-muted:#64748b;
  --checkout-border:#dbe7f1;
  --checkout-danger:#be123c;
  --checkout-success:#166534;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:'Kodchasan',sans-serif;
  color:var(--checkout-text);
  background:
    linear-gradient(
      180deg,
      #fbfdff 0%,
      var(--checkout-background) 100%
    );
}

button,
input,
a{
  font:inherit;
}

button{
  cursor:pointer;
}

button:disabled{
  opacity:.55;
  cursor:not-allowed;
}

.checkout-topbar{
  position:sticky;
  top:0;
  z-index:100;
  min-height:68px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:11px 16px;
  background:rgba(255,255,255,.94);
  border-bottom:1px solid rgba(219,231,241,.95);
  backdrop-filter:blur(10px);
  box-shadow:0 5px 18px rgba(71,85,105,.07);
}

.checkout-topbar button,
.checkout-topbar a{
  width:46px;
  height:46px;
  border:none;
  border-radius:999px;
  background:#fff;
  color:var(--checkout-text);
  display:flex;
  align-items:center;
  justify-content:center;
  text-decoration:none;
  font-size:21px;
  box-shadow:0 4px 14px rgba(71,85,105,.10);
}

.checkout-topbar h1{
  flex:1;
  margin:0;
  padding:0 12px;
  text-align:center;
  color:#3f6078;
  font-size:20px;
}

.checkout-cart{
  position:relative;
}

.checkout-cart-count{
  position:absolute;
  top:-5px;
  right:-5px;
  min-width:20px;
  height:20px;
  padding:0 5px;
  border-radius:999px;
  background:#ff5c7a;
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:10px;
  font-weight:700;
}

.checkout-container{
  width:min(1160px,100%);
  margin:auto;
  padding:22px 18px 130px;
}

.checkout-layout{
  display:grid;
  grid-template-columns:minmax(0,1.55fr) minmax(300px,.75fr);
  gap:22px;
  align-items:start;
}

.checkout-main{
  min-width:0;
}

.checkout-card{
  margin-bottom:18px;
  padding:18px;
  background:#fff;
  border:1px solid var(--checkout-border);
  border-radius:21px;
  box-shadow:0 8px 25px rgba(86,142,178,.08);
}

.checkout-card-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  margin-bottom:14px;
}

.checkout-card-header h2{
  margin:0;
  color:#3f6078;
  font-size:19px;
}

.checkout-card-header span{
  color:var(--checkout-muted);
  font-size:13px;
}

.checkout-secondary-button{
  border:1px solid #cde6f5;
  border-radius:999px;
  padding:9px 14px;
  background:#eef8ff;
  color:#3476a2;
  font-weight:700;
}

.checkout-address-card{
  padding:15px;
  border:1px solid #d7ebf7;
  border-radius:16px;
  background:linear-gradient(135deg,#f3fbff,#fbfdff);
}

.checkout-address-head{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:12px;
  margin-bottom:11px;
}

.checkout-address-name{
  font-size:17px;
  font-weight:700;
}

.checkout-default-badge{
  display:inline-flex;
  margin-top:6px;
  padding:4px 8px;
  border-radius:999px;
  background:#dcfce7;
  color:#166534;
  font-size:11px;
  font-weight:700;
}

.checkout-address-icon{
  font-size:25px;
}

.checkout-address-line{
  display:flex;
  align-items:flex-start;
  gap:9px;
  margin-top:8px;
  color:#526777;
  line-height:1.65;
}

.checkout-address-empty,
.checkout-empty-state{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:9px;
  min-height:180px;
  padding:22px;
  text-align:center;
  border:1px dashed #cbdde8;
  border-radius:16px;
  background:#fbfdff;
}

.checkout-address-empty span,
.checkout-empty-state p{
  margin:0;
  color:var(--checkout-muted);
}

.checkout-empty-state a{
  display:inline-flex;
  padding:10px 16px;
  border-radius:999px;
  background:var(--checkout-primary);
  color:#fff;
  text-decoration:none;
  font-weight:700;
}

.checkout-state-icon{
  font-size:42px;
}

.checkout-inline-loading{
  min-height:100px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:11px;
  color:var(--checkout-muted);
}

.checkout-mini-spinner{
  width:24px;
  height:24px;
  border:3px solid #dff2fc;
  border-top-color:var(--checkout-primary-dark);
  border-radius:50%;
  animation:checkoutSpin .8s linear infinite;
}

@keyframes checkoutSpin{
  to{transform:rotate(360deg)}
}

.checkout-error-box{
  display:flex;
  flex-direction:column;
  gap:8px;
  padding:15px;
  border:1px solid #fecaca;
  border-radius:15px;
  background:#fff1f2;
  color:#9f1239;
}

.checkout-error-box button{
  width:max-content;
  border:none;
  border-radius:999px;
  padding:8px 13px;
  background:#be123c;
  color:#fff;
  font-weight:700;
}

.checkout-product-card{
  display:grid;
  grid-template-columns:82px minmax(0,1fr) auto;
  gap:13px;
  align-items:start;
  padding:13px 0;
  border-bottom:1px solid #edf2f6;
}

.checkout-product-card:last-child{
  border-bottom:none;
  padding-bottom:0;
}

.checkout-product-image,
.checkout-product-placeholder{
  width:82px;
  height:82px;
  border-radius:13px;
  background:#edf7fc;
}

.checkout-product-image{
  object-fit:cover;
}

.checkout-product-placeholder{
  display:flex;
  align-items:center;
  justify-content:center;
  color:#94a3b8;
  font-size:11px;
  text-align:center;
}

.checkout-product-main{
  min-width:0;
}

.checkout-product-main h3{
  margin:0;
  font-size:15px;
  line-height:1.5;
  overflow-wrap:anywhere;
}

.checkout-option-list{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
  margin-top:8px;
}

.checkout-option-badge{
  display:inline-flex;
  padding:4px 8px;
  border-radius:999px;
  background:#eef8ff;
  color:#3f7194;
  font-size:11px;
  font-weight:600;
}

.checkout-product-meta{
  margin-top:8px;
  color:var(--checkout-muted);
  font-size:12px;
}

.checkout-product-total{
  min-width:90px;
  display:flex;
  flex-direction:column;
  align-items:flex-end;
  gap:4px;
  text-align:right;
}

.checkout-product-total span{
  color:var(--checkout-muted);
  font-size:11px;
}

.checkout-product-total strong{
  color:#347fb4;
  font-size:16px;
}

.checkout-summary{
  position:sticky;
  top:88px;
  padding:19px;
  background:#fff;
  border:1px solid var(--checkout-border);
  border-radius:21px;
  box-shadow:0 11px 32px rgba(86,142,178,.11);
}

.checkout-summary h2{
  margin:0 0 15px;
  color:#3f6078;
  font-size:19px;
}

.checkout-summary-row{
  display:flex;
  justify-content:space-between;
  gap:12px;
  padding:9px 0;
  color:var(--checkout-muted);
  font-size:14px;
}

.checkout-summary-row strong{
  color:var(--checkout-text);
}

.checkout-total-row{
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  gap:12px;
  margin-top:9px;
  padding-top:15px;
  border-top:1px solid var(--checkout-border);
}

.checkout-total-row span{
  font-weight:700;
}

.checkout-total-row strong{
  color:#2563eb;
  font-size:28px;
}

.checkout-payment-button{
  width:100%;
  min-height:51px;
  margin-top:18px;
  border:none;
  border-radius:999px;
  background:linear-gradient(135deg,#7dcfff,#57b8ed);
  color:#fff;
  font-size:16px;
  font-weight:700;
  box-shadow:0 9px 22px rgba(87,184,237,.25);
}

.checkout-back-link{
  display:block;
  margin-top:11px;
  color:#53748b;
  text-align:center;
  text-decoration:none;
  font-size:13px;
  font-weight:600;
}

/* Gift Engine UI */

#giftSection{
  margin-top:4px;
}

.gift-loading,
.gift-empty,
.gift-error{
  padding:17px;
  border-radius:15px;
  text-align:center;
  margin-top:14px;
}

.gift-loading,
.gift-empty{
  background:#f8fbff;
  color:#64748b;
  border:1px solid #e3eef5;
}

.gift-error{
  background:#fff1f2;
  color:#be123c;
  border:1px solid #fecdd3;
}

.gift-campaign-card{
  margin-top:16px;
  padding:15px;
  border:1px solid #dbeafe;
  border-radius:17px;
  background:linear-gradient(135deg,#fbfdff,#f5fbff);
}

.gift-campaign-title{
  margin:0 0 6px;
  font-size:17px;
  color:#3f6078;
}

.gift-campaign-meta{
  color:#64748b;
  font-size:13px;
  line-height:1.7;
  margin-bottom:13px;
}

.gift-rule-card{
  margin-top:13px;
  padding:13px;
  border:1px solid #e5e7eb;
  border-radius:15px;
  background:#fff;
}

.gift-rule-header{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:12px;
  margin-bottom:11px;
}

.gift-rule-name{
  font-weight:700;
}

.gift-rule-count{
  padding:4px 8px;
  border-radius:999px;
  background:#eff6ff;
  color:#2563eb;
  font-size:12px;
  font-weight:700;
  white-space:nowrap;
}

.gift-item-row{
  display:flex;
  align-items:flex-start;
  gap:11px;
  padding:11px;
  border:1px solid #eef2f7;
  border-radius:13px;
  margin-top:9px;
}

.gift-item-row.selected{
  border-color:#7dcfff;
  background:#f4fbff;
  box-shadow:0 0 0 2px rgba(125,207,255,.10);
}

.gift-item-image{
  width:60px;
  height:60px;
  object-fit:cover;
  border-radius:10px;
  background:#f1f5f9;
  flex:0 0 auto;
}

.gift-item-main{
  flex:1;
  min-width:0;
}

.gift-item-name{
  font-weight:700;
}

.gift-item-actions{
  display:flex;
  align-items:center;
  gap:8px;
  flex:0 0 auto;
}

.gift-item-actions input[type="checkbox"]{
  width:18px;
  height:18px;
  margin:4px 0 0;
}

.gift-qty-control{
  display:flex;
  align-items:center;
  gap:8px;
}

.gift-qty-control button{
  width:34px;
  height:34px;
  padding:0;
  margin:0;
  border:none;
  border-radius:999px;
  background:#d9f2ff;
  color:#347fb4;
  font-weight:700;
}

.gift-qty-value{
  min-width:24px;
  text-align:center;
  font-weight:700;
}

.gift-character-box{
  margin-top:9px;
}

.gift-character-title{
  margin:9px 0 6px;
  font-size:12px;
  font-weight:700;
  color:#526777;
}

.gift-char-list{
  display:flex;
  flex-wrap:wrap;
  gap:7px;
}

.gift-char-item{
  display:inline-flex;
  align-items:center;
  gap:7px;
  margin:0;
  padding:7px 10px;
  border:1px solid #dfe9ef;
  border-radius:999px;
  background:#fff;
  cursor:pointer;
  font-size:12px;
}

.gift-char-item:has(input:checked){
  border-color:#7dcfff;
  background:#eef8ff;
}

.gift-char-item input{
  width:auto;
  margin:0;
}

.gift-char-image{
  width:29px;
  height:29px;
  object-fit:cover;
  border-radius:999px;
  background:#f1f5f9;
}

.gift-summary-note{
  margin-top:11px;
  color:#64748b;
  font-size:12px;
  line-height:1.65;
}

.checkout-message{
  position:fixed;
  left:50%;
  bottom:24px;
  z-index:2000;
  width:min(410px,calc(100% - 28px));
  padding:13px 16px;
  border-radius:14px;
  background:#18384e;
  color:#fff;
  text-align:center;
  font-weight:600;
  opacity:0;
  pointer-events:none;
  transform:translate(-50%,20px);
  transition:.2s ease;
  box-shadow:0 12px 30px rgba(15,23,42,.24);
}

.checkout-message.show{
  opacity:1;
  transform:translate(-50%,0);
}

.checkout-message.error{
  background:#991b1b;
}

@media(max-width:850px){

  .checkout-layout{
    grid-template-columns:1fr;
  }

  .checkout-summary{
    position:static;
  }

}

@media(max-width:600px){

  .checkout-topbar{
    min-height:64px;
    padding:9px 11px;
  }

  .checkout-topbar h1{
    font-size:17px;
  }

  .checkout-container{
    padding:14px 10px 116px;
  }

  .checkout-card{
    padding:14px;
    border-radius:18px;
  }

  .checkout-card-header{
    align-items:flex-start;
  }

  .checkout-card-header h2{
    font-size:17px;
  }

  .checkout-product-card{
    grid-template-columns:68px minmax(0,1fr);
  }

  .checkout-product-image,
  .checkout-product-placeholder{
    width:68px;
    height:68px;
  }

  .checkout-product-total{
    grid-column:2;
    min-width:0;
    align-items:flex-start;
    text-align:left;
    flex-direction:row;
  }

  .gift-rule-header{
    flex-direction:column;
  }

  .gift-item-row{
    flex-wrap:wrap;
  }

  .gift-item-actions{
    width:100%;
    justify-content:flex-end;
  }

}

</style>

</head>

<body>

<header class="checkout-topbar">

<button
type="button"
aria-label="กลับหน้าก่อนหน้า"
onclick="goCheckoutBack()">
←
</button>

<h1>
ยืนยันคำสั่งซื้อ
</h1>

<a
href="cart.html"
class="checkout-cart"
aria-label="เปิดตะกร้าสินค้า">

<span>🛒</span>

<span
id="checkoutCartCount"
class="checkout-cart-count">
0
</span>

</a>

</header>

<main class="checkout-container">

<div class="checkout-layout">

<section class="checkout-main">

<div class="checkout-card">

<div class="checkout-card-header">

<div>

<h2>
📍 ที่อยู่จัดส่ง
</h2>

</div>

<button
type="button"
class="checkout-secondary-button"
onclick="window.location.href='address-book.html?select=checkout'">
เปลี่ยนที่อยู่
</button>

</div>

<div id="selectedAddress">

<div class="checkout-inline-loading">

<span class="checkout-mini-spinner"></span>

<span>
กำลังโหลดที่อยู่จัดส่ง...
</span>

</div>

</div>

</div>

<div class="checkout-card">

<div class="checkout-card-header">

<h2>
🛍️ รายการสินค้า
</h2>

<span id="checkoutItemCount">
0 ชิ้น
</span>

</div>

<div id="items"></div>

</div>

<div class="checkout-card">

<div class="checkout-card-header">

<h2>
🎁 ของแถม
</h2>

</div>

<div id="giftSection">

<div class="gift-loading">
⏳ กำลังตรวจสอบสิทธิ์ของแถม...
</div>

</div>

</div>

</section>

<aside class="checkout-summary">

<h2>
สรุปคำสั่งซื้อ
</h2>

<div class="checkout-summary-row">

<span>
จำนวนสินค้า
</span>

<strong id="checkoutItemCountSummary">
ตรวจสอบด้านซ้าย
</strong>

</div>

<div class="checkout-summary-row">

<span>
ยอดสินค้า
</span>

<strong id="checkoutSubtotal">
฿0
</strong>

</div>

<div class="checkout-total-row">

<span>
ยอดรวม
</span>

<strong id="total">
฿0
</strong>

</div>

<button
id="checkoutPaymentButton"
type="button"
class="checkout-payment-button"
onclick="goPayment()"
disabled>
ไปชำระเงิน
</button>

<a
href="cart.html"
class="checkout-back-link">
กลับไปแก้ไขตะกร้า
</a>

</aside>

</div>

</main>

<div
id="checkoutMessage"
class="checkout-message"
role="status"
aria-live="polite">
</div>

<script>
const API =
"https://script.google.com/macros/s/AKfycbxKjVvn8AXrK0wDvKqN-A9yS2Vk8R-w25ar1b9ftiIdUgUvFaShunLnFnAyIDuaTWj76w/exec";

const customer =
  JSON.parse(
    localStorage.getItem(
      "customer"
    ) || "{}"
  );

const checkoutSessionToken =
  String(
    localStorage.getItem(
      "session_token"
    ) ||
    customer.session_token ||
    ""
  ).trim();

if(!checkoutSessionToken){

  window.location.href =
    "login.html";

}
  
let cart = [];
let checkoutSubmitting = false;

loadCheckout();

function loadCheckout(){

  const checkoutSource =
    localStorage.getItem(
      "checkoutSource"
    );

  const buyNowCart =
    JSON.parse(
      localStorage.getItem(
        "buyNowCart"
      ) || "[]"
    );

  const checkoutCart =
    JSON.parse(
      localStorage.getItem(
        "checkoutCart"
      ) || "[]"
    );

  const normalCart =
    JSON.parse(
      localStorage.getItem(
        "cart"
      ) || "[]"
    );

  if(
    checkoutSource === "buyNow" &&
    Array.isArray(buyNowCart) &&
    buyNowCart.length
  ){

    cart =
      buyNowCart;

    console.log(
      "CHECKOUT SOURCE:",
      "buyNowCart"
    );

  }
  else if(
    checkoutSource === "cart" &&
    Array.isArray(checkoutCart) &&
    checkoutCart.length
  ){

    cart =
      checkoutCart;

    console.log(
      "CHECKOUT SOURCE:",
      "checkoutCart"
    );

  }
  else if(
    Array.isArray(checkoutCart) &&
    checkoutCart.length
  ){

    cart =
      checkoutCart;

    console.log(
      "CHECKOUT SOURCE:",
      "checkoutCart fallback"
    );

  }
  else if(
    Array.isArray(buyNowCart) &&
    buyNowCart.length
  ){

    cart =
      buyNowCart;

    console.log(
      "CHECKOUT SOURCE:",
      "buyNowCart fallback"
    );

  }
  else if(
    Array.isArray(normalCart)
  ){

    cart =
      normalCart;

    console.log(
      "CHECKOUT SOURCE:",
      "cart fallback"
    );

  }
  else{

    cart = [];

  }

  console.log(
    "CHECKOUT CART:",
    cart
  );

  renderItems();

  loadDefaultAddress();

  loadGifts();

  updateCheckoutCartCount();

  updateCheckoutPaymentState();

}

async function loadDefaultAddress(){

  const box =
    document.getElementById(
      "selectedAddress"
    );

  if(box){

    box.innerHTML = `

<div class="checkout-inline-loading">

  <span class="checkout-mini-spinner"></span>

  <span>
    กำลังโหลดที่อยู่จัดส่ง...
  </span>

</div>

`;

  }

  let selectedAddress =
    getCheckoutStoredValue(
      "selectedCheckoutAddress",
      null
    );

  try{

    if(!selectedAddress){

      const sessionToken =
  checkoutSessionToken;
      
      const query =
        new URLSearchParams();

      query.set(
        "action",
        "customerAddresses"
      );

      if(sessionToken){

  query.set(
    "action",
    "customerAddresses"
  );

  query.set(
    "session_token",
    sessionToken
  );

}else if(customer.email){

  // รองรับ Backend เก่า
  query.set(
    "email",
    customer.email
  );

}

const response =
  await fetch(
    API +
    "?" +
    query.toString()
  );

      if(!response.ok){

function escapeHtml(
  value
){

  return String(
    value || ""
  )
    .replaceAll(
      "&",
      "&amp;"
    )
    .replaceAll(
      "<",
      "&lt;"
    )
    .replaceAll(
      ">",
      "&gt;"
    )
    .replaceAll(
      '"',
      "&quot;"
    )
    .replaceAll(
      "'",
      "&#039;"
    );

}


/*
=========================================
CHECKOUT GIFT ENGINE — SCHEMA 1.1
Campaign → Rule → Gift Item → Character
=========================================
*/

const checkoutGiftState = {
  campaigns:[],
  rules:[],
  items:[],
  characters:[],
  exclusions:[],
  collections:[],
  eligibleCampaigns:[],
  selections:{}
};


function normalizeGiftBoolean(
  value
){

  if(
    value === true ||
    value === 1
  ){
    return true;
  }

  return [
    "yes",
    "true",
    "1",
    "active"
  ].includes(
    String(
      value || ""
    )
      .trim()
      .toLowerCase()
  );

}


function normalizeGiftId(
  value
){

  return String(
    value || ""
  ).trim();

}


function getCartItemUnitPrice(
  item
){

  const value =
    Number(
      item.final_price ??
      item.price ??
      0
    );

  return Number.isFinite(value)
    ? Math.max(0,value)
    : 0;

}


function getCartItemQty(
  item
){

  const value =
    Number(
      item.qty || 0
    );

  return Number.isFinite(value)
    ? Math.max(0,value)
    : 0;

}


function getCartItemTotal(
  item
){

  return (
    getCartItemUnitPrice(item) *
    getCartItemQty(item)
  );

}


function getGiftResponseArray(
  result,
  keys = []
){

  if(Array.isArray(result)){
    return result;
  }

  for(const key of keys){

    if(
      result &&
      Array.isArray(
        result[key]
      )
    ){
      return result[key];
    }

  }

  return [];

}


async function fetchCheckoutGiftAction(
  action,
  parameters = {}
){

  const query =
    new URLSearchParams();

  query.set(
    "action",
    action
  );

  Object.entries(
    parameters || {}
  ).forEach(
    ([key,value])=>{

      if(
        value === undefined ||
        value === null ||
        value === ""
      ){
        return;
      }

      query.set(
        key,
        String(value)
      );

    }
  );

  const controller =
    new AbortController();

  const timeoutId =
    setTimeout(
      ()=>controller.abort(),
      12000
    );

  let response;

  try{

    response =
      await fetch(
        API +
        "?" +
        query.toString(),
        {
          signal:
            controller.signal
        }
      );

  }catch(error){

    if(
      error &&
      error.name ===
      "AbortError"
    ){

      throw new Error(
        "โหลดข้อมูลของแถมนานเกินไป กรุณาลองใหม่"
      );

    }

    throw error;

  }finally{

    clearTimeout(
      timeoutId
    );

  }

  if(!response.ok){

    throw new Error(
      "HTTP " +
      response.status
    );

  }

  const result =
    await response.json();

  if(
    result &&
    result.success === false
  ){

    throw new Error(
      result.error ||
      result.message ||
      "เรียก API ไม่สำเร็จ"
    );

  }

  return result;

}


async function fetchCheckoutGiftActionFallback(
  actions,
  keys
){

  let lastError = null;

  for(const action of actions){

    try{

      const result =
        await fetchCheckoutGiftAction(
          action
        );

      const rows =
        getGiftResponseArray(
          result,
          keys
        );

      if(
        rows.length ||
        (
          result &&
          result.success === true
        )
      ){
        return rows;
      }

    }catch(error){

      lastError = error;

      console.warn(
        "Gift API fallback:",
        action,
        error
      );

    }

  }

  if(lastError){
    throw lastError;
  }

  return [];

}

function getCollectionById(
  collectionId
){

  const normalizedId =
    normalizeGiftId(
      collectionId
    );

  return (
    checkoutGiftState.collections.find(
      collection =>

        normalizeGiftId(
          collection.collection_id
        ) ===
        normalizedId

    ) ||
    null
  );

}


function getCampaignFandom(
  campaign
){

  const directFandom =
    String(
      campaign.fandom || ""
    ).trim();

  if(directFandom){
    return directFandom;
  }

  const collection =
    getCollectionById(
      campaign.collection_id
    );

  if(
    collection &&
    collection.fandom
  ){
    return String(
      collection.fandom
    ).trim();
  }

  const cartItem =
    cart.find(
      item =>

        normalizeGiftId(
          item.collection_id
        ) ===
        normalizeGiftId(
          campaign.collection_id
        )

    );

  return cartItem
    ? String(
        cartItem.fandom || ""
      ).trim()
    : "";

}


function getCampaignExcludedProductIds(
  campaignId
){

  const normalizedCampaignId =
    normalizeGiftId(
      campaignId
    );

  return new Set(

    checkoutGiftState.exclusions
      .filter(
        exclusion =>

          normalizeGiftId(
            exclusion.campaign_id
          ) ===
          normalizedCampaignId

      )
      .map(
        exclusion =>
          normalizeGiftId(
            exclusion.product_id
          )
      )
      .filter(Boolean)

  );

}

function getCampaignEligibleCartItems(
  campaign
){

  if(
    !campaign ||
    !Array.isArray(cart) ||
    cart.length===0
  ){

    return [];

  }


  const campaignId =
    normalizeGiftId(
      campaign.campaign_id ||
      campaign.gift_id
    );


  const collectionId =
    normalizeGiftId(
      campaign.collection_id
    );


  const campaignFandom =
    String(
      getCampaignFandom(
        campaign
      ) || ""
    )
      .trim()
      .toLowerCase();


  /*
  รองรับชื่อทั้ง V2 และชื่อเก่าที่เคยใช้
  */

  const rawScope =
    String(
      campaign.eligibility_scope ||
      "collection_only"
    )
      .trim()
      .toLowerCase();


  let scope =
    rawScope;


  if(
    scope === "collection"
  ){

    scope =
      "collection_only";

  }


  if(
    scope === "fandom"
  ){

    scope =
      "fandom_all";

  }


  const excludedProductIds =
    getCampaignExcludedProductIds(
      campaignId
    );


  /*
  =========================================
  ต้องมีสินค้าจาก Campaign ก่อนหรือไม่
  =========================================
  */

  if(
    normalizeGiftBoolean(
      campaign.require_campaign_item
    )
  ){

    const hasCampaignItem =
      cart.some(
        item=>{

          const productId =
            normalizeGiftId(
              item.product_id
            );


          if(
            excludedProductIds.has(
              productId
            )
          ){

            return false;

          }


          return (

            normalizeGiftId(
              item.collection_id
            ) ===
            collectionId &&

            getCartItemQty(
              item
            ) > 0

          );

        }
      );


    if(!hasCampaignItem){

      return [];

    }

  }


  /*
  =========================================
  กรองสินค้าที่ใช้คำนวณยอด
  =========================================
  */

  return cart.filter(
    item=>{

      const productId =
        normalizeGiftId(
          item.product_id
        );


      if(
        excludedProductIds.has(
          productId
        )
      ){

        return false;

      }


      if(
        getCartItemQty(
          item
        ) <= 0
      ){

        return false;

      }


      const itemCollectionId =
        normalizeGiftId(
          item.collection_id
        );


      const itemFandom =
        String(
          item.fandom || ""
        )
          .trim()
          .toLowerCase();


      /*
      =========================
      Collection only
      =========================
      */

      if(
        scope ===
        "collection_only"
      ){

        return (

          !!collectionId &&

          itemCollectionId ===
          collectionId

        );

      }


      /*
      =========================
      Fandom all
      =========================
      */

      if(
        scope ===
        "fandom_all"
      ){

        return (

          !!campaignFandom &&

          itemFandom ===
          campaignFandom

        );

      }


      /*
      =========================
      All cart
      compatibility
      =========================
      */

      if(
        scope === "all"
      ){

        return true;

      }


      /*
      Unknown scope:
      ปลอดภัยไว้ก่อน ไม่เอาสินค้าเข้า
      =========================
      */

      console.warn(
        "Unknown gift eligibility_scope:",
        rawScope,
        campaignId
      );

      return false;

    }
  );

}

function campaignHasRequiredItem(
  campaign
){

  if(
    !normalizeGiftBoolean(
      campaign.require_campaign_item
    )
  ){
    return true;
  }

  const campaignCollectionId =
    normalizeGiftId(
      campaign.collection_id
    );

  const excludedProductIds =
    getCampaignExcludedProductIds(
      campaign.campaign_id
    );

  return cart.some(
    item => {

      const productId =
        normalizeGiftId(
          item.product_id
        );

      return (
        normalizeGiftId(
          item.collection_id
        ) ===
        campaignCollectionId &&
        !excludedProductIds.has(
          productId
        ) &&
        getCartItemQty(item) > 0
      );

    }
  );

}

function normalizeCheckoutGiftRewardMode(
  value
){

  return String(
    value || ""
  )
    .trim()
    .toLowerCase() === "custom"
      ? "custom"
      : "normal";

}


function createCheckoutGiftSelectionRuleId(
  entitlementRuleId,
  sourceRuleId
){

  const entitlementId =
    normalizeGiftId(
      entitlementRuleId
    );

  const sourceId =
    normalizeGiftId(
      sourceRuleId
    );

  if(
    entitlementId ===
    sourceId
  ){

    return entitlementId;

  }

  return (
    entitlementId +
    "__SOURCE__" +
    sourceId
  );

}


function getCheckoutGiftRuleItems(
  sourceRuleId,
  giftItems
){

  const normalizedSourceRuleId =
    normalizeGiftId(
      sourceRuleId
    );

  return (
    Array.isArray(giftItems)
      ? giftItems
      : []
  )
    .filter(
      item =>

        normalizeGiftId(
          item.rule_id
        ) ===
        normalizedSourceRuleId
    )
    .sort(
      (
        firstItem,
        secondItem
      ) =>

        Number(
          firstItem.sort_order || 0
        ) -

        Number(
          secondItem.sort_order || 0
        )
    );

}


function buildCheckoutGiftSelectionGroup({
  entitlementRule,
  sourceRule,
  maxSelect,
  giftItems,
  inherited
}){

  if(
    !entitlementRule ||
    !sourceRule
  ){

    return null;

  }

  const entitlementRuleId =
    normalizeGiftId(
      entitlementRule.rule_id
    );

  const sourceRuleId =
    normalizeGiftId(
      sourceRule.rule_id
    );

  const selectionRuleId =
    createCheckoutGiftSelectionRuleId(
      entitlementRuleId,
      sourceRuleId
    );

  const items =
    getCheckoutGiftRuleItems(
      sourceRuleId,
      giftItems
    );

  if(!items.length){

    return null;

  }

  const entitlementRuleName =
    String(
      entitlementRule.rule_name ||
      entitlementRuleId
    ).trim();

  const sourceRuleName =
    String(
      sourceRule.rule_name ||
      sourceRuleId
    ).trim();

  const isInherited =
    Boolean(inherited);

  return {

    /*
    rule_id ใช้เป็น ID ของกลุ่มการเลือกในหน้า Checkout
    อาจเป็น ID เสมือนเมื่อเป็นสิทธิ์จากเทียร์ก่อนหน้า
    */
    ...sourceRule,

    rule_id:
      selectionRuleId,

    selection_rule_id:
      selectionRuleId,

    /*
    Rule ที่เป็นเจ้าของสิทธิ์
    เช่น ยอด 1,200 เป็นผู้มอบสิทธิ์ยอด 600 เพิ่ม 2 ชิ้น
    */
    entitlement_rule_id:
      entitlementRuleId,

    entitlement_rule_name:
      entitlementRuleName,

    entitlement_min_amount:
      Number(
        entitlementRule.min_amount || 0
      ),

    /*
    Rule ต้นทางของ Gift Item
    */
    source_rule_id:
      sourceRuleId,

    source_rule_name:
      sourceRuleName,

    source_min_amount:
      Number(
        sourceRule.min_amount || 0
      ),

    max_select:
      Math.max(
        1,
        Math.floor(
          Number(
            maxSelect || 1
          )
        )
      ),

    /*
    ใช้เงื่อนไขเลือกซ้ำของ Rule ต้นทาง
    เพราะ Gift Item มาจาก Rule ต้นทาง
    */
    allow_duplicate:
      sourceRule.allow_duplicate,

    reward_mode:
      normalizeCheckoutGiftRewardMode(
        entitlementRule.reward_mode
      ),

    reward_description:
      String(
        entitlementRule.reward_description ||
        ""
      ).trim(),

    inherited:
      isInherited,

    rule_name:
      isInherited
        ? (
            sourceRuleName +
            " — สิทธิ์เพิ่มจาก " +
            entitlementRuleName
          )
        : sourceRuleName,

    display_description:
      isInherited
        ? (
            "สิทธิ์จาก " +
            entitlementRuleName +
            " ให้เลือกของแถมจาก " +
            sourceRuleName
          )
        : "",

    items:
      items

  };

}
  
function buildEligibleGiftCampaigns(){

  const result = [];

  const campaigns =
    checkoutGiftState.campaigns || [];

  const rules =
    checkoutGiftState.rules || [];

  const giftItems =
    checkoutGiftState.items || [];

  campaigns.forEach(
    campaign=>{

      const campaignId =
        normalizeGiftId(
          campaign.campaign_id
        );

      if(!campaignId){
        return;
      }

      const eligibleCartItems =
        getCampaignEligibleCartItems(
          campaign
        );

      if(!eligibleCartItems.length){
        return;
      }

      const eligibleTotal =
        eligibleCartItems.reduce(
          (sum,item)=>
            sum +
            getCartItemTotal(item),
          0
        );

      if(
        !Number.isFinite(
          eligibleTotal
        ) ||
        eligibleTotal <= 0
      ){
        return;
      }

      /*
      Rule ทั้งหมดที่ยอดถึง
      */

      const matchedRules =
        rules
          .filter(
            rule=>

              normalizeGiftId(
                rule.campaign_id
              ) ===
              campaignId
          )
          .filter(
            rule=>

              eligibleTotal >=
              Number(
                rule.min_amount || 0
              )
          )
          .sort(
            (a,b)=>

              Number(
                a.min_amount || 0
              ) -

              Number(
                b.min_amount || 0
              )
          );

      if(!matchedRules.length){
        return;
      }

      /*
      ใช้ Rule สูงสุดเป็นจำนวนสิทธิ์รวม
      */

      const highestRule =
        matchedRules[
          matchedRules.length - 1
        ];

      const maxSelect =
        Math.max(
          1,
          Math.floor(
            Number(
              highestRule.max_select || 1
            )
          )
        );

      const matchedRuleIds =
        new Set(
          matchedRules.map(
            rule=>
              normalizeGiftId(
                rule.rule_id
              )
          )
        );

      /*
      รวม Gift Item ของทุก Rule ที่ปลดล็อก
      และตัดรายการซ้ำ
      */

      const itemMap = {};

      giftItems.forEach(
        item=>{

          const itemRuleId =
            normalizeGiftId(
              item.rule_id
            );

          const giftItemId =
            normalizeGiftId(
              item.gift_item_id
            );

          if(
            !matchedRuleIds.has(
              itemRuleId
            ) ||
            !giftItemId
          ){
            return;
          }

          if(
            !itemMap[
              giftItemId
            ]
          ){

            itemMap[
              giftItemId
            ] = item;

          }

        }
      );

      const availableItems =
        Object
          .values(
            itemMap
          )
          .sort(
            (a,b)=>

              Number(
                a.sort_order || 0
              ) -

              Number(
                b.sort_order || 0
              )
          );

      if(!availableItems.length){
        return;
      }

      result.push({

        ...campaign,

        campaign_id:
          campaignId,

        eligible_items:
          eligibleCartItems,

        eligible_total:
          eligibleTotal,

        highest_rule:
          highestRule,

        matched_rules:
          matchedRules,

        max_select:
          Math.min(
            maxSelect,
            availableItems.length
          ),

        items:
          availableItems

      });

    }
  );

  return result;

}

function getCharactersForGiftItem(

    )
    .sort(
      (a,b) =>

        Number(
          a.sort_order || 0
        ) -
        Number(
          b.sort_order || 0
        )
    );

}


function getGiftRuleSelection(
  ruleId
){

  const normalizedRuleId =
    normalizeGiftId(
      ruleId
    );

  if(
    !checkoutGiftState.selections[
      normalizedRuleId
    ]
  ){

    checkoutGiftState.selections[
      normalizedRuleId
    ] = {};

  }

  return checkoutGiftState.selections[
    normalizedRuleId
  ];

}


function getGiftItemSelectionQty(
  ruleId,
  giftItemId
){

  const ruleSelection =
    getGiftRuleSelection(
      ruleId
    );

  const itemSelection =
    ruleSelection[
      normalizeGiftId(
        giftItemId
      )
    ];

  return itemSelection
    ? Math.max(
        0,
        Number(
          itemSelection.qty || 0
        )
      )
    : 0;

}

function getGiftRuleSelectedCount(
  ruleId
){

  const ruleSelection =
    getGiftRuleSelection(
      ruleId
    );

  return Object.values(
    ruleSelection

    (

      selection
    ) =>
      sum +

        0,
        Number(
          selection.qty || 0
        )
      ),
    0
  );

}

function toggleSimpleCheckoutGift(
  checkbox
){

  const campaignId =
    normalizeGiftId(
      checkbox.dataset
        .simpleGiftCampaignId
    );

  const giftItemId =
    normalizeGiftId(
      checkbox.dataset
        .simpleGiftItemId
    );

  const campaign =
    findSimpleGiftCampaign(
      campaignId
    );

  if(!campaign){

    checkbox.checked = false;

    return;
  }

  const item =
    findSimpleGiftItem(
      campaign,
      giftItemId
    );

  if(!item){

    checkbox.checked = false;

    return;
  }

  const selection =
    getSimpleGiftCampaignSelection(
      campaignId
    );

  const maxSelect =
    Math.max(
      1,
      Number(
        campaign.max_select || 1
      )
    );

  if(checkbox.checked){

    if(
      Object.keys(
        selection
      ).length >=
      maxSelect
    ){

      checkbox.checked = false;

      alert(
        `เลือกของแถมได้สูงสุด ${maxSelect} ชิ้น`
      );

      return;
    }

    selection[
      giftItemId
    ] = {

      gift_item_id:
        giftItemId,

      character_id:
        ""

    };

  }else{

    delete selection[
      giftItemId
    ];

  }

  refreshSimpleGiftItemUI(
    campaign,
    item
  );

  refreshSimpleGiftCampaignCount(
    campaign
  );

}

</div>

</div>

`;

}


function escapeJsValue(
  value
){

  return String(
    value || ""
  )
    .replaceAll(
      "\\",
      "\\\\"
    )
    .replaceAll(
      "'",
      "\\'"
    )
    .replaceAll(
      "\r",
      "\\r"
    )
    .replaceAll(
      "\n",
      "\\n"
    );

}


function findGiftRule(
  ruleId
){

  const normalizedRuleId =
    normalizeGiftId(
      ruleId
    );

  for(
    const campaign
    of checkoutGiftState
      .eligibleCampaigns
  ){

    const rule =
      campaign.rules.find(
        item =>

          normalizeGiftId(
            item.rule_id
          ) ===
          normalizedRuleId

      );

    if(rule){

      return {
        campaign,
        rule
      };

    }

  }

  return null;

}


function findGiftItemInRule(
  rule,
  giftItemId
){

  const normalizedGiftItemId =
    normalizeGiftId(
      giftItemId
    );

  return rule.items.find(
    item =>

      normalizeGiftId(
        item.gift_item_id
      ) ===
      normalizedGiftItemId

  ) || null;

}


function toggleCheckoutGiftItem(
  checkbox
){

  const ruleId =
    checkbox.dataset
      .giftCheckboxRule;

  const giftItemId =
    checkbox.dataset
      .giftCheckboxItem;

  const found =
    findGiftRule(
      ruleId
    );

  if(!found){

    checkbox.checked = false;

    return;
  }

  const maxSelect =
    Math.max(
      1,
      Number(
        found.rule.max_select || 1
      )
    );

  const selectedCount =
    getGiftRuleSelectedCount(
      ruleId
    );

  if(
    checkbox.checked &&
    selectedCount >= maxSelect
  ){

    checkbox.checked = false;

    alert(
      `Rule นี้เลือกของแถมได้สูงสุด ${maxSelect} ชิ้น`
    );

    return;
  }

  setCheckoutGiftItemQty(
    ruleId,
    giftItemId,
    checkbox.checked
      ? 1
      : 0
  );

}


function changeCheckoutGiftQty(
  ruleId,
  giftItemId,
  change
){

  const found =
    findGiftRule(
      ruleId
    );

  if(!found){
    return;
  }

  const maxSelect =
    Math.max(
      1,
      Number(
        found.rule.max_select || 1
      )
    );

  const currentQty =
    getGiftItemSelectionQty(
      ruleId,
      giftItemId
    );

  const nextQty =
    Math.max(
      0,
      currentQty +
      Number(change || 0)
    );

  const selectedWithoutCurrent =
    getGiftRuleSelectedCount(
      ruleId
    ) -
    currentQty;

  if(
    nextQty +
    selectedWithoutCurrent >
    maxSelect
  ){

    alert(
      `Rule นี้เลือกของแถมได้สูงสุด ${maxSelect} ชิ้น`
    );

    return;
  }

  setCheckoutGiftItemQty(
    ruleId,
    giftItemId,
    nextQty
  );

}


function setCheckoutGiftItemQty(
  ruleId,
  giftItemId,
  qty
){

  const found =
    findGiftRule(
      ruleId
    );

  if(!found){
    return;
  }

  const item =
    findGiftItemInRule(
      found.rule,
      giftItemId
    );

  if(!item){
    return;
  }

  const normalizedRuleId =
    normalizeGiftId(
      ruleId
    );

  const normalizedGiftItemId =
    normalizeGiftId(
      giftItemId
    );

  const ruleSelection =
    getGiftRuleSelection(
      normalizedRuleId
    );

  const normalizedQty =
    Math.max(
      0,
      Math.floor(
        Number(qty || 0)
      )
    );

  if(normalizedQty <= 0){

    delete ruleSelection[
      normalizedGiftItemId
    ];

  }else{

    const previous =
      ruleSelection[
        normalizedGiftItemId
      ] || {};

    ruleSelection[
      normalizedGiftItemId
    ] = {
      qty:
        normalizedQty,
      characters:
        Array.isArray(
          previous.characters
        )
          ? previous.characters.slice(
              0,
              normalizedQty
            )
          : []
    };

  }

  refreshGiftItemUI(
    found.rule,
    item
  );

  refreshGiftRuleUI(
    found.rule
  );

}


function refreshAllGiftRuleUI(){

  checkoutGiftState
    .eligibleCampaigns
    .forEach(
      campaign =>

        campaign.rules.forEach(
          rule => {

            rule.items.forEach(
              item =>
                refreshGiftItemUI(
                  rule,
                  item
                )
            );

            refreshGiftRuleUI(
              rule
            );

          }
        )

    );

}


function refreshGiftRuleUI(
  rule
){

  const ruleId =
    normalizeGiftId(
      rule.rule_id
    );

  const countBox =
    document.querySelector(
      `[data-gift-count-for="${CSS.escape(
        ruleId
      )}"]`
    );

  if(!countBox){
    return;
  }

  const selectedCount =
    getGiftRuleSelectedCount(
      ruleId
    );

  const maxSelect =
    Math.max(
      1,
      Number(
        rule.max_select || 1
      )
    );

  countBox.textContent =
    `เลือกแล้ว ${selectedCount} / ${maxSelect}`;

  countBox.style.color =
    selectedCount > maxSelect
      ? "#be123c"
      : "#2563eb";

}


function refreshGiftItemUI(
  rule,
  item
){

  const ruleId =
    normalizeGiftId(
      rule.rule_id
    );

  const giftItemId =
    normalizeGiftId(
      item.gift_item_id
    );

  const qty =
    getGiftItemSelectionQty(
      ruleId,
      giftItemId
    );

  const row =
    document.querySelector(
      `[data-gift-row="${CSS.escape(
        giftItemId
      )}"]`
    );

  if(row){

    row.classList.toggle(
      "selected",
      qty > 0
    );

  }

  const checkbox =
    document.querySelector(
      `[data-gift-checkbox-rule="${CSS.escape(
        ruleId
      )}"][data-gift-checkbox-item="${CSS.escape(
        giftItemId
      )}"]`
    );

  if(checkbox){

    checkbox.checked =
      qty > 0;

  }

  const qtyBox =
    document.querySelector(
      `[data-gift-qty-for="${CSS.escape(
        ruleId +
        "::" +
        giftItemId
      )}"]`
    );

  if(qtyBox){

    qtyBox.textContent =
      String(qty);

  }

  renderGiftCharacterSelectors(
    rule,
    item,
    qty
  );

}


function renderGiftCharacterSelectors(
  rule,
  item,
  quantity
){

  const giftItemId =
    normalizeGiftId(
      item.gift_item_id
    );

  const box =
    document.querySelector(
      `[data-gift-character-box="${CSS.escape(
        giftItemId
      )}"]`
    );

  if(!box){
    return;
  }

  const characters =
    getCharactersForGiftItem(
      giftItemId
    );

  if(
    quantity <= 0 ||
    !characters.length
  ){

    box.innerHTML = "";

    return;
  }

  const selection =
    getGiftRuleSelection(
      rule.rule_id
    )[
      giftItemId
    ];

  const selectedCharacters =
    selection &&
    Array.isArray(
      selection.characters
    )
      ? selection.characters
      : [];

  let html = "";

  for(
    let index = 0;
    index < quantity;
    index++
  ){

    html += `

<div
class="gift-character-title"
>
เลือกตัวละครสำหรับชิ้นที่
${index + 1}
</div>

<div class="gift-char-list">

`;

    characters.forEach(
      character => {

        const characterId =
          normalizeGiftId(
            character.character_id
          );

        const checked =
          normalizeGiftId(
            selectedCharacters[
              index
            ]
          ) ===
          characterId;

        const characterImage =
          String(
            character.character_image ||
            character.image ||
            ""
          ).trim();

        html += `

<label class="gift-char-item">

<input
type="radio"
name="gift-character-${escapeHtml(
  rule.rule_id +
  "-" +
  giftItemId +
  "-" +
  index
)}"
value="${escapeHtml(
  characterId
)}"
${
  checked
    ? " checked"
    : ""
}
onchange="
selectCheckoutGiftCharacter(
'${escapeJsValue(
  rule.rule_id
)}',
'${escapeJsValue(
  giftItemId
)}',
${index},
this.value
)
"
>

${
  characterImage
    ? `

<img
class="gift-char-image"
src="${escapeHtml(
  characterImage
)}"
alt=""
>

`
    : ""
}

<span>
${escapeHtml(
  character.character_name ||
  characterId
)}
</span>

</label>

`;

      }
    );

    html += `

</div>

`;

  }

  box.innerHTML =
    html;

}


function selectCheckoutGiftCharacter(
  ruleId,
  giftItemId,
  itemIndex,
  characterId
){

  const ruleSelection =
    getGiftRuleSelection(
      ruleId
    );

  const itemSelection =
    ruleSelection[
      normalizeGiftId(
        giftItemId
      )
    ];

  if(!itemSelection){
    return;
  }

  if(
    !Array.isArray(
      itemSelection.characters
    )
  ){

    itemSelection.characters = [];

  }

  itemSelection.characters[
    Number(itemIndex)
  ] =
    normalizeGiftId(
      characterId
    );

}

function validateCheckoutGiftSelections(){

  for(
    const campaign
    of checkoutGiftState
      .eligibleCampaigns
  ){

    const campaignId =
      normalizeGiftId(
        campaign.campaign_id
      );

    const selection =
      getSimpleGiftCampaignSelection(
        campaignId
      );

    const selectedIds =
      Object.keys(
        selection
      );

    const maxSelect =
      Math.max(
        1,
        Number(
          campaign.max_select || 1
        )
      );

    if(
      selectedIds.length >
      maxSelect
    ){

      alert(
        `เลือกของแถมได้สูงสุด ${maxSelect} ชิ้น`
      );

      return false;
    }

    for(
      const giftItemId
      of selectedIds
    ){

      const item =
        findSimpleGiftItem(
          campaign,
          giftItemId
        );

      if(!item){
        continue;
      }

      if(
        !normalizeGiftBoolean(
          item.has_character
        )
      ){
        continue;
      }

      const characterId =
        normalizeGiftId(
          selection[
            giftItemId
          ].character_id
        );

      if(!characterId){

        alert(
          `กรุณาเลือกตัวละครของ ${item.gift_name || "ของแถม"}`
        );

        return false;
      }

    }

  }

  return true;

}

function collectCheckoutGiftSelections(){

  const gifts = [];

  checkoutGiftState
    .eligibleCampaigns
    .forEach(
      campaign=>{

        const campaignId =
          normalizeGiftId(
            campaign.campaign_id
          );

        const selection =
          getSimpleGiftCampaignSelection(
            campaignId
          );

        const entitlementRule =
          campaign.highest_rule ||
          {};

        Object.entries(
          selection
        ).forEach(
          ([
            giftItemId,
            selected
          ])=>{

            const item =
              findSimpleGiftItem(
                campaign,
                giftItemId
              );

            if(!item){
              return;
            }

            const characterId =
              normalizeGiftId(
                selected.character_id
              );

            const characters =
              getCharactersForGiftItem(
                giftItemId
              );

            const character =
              characters.find(
                row=>

                  normalizeGiftId(
                    row.character_id
                  ) ===
                  characterId
              );

            gifts.push({

              campaign_id:
                campaignId,

              campaign_name:
                campaign.campaign_name ||
                "",

              /*
              Rule จริงที่ Gift Item อยู่
              */
              rule_id:
                normalizeGiftId(
                  item.rule_id
                ),

              /*
              Rule สูงสุดที่มอบจำนวนสิทธิ์รวม
              */
              entitlement_rule_id:
                normalizeGiftId(
                  entitlementRule.rule_id
                ),

              temporary_simple_gift:
                true,

              gift_item_id:
                normalizeGiftId(
                  item.gift_item_id
                ),

              gift_id:
                normalizeGiftId(
                  item.gift_item_id
                ),

              gift_name:
                item.gift_name ||
                "",

              character_id:
                characterId,

              character_name:
                character
                  ? character.character_name ||
                    ""
                  : "",

              collection_id:
                normalizeGiftId(
                  campaign.collection_id
                )

            });

          }
        );

      }
    );

  return gifts;

}
  
function goPayment(){

  if(checkoutSubmitting){
    return;
  }

  const addressData =
    window.checkoutAddress;

  if(!cart.length){

    showCheckoutMessage(
      "ไม่มีสินค้าในรายการสั่งซื้อ",
      true
    );

    return;

  }

  if(!addressData){

    showCheckoutMessage(
      "กรุณาเลือกที่อยู่จัดส่งก่อน",
      true
    );

    return;

  }

  if(
    !addressData.receiver ||
    !addressData.phone ||
    !addressData.address ||
    !addressData.province ||
    !addressData.postcode
  ){

    showCheckoutMessage(
      "ข้อมูลที่อยู่จัดส่งไม่ครบ กรุณาเลือกหรือแก้ไขที่อยู่ใหม่",
      true
    );

    return;

  }

  if(
    !validateCheckoutGiftSelections()
  ){
    return;
  }

  checkoutSubmitting = true;
  setCheckoutLoading(true);

  try{

    const gifts =
      collectCheckoutGiftSelections();

   const checkoutData = {

  ...addressData,

  email:
    addressData.email ||
    customer.email ||
    "",

  gifts:
    gifts

};
    window.checkoutAddress =
      checkoutData;

    localStorage.setItem(
      "checkoutAddress",
      JSON.stringify(
        checkoutData
      )
    );

    window.location.href =
      "payment.html";

  }catch(error){

    console.error(
      "goPayment error:",
      error
    );

    checkoutSubmitting = false;
    setCheckoutLoading(false);

    showCheckoutMessage(
      error.message ||
      "เตรียมข้อมูลชำระเงินไม่สำเร็จ",
      true
    );

  }

}


function setCheckoutLoading(
  loading
){

  const button =
    document.getElementById(
      "checkoutPaymentButton"
    );

  if(!button){
    return;
  }

  button.disabled =
    Boolean(loading);

  button.textContent =
    loading
      ? "⏳ กำลังดำเนินการ..."
      : "ไปชำระเงิน";

}


function updateCheckoutPaymentState(){

  const button =
    document.getElementById(
      "checkoutPaymentButton"
    );

  if(!button){
    return;
  }

  const canContinue =
    cart.length > 0 &&
    Boolean(
      window.checkoutAddress
    );

  button.disabled =
    !canContinue ||
    checkoutSubmitting;

}


function updateCheckoutCartCount(){

  let normalCart = [];

  try{

    const stored =
      JSON.parse(
        localStorage.getItem(
          "cart"
        ) || "[]"
      );

    normalCart =
      Array.isArray(stored)
        ? stored
        : [];

  }catch(error){

    normalCart = [];

  }

  const count =
    normalCart.reduce(
      (sum,item)=>
        sum +
        Number(item.qty || 0),
      0
    );

  const box =
    document.getElementById(
      "checkoutCartCount"
    );

  if(box){

    box.textContent =
      count > 99
        ? "99+"
        : String(count);

  }

}


function getCheckoutStoredValue(
  key,
  fallback
){

  try{

    const raw =
      localStorage.getItem(key);

    if(raw === null){

      return fallback;

    }

    return JSON.parse(raw);

  }catch(error){

    console.warn(
      "อ่าน localStorage ไม่สำเร็จ:",
      key,
      error
    );

    return fallback;

  }

}


function normalizeCheckoutBoolean(
  value
){

  return (
    value === true ||
    value === 1 ||
    [
      "true",
      "yes",
      "1",
      "default",
      "active"
    ].includes(
      String(
        value || ""
      )
        .trim()
        .toLowerCase()
    )
  );

}


let checkoutMessageTimer = null;

function showCheckoutMessage(
  message,
  error
){

  const box =
    document.getElementById(
      "checkoutMessage"
    );

  if(!box){
    return;
  }

  box.textContent =
    String(message || "");

  box.classList.toggle(
    "error",
    Boolean(error)
  );

  box.classList.add(
    "show"
  );

  clearTimeout(
    checkoutMessageTimer
  );

  checkoutMessageTimer =
    setTimeout(
      ()=>{

        box.classList.remove(
          "show"
        );

      },
      2600
    );

}


function goCheckoutBack(){

  if(
    document.referrer &&
    document.referrer !==
    window.location.href
  ){

    history.back();

  }else{

    window.location.href =
      "cart.html";

  }

}
