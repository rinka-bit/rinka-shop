<script>

const API =
"https://script.google.com/macros/s/AKfycbxKjVvn8AXrK0wDvKqN-A9yS2Vk8R-w25ar1b9ftiIdUgUvFaShunLnFnAyIDuaTWj76w/exec";

let cart = [];

loadCheckout();

function loadCheckout(){

  const checkoutSource =
    localStorage.getItem(
      "checkoutSource"
    );

  const buyNowCart =
    JSON.parse(
      localStorage.getItem(
        "buyNowCart"
      ) || "[]"
    );

  const checkoutCart =
    JSON.parse(
      localStorage.getItem(
        "checkoutCart"
      ) || "[]"
    );

  const normalCart =
    JSON.parse(
      localStorage.getItem(
        "cart"
      ) || "[]"
    );

  if(
    checkoutSource === "buyNow" &&
    Array.isArray(buyNowCart) &&
    buyNowCart.length
  ){

    cart =
      buyNowCart;

    console.log(
      "CHECKOUT SOURCE:",
      "buyNowCart"
    );

  }
  else if(
    checkoutSource === "cart" &&
    Array.isArray(checkoutCart) &&
    checkoutCart.length
  ){

    cart =
      checkoutCart;

    console.log(
      "CHECKOUT SOURCE:",
      "checkoutCart"
    );

  }
  else if(
    Array.isArray(checkoutCart) &&
    checkoutCart.length
  ){

    cart =
      checkoutCart;

    console.log(
      "CHECKOUT SOURCE:",
      "checkoutCart fallback"
    );

  }
  else if(
    Array.isArray(buyNowCart) &&
    buyNowCart.length
  ){

    cart =
      buyNowCart;

    console.log(
      "CHECKOUT SOURCE:",
      "buyNowCart fallback"
    );

  }
  else if(
    Array.isArray(normalCart)
  ){

    cart =
      normalCart;

    console.log(
      "CHECKOUT SOURCE:",
      "cart fallback"
    );

  }
  else{

    cart = [];

  }

  console.log(
    "CHECKOUT CART:",
    cart
  );

  renderItems();

  loadDefaultAddress();

  loadGifts();

}

async function loadDefaultAddress(){

let selectedAddress =
JSON.parse(
localStorage.getItem(
"selectedCheckoutAddress"
) || "null"
);

if(!selectedAddress){

const response =
await fetch(
API +
"?action=customerAddresses&email=" +
encodeURIComponent(
customer.email
)
);

const addresses =
await response.json();

selectedAddress =
addresses.find(
a => a.is_default
) || addresses[0];

}

if(!selectedAddress){

document.getElementById(
"selectedAddress"
).innerHTML =
"ยังไม่มีที่อยู่จัดส่ง กรุณาเพิ่มที่อยู่ก่อน";

return;

}

window.checkoutAddress =
selectedAddress;

document.getElementById(
"selectedAddress"
).innerHTML = `

<div
style="

border-radius:12px;
background:#f8fbff;

">

${selectedAddress.receiver}

<br>

${selectedAddress.address}

<br>

${selectedAddress.subdistrict}
${selectedAddress.district}

${selectedAddress.province}

</div>

`;

}
  
function renderItems(){

let html = "";
let total = 0;

cart.forEach(item=>{

const qty =

total +=
price * qty;

const optionText =

item.selected_options

?

Object.entries(
item.selected_options
)

.map(
([k,v])=>

`${k}: ${
Array.isArray(v)
? v.join(", ")

}`

"";

html += `

style="

border:1px solid #eee;

font-weight:700;

style="
font-size:13px;

${qty}

document
.getElementById(
"items"
)
.innerHTML =
html;

.getElementById(
"total"

function escapeHtml(
  value
){

  return String(
    value || ""
  )
    .replaceAll(
      "&",
      "&amp;"
    )
    .replaceAll(
      "<",
      "&lt;"
    )
    .replaceAll(
      ">",
      "&gt;"
    )
    .replaceAll(
      '"',
      "&quot;"
    )
    .replaceAll(
      "'",
      "&#039;"
    );

}

function getSelectedGiftCharacter(
  giftId,
  itemIndex
){

  const radioName =
    `gift-char-${giftId}-${itemIndex}`;

  const selectedCharacter =
    document.querySelector(
      `input[name="${CSS.escape(
        radioName
      )}"]:checked`
    );

  console.log(

"SELECTED",

giftId,

itemIndex,

selectedCharacter

);

  return selectedCharacter
    ? selectedCharacter.value
    : "";

}

function validateSameGiftCharacters(
  giftId,
  quantity,
  maxSameCharacter
){

  quantity =
    Math.max(
      0,
      Number(
        quantity || 0
      )
    );

  maxSameCharacter =
    Math.max(
      0,
      Number(
        maxSameCharacter || 0
      )
    );


  if(
    quantity <= 1 ||
    maxSameCharacter <= 0
  ){

    return true;

  }


  const characterCounts = {};


  for(
    let itemIndex = 0;
    itemIndex < quantity;
    itemIndex++
  ){

    const characterName =
      getSelectedGiftCharacter(

        giftId,

        itemIndex

      );


    if(!characterName){

      continue;

    }


    if(
      !characterCounts[
        characterName
      ]
    ){

      characterCounts[
        characterName
      ] = 0;

    }


    characterCounts[
      characterName
    ]++;


    if(
      characterCounts[
        characterName
      ] >
      maxSameCharacter
    ){

      alert(

        maxSameCharacter === 1

          ? "ของแถมรายการนี้ไม่สามารถเลือกตัวละครซ้ำกันได้"

          : `ตัวละครเดียวกันเลือกซ้ำได้สูงสุด ${maxSameCharacter} ชิ้น`

      );

      return false;

    }

  }


  return true;

}

function validateGiftCharacterLimits(
  gifts
){

  const characterGroups = {};


  gifts.forEach(gift=>{

    const characterName =
      String(
        gift.character_name || ""
      ).trim();


    if(!characterName){

      return;

    }


    const maxSameCharacter =
      Math.max(
        0,
        Number(
          gift.max_same_character || 0
        )
      );


    if(maxSameCharacter <= 0){

      return;

    }


    const groupKey =

      String(
        gift.collection_id || ""
      ).trim()

      +

      "::"

      +

      String(
        gift.tier_name || ""
      )
        .trim()
        .toLowerCase()

      +

      "::"

      +

      characterName;


    if(
      !characterGroups[
        groupKey
      ]
    ){

      characterGroups[
        groupKey
      ] = {

        characterName:
          characterName,

        tierName:
          gift.tier_name || "",

        count:
          0,

        limit:
          maxSameCharacter

      };

    }


    const group =
      characterGroups[
        groupKey
      ];


    group.count++;


    /*
    ถ้าของใน Tier เดียวกันตั้งค่าไม่เท่ากัน
    ให้ใช้ค่าที่เข้มงวดที่สุด
    */

    group.limit =
      Math.min(

        group.limit,

        maxSameCharacter

      );

  });


  for(
    const groupKey
    in characterGroups
  ){

    const group =
      characterGroups[
        groupKey
      ];


    if(
      group.count >
      group.limit
    ){

      alert(

        group.limit === 1

          ? `ของแถม ${group.tierName} ไม่สามารถเลือกตัวละคร ${group.characterName} ซ้ำกันได้`

          : `ของแถม ${group.tierName} เลือกตัวละคร ${group.characterName} ได้สูงสุด ${group.limit} ชิ้น`

      );

      return false;

    }

  }


  return true;

}  

function createGiftSelectionData(
  element,
  characterName
){

  const maxSameCharacterValue =
    Number(
      element.dataset
        .maxSameCharacter || 0
    );

  return {

    gift_id:
      element.dataset.giftId ||
      element.value ||
      "",

    tier_name:
      element.dataset.tierName ||
      "",

    collection_id:
      element.dataset.collectionId ||
      "",

    character_name:
      characterName || "",

    max_same_character:
      Number.isFinite(
        maxSameCharacterValue
      )
        ? Math.max(
            0,
            maxSameCharacterValue
          )
        : 0

  };

}

  function isGiftElementActive(
  element
){

  const tierCard =
    element.closest(
      ".gift-tier-card"
    );


  if(!tierCard){

    return true;

  }


  return String(
    tierCard.dataset
      .redemptionActive ||
    "yes"
  ) !== "no";

}

function goPayment(){

  /*
  =========================
  ตรวจสอบที่อยู่จัดส่ง
  =========================
  */

  const addressData =
    window.checkoutAddress;


  if(!addressData){

    alert(
      "กรุณาเลือกที่อยู่จัดส่งก่อน"
    );

    return;

  }


  if(
    !addressData.receiver ||
    !addressData.phone ||
    !addressData.address ||
    !addressData.province ||
    !addressData.postcode
  ){

    alert(
      "ข้อมูลที่อยู่จัดส่งไม่ครบ กรุณาเลือกหรือแก้ไขที่อยู่ใหม่"
    );

    return;

  }


  /*
  =========================
  ตรวจสิทธิ์ของแถมก่อนรวบรวม
  =========================
  */

  if(
    !validateGiftRedemption(
      true
    )
  ){

    return;

  }


  const gifts = [];


  /*
  =========================
  ของแถมแบบ Quantity
  =========================
  */

  const quantityInputs =
    document.querySelectorAll(
      ".gift-quantity"
    );


  for(
    const quantityInput
    of quantityInputs
  ){

    if(
      !isGiftElementActive(
        quantityInput
      )
    ){

      continue;

    }


    const giftId =
      String(
        quantityInput.dataset
          .giftId || ""
      ).trim();


    const quantity =
      Math.max(
        0,
        Number(
          quantityInput.value || 0
        )
      );


    if(
      !giftId ||
      quantity <= 0
    ){

      continue;

    }


    const characters =
      giftCharacterMap[
        giftId
      ] || [];


    const maxSameCharacter =
      Math.max(
        0,
        Number(
          quantityInput.dataset
            .maxSameCharacter || 0
        )
      );


    if(
      characters.length &&
      !validateSameGiftCharacters(

        giftId,

        quantity,

        maxSameCharacter

      )
    ){

      return;

    }


    for(
      let itemIndex = 0;
      itemIndex < quantity;
      itemIndex++
    ){

      let characterName = "";


      if(characters.length){

        characterName =
          getSelectedGiftCharacter(

            giftId,

            itemIndex

          );


        if(!characterName){

          alert(
            `กรุณาเลือกตัวละครของของแถมชิ้นที่ ${itemIndex + 1} ให้ครบ`
          );

          return;

        }

      }


      gifts.push(

        createGiftSelectionData(

          quantityInput,

          characterName

        )

      );

    }

  }


  /*
  =========================
  ของแถมแบบ Checkbox
  =========================
  */

  const checkedGiftBoxes =
    document.querySelectorAll(
      ".gift-checkbox:checked"
    );


  for(
    const checkbox
    of checkedGiftBoxes
  ){

    if(
      !isGiftElementActive(
        checkbox
      )
    ){

      continue;

    }


    const giftId =
      String(
        checkbox.dataset.giftId ||
        checkbox.value ||
        ""
      ).trim();


    if(!giftId){

      continue;

    }


    const characters =
      giftCharacterMap[
        giftId
      ] || [];


    let characterName = "";


    if(characters.length){

      characterName =
        getSelectedGiftCharacter(

          giftId,

          0

        );


      if(!characterName){

        alert(
          "กรุณาเลือกตัวละครของของแถมให้ครบ"
        );

        return;

      }

    }


    gifts.push(

      createGiftSelectionData(

        checkbox,

        characterName

      )

    );

  }


  /*
  =========================
  ของแถมแบบ Fixed Set
  =========================
  */

  const fixedGiftInputs =
    document.querySelectorAll(
      ".gift-fixed"
    );


  for(
    const fixedInput
    of fixedGiftInputs
  ){

    if(
      !isGiftElementActive(
        fixedInput
      )
    ){

      continue;

    }


    const giftId =
      String(
        fixedInput.dataset
          .giftId || ""
      ).trim();


    if(!giftId){

      continue;

    }


    const characters =
      giftCharacterMap[
        giftId
      ] || [];


    let characterName = "";


    if(characters.length){

      characterName =
        getSelectedGiftCharacter(

          giftId,

          0

        );


      if(!characterName){

        alert(
          "กรุณาเลือกตัวละครของของแถมแบบเซ็ตให้ครบ"
        );

        return;

      }

    }


    gifts.push(

      createGiftSelectionData(

        fixedInput,

        characterName

      )

    );

  }


  /*
  =========================
  ตรวจจำนวนคาร์ซ้ำรวมทั้ง Tier
  =========================
  */

  if(
    !validateGiftCharacterLimits(
      gifts
    )
  ){

    return;

  }


  /*
  =========================
  ตัดข้อมูลภายในที่ไม่ต้องส่ง
  =========================
  */

  const cleanGifts =
    gifts.map(gift=>({

      gift_id:
        gift.gift_id,

      tier_name:
        gift.tier_name,

      collection_id:
        gift.collection_id,

      character_name:
        gift.character_name

    }));


  /*
  =========================
  เตรียมข้อมูลไปหน้า Payment
  =========================
  */

  const checkoutData = {

    ...addressData,

    email:
      addressData.email ||
      customer.email ||
      "",

    gifts:
      cleanGifts

  };


  console.log(
    "CHECKOUT GIFTS",
    cleanGifts
  );


  window.checkoutAddress =
    checkoutData;


  localStorage.setItem(

    "checkoutAddress",

    JSON.stringify(
      checkoutData
    )

  );


  window.location.href =
    "payment.html";

}
  
function getCollectionTotals(){

  const collectionTotals = {};

  cart.forEach(item=>{

    const collectionId =
      String(
        item.collection_id || ""
      ).trim();

    if(!collectionId){

      console.warn(
        "สินค้าไม่มี collection_id",
        item
      );

      return;

    }

    if(
      !collectionTotals[
        collectionId
      ]
    ){

      collectionTotals[
        collectionId
      ] = 0;

    }

    collectionTotals[
      collectionId
    ] +=

      Number(
        item.price || 0
      )

      *

      Number(
        item.qty || 0
      );

  });

  return collectionTotals;

}

async function fetchGiftRules(
  collectionId,
  total
){

  const response =
    await fetch(

      API +

      "?action=giftRules" +

      "&collection_id=" +

      encodeURIComponent(
        collectionId
      ) +

      "&total=" +

      encodeURIComponent(
        total
      )

    );

  const result =
    await response.json();

  console.log(
    "GIFT RULE RESPONSE",
    collectionId,
    total,
    result
  );

  if(
    Array.isArray(result)
  ){

    return result;

  }

  if(
    Array.isArray(
      result.rules
    )
  ){

    return result.rules;

  }

  if(
    Array.isArray(
      result.giftRules
    )
  ){

    return result.giftRules;

  }

  return [];

}

      "?action=gifts" +

  }

  if(

    )
  ){

  }

}
  
function normalizeGiftBoolean(
  value
){

  if(
    value === true ||
    value === 1
  ){

    return true;

  }

  const normalizedValue =
    String(
      value || ""
    )
      .trim()
      .toLowerCase();

  return [

    "yes",

    "true",

    "1",

    "active"

  ].includes(
    normalizedValue
  );

}


function getGiftSelectionMode(
  rule
){

  const selectionMode =
    String(
      rule.selection_mode ||
      "checkbox"
    )
      .trim()
      .toLowerCase();

  if(
    selectionMode ===
      "quantity" ||
    selectionMode ===
      "fixed_set"
  ){

    return selectionMode;

  }

  return "checkbox";

}

  giftId
){

  return `

<div
id="gift-char-${escapeHtml(
  giftId
)}"
class="gift-char-box"
style="
display:none;
margin-top:8px;
">
</div>

`;

}

function renderCheckboxGift(
  gift,
  rule,
  collectionId,
  tierKey
){

  const giftId =
    String(
      gift.gift_id || ""
    ).trim();


  const hasCharacterSelect =
    normalizeGiftBoolean(
      gift.has_character_select
    );


  const maxSameCharacterValue =
    Number(
      gift.max_same_character
    );


  const maxSameCharacter =
    hasCharacterSelect

      ? (
          Number.isFinite(
            maxSameCharacterValue
          )

            ? Math.max(
                1,
                maxSameCharacterValue
              )

            : 1
        )

      : 0;


  return `

<div
class="gift-item"
data-selection-mode="checkbox"
style="
display:flex;
align-items:flex-start;
gap:12px;
padding:10px;
margin-bottom:10px;
border:1px solid #eee;
border-radius:12px;
"
>

<img
src="${escapeHtml(
  gift.gift_image || ""
)}"
style="
width:60px;
height:60px;
object-fit:cover;
border-radius:8px;
"
alt=""
>

<div
style="
flex:1;
"
>

<div>

${escapeHtml(
  gift.gift_name || ""
)}

</div>

${createGiftCharacterBox(
  giftId
)}

</div>

<input
type="checkbox"

async function loadAllGiftCharacters(){

  const giftElements =
    document.querySelectorAll(

      ".gift-checkbox," +

      ".gift-quantity," +

      ".gift-fixed"

    );


  const loadedGiftIds =
    new Set();


  for(
    const element of giftElements
  ){

    const giftId =
      String(
        element.dataset.giftId || ""
      ).trim();


    if(
      !giftId ||
      loadedGiftIds.has(
        giftId
      )
    ){

      continue;

    }


    loadedGiftIds.add(
      giftId
    );


    await loadGiftCharacters(
      giftId
    );

  }

}

function validateGiftRedemption(
  showAlert = true
){

  const tierCards =
    Array.from(
      document.querySelectorAll(
        ".gift-tier-card"
      )
    );


  for(
    const tierCard
    of tierCards
  ){

    const isActive =
      String(
        tierCard.dataset
          .redemptionActive ||
        "yes"
      ) !== "no";


    const tierName =
      String(
        tierCard.dataset
          .tierName ||
        ""
      ).trim();


    const tierKey =
      String(
        tierCard.dataset
          .tierKey ||
        ""
      ).trim();


    const selectionMode =
      String(
        tierCard.dataset
          .selectionMode ||
        "checkbox"
      )
        .trim()
        .toLowerCase();


    const maxSelect =
      Math.max(
        0,
        Number(
          tierCard.dataset.max ||
          0
        )
      );


    /*
    Tier ที่ถูกปิดเพราะเลือก
    แลกสิทธิ์ลง Tier ต่ำกว่า
    ต้องไม่มีรายการที่ถูกเลือกค้างอยู่
    */

    if(!isActive){

      const selectedCount =
        getGiftTierSelectedCount(
          tierKey
        );


      if(
        selectedCount > 0
      ){

        if(showAlert){

          alert(
            `ไม่สามารถเลือกของแถม ${tierName} ได้ เนื่องจากเลือกแลกสิทธิ์เป็น Tier ต่ำกว่าแล้ว`
          );

        }

        return false;

      }


      continue;

    }


    /*
    Fixed Set ได้รับอัตโนมัติ
    ไม่ต้องตรวจจำนวนการเลือก
    */

    if(
      selectionMode ===
      "fixed_set"
    ){

      continue;

    }


    const selectedCount =
      getGiftTierSelectedCount(
        tierKey
      );


    if(
      selectedCount >
      maxSelect
    ){

      if(showAlert){

        alert(
          `ของแถม ${tierName} เลือกได้สูงสุด ${maxSelect} ชิ้น`
        );

      }

      return false;

    }

  }


  return true;

}
  
function getGiftTierSelectedCount(
  tierKey
){

  let total = 0;

  document
    .querySelectorAll(
      ".gift-checkbox"
    )
    .forEach(checkbox=>{

      if(
        checkbox.dataset.tier === tierKey &&
        checkbox.checked
      ){

        total += 1;

      }

    });

  document
    .querySelectorAll(
      ".gift-quantity"
    )
    .forEach(input=>{

      if(
        input.dataset.tier === tierKey
      ){

        total +=
          Number(
            input.value || 0
          );

      }

    });

  return total;

}

function updateGiftTierCount(
  tierKey
){

  const tierCard =
    document.querySelector(
      `.gift-tier-card[data-tier-key="${CSS.escape(
        tierKey
      )}"]`
    );


  if(!tierCard){

    return;

  }

    );

    return;

  }


  const isActive =
    String(

    ) !== "no";


  if(!isActive){

    countBox.textContent =
      "เปลี่ยนสิทธิ์เป็นของแถม Tier ต่ำกว่าแล้ว";

    countBox.style.color =
      "#888";

    return;

  }


  const selectionMode =
    String(
      tierCard.dataset
        .selectionMode ||
      "checkbox"
    )
      .trim()
      .toLowerCase();


  if(
    selectionMode ===
    "fixed_set"
  ){

    countBox.textContent =
      "รับของแถมเซ็ตนี้อัตโนมัติ";

    countBox.style.color =
      "#4388aa";

    return;

  }


  const selectedCount =

      tierKey
    );


  const maxSelect =
    Math.max(

      Number(
        tierCard.dataset.max ||
        0
      )

  countBox.textContent =
    `เลือกแล้ว ${selectedCount} / ${maxSelect} ชิ้น`;

    Array.from(
      document.querySelectorAll(
        ".gift-tier-card"
      )
    )
    .filter(card=>

      String(
        card.dataset.collectionId || ""
      ).trim() ===
      collectionId

    );


  collectionTierCards.forEach(card=>{

    const defaultMax =
      Math.max(
        1,
        Number(
          card.dataset.defaultMax ||
          card.dataset.max ||
          1
        )
      );

    card.dataset.max =
      String(
        defaultMax
      );

    setGiftTierActiveState(
      card,
      true
    );

  });


  /*
  =========================
  ตรวจทุก Tier ที่เลือก
  แลกเป็น Tier ต่ำกว่า
  =========================
  */

  collectionTierCards.forEach(card=>{

    const redemptionChoice =
      String(
        card.dataset
          .redemptionChoice ||
        "current"
      )
        .trim()
        .toLowerCase();


    if(
      redemptionChoice !==
      "lower"
    ){

      return;

    }


    const lowerTierName =
      String(
        card.dataset
          .lowerTierName || ""
      ).trim();


    const lowerTierQuantity =
      Math.max(
        0,
        Number(
          card.dataset
            .lowerTierQuantity || 0
        )
      );


    const lowerTierCard =
      findGiftTierCard(

        collectionId,

        lowerTierName

      );


    if(
      !lowerTierCard ||
      lowerTierQuantity <= 0
    ){

      console.warn(
        "ไม่พบ Tier ต่ำกว่าสำหรับแลกสิทธิ์",
        {
          collectionId,
          lowerTierName,
          lowerTierQuantity
        }
      );

      card.dataset
        .redemptionChoice =
          "current";

      const currentRadio =
        card.querySelector(
          '.gift-redeem-radio[value="current"]'
        );

      if(currentRadio){

        currentRadio.checked =
          true;

      }

      return;

    }


    /*
    ปิด Tier ต้นทาง
    เช่น ปิด Tier 2
    */

    setGiftTierActiveState(
      card,
      false
    );


    /*
    กำหนดสิทธิ์ Tier ต่ำกว่าเป็นยอดรวมใหม่

    ตัวอย่าง:
    Tier 1 เดิมเลือกได้ 1
    แลกจาก Tier 2 แล้วเลือกได้รวม 2
    ไม่ใช่ 1 + 2 = 3
    */

    lowerTierCard.dataset.max =
      String(
        Math.max(
          Number(
            lowerTierCard.dataset.max ||
            0
          ),
          lowerTierQuantity
        )
      );

  });


  updateAllGiftTierCounts();

}
  
function toggleGiftCharacterBox(
  giftId,
  show
){

  const charBox =
    document.getElementById(
      `gift-char-${giftId}`
    );

  if(!charBox){

    return;

  }

  charBox.style.display =
    show
      ? "block"
      : "none";

  if(!show){

    charBox
      .querySelectorAll(
        "input"
      )
      .forEach(input=>{

        input.checked =
          false;

      });

  }

}

document.addEventListener(
  "change",
  e=>{

    if(
      !e.target.classList.contains(
        "gift-checkbox"
      )
    ){

      return;

    }

    const checkbox =
      e.target;

    const tierKey =
      checkbox.dataset.tier;


    /*
    ทดลองเลือกก่อน แล้วตรวจสิทธิ์รวม
    */

    if(
      checkbox.checked &&
      !validateGiftRedemption(
        false
      )
    ){

      checkbox.checked =
        false;

      alert(
        "เลือกของแถมเกินสิทธิ์ที่ได้รับ"
      );

    }


    renderGiftCharacterSelectors(

      checkbox.value,

      checkbox.checked
        ? 1
        : 0

    );


    updateAllGiftTierCounts();

  }
);

  document.addEventListener(
  "change",
  e=>{

    if(
      !e.target.classList.contains(
        "gift-redeem-radio"
      )
    ){

      return;

    }


    const radio =
      e.target;


    updateTierRedemptionChoice(

      radio.dataset.tierKey,

      radio.value

    );


    if(
      !validateGiftRedemption(
        false
      )
    ){

      const tierCard =
        radio.closest(
          ".gift-tier-card"
        );


      const currentRadio =
        tierCard
          ? tierCard.querySelector(
              '.gift-redeem-radio[value="current"]'
            )
          : null;


      if(currentRadio){

        currentRadio.checked =
          true;


        updateTierRedemptionChoice(

          currentRadio.dataset
            .tierKey,

          "current"

        );

      }


      alert(
        "ไม่สามารถเปลี่ยนรูปแบบการรับของแถมได้"
      );

    }

  }
);

  document.addEventListener(
  "click",
  e=>{

    const plusButton =
      e.target.closest(
        ".gift-qty-plus"
      );

    const minusButton =
      e.target.closest(
        ".gift-qty-minus"
      );

    if(
      !plusButton &&
      !minusButton
    ){

      return;

    }

    const button =
      plusButton ||
      minusButton;

    const giftId =
      button.dataset.giftId;

    const quantityInput =
      document.querySelector(
        `.gift-quantity[data-gift-id="${CSS.escape(
          giftId
        )}"]`
      );

    if(!quantityInput){

      return;

    }

    let quantity =
      Number(
        quantityInput.value || 0
      );

    if(plusButton){

  quantity++;

  quantityInput.value =
    quantity;


  if(
    !validateGiftRedemption(
      false
    )
  ){

    quantity--;

    quantityInput.value =
      quantity;

    alert(
      "เลือกของแถมเกินสิทธิ์ที่ได้รับ"
    );

    return;

  }

}

    if(minusButton){

      quantity =
        Math.max(
          0,
          quantity - 1
        );

    }

    quantityInput.value =
      quantity;

    const qtyLabel =
      document.getElementById(
        `gift-qty-${giftId}`
      );

    if(qtyLabel){

      qtyLabel.textContent =
        quantity;

    }

    renderGiftCharacterSelectors(
      giftId,
      quantity
    );

    updateAllGiftTierCounts();

  }
);

const giftCharacterMap = {};


function renderGiftCharacterSelectors(
  giftId,
  quantity
){

  const box =
    document.getElementById(
      `gift-char-${giftId}`
    );

  if(!box){

    return;

  }

  const chars =
    giftCharacterMap[
      giftId
    ] || [];

  quantity =
    Math.max(
      0,
      Number(
        quantity || 0
      )
    );

  if(
    !chars.length ||
    quantity <= 0
  ){

    box.innerHTML = "";

    box.style.display =
      "none";

    return;

  }


  const previousSelections = [];

  box
    .querySelectorAll(
      ".gift-character-group"
    )
    .forEach((group,index)=>{

      const selected =
        group.querySelector(
          "input[type='radio']:checked"
        );

      previousSelections[
        index
      ] =
        selected
          ? selected.value
          : "";

    });


  let html = "";

  for(
    let itemIndex = 0;
    itemIndex < quantity;
    itemIndex++
  ){

    const previousValue =
      previousSelections[
        itemIndex
      ] || "";

    html += `

<div
class="gift-character-group"
data-gift-id="${escapeHtml(
  giftId
)}"
data-item-index="${itemIndex}"
style="
margin-top:10px;
padding:10px;
border:1px solid #e5e5e5;
border-radius:10px;
"
>

<div
style="
font-size:13px;
font-weight:700;
margin-bottom:8px;
"
>

เลือกตัวละครสำหรับชิ้นที่
${itemIndex + 1}

</div>

`;

    chars.forEach(char=>{

      const characterName =
        String(
          char.character_name || ""
        );

      const checked =
        previousValue ===
        characterName;

      html += `

<label
class="gift-char-item"
style="
display:flex;
align-items:center;
gap:8px;
margin-bottom:6px;
cursor:pointer;
"
>

<input
type="radio"

name="gift-char-${escapeHtml(
  giftId
)}-${itemIndex}"

value="${escapeHtml(
  characterName
)}"

${checked ? "checked" : ""}
>

<div class="gift-char-name">

${escapeHtml(
  characterName
)}

</div>

</label>

`;

    });

    html += `

</div>

`;

  }

  box.innerHTML =
    html;

  box.style.display =
    "block";

}


async function loadGiftCharacters(
  giftId
){

  try{

    const response =
      await fetch(

        API +

        "?action=giftCharacters" +

        "&gift_id=" +

        encodeURIComponent(
          giftId
        )

      );

    const result =
      await response.json();

    const chars =
      Array.isArray(
        result
      )
        ? result
        : Array.isArray(
            result.characters
          )
            ? result.characters
            : [];

    console.log(
      "CHARS",
      giftId,
      chars
    );

    giftCharacterMap[
      giftId
    ] =
      chars;

    const quantityInput =
      document.querySelector(
        `.gift-quantity[data-gift-id="${CSS.escape(
          giftId
        )}"]`
      );

    const checkbox =
  document.querySelector(
    `.gift-checkbox[data-gift-id="${CSS.escape(
      giftId
    )}"]`
  );

const fixedInput =
  document.querySelector(
    `.gift-fixed[data-gift-id="${CSS.escape(
      giftId
    )}"]`
  );

let quantity = 0;

if(quantityInput){

  quantity =
    Number(
      quantityInput.value || 0
    );

}
else if(
  checkbox &&
  checkbox.checked
){

  quantity = 1;

}
else if(fixedInput){

  quantity = 1;

}

    renderGiftCharacterSelectors(
      giftId,
      quantity
    );

  }
  catch(error){

    console.error(
      "loadGiftCharacters error",
      giftId,
      error
    );

  }

}
  
</script>
