<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Checkout</title>

<link rel="stylesheet" href="style.css">

<style>

.container{
max-width:900px;
margin:auto;
padding:20px;
}

.card{
background:white;
padding:20px;
border-radius:12px;
margin-bottom:20px;
}

input,
textarea{
width:100%;
padding:10px;
margin:5px 0;
}

button{
padding:10px 20px;
cursor:pointer;
}

</style>

</head>

<body>

<div class="container">

<h1>ยืนยันคำสั่งซื้อ</h1>

<div class="card">

<h2>ข้อมูลจัดส่ง</h2>

<input
id="email"
placeholder="อีเมล">

<button
onclick="loadAddress()">
โหลดที่อยู่
</button>

<hr>

<input
id="receiver"
placeholder="ชื่อผู้รับ">

<input
id="phone"
placeholder="เบอร์โทร">

<input
id="social"
placeholder="Twitter / Discord">

<textarea
id="address"
placeholder="ที่อยู่">
</textarea>

<input
id="subdistrict"
placeholder="แขวง / ตำบล">

<input
id="district"
placeholder="เขต / อำเภอ">

<input
id="province"
placeholder="จังหวัด">

<input
id="postcode"
placeholder="รหัสไปรษณีย์">

<button
onclick="saveAddress()">
บันทึกที่อยู่
</button>

<script>

const API =
"https://script.google.com/macros/s/AKfycbxKjVvn8AXrK0wDvKqN-A9yS2Vk8R-w25ar1b9ftiIdUgUvFaShunLnFnAyIDuaTWj76w/exec";
  
let cart = [];

loadCheckout();

function loadCheckout(){

cart =
JSON.parse(
localStorage.getItem(
"buyNowCart"
) || "[]"
);

renderItems();

}

function renderItems(){

let html = "";
let total = 0;

cart.forEach(item=>{

const price =
Number(item.price);

const qty =
Number(item.qty);

total +=
price * qty;

html += `
<p>

${item.name}

x ${qty}

= ${price*qty}

บาท

</p>
`;

});

document
.getElementById(
"items"
)
.innerHTML =
html;

document
.getElementById(
"total"
)
.innerHTML =
`รวม ${total} บาท`;

}

async function loadAddress(){

  const email =
    document
      .getElementById(
        "email"
      )
      .value;

  if(!email){

    alert(
      "กรุณากรอกอีเมล"
    );

    return;

  }

  const response =
    await fetch(
      API +
      "?action=address&email=" +
      encodeURIComponent(
        email
      )
    );

  const data =
    await response.json();

  if(!data){

    alert(
      "ไม่พบข้อมูลที่อยู่"
    );

    return;

  }

  document.getElementById(
    "receiver"
  ).value =
    data.receiver || "";

  document.getElementById(
    "phone"
  ).value =
    data.phone || "";

  document.getElementById(
    "social"
  ).value =
    data.twitter || "";

  document.getElementById(
    "address"
  ).value =
    data.address || "";

  document.getElementById(
    "subdistrict"
  ).value =
    data.subdistrict || "";

  document.getElementById(
    "district"
  ).value =
    data.district || "";

  document.getElementById(
    "province"
  ).value =
    data.province || "";

  document.getElementById(
    "postcode"
  ).value =
    data.postcode || "";

  alert(
    "โหลดที่อยู่เรียบร้อย"
  );

}

async function saveAddress(){

  const payload = {

    email:
      document.getElementById(
        "email"
      ).value,

    twitter:
      document.getElementById(
        "social"
      ).value,

    contact:"",

    receiver:
      document.getElementById(
        "receiver"
      ).value,

    phone:
      document.getElementById(
        "phone"
      ).value,

    address:
      document.getElementById(
        "address"
      ).value,

    subdistrict:
      document.getElementById(
        "subdistrict"
      ).value,

    district:
      document.getElementById(
        "district"
      ).value,

    province:
      document.getElementById(
        "province"
      ).value,

    postcode:
      document.getElementById(
        "postcode"
      ).value

  };

  const formData =
    new FormData();

  formData.append(
    "payload",
    JSON.stringify(
      payload
    )
  );

  const response =
    await fetch(

      API +
      "?action=saveAddress",

      {

        method:"POST",

        body:formData

      }

    );

  await response.json();

  alert(
    "บันทึกที่อยู่เรียบร้อย"
  );

}
  
function getAddress(email){

  const sheet =
    SpreadsheetApp
      .getActiveSpreadsheet()
      .getSheetByName(
        "CustomerAddresses"
      );

  const rows =
    sheet.getDataRange()
      .getValues();

  for(let i=1;i<rows.length;i++){

    if(rows[i][0] == email){

      return {

        email: rows[i][0],
        twitter: rows[i][1],
        contact: rows[i][2],
        receiver: rows[i][3],
        phone: rows[i][4],
        address: rows[i][5],
        subdistrict: rows[i][6],
        district: rows[i][7],
        province: rows[i][8],
        postcode: rows[i][9]

      };

    }

  }

  return null;

}
  
</script>

</body>
</html>
