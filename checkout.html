<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1">

<title>Checkout</title>

<link rel="stylesheet"
href="style.css">

<style>

.container{
max-width:900px;
margin:auto;
padding:20px;
}

.card{

background:white;

padding:16px;

border-radius:16px;

margin-bottom:20px;

box-shadow:
0 2px 8px rgba(0,0,0,.05);

}

input,
textarea{
width:100%;
padding:10px;
margin:5px 0;
box-sizing:border-box;
}

button{
padding:10px 20px;
cursor:pointer;
margin-top:10px;
}

.topbar{

display:flex;

align-items:center;

justify-content:space-between;

margin-bottom:20px;

}

.topbar button{

width:44px;
height:44px;

border:none;

border-radius:999px;

background:white;

box-shadow:
0 2px 8px rgba(0,0,0,.08);

font-size:20px;

cursor:pointer;

}

.topbar h2{

margin:0;

font-size:20px;

}



</style>

</head>

<body>

<div class="topbar">

<button
onclick="history.back()">

←

</button>

<h2>
ทำการสั่งซื้อ
</h2>

<div></div>

</div>

<div class="container">

<h1>
ยืนยันคำสั่งซื้อ
</h1>

<div class="card">

<h2>
📍 ที่อยู่จัดส่ง
</h2>

<input
id="email"
placeholder="อีเมล">

<button
onclick="loadAddress()">
โหลดที่อยู่
</button>

<hr>

<input
id="receiver"
placeholder="ชื่อผู้รับ">

<input
id="phone"
placeholder="เบอร์โทร">

<input
id="social"
placeholder="Twitter / Discord">

<textarea
id="address"
placeholder="ที่อยู่"></textarea>

<input
id="subdistrict"
placeholder="แขวง / ตำบล">

<input
id="district"
placeholder="เขต / อำเภอ">

<input
id="province"
placeholder="จังหวัด">

<input
id="postcode"
placeholder="รหัสไปรษณีย์">

<button
onclick="saveAddress()">
บันทึกที่อยู่
</button>

</div>

<div class="card">

<h2>
รายการสินค้า
</h2>

<div id="items"></div>

<div
id="giftSection">
</div>

<h3 id="total">
รวม 0 บาท
</h3>

</div>

<button
onclick="goPayment()">
ไปชำระเงิน
</button>

</div>

<script>

const API =
"https://script.google.com/macros/s/AKfycbxKjVvn8AXrK0wDvKqN-A9yS2Vk8R-w25ar1b9ftiIdUgUvFaShunLnFnAyIDuaTWj76w/exec";

let cart = [];

loadCheckout();

function loadCheckout(){

cart =

JSON.parse(
localStorage.getItem(
"checkoutCart"
) || "[]"
);

if(
cart.length === 0
){

cart =

JSON.parse(
localStorage.getItem(
"cart"
) || "[]"
);

}

renderItems();

loadGifts();

}
  
function renderItems(){

let html = "";
let total = 0;

cart.forEach(item=>{

const price =
Number(item.price);

const qty =
Number(item.qty);

total +=
price * qty;

const optionText =

item.selected_options

?

Object.entries(
item.selected_options
)

.map(
([k,v])=>

`${k}: ${
Array.isArray(v)
? v.join(", ")
: v
}`

)

.join("<br>")

:

"";

html += `

<div
style="
padding:12px;
border:1px solid #eee;
border-radius:12px;
margin-bottom:12px;
">

<div
style="
font-weight:700;
margin-bottom:6px;
">

${item.name}

</div>

<div
style="
font-size:13px;
color:#666;
margin-bottom:8px;
">

${optionText}

</div>

<div>

${qty}
ชิ้น

×

฿${price}

</div>

</div>

`;
});

document
.getElementById(
"items"
)
.innerHTML =
html;

document
.getElementById(
"total"
)
.innerHTML =
`รวม ${total} บาท`;

}

async function loadAddress(){

const email =
document.getElementById(
"email"
).value;

if(!email){

alert(
"กรุณากรอกอีเมล"
);

return;

}

const response =
await fetch(
API +
"?action=address&email=" +
encodeURIComponent(
email
)
);

const data =
await response.json();

if(!data){

alert(
"ไม่พบข้อมูลที่อยู่"
);

return;

}

document.getElementById(
"receiver"
).value =
data.receiver || "";

document.getElementById(
"phone"
).value =
data.phone || "";

document.getElementById(
"social"
).value =
data.twitter || "";

document.getElementById(
"address"
).value =
data.address || "";

document.getElementById(
"subdistrict"
).value =
data.subdistrict || "";

document.getElementById(
"district"
).value =
data.district || "";

document.getElementById(
"province"
).value =
data.province || "";

document.getElementById(
"postcode"
).value =
data.postcode || "";

}

async function saveAddress(){

const payload = {

email:
document.getElementById(
"email"
).value,

twitter:
document.getElementById(
"social"
).value,

contact:"",

receiver:
document.getElementById(
"receiver"
).value,

phone:
document.getElementById(
"phone"
).value,

address:
document.getElementById(
"address"
).value,

subdistrict:
document.getElementById(
"subdistrict"
).value,

district:
document.getElementById(
"district"
).value,

province:
document.getElementById(
"province"
).value,

postcode:
document.getElementById(
"postcode"
).value

};

const formData =
new FormData();

formData.append(
"payload",
JSON.stringify(
payload
)
);

const response =
await fetch(
API +
"?action=saveAddress",
{
method:"POST",
body:formData
}
);

await response.json();

alert(
"บันทึกที่อยู่เรียบร้อย"
);

}

function goPayment(){

const gifts = [];

document
.querySelectorAll(
'input[name="gift"]:checked'
)
.forEach(el=>{

  gifts.push(
    el.value
  );

});

const addressData = {

email:
document.getElementById(
"email"
).value,

receiver:
document.getElementById(
"receiver"
).value,

phone:
document.getElementById(
"phone"
).value,

social:
document.getElementById(
"social"
).value,

address:
document.getElementById(
"address"
).value,

subdistrict:
document.getElementById(
"subdistrict"
).value,

district:
document.getElementById(
"district"
).value,

province:
document.getElementById(
"province"
).value,

postcode:
document.getElementById(
"postcode"
).value,

gifts:gifts

};

localStorage.setItem(
"checkoutAddress",
JSON.stringify(
addressData
)
);

window.location =
"payment.html";

}

async function loadGifts(){

  const collectionMap = {};
  const collectionTotals = {};

  cart.forEach(item=>{

    if(item.collection_id){

      collectionMap[
        item.collection_id
      ] = true;

      if(
        !collectionTotals[
          item.collection_id
        ]
      ){

        collectionTotals[
          item.collection_id
        ] = 0;

      }

      collectionTotals[
        item.collection_id
      ] +=

      Number(item.price)
      *
      Number(item.qty);

    }

  });

  let html = "";

  for(
    const collectionId
    in
    collectionMap
  ){

    const total =

    collectionTotals[
      collectionId
    ] || 0;

    const ruleResponse =
    await fetch(

      API +

      "?action=giftRule"

      +

      "&collection_id="

      +

      collectionId

      +

      "&total="

      +

      total

    );

    const rule =
    await ruleResponse.json();

    if(!rule){

      continue;

    }

    const response =
    await fetch(

      API +

      "?action=gifts&collection_id=" +

      collectionId

    );

    const gifts =
    await response.json();

    html += `

<div
style="
margin-bottom:15px;
padding:12px;
background:#fafafa;
border-radius:12px;
">

<div
style="
font-weight:700;
margin-bottom:8px;
">

🎁 ของแถม

</div>

<div
style="
font-size:13px;
color:#666;
margin-bottom:10px;
">

ซื้อครบ

฿${Number(
  rule.min_amount
).toLocaleString()}

เลือกได้

${rule.max_select}

ชิ้น

</div>

`;

    gifts.forEach(gift=>{

      html += `

<label
style="
display:flex;
align-items:center;
gap:12px;
padding:10px;
margin-bottom:10px;
border:1px solid #eee;
border-radius:12px;
cursor:pointer;
background:white;
">

<img
src="${gift.gift_image}"
style="
width:60px;
height:60px;
object-fit:cover;
border-radius:8px;
">

<div
style="
flex:1;
">

<div
style="
font-weight:600;
">

${gift.gift_name}

</div>

</div>

<input
type="checkbox"
class="gift-checkbox"
data-collection="${collectionId}"
data-max="${rule.max_select}"
value="${gift.gift_id}"
>

</label>

`;

    });

    html += `

</div>

`;

  }

  if(html){

    document
      .getElementById(
        "giftSection"
      )
      .innerHTML = html;

  }
  else{

    document
      .getElementById(
        "giftSection"
      )
      .innerHTML = "";

  }

}
  
</script>

</body>
</html>
