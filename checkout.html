<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1">

<title>Checkout</title>

<link rel="stylesheet"
href="style.css">

<style>

.container{
max-width:900px;
margin:auto;
padding:20px;
}

.card{

background:white;

padding:16px;

border-radius:16px;

margin-bottom:20px;

box-shadow:
0 2px 8px rgba(0,0,0,.05);

}

input,
textarea{
width:100%;
padding:10px;
margin:5px 0;
box-sizing:border-box;
}

button{
padding:10px 20px;
cursor:pointer;
margin-top:10px;
}

.topbar{

display:flex;

align-items:center;

justify-content:space-between;

margin-bottom:20px;

}

.topbar button{

width:44px;
height:44px;

border:none;

border-radius:999px;

background:white;

box-shadow:
0 2px 8px rgba(0,0,0,.08);

font-size:20px;

cursor:pointer;

}

.topbar h2{

margin:0;

font-size:20px;

}

.product-topbar{

position:fixed;

top:15px;
left:15px;
right:15px;

display:flex;
justify-content:space-between;
align-items:center;

z-index:999;

}

.product-topbar button,
.product-topbar a{

width:46px;
height:46px;

border:none;

border-radius:999px;

background:white;

display:flex;
align-items:center;
justify-content:center;

text-decoration:none;

font-size:22px;

box-shadow:
0 3px 12px rgba(0,0,0,.15);

cursor:pointer;

}

.gift-char-item{

display:inline-flex;
align-items:center;
gap:8px;

padding:8px 12px;

border:1px solid #ddd;
border-radius:999px;

margin-right:8px;
margin-top:8px;

cursor:pointer;

}

.gift-char-item:has(input:checked){

border-color:#7dcfff;
background:#eef8ff;

}
  
</style>

</head>

<body>

<div class="product-topbar">

<button
onclick="history.back()">
←
</button>

<a
href="cart.html"
id="floatingCart">
🛒
</a>

</div>

<div class="container">

<h1>
ยืนยันคำสั่งซื้อ
</h1>

<div class="card">

<h2>
📍 ที่อยู่จัดส่ง
</h2>

<button
onclick="
window.location.href=
'address-book.html'
">

เลือกหรือเปลี่ยนที่อยู่

</button>

<hr>

<div id="selectedAddress"></div>

<button
onclick="
window.location.href=
'address-book.html?select=checkout'
">
เปลี่ยนที่อยู่
</button>
  

</div>

<div class="card">

<h2>
รายการสินค้า
</h2>

<div id="items"></div>

<div
id="giftSection">
</div>

<h3 id="total">
รวม 0 บาท
</h3>

</div>

<button
onclick="goPayment()">
ไปชำระเงิน
</button>

</div>

<script>

const API =
"https://script.google.com/macros/s/AKfycbxKjVvn8AXrK0wDvKqN-A9yS2Vk8R-w25ar1b9ftiIdUgUvFaShunLnFnAyIDuaTWj76w/exec";

const customer =
JSON.parse(
  localStorage.getItem(
    "customer"
  ) || "{}"
);

if(!customer.email){

  window.location =
  "login.html";

}
  
let cart = [];

loadCheckout();

function loadCheckout(){

cart =
JSON.parse(
localStorage.getItem(
"checkoutCart"
) || "[]"
);

if(cart.length===0){

cart =
JSON.parse(
localStorage.getItem(
"buyNowCart"
) || "[]"
);

}

if(cart.length===0){

cart =
JSON.parse(
localStorage.getItem(
"cart"
) || "[]"
);

}
  
renderItems();

loadDefaultAddress();

loadGifts();

}

async function loadDefaultAddress(){

  const response =
  await fetch(

    API +

    "?action=customerAddresses&email=" +

    encodeURIComponent(
      customer.email
    )

  );

  const addresses =
  await response.json();

  const address =

    addresses.find(
      a => a.is_default
    )

    ||

    addresses[0];

  if(!address){
    return;
  }

 async function loadDefaultAddress(){

let selectedAddress =
JSON.parse(
localStorage.getItem(
"selectedCheckoutAddress"
) || "null"
);

if(!selectedAddress){

const response =
await fetch(
API +
"?action=customerAddresses&email=" +
encodeURIComponent(
customer.email
)
);

const addresses =
await response.json();

selectedAddress =
addresses.find(
a => a.is_default
) || addresses[0];

}

if(!selectedAddress){

document.getElementById(
"selectedAddress"
).innerHTML =
"ยังไม่มีที่อยู่จัดส่ง กรุณาเพิ่มที่อยู่ก่อน";

return;

}

window.checkoutAddress =
selectedAddress;

document.getElementById(
"selectedAddress"
).innerHTML = `

<div
style="
padding:12px;
border:1px solid #eee;
border-radius:12px;
background:#f8fbff;
line-height:1.7;
">

<b>
${selectedAddress.receiver}
</b>

<br>

${selectedAddress.phone}

<br>

${selectedAddress.address}

<br>

${selectedAddress.subdistrict}
${selectedAddress.district}

<br>

${selectedAddress.province}
${selectedAddress.postcode}

</div>

`;

} 
  
function renderItems(){

let html = "";
let total = 0;

cart.forEach(item=>{

const price =
Number(item.price);

const qty =
Number(item.qty);

total +=
price * qty;

const optionText =

item.selected_options

?

Object.entries(
item.selected_options
)

.map(
([k,v])=>

`${k}: ${
Array.isArray(v)
? v.join(", ")
: v
}`

)

.join("<br>")

:

"";

html += `

<div
style="
padding:12px;
border:1px solid #eee;
border-radius:12px;
margin-bottom:12px;
">

<div
style="
font-weight:700;
margin-bottom:6px;
">

${item.name}

</div>

<div
style="
font-size:13px;
color:#666;
margin-bottom:8px;
">

${optionText}

</div>

<div>

${qty}
ชิ้น

×

฿${price}

</div>

</div>

`;
});

document
.getElementById(
"items"
)
.innerHTML =
html;

document
.getElementById(
"total"
)
.innerHTML =
`รวม ${total} บาท`;

}

function goPayment(){

let hasError = false;

const gifts = [];

document
.querySelectorAll(
'input[name="gift"]:checked'
)
.forEach(el=>{

const giftId =
el.value;

const selectedChar =
document.querySelector(
`input[name="gift-char-${giftId}"]:checked`
);

const charBox =
document.querySelector(
`#gift-char-${giftId}`
);

if(
charBox &&
charBox.querySelector("input") &&
!selectedChar
){

alert(
"กรุณาเลือกตัวละครของของแถม"
);

hasError = true;

return;

}

gifts.push({

gift_id:
giftId,

character_name:
selectedChar
?
selectedChar.value
:
""

});

});

if(hasError){
return;
}

if(!window.checkoutAddress){

alert(
"กรุณาเลือกที่อยู่จัดส่ง"
);

return;

}

const addressData = {

email:
customer.email,

receiver:
window.checkoutAddress.receiver,

phone:
window.checkoutAddress.phone,

social:
customer.social || "",

address:
window.checkoutAddress.address,

subdistrict:
window.checkoutAddress.subdistrict,

district:
window.checkoutAddress.district,

province:
window.checkoutAddress.province,

postcode:
window.checkoutAddress.postcode,

gifts:gifts

};

localStorage.setItem(
"checkoutAddress",
JSON.stringify(
addressData
)
);

localStorage.removeItem(
"selectedCheckoutAddress"
);

window.location =
"payment.html";

}

async function loadGifts(){

  const collectionTotals = {};

  cart.forEach(item=>{

    if(!item.collection_id){
      return;
    }

    if(
      !collectionTotals[
        item.collection_id
      ]
    ){
      collectionTotals[
        item.collection_id
      ] = 0;
    }

    collectionTotals[
      item.collection_id
    ] +=

    Number(item.price)
    *
    Number(item.qty);

  });

  let html = "";

  for(
    const collectionId
    in
    collectionTotals
  ){

    const total =

    collectionTotals[
      collectionId
    ];

    console.log(
  "COLLECTION",
  collectionId,
  total
);

    const ruleResponse =
    await fetch(

      API +

      "?action=giftRules"

      +

      "&collection_id="

      +

      collectionId

      +

      "&total="

      +

      total

    );

    const rules =
    await ruleResponse.json();

    console.log(
  "RULES",
  rules
);

    if(
      !rules.length
    ){
      continue;
    }

    const giftResponse =
    await fetch(

      API +

      "?action=gifts"

      +

      "&collection_id="

      +

      collectionId

    );

    const gifts =
    await giftResponse.json();

    console.log(
  "GIFTS",
  gifts
);

    rules.forEach(rule=>{

      const tierGifts =

      gifts.filter(

        gift =>

        gift.tier_name
        ===
        rule.tier_name

      );

      if(
        !tierGifts.length
      ){
        return;
      }

      html += `

<div
style="
margin-bottom:20px;
padding:15px;
border:1px solid #eee;
border-radius:12px;
">

<h3>

🎁

${rule.tier_name}

</h3>

<div
style="
font-size:13px;
color:#666;
margin-bottom:10px;
">

ซื้อครบ

฿${Number(
  rule.min_amount
).toLocaleString()}

เลือกได้

${rule.max_select}

ชิ้น

</div>

`;

      tierGifts.forEach(gift=>{

        html += `

<label
style="
display:flex;
align-items:center;
gap:12px;
padding:10px;
margin-bottom:10px;
border:1px solid #eee;
border-radius:12px;
cursor:pointer;
">

<img
src="${gift.gift_image}"
style="
width:60px;
height:60px;
object-fit:cover;
border-radius:8px;
">

<div
style="
flex:1;
">

<div>

<div>
${gift.gift_name}
</div>

<div
id="gift-char-${gift.gift_id}"
class="gift-char-box"
style="
display:none;
margin-top:8px;
"
>

</div>

</div>

</div>

<input
type="checkbox"

name="gift"

class="gift-checkbox"

data-tier="${rule.tier_name}"

data-max="${rule.max_select}"

value="${gift.gift_id}"

>

</label>

`;

      });

      html += `

</div>

`;

    });

  }

 if(html){

  document
    .getElementById(
      "giftSection"
    )
    .innerHTML =
    html;

  const giftBoxes =

  document.querySelectorAll(
    "[id^='gift-char-']"
  );

  giftBoxes.forEach(box=>{

    const giftId =

    box.id.replace(
      "gift-char-",
      ""
    );

    loadGiftCharacters(
      giftId
    );

  });

}
else{

  document
    .getElementById(
      "giftSection"
    )
    .innerHTML =
    "";

}

}

document.addEventListener(
"change",
e=>{

  if(
    !e.target.classList.contains(
      "gift-checkbox"
    )
  ){
    return;
  }

  const tier =

  e.target.dataset.tier;

  const max =

  Number(
    e.target.dataset.max
  );

  const checked =

  document.querySelectorAll(

    `.gift-checkbox[data-tier="${tier}"]:checked`

  );

  if(
    checked.length > max
  ){

    e.target.checked =
    false;

    alert(

      `เลือกได้สูงสุด ${max} ชิ้น`

    );

  }

  const giftId =
e.target.value;

const charBox =
document.getElementById(
`gift-char-${giftId}`
);

if(charBox){

charBox.style.display =
e.target.checked
? "block"
: "none";

if(!e.target.checked){

charBox
.querySelectorAll(
"input"
)
.forEach(input=>{

input.checked = false;

});

}

}

});

 async function loadGiftCharacters(
  giftId
){

  try{

    const response =
    await fetch(

      API +

      "?action=giftCharacters"

      +

      "&gift_id="

      +

      encodeURIComponent(
        giftId
      )

    );

    const chars =
    await response.json();

    console.log(
      "CHARS",
      giftId,
      chars
    );

    if(
      !Array.isArray(chars)
      ||
      !chars.length
    ){
      return;
    }

    const box =
    document.getElementById(
      `gift-char-${giftId}`
    );

    console.log(
      "BOX",
      giftId,
      box
    );

    if(!box){
      return;
    }

    let html = "";

    chars.forEach(char=>{

     html += `

<label class="gift-char-item">

<input
type="radio"
name="gift-char-${giftId}"
value="${char.character_name}"
>

<div class="gift-char-name">
${char.character_name}
</div>

</label>

`;

    });

    box.innerHTML =
    html;

  }
  catch(error){

    console.error(
      "loadGiftCharacters error",
      giftId,
      error
    );

  }

} 
  
</script>

</body>
</html>
