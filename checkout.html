<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ชำระเงิน | Rinka Shop</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;600;700&family=Noto+Serif+Thai:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="site-header"></div>

<section class="section">
  <div class="wrap two-col">
    <div>
      <h2>ข้อมูลผู้สั่งซื้อ</h2>
      <form id="checkoutForm" class="panel stack">
        <div class="field-row">
          <div class="field"><label>ชื่อ-นามสกุล *</label><input name="customer_name" required></div>
          <div class="field"><label>เบอร์โทร *</label><input name="phone" required></div>
        </div>
        <div class="field-row">
          <div class="field"><label>อีเมล *</label><input type="email" name="email" required></div>
          <div class="field"><label>Line / Twitter/X (ติดต่อกลับ)</label><input name="social"></div>
        </div>

        <h3 style="margin-top:8px;">ที่อยู่จัดส่ง</h3>
        <p class="hint" style="margin-top:-8px;">สำหรับสินค้าพรีออเดอร์ ที่อยู่นี้จะใช้ยืนยันอีกครั้งตอนของถึงไทยและพร้อมจัดส่งจริง</p>
        <div class="field"><label>ที่อยู่ *</label><textarea name="address" rows="2" required></textarea></div>
        <div class="field-row">
          <div class="field"><label>ตำบล/แขวง</label><input name="subdistrict"></div>
          <div class="field"><label>อำเภอ/เขต</label><input name="district"></div>
        </div>
        <div class="field-row">
          <div class="field"><label>จังหวัด</label><input name="province"></div>
          <div class="field"><label>รหัสไปรษณีย์</label><input name="postcode"></div>
        </div>

        <button type="submit" class="btn btn-primary btn-block" id="submitBtn">ยืนยันคำสั่งซื้อ &amp; ไปหน้าชำระเงิน</button>
      </form>
    </div>

    <div>
      <div class="panel">
        <h3 style="margin-top:0;">รายการสั่งซื้อ</h3>
        <div id="reviewLines"></div>
        <div class="summary-row total"><span>ยอดที่ต้องชำระตอนนี้</span><span id="reviewTotal">฿0</span></div>
      </div>
    </div>
  </div>
</section>

<div id="site-footer"></div>
<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/cart.js"></script>
<script src="js/common.js"></script>
<script>
function renderReview(){
  const items = RinkaCart.read();
  if(!items.length){
    document.getElementById("reviewLines").innerHTML = `<p class="muted">ตะกร้าว่างเปล่า <a href="index.html">เลือกซื้อสินค้า</a></p>`;
    document.getElementById("submitBtn").disabled = true;
    return;
  }
  document.getElementById("reviewLines").innerHTML = items.map(i => {
    const lineTotal = (Number(i.price) + (i.crate_selected ? Number(i.crate_fee||0) : 0)) * i.qty;
    return `<div class="summary-row"><span>${i.name} ${i.option_value ? '('+i.option_value+')' : ''} × ${i.qty}</span><span>${money(lineTotal)}</span></div>`;
  }).join("");
  const { subtotal } = RinkaCart.totals();
  document.getElementById("reviewTotal").textContent = money(subtotal);
}
renderReview();

document.getElementById("checkoutForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const items = RinkaCart.read();
  if(!items.length){ toast("ตะกร้าว่างเปล่า", true); return; }

  const fd = new FormData(e.target);
  const address = ["address","subdistrict","district","province","postcode"]
    .map(k => fd.get(k)).filter(Boolean).join(" ");

  const { subtotal } = RinkaCart.totals();
  const session = RinkaAuth.get();

  const payload = {
    customer_name: fd.get("customer_name"),
    email: fd.get("email"),
    phone: fd.get("phone"),
    social: fd.get("social") || "",
    subtotal: subtotal,
    total: subtotal,
    customer_id: session ? session.customer_id : "",
    shipping_address: address,
    items: items.map(i => ({
      product_id: i.product_id,
      name: i.name,
      qty: i.qty,
      price: i.price,
      selected_options: i.selected_options,
      final_price: (Number(i.price) + (i.crate_selected ? Number(i.crate_fee||0) : 0)) * i.qty
    }))
  };

  const btn = document.getElementById("submitBtn");
  btn.disabled = true;
  btn.textContent = "กำลังส่งคำสั่งซื้อ...";

  try{
    const res = await RinkaAPI.createOrder(payload);
    if(res && res.success){
      RinkaCart.clear();
      location.href = `payment.html?id=${encodeURIComponent(res.order_id)}&total=${subtotal}`;
    } else {
      toast(res.error || "สั่งซื้อไม่สำเร็จ กรุณาลองใหม่", true);
      btn.disabled = false;
      btn.textContent = "ยืนยันคำสั่งซื้อ & ไปหน้าชำระเงิน";
    }
  }catch(err){
    toast("เกิดข้อผิดพลาด กรุณาลองใหม่", true);
    btn.disabled = false;
    btn.textContent = "ยืนยันคำสั่งซื้อ & ไปหน้าชำระเงิน";
  }
});
</script>
</body>
</html>
