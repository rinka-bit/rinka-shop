<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1">

<title>Checkout</title>

<link rel="stylesheet"
href="style.css">

<style>

.container{
max-width:900px;
margin:auto;
padding:20px;
}

.card{

background:white;

padding:16px;

border-radius:16px;

margin-bottom:20px;

box-shadow:
0 2px 8px rgba(0,0,0,.05);

}

input,
textarea{
width:100%;
padding:10px;
margin:5px 0;
box-sizing:border-box;
}

button{
padding:10px 20px;
cursor:pointer;
margin-top:10px;
}

.topbar{

display:flex;

align-items:center;

justify-content:space-between;

margin-bottom:20px;

}

.topbar button{

width:44px;
height:44px;

border:none;

border-radius:999px;

background:white;

box-shadow:
0 2px 8px rgba(0,0,0,.08);

font-size:20px;

cursor:pointer;

}

.topbar h2{

margin:0;

font-size:20px;

}

.product-topbar{

position:fixed;

top:15px;
left:15px;
right:15px;

display:flex;
justify-content:space-between;
align-items:center;

z-index:999;

}

.product-topbar button,
.product-topbar a{

width:46px;
height:46px;

border:none;

border-radius:999px;

background:white;

display:flex;
align-items:center;
justify-content:center;

text-decoration:none;

font-size:22px;

box-shadow:
0 3px 12px rgba(0,0,0,.15);

cursor:pointer;

}

.gift-char-item{

display:inline-flex;
align-items:center;
gap:8px;

padding:8px 12px;

border:1px solid #ddd;
border-radius:999px;

margin-right:8px;
margin-top:8px;

cursor:pointer;

}

.gift-char-item:has(input:checked){

border-color:#7dcfff;
background:#eef8ff;

}
  
</style>

</head>

<body>

<div class="product-topbar">

<button
onclick="history.back()">
←
</button>

<a
href="cart.html"
id="floatingCart">
🛒
</a>

</div>

<div class="container">

<h1>
ยืนยันคำสั่งซื้อ
</h1>

<div class="card">

<h2>
📍 ที่อยู่จัดส่ง
</h2>

<div id="selectedAddress"></div>

<button
onclick="
window.location.href=
'address-book.html?select=checkout'
">
เปลี่ยนที่อยู่
</button>
  

</div>

<div class="card">

<h2>
รายการสินค้า
</h2>

<div id="items"></div>

<div
id="giftSection">
</div>

<h3 id="total">
รวม 0 บาท
</h3>

</div>

<button
onclick="goPayment()">
ไปชำระเงิน
</button>

</div>

<script>

const API =
"https://script.google.com/macros/s/AKfycbxKjVvn8AXrK0wDvKqN-A9yS2Vk8R-w25ar1b9ftiIdUgUvFaShunLnFnAyIDuaTWj76w/exec";

const customer =
JSON.parse(
  localStorage.getItem(
    "customer"
  ) || "{}"
);

if(!customer.email){

  window.location =
  "login.html";

}
  
let cart = [];

loadCheckout();

function loadCheckout(){

  const checkoutSource =
    localStorage.getItem(
      "checkoutSource"
    );

  const buyNowCart =
    JSON.parse(
      localStorage.getItem(
        "buyNowCart"
      ) || "[]"
    );

  const checkoutCart =
    JSON.parse(
      localStorage.getItem(
        "checkoutCart"
      ) || "[]"
    );

  const normalCart =
    JSON.parse(
      localStorage.getItem(
        "cart"
      ) || "[]"
    );

  if(
    checkoutSource === "buyNow" &&
    Array.isArray(buyNowCart) &&
    buyNowCart.length
  ){

    cart =
      buyNowCart;

    console.log(
      "CHECKOUT SOURCE:",
      "buyNowCart"
    );

  }
  else if(
    checkoutSource === "cart" &&
    Array.isArray(checkoutCart) &&
    checkoutCart.length
  ){

    cart =
      checkoutCart;

    console.log(
      "CHECKOUT SOURCE:",
      "checkoutCart"
    );

  }
  else if(
    Array.isArray(checkoutCart) &&
    checkoutCart.length
  ){

    cart =
      checkoutCart;

    console.log(
      "CHECKOUT SOURCE:",
      "checkoutCart fallback"
    );

  }
  else if(
    Array.isArray(buyNowCart) &&
    buyNowCart.length
  ){

    cart =
      buyNowCart;

    console.log(
      "CHECKOUT SOURCE:",
      "buyNowCart fallback"
    );

  }
  else if(
    Array.isArray(normalCart)
  ){

    cart =
      normalCart;

    console.log(
      "CHECKOUT SOURCE:",
      "cart fallback"
    );

  }
  else{

    cart = [];

  }

  console.log(
    "CHECKOUT CART:",
    cart
  );

  renderItems();

  loadDefaultAddress();

  loadGifts();

}

async function loadDefaultAddress(){

let selectedAddress =
JSON.parse(
localStorage.getItem(
"selectedCheckoutAddress"
) || "null"
);

if(!selectedAddress){

const response =
await fetch(
API +
"?action=customerAddresses&email=" +
encodeURIComponent(
customer.email
)
);

const addresses =
await response.json();

selectedAddress =
addresses.find(
a => a.is_default
) || addresses[0];

}

if(!selectedAddress){

document.getElementById(
"selectedAddress"
).innerHTML =
"ยังไม่มีที่อยู่จัดส่ง กรุณาเพิ่มที่อยู่ก่อน";

return;

}

window.checkoutAddress =
selectedAddress;

document.getElementById(
"selectedAddress"
).innerHTML = `

<div
style="
padding:12px;
border:1px solid #eee;
border-radius:12px;
background:#f8fbff;
line-height:1.7;
">

<b>
${selectedAddress.receiver}
</b>

<br>

${selectedAddress.phone}

<br>

${selectedAddress.address}

<br>

${selectedAddress.subdistrict}
${selectedAddress.district}

<br>

${selectedAddress.province}
${selectedAddress.postcode}

</div>

`;

}
  
function renderItems(){

let html = "";
let total = 0;

cart.forEach(item=>{

const price =
Number(item.price);

const qty =
Number(item.qty);

total +=
price * qty;

const optionText =

item.selected_options

?

Object.entries(
item.selected_options
)

.map(
([k,v])=>

`${k}: ${
Array.isArray(v)
? v.join(", ")
: v
}`

)

.join("<br>")

:

"";

html += `

<div
style="
padding:12px;
border:1px solid #eee;
border-radius:12px;
margin-bottom:12px;
">

<div
style="
font-weight:700;
margin-bottom:6px;
">

${item.name}

</div>

<div
style="
font-size:13px;
color:#666;
margin-bottom:8px;
">

${optionText}

</div>

<div>

${qty}
ชิ้น

×

฿${price}

</div>

</div>

`;
});

document
.getElementById(
"items"
)
.innerHTML =
html;

document
.getElementById(
"total"
)
.innerHTML =
`รวม ${total} บาท`;

}

function escapeHtml(
  value
){

  return String(
    value || ""
  )
    .replaceAll(
      "&",
      "&amp;"
    )
    .replaceAll(
      "<",
      "&lt;"
    )
    .replaceAll(
      ">",
      "&gt;"
    )
    .replaceAll(
      '"',
      "&quot;"
    )
    .replaceAll(
      "'",
      "&#039;"
    );

}

function goPayment(){

  /*
  =========================
  ตรวจสอบที่อยู่จัดส่ง
  =========================
  */

  const addressData =
    window.checkoutAddress;


  if(!addressData){

    alert(
      "กรุณาเลือกที่อยู่จัดส่งก่อน"
    );

    return;

  }


  if(
    !addressData.receiver ||
    !addressData.phone ||
    !addressData.address ||
    !addressData.province ||
    !addressData.postcode
  ){

    alert(
      "ข้อมูลที่อยู่จัดส่งไม่ครบ กรุณาเลือกหรือแก้ไขที่อยู่ใหม่"
    );

    return;

  }


  const gifts = [];

  let validationError =
    false;


  /*
  =========================
  ของแถมแบบเลือกจำนวน
  =========================
  */

  document
    .querySelectorAll(
      ".gift-quantity"
    )
    .forEach(quantityInput=>{

      if(validationError){

        return;

      }


      const giftId =
        quantityInput.dataset.giftId ||
        "";

      const tierName =
        quantityInput.dataset.tierName ||
        "";

      const collectionId =
        quantityInput.dataset.collectionId ||
        "";

      const quantity =
        Number(
          quantityInput.value || 0
        );


      if(
        !giftId ||
        quantity <= 0
      ){

        return;

      }


      const characters =
        giftCharacterMap[
          giftId
        ] || [];


      for(
        let itemIndex = 0;
        itemIndex < quantity;
        itemIndex++
      ){

        let characterName = "";


        if(characters.length){

          const radioName =
            `gift-char-${giftId}-${itemIndex}`;

          const selectedCharacter =
            Array.from(
              document.querySelectorAll(
                "input[type='radio']"
              )
            )
            .find(input=>

              input.name === radioName &&
              input.checked

            );


          if(!selectedCharacter){

            alert(
              `กรุณาเลือกตัวละครของของแถมชิ้นที่ ${itemIndex + 1} ให้ครบ`
            );

            validationError =
              true;

            return;

          }


          characterName =
            selectedCharacter.value;

        }


        gifts.push({

          gift_id:
            giftId,

          tier_name:
            tierName,

          collection_id:
            collectionId,

          character_name:
            characterName

        });

      }

    });


  if(validationError){

    return;

  }


  /*
  =========================
  ของแถมแบบ Checkbox
  =========================
  */

  document
    .querySelectorAll(
      ".gift-checkbox:checked"
    )
    .forEach(checkbox=>{

      if(validationError){

        return;

      }


      const giftId =
        checkbox.dataset.giftId ||
        checkbox.value ||
        "";

      const tierName =
        checkbox.dataset.tierName ||
        "";

      const collectionId =
        checkbox.dataset.collectionId ||
        "";


      if(!giftId){

        return;

      }


      const characters =
        giftCharacterMap[
          giftId
        ] || [];

      let characterName = "";


      if(characters.length){

        const radioName =
          `gift-char-${giftId}-0`;

        const selectedCharacter =
          Array.from(
            document.querySelectorAll(
              "input[type='radio']"
            )
          )
          .find(input=>

            input.name === radioName &&
            input.checked

          );


        if(!selectedCharacter){

          alert(
            "กรุณาเลือกตัวละครของของแถมให้ครบ"
          );

          validationError =
            true;

          return;

        }


        characterName =
          selectedCharacter.value;

      }


      gifts.push({

        gift_id:
          giftId,

        tier_name:
          tierName,

        collection_id:
          collectionId,

        character_name:
          characterName

      });

    });


  if(validationError){

    return;

  }


  /*
  =========================
  ตรวจจำนวนของแถมแต่ละ Tier
  =========================
  */

  const tierCards =
    document.querySelectorAll(
      ".gift-tier-card"
    );


  for(
    const tierCard of tierCards
  ){

    const tierKey =
      tierCard.dataset.tierKey;

    const max =
      Number(
        tierCard.dataset.max || 1
      );

    const selectedCount =
      getGiftTierSelectedCount(
        tierKey
      );


    if(selectedCount > max){

      alert(
        `เลือกของแถมได้สูงสุด ${max} ชิ้น`
      );

      return;

    }

  }


  /*
  =========================
  เตรียมข้อมูลไปหน้า Payment
  =========================
  */

  const checkoutData = {

    ...addressData,

    email:
      addressData.email ||
      customer.email ||
      "",

    gifts:
      gifts

  };


  window.checkoutAddress =
    checkoutData;


  localStorage.setItem(

    "checkoutAddress",

    JSON.stringify(
      checkoutData
    )

  );


  window.location.href =
    "payment.html";

}
  
async function loadGifts(){

  const giftSection =
    document.getElementById(
      "giftSection"
    );

  const collectionTotals = {};

  cart.forEach(item=>{

    const collectionId =
      String(
        item.collection_id || ""
      ).trim();

    if(!collectionId){

      console.warn(
        "สินค้าไม่มี collection_id",
        item
      );

      return;

    }

    if(
      !collectionTotals[
        collectionId
      ]
    ){

      collectionTotals[
        collectionId
      ] = 0;

    }

    collectionTotals[
      collectionId
    ] +=

      Number(
        item.price || 0
      )

      *

      Number(
        item.qty || 0
      );

  });

  console.log(
    "COLLECTION TOTALS",
    collectionTotals
  );

  let html = "";

  try{

    for(
      const collectionId
      in collectionTotals
    ){

      const total =
        collectionTotals[
          collectionId
        ];

      const ruleResponse =
        await fetch(

          API +

          "?action=giftRules" +

          "&collection_id=" +

          encodeURIComponent(
            collectionId
          ) +

          "&total=" +

          encodeURIComponent(
            total
          )

        );

      const ruleResult =
        await ruleResponse.json();

      const rules =
        Array.isArray(
          ruleResult
        )
          ? ruleResult
          : Array.isArray(
              ruleResult.rules
            )
              ? ruleResult.rules
              : [];

      console.log(
        "RULES",
        rules
      );

      if(!rules.length){

        continue;

      }

      const giftResponse =
        await fetch(

          API +

          "?action=gifts" +

          "&collection_id=" +

          encodeURIComponent(
            collectionId
          )

        );

      const giftResult =
        await giftResponse.json();

      const gifts =
        Array.isArray(
          giftResult
        )
          ? giftResult
          : Array.isArray(
              giftResult.gifts
            )
              ? giftResult.gifts
              : [];

      console.log(
        "GIFTS",
        gifts
      );

      rules.forEach(rule=>{

        const normalizedRuleTier =
          String(
            rule.tier_name || ""
          )
            .trim()
            .toLowerCase();

        const tierKey =
          collectionId +
          "::" +
          normalizedRuleTier;

        const maxSelect =
          Math.max(
            1,
            Number(
              rule.max_select || 1
            )
          );

        const allowDuplicate =
          String(
            rule.allow_duplicate || ""
          )
            .trim()
            .toLowerCase() ===
          "yes";

        const tierGifts =
          gifts.filter(gift=>

            String(
              gift.tier_name || ""
            )
              .trim()
              .toLowerCase() ===
            normalizedRuleTier

          );

        if(!tierGifts.length){

          console.warn(
            "ไม่พบของแถมของ Tier",
            rule.tier_name
          );

          return;

        }

        html += `

<div
class="gift-tier-card"
data-tier-key="${escapeHtml(
  tierKey
)}"
data-max="${maxSelect}"
style="
margin-bottom:20px;
padding:15px;
border:1px solid #eee;
border-radius:12px;
">

<h3>

🎁

${escapeHtml(
  rule.tier_name
)}

</h3>

<div
style="
font-size:13px;
color:#666;
margin-bottom:10px;
">

ซื้อครบ

฿${Number(
  rule.min_amount || 0
).toLocaleString()}

เลือกได้สูงสุด

${maxSelect}

ชิ้น

${
  allowDuplicate
    ? " · เลือกของแถมแบบเดิมซ้ำได้"
    : ""
}

</div>

<div
class="gift-tier-count"
style="
font-size:13px;
font-weight:700;
margin-bottom:12px;
">

เลือกแล้ว 0 / ${maxSelect} ชิ้น

</div>

`;

        tierGifts.forEach(gift=>{

          const giftId =
            String(
              gift.gift_id || ""
            );

          html += `

<div
class="gift-item"
style="
display:flex;
align-items:center;
gap:12px;
padding:10px;
margin-bottom:10px;
border:1px solid #eee;
border-radius:12px;
">

<img
src="${escapeHtml(
  gift.gift_image || ""
)}"
style="
width:60px;
height:60px;
object-fit:cover;
border-radius:8px;
"
alt=""
>

<div
style="
flex:1;
">

<div>

${escapeHtml(
  gift.gift_name || ""
)}

</div>

<div
id="gift-char-${escapeHtml(
  giftId
)}"
class="gift-char-box"
style="
display:none;
margin-top:8px;
">
</div>

</div>

${
  allowDuplicate
    ? `

<div
style="
display:flex;
align-items:center;
gap:8px;
">

<button
type="button"
class="gift-qty-minus"
data-gift-id="${escapeHtml(
  giftId
)}"
style="
width:34px;
height:34px;
padding:0;
margin:0;
"
>

−

</button>

<span
class="gift-qty-value"
id="gift-qty-${escapeHtml(
  giftId
)}"
style="
min-width:24px;
text-align:center;
font-weight:700;
"
>

0

</span>

<button
type="button"
class="gift-qty-plus"
data-gift-id="${escapeHtml(
  giftId
)}"
style="
width:34px;
height:34px;
padding:0;
margin:0;
"
>

+

</button>

<input
type="hidden"
class="gift-quantity"

data-gift-id="${escapeHtml(
  giftId
)}"

data-tier="${escapeHtml(
  tierKey
)}"

data-tier-name="${escapeHtml(
  rule.tier_name || ""
)}"

data-collection-id="${escapeHtml(
  collectionId
)}"

data-max="${maxSelect}"

data-allow-duplicate="yes"

value="0"
>

</div>

`
    : `

<input
type="checkbox"

class="gift-checkbox"

data-gift-id="${escapeHtml(
  giftId
)}"

data-tier="${escapeHtml(
  tierKey
)}"

data-tier-name="${escapeHtml(
  rule.tier_name || ""
)}"

data-collection-id="${escapeHtml(
  collectionId
)}"

data-max="${maxSelect}"

data-allow-duplicate="no"

value="${escapeHtml(
  giftId
)}"
>

`
}

</div>

`;

        });

        html += `

</div>

`;

      });

    }

    giftSection.innerHTML =
      html;

    if(!html){

      console.warn(
        "ไม่มีของแถมที่ผ่านเงื่อนไข"
      );

      return;

    }

    document
      .querySelectorAll(
        "[id^='gift-char-']"
      )
      .forEach(box=>{

        const giftId =
          box.id.replace(
            "gift-char-",
            ""
          );

        loadGiftCharacters(
          giftId
        );

      });

    updateAllGiftTierCounts();

  }
  catch(error){

    console.error(
      "loadGifts error",
      error
    );

    giftSection.innerHTML = "";

  }

}

function getGiftTierSelectedCount(
  tierKey
){

  let total = 0;

  document
    .querySelectorAll(
      ".gift-checkbox"
    )
    .forEach(checkbox=>{

      if(
        checkbox.dataset.tier === tierKey &&
        checkbox.checked
      ){

        total += 1;

      }

    });

  document
    .querySelectorAll(
      ".gift-quantity"
    )
    .forEach(input=>{

      if(
        input.dataset.tier === tierKey
      ){

        total +=
          Number(
            input.value || 0
          );

      }

    });

  return total;

}


function updateGiftTierCount(
  tierKey
){

  const tierCard =
    Array.from(
      document.querySelectorAll(
        ".gift-tier-card"
      )
    )
    .find(card=>

      card.dataset.tierKey ===
      tierKey

    );

  if(!tierCard){

    return;

  }

  const max =
    Number(
      tierCard.dataset.max || 1
    );

  const selectedCount =
    getGiftTierSelectedCount(
      tierKey
    );

  const countBox =
    tierCard.querySelector(
      ".gift-tier-count"
    );

  if(countBox){

    countBox.textContent =
      `เลือกแล้ว ${selectedCount} / ${max} ชิ้น`;

  }

}


function updateAllGiftTierCounts(){

  document
    .querySelectorAll(
      ".gift-tier-card"
    )
    .forEach(card=>{

      updateGiftTierCount(
        card.dataset.tierKey
      );

    });

}


function toggleGiftCharacterBox(
  giftId,
  show
){

  const charBox =
    document.getElementById(
      `gift-char-${giftId}`
    );

  if(!charBox){

    return;

  }

  charBox.style.display =
    show
      ? "block"
      : "none";

  if(!show){

    charBox
      .querySelectorAll(
        "input"
      )
      .forEach(input=>{

        input.checked =
          false;

      });

  }

}


document.addEventListener(
  "change",
  e=>{

    if(
      !e.target.classList.contains(
        "gift-checkbox"
      )
    ){

      return;

    }

    const checkbox =
      e.target;

    const tierKey =
      checkbox.dataset.tier;

    const max =
      Number(
        checkbox.dataset.max || 1
      );

    if(
      checkbox.checked &&
      getGiftTierSelectedCount(
        tierKey
      ) > max
    ){

      checkbox.checked =
        false;

      alert(
        `เลือกได้สูงสุด ${max} ชิ้น`
      );

    }

  renderGiftCharacterSelectors(

    checkbox.value,

    checkbox.checked
      ? 1
      : 0

);

updateGiftTierCount(
    tierKey
);

  }
);

  document.addEventListener(
  "click",
  e=>{

    const plusButton =
      e.target.closest(
        ".gift-qty-plus"
      );

    const minusButton =
      e.target.closest(
        ".gift-qty-minus"
      );

    if(
      !plusButton &&
      !minusButton
    ){

      return;

    }

    const button =
      plusButton ||
      minusButton;

    const giftId =
      button.dataset.giftId;

    const quantityInput =
      document.querySelector(
        `.gift-quantity[data-gift-id="${CSS.escape(
          giftId
        )}"]`
      );

    if(!quantityInput){

      return;

    }

    const tierKey =
      quantityInput.dataset.tier;

    const max =
      Number(
        quantityInput.dataset.max || 1
      );

    let quantity =
      Number(
        quantityInput.value || 0
      );

    if(plusButton){

      const selectedCount =
        getGiftTierSelectedCount(
          tierKey
        );

      if(
        selectedCount >= max
      ){

        alert(
          `เลือกได้สูงสุด ${max} ชิ้น`
        );

        return;

      }

      quantity++;

    }

    if(minusButton){

      quantity =
        Math.max(
          0,
          quantity - 1
        );

    }

    quantityInput.value =
      quantity;

    const qtyLabel =
      document.getElementById(
        `gift-qty-${giftId}`
      );

    if(qtyLabel){

      qtyLabel.textContent =
        quantity;

    }

    renderGiftCharacterSelectors(
      giftId,
      quantity
    );

    updateGiftTierCount(
      tierKey
    );

  }
);

const giftCharacterMap = {};


function renderGiftCharacterSelectors(
  giftId,
  quantity
){

  const box =
    document.getElementById(
      `gift-char-${giftId}`
    );

  if(!box){

    return;

  }

  const chars =
    giftCharacterMap[
      giftId
    ] || [];

  quantity =
    Math.max(
      0,
      Number(
        quantity || 0
      )
    );

  if(
    !chars.length ||
    quantity <= 0
  ){

    box.innerHTML = "";

    box.style.display =
      "none";

    return;

  }


  const previousSelections = [];

  box
    .querySelectorAll(
      ".gift-character-group"
    )
    .forEach((group,index)=>{

      const selected =
        group.querySelector(
          "input[type='radio']:checked"
        );

      previousSelections[
        index
      ] =
        selected
          ? selected.value
          : "";

    });


  let html = "";

  for(
    let itemIndex = 0;
    itemIndex < quantity;
    itemIndex++
  ){

    const previousValue =
      previousSelections[
        itemIndex
      ] || "";

    html += `

<div
class="gift-character-group"
data-gift-id="${escapeHtml(
  giftId
)}"
data-item-index="${itemIndex}"
style="
margin-top:10px;
padding:10px;
border:1px solid #e5e5e5;
border-radius:10px;
"
>

<div
style="
font-size:13px;
font-weight:700;
margin-bottom:8px;
"
>

เลือกตัวละครสำหรับชิ้นที่
${itemIndex + 1}

</div>

`;

    chars.forEach(char=>{

      const characterName =
        String(
          char.character_name || ""
        );

      const checked =
        previousValue ===
        characterName;

      html += `

<label
class="gift-char-item"
style="
display:flex;
align-items:center;
gap:8px;
margin-bottom:6px;
cursor:pointer;
"
>

<input
type="radio"

name="gift-char-${escapeHtml(
  giftId
)}-${itemIndex}"

value="${escapeHtml(
  characterName
)}"

${checked ? "checked" : ""}
>

<div class="gift-char-name">

${escapeHtml(
  characterName
)}

</div>

</label>

`;

    });

    html += `

</div>

`;

  }

  box.innerHTML =
    html;

  box.style.display =
    "block";

}


async function loadGiftCharacters(
  giftId
){

  try{

    const response =
      await fetch(

        API +

        "?action=giftCharacters" +

        "&gift_id=" +

        encodeURIComponent(
          giftId
        )

      );

    const result =
      await response.json();

    const chars =
      Array.isArray(
        result
      )
        ? result
        : Array.isArray(
            result.characters
          )
            ? result.characters
            : [];

    console.log(
      "CHARS",
      giftId,
      chars
    );

    giftCharacterMap[
      giftId
    ] =
      chars;

    const quantityInput =
      document.querySelector(
        `.gift-quantity[data-gift-id="${CSS.escape(
          giftId
        )}"]`
      );

    const checkbox =
      document.querySelector(
        `.gift-checkbox[data-gift-id="${CSS.escape(
          giftId
        )}"]`
      );

    let quantity = 0;

    if(quantityInput){

      quantity =
        Number(
          quantityInput.value || 0
        );

    }
    else if(
      checkbox &&
      checkbox.checked
    ){

      quantity = 1;

    }

    renderGiftCharacterSelectors(
      giftId,
      quantity
    );

  }
  catch(error){

    console.error(
      "loadGiftCharacters error",
      giftId,
      error
    );

  }

}
  
</script>
