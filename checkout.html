<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ทำการสั่งซื้อ — Rinka Shop</title>
<link rel="stylesheet" href="shared.css">
<style>
  body{ padding-bottom: 110px; }
  .rk-step-panel{ padding: 4px 18px 24px; }
  .rk-order-item{
    display:flex; gap:10px; align-items:center;
    padding: 10px 0; border-bottom: 1px solid var(--rk-border);
  }
  .rk-order-item:last-child{ border-bottom:none; }
  .rk-order-item img{ width:52px; height:52px; border-radius:10px; object-fit:cover; }
  .rk-order-item .rk-oi-name{ font-size:13.5px; font-weight:600; }
  .rk-order-item .rk-oi-sub{ font-size:12px; color: var(--rk-ink-soft); }
  .rk-order-item .rk-oi-price{ margin-left:auto; font-family: var(--rk-font-mono); font-weight:700; }

  .rk-gift-tier{ margin-bottom:18px; }
  .rk-gift-tier .rk-gt-head{ font-size:13.5px; font-weight:700; margin-bottom:2px; }
  .rk-gift-tier .rk-gt-sub{ font-size:12px; color: var(--rk-ink-soft); margin-bottom:10px; }
  .rk-gift-option{
    display:flex; align-items:center; gap:12px;
    border: 1.5px solid var(--rk-border); border-radius: var(--rk-radius-sm);
    padding:10px; margin-bottom:8px; cursor:pointer;
  }
  .rk-gift-option img{ width:52px; height:52px; border-radius:8px; object-fit:cover; }
  .rk-gift-option input[type="checkbox"]{ margin-left:auto; width:18px; height:18px; accent-color: var(--rk-primary); }

  .rk-bottom-bar{
    position:fixed; left:0; right:0; bottom:0; z-index:150;
    background: rgba(255,255,255,.97); backdrop-filter: blur(10px);
    border-top: 1px solid var(--rk-border);
    padding: 12px 18px calc(12px + env(safe-area-inset-bottom));
    display:flex; gap:10px;
  }
</style>
</head>
<body>

<div id="rkChrome"></div>

<div class="rk-steps">
  <div class="rk-step rk-step-active" id="stepDot-1">
    <div class="rk-step-dot">1</div>ที่อยู่
  </div>
  <div class="rk-step-line"></div>
  <div class="rk-step" id="stepDot-2">
    <div class="rk-step-dot">2</div>ของแถม
  </div>
  <div class="rk-step-line"></div>
  <div class="rk-step" id="stepDot-3">
    <div class="rk-step-dot">3</div>ตรวจสอบ
  </div>
</div>

<!-- STEP 1: ที่อยู่ -->
<div id="panel-1" class="rk-step-panel">
  <div class="rk-card" style="margin-bottom:14px;">
    <h2 style="font-size:15px;">📍 ที่อยู่จัดส่ง</h2>
    <div class="rk-field">
      <label>อีเมล</label>
      <input id="email" type="email" placeholder="you@email.com">
      <div class="rk-field-msg">กรอกอีเมลให้ถูกต้อง เช่น name@email.com</div>
    </div>
    <button class="rk-btn rk-btn-outline" style="margin-bottom:16px;" onclick="loadAddress()">
      📥 โหลดที่อยู่ที่เคยบันทึกไว้
    </button>
    <div class="rk-field">
      <label>ชื่อผู้รับ</label>
      <input id="receiver" placeholder="ชื่อ-นามสกุล">
      <div class="rk-field-msg">กรอกชื่อผู้รับ</div>
    </div>
    <div class="rk-field">
      <label>เบอร์โทร</label>
      <input id="phone" placeholder="0812345678" inputmode="numeric">
      <div class="rk-field-msg">เบอร์โทรต้องเป็นตัวเลข 10 หลัก ขึ้นต้นด้วย 0</div>
    </div>
    <div class="rk-field">
      <label>Twitter / Discord (ถ้ามี)</label>
      <input id="social" placeholder="@handle">
    </div>
    <div class="rk-field">
      <label>ที่อยู่</label>
      <textarea id="address" rows="2" placeholder="บ้านเลขที่ ถนน ซอย"></textarea>
      <div class="rk-field-msg">กรอกที่อยู่</div>
    </div>
    <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
      <div class="rk-field"><label>แขวง/ตำบล</label><input id="subdistrict"></div>
      <div class="rk-field"><label>เขต/อำเภอ</label><input id="district"></div>
      <div class="rk-field"><label>จังหวัด</label><input id="province"></div>
      <div class="rk-field"><label>รหัสไปรษณีย์</label><input id="postcode" inputmode="numeric"></div>
    </div>
    <button class="rk-btn rk-btn-outline rk-btn-block" onclick="saveAddress()">💾 บันทึกที่อยู่นี้ไว้ใช้ครั้งหน้า</button>
  </div>
</div>

<!-- STEP 2: ของแถม -->
<div id="panel-2" class="rk-step-panel rk-hidden">
  <div id="giftSection"></div>
  <div id="noGiftMsg" class="rk-empty rk-hidden">
    <div class="rk-empty-emoji">🎁</div>รอบนี้ยังไม่มีของแถม ไปต่อได้เลย
  </div>
</div>

<!-- STEP 3: ตรวจสอบ -->
<div id="panel-3" class="rk-step-panel rk-hidden">
  <div class="rk-card" style="margin-bottom:14px;">
    <h2 style="font-size:15px;">รายการสินค้า</h2>
    <div id="reviewItems"></div>
  </div>
  <div class="rk-card">
    <h2 style="font-size:15px;">📍 จัดส่งไปที่</h2>
    <div id="reviewAddress" style="font-size:13.5px; color: var(--rk-ink-soft); line-height:1.7;"></div>
  </div>
  <div class="rk-card" style="margin-top:14px; display:flex; justify-content:space-between; align-items:center;">
    <span style="font-weight:600;">ยอดรวมทั้งหมด</span>
    <span class="rk-price" style="font-size:20px;" id="reviewTotal">฿0</span>
  </div>
</div>

<div class="rk-bottom-bar">
  <button class="rk-btn rk-btn-outline" id="backBtn" style="flex:0 0 90px;" onclick="prevStep()">ย้อนกลับ</button>
  <button class="rk-btn rk-btn-primary rk-btn-block" id="nextBtn" onclick="nextStep()">ถัดไป</button>
</div>

<script src="toast.js"></script>
<script src="shared.js"></script>
<script>
let cart = [];
let currentStep = 1;
let addressData = {};

init();

function init() {
  cart = JSON.parse(localStorage.getItem("checkoutCart") || "[]");
  if (cart.length === 0) cart = RinkaCart.get();
  if (cart.length === 0) {
    showToast("ไม่พบสินค้าที่จะสั่งซื้อ", "error");
    setTimeout(() => (location.href = "cart.html"), 1200);
    return;
  }
  document.getElementById("backBtn").classList.add("rk-hidden");
  loadGifts();
}

/* ---------- Step navigation ---------- */
function goToStep(step) {
  [1, 2, 3].forEach((s) => {
    document.getElementById(`panel-${s}`).classList.toggle("rk-hidden", s !== step);
    const dot = document.getElementById(`stepDot-${s}`);
    dot.classList.toggle("rk-step-active", s === step);
    dot.classList.toggle("rk-step-done", s < step);
  });
  document.getElementById("backBtn").classList.toggle("rk-hidden", step === 1);
  document.getElementById("nextBtn").textContent = step === 3 ? "ไปหน้าชำระเงิน" : "ถัดไป";
  currentStep = step;
  if (step === 3) renderReview();
  window.scrollTo({ top: 0, behavior: "smooth" });
}
function prevStep() {
  if (currentStep > 1) goToStep(currentStep - 1);
}
function nextStep() {
  if (currentStep === 1) {
    if (!validateStep1()) return;
    goToStep(2);
  } else if (currentStep === 2) {
    goToStep(3);
  } else {
    submitAndGoToPayment();
  }
}

/* ---------- Step 1: address ---------- */
function validateStep1() {
  let ok = true;
  const emailEl = document.getElementById("email");
  const receiverEl = document.getElementById("receiver");
  const phoneEl = document.getElementById("phone");
  const addressEl = document.getElementById("address");

  if (!RinkaValidate.email(emailEl.value)) {
    RinkaValidate.markError(emailEl, "กรอกอีเมลให้ถูกต้อง เช่น name@email.com");
    ok = false;
  } else RinkaValidate.clearError(emailEl);

  if (!RinkaValidate.notEmpty(receiverEl.value)) {
    RinkaValidate.markError(receiverEl, "กรอกชื่อผู้รับ");
    ok = false;
  } else RinkaValidate.clearError(receiverEl);

  if (!RinkaValidate.thaiPhone(phoneEl.value)) {
    RinkaValidate.markError(phoneEl, "เบอร์โทรต้องเป็นตัวเลข 10 หลัก ขึ้นต้นด้วย 0");
    ok = false;
  } else RinkaValidate.clearError(phoneEl);

  if (!RinkaValidate.notEmpty(addressEl.value)) {
    RinkaValidate.markError(addressEl, "กรอกที่อยู่");
    ok = false;
  } else RinkaValidate.clearError(addressEl);

  if (!ok) showToast("กรอกข้อมูลให้ครบก่อนไปต่อนะครับ", "warning");
  return ok;
}

async function loadAddress() {
  const email = document.getElementById("email").value;
  if (!RinkaValidate.email(email)) {
    showToast("กรอกอีเมลให้ถูกต้องก่อนโหลดที่อยู่", "warning");
    return;
  }
  try {
    const data = await RinkaAPI.get("address", { email });
    if (!data || !data.receiver) {
      showToast("ไม่พบข้อมูลที่อยู่สำหรับอีเมลนี้", "error");
      return;
    }
    document.getElementById("receiver").value = data.receiver || "";
    document.getElementById("phone").value = data.phone || "";
    document.getElementById("social").value = data.twitter || "";
    document.getElementById("address").value = data.address || "";
    document.getElementById("subdistrict").value = data.subdistrict || "";
    document.getElementById("district").value = data.district || "";
    document.getElementById("province").value = data.province || "";
    document.getElementById("postcode").value = data.postcode || "";
    showToast("โหลดที่อยู่สำเร็จ", "success");
  } catch (err) {
    console.error(err);
    showToast("โหลดที่อยู่ไม่สำเร็จ ลองใหม่อีกครั้ง", "error");
  }
}

async function saveAddress() {
  if (!validateStep1()) return;
  const payload = {
    email: document.getElementById("email").value,
    twitter: document.getElementById("social").value,
    contact: "",
    receiver: document.getElementById("receiver").value,
    phone: document.getElementById("phone").value,
    address: document.getElementById("address").value,
    subdistrict: document.getElementById("subdistrict").value,
    district: document.getElementById("district").value,
    province: document.getElementById("province").value,
    postcode: document.getElementById("postcode").value,
  };
  try {
    await RinkaAPI.post("saveAddress", payload);
    showToast("บันทึกที่อยู่เรียบร้อย", "success");
  } catch (err) {
    console.error(err);
    showToast("บันทึกที่อยู่ไม่สำเร็จ", "error");
  }
}

/* ---------- Step 2: gifts ---------- */
async function loadGifts() {
  const collectionTotals = {};
  cart.forEach((item) => {
    if (!item.collection_id) return;
    collectionTotals[item.collection_id] =
      (collectionTotals[item.collection_id] || 0) + Number(item.price) * Number(item.qty);
  });

  const collectionIds = Object.keys(collectionTotals);
  if (collectionIds.length === 0) {
    document.getElementById("noGiftMsg").classList.remove("rk-hidden");
    return;
  }

  try {
    const results = await Promise.all(
      collectionIds.map(async (collectionId) => {
        const total = collectionTotals[collectionId];
        const rules = await RinkaAPI.get("giftRules", { collection_id: collectionId, total });
        if (!rules.length) return null;
        const gifts = await RinkaAPI.get("gifts", { collection_id: collectionId });
        return { collectionId, rules, gifts };
      })
    );

    let html = "";
    results.filter(Boolean).forEach(({ rules, gifts }) => {
      rules.forEach((rule) => {
        const tierGifts = gifts.filter((g) => g.tier_name === rule.tier_name);
        if (!tierGifts.length) return;
        html += `
          <div class="rk-gift-tier">
            <div class="rk-gt-head">🎁 ${rule.tier_name}</div>
            <div class="rk-gt-sub">ซื้อครบ ${formatBaht(rule.min_amount)} เลือกได้ ${rule.max_select} ชิ้น</div>
            ${tierGifts
              .map(
                (gift) => `
              <label class="rk-gift-option">
                <img src="${gift.gift_image}" alt="">
                <span>${gift.gift_name}</span>
                <input type="checkbox" name="gift" class="gift-checkbox"
                  data-tier="${rule.tier_name}" data-max="${rule.max_select}" value="${gift.gift_id}">
              </label>`
              )
              .join("")}
          </div>`;
      });
    });

    if (html) {
      document.getElementById("giftSection").innerHTML = html;
    } else {
      document.getElementById("noGiftMsg").classList.remove("rk-hidden");
    }
  } catch (err) {
    console.error("loadGifts error", err);
  }
}

document.addEventListener("change", (e) => {
  if (!e.target.classList.contains("gift-checkbox")) return;
  const tier = e.target.dataset.tier;
  const max = Number(e.target.dataset.max);
  const checked = document.querySelectorAll(`.gift-checkbox[data-tier="${tier}"]:checked`);
  if (checked.length > max) {
    e.target.checked = false;
    showToast(`เลือกของแถมทีเดียวได้สูงสุด ${max} ชิ้น`, "warning");
  }
});

/* ---------- Step 3: review ---------- */
function renderReview() {
  let total = 0;
  document.getElementById("reviewItems").innerHTML = cart
    .map((item) => {
      const price = Number(item.final_price ?? item.price ?? 0);
      const lineTotal = price * Number(item.qty);
      total += lineTotal;
      return `
        <div class="rk-order-item">
          <img src="${item.image || ""}" alt="">
          <div>
            <div class="rk-oi-name">${item.name}</div>
            <div class="rk-oi-sub">${item.qty} ชิ้น × ${formatBaht(price)}</div>
          </div>
          <div class="rk-oi-price">${formatBaht(lineTotal)}</div>
        </div>`;
    })
    .join("");
  document.getElementById("reviewTotal").textContent = formatBaht(total);

  const a = collectAddress();
  document.getElementById("reviewAddress").innerHTML = `
    ${a.receiver} · ${a.phone}<br>
    ${a.address} ${a.subdistrict} ${a.district}<br>
    ${a.province} ${a.postcode}
  `;
}

function collectAddress() {
  const gifts = [];
  document.querySelectorAll('input[name="gift"]:checked').forEach((el) => {
    gifts.push({ gift_id: el.value, character_name: "" });
  });
  return {
    email: document.getElementById("email").value,
    receiver: document.getElementById("receiver").value,
    phone: document.getElementById("phone").value,
    social: document.getElementById("social").value,
    address: document.getElementById("address").value,
    subdistrict: document.getElementById("subdistrict").value,
    district: document.getElementById("district").value,
    province: document.getElementById("province").value,
    postcode: document.getElementById("postcode").value,
    gifts,
  };
}

function submitAndGoToPayment() {
  addressData = collectAddress();
  localStorage.setItem("checkoutAddress", JSON.stringify(addressData));
  location.href = "payment.html";
}
</script>
</body>
</html>
