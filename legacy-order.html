<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>รายละเอียดออเดอร์เก่า | Rinka Shop</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link
href="https://fonts.googleapis.com/css2?family=Kodchasan:wght@400;500;600;700&display=swap"
rel="stylesheet"
>

<style>

:root{
  --p:#7dcfff;
  --pd:#4ba5db;
  --bg:#f6fbff;
  --text:#334155;
  --muted:#64748b;
  --border:#dbe7f1;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:'Kodchasan',sans-serif;
  color:var(--text);
  background:linear-gradient(180deg,#fbfdff,var(--bg));
}

button,
a{
  font:inherit;
}

button{
  cursor:pointer;
}

.topbar{
  position:sticky;
  top:0;
  z-index:100;
  min-height:68px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:11px 16px;
  background:rgba(255,255,255,.94);
  border-bottom:1px solid var(--border);
  backdrop-filter:blur(10px);
}

.topbar button,
.topbar a{
  width:46px;
  height:46px;
  border:none;
  border-radius:999px;
  background:#fff;
  color:var(--text);
  display:flex;
  align-items:center;
  justify-content:center;
  text-decoration:none;
  font-size:21px;
  box-shadow:0 4px 14px rgba(71,85,105,.1);
}

.topbar h1{
  margin:0;
  flex:1;
  text-align:center;
  font-size:20px;
  color:#3f6078;
}

.container{
  width:min(760px,100%);
  margin:auto;
  padding:20px 16px 50px;
}

.legacy-notice{
  margin-bottom:14px;
  padding:12px 14px;
  border:1px solid #ddd6fe;
  border-radius:14px;
  background:#f5f3ff;
  color:#5b21b6;
  font-size:12px;
  line-height:1.7;
}

.card{
  margin-bottom:14px;
  padding:17px;
  border:1px solid var(--border);
  border-radius:19px;
  background:#fff;
  box-shadow:0 7px 22px rgba(86,142,178,.07);
}

.card h2{
  margin:0 0 13px;
  font-size:17px;
  color:#3f6078;
}

.product{
  display:grid;
  grid-template-columns:110px minmax(0,1fr);
  gap:15px;
}

.product-image{
  width:110px;
  height:110px;
  border-radius:15px;
  object-fit:cover;
  background:#edf7fc;
}

.image-placeholder{
  width:110px;
  height:110px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:15px;
  background:#edf7fc;
  font-size:38px;
}

.product-name{
  font-size:17px;
  font-weight:700;
  line-height:1.55;
}

.fandom{
  margin-top:5px;
  color:var(--muted);
  font-size:12px;
}

.badges{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
  margin-top:9px;
}

.badge{
  display:inline-flex;
  padding:5px 9px;
  border-radius:999px;
  font-size:10px;
  font-weight:700;
}

.badge-old{
  background:#f5f3ff;
  color:#6d28d9;
}

.badge-qty{
  background:#eff6ff;
  color:#1d4ed8;
}

.badge-status{
  background:#ecfdf5;
  color:#166534;
}

.detail-list{
  display:grid;
  gap:0;
}

.detail-row{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:20px;
  padding:11px 0;
  border-bottom:1px solid #edf2f6;
}

.detail-row:last-child{
  border-bottom:none;
}

.detail-label{
  color:var(--muted);
  font-size:12px;
}

.detail-value{
  text-align:right;
  font-size:13px;
  font-weight:600;
  overflow-wrap:anywhere;
}

.money-paid{
  color:#166534;
}

.money-remaining{
  color:#be123c;
}

.total-box{
  margin-top:12px;
  padding:13px;
  border-radius:13px;
  background:#f8fbff;
}

.total-row{
  display:flex;
  justify-content:space-between;
  gap:15px;
  padding:5px 0;
  font-size:13px;
}

.total-row strong{
  color:#287caf;
}

.state{
  min-height:360px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:10px;
  padding:25px;
  text-align:center;
  border:1px solid var(--border);
  border-radius:21px;
  background:#fff;
}

.state h2{
  margin:5px 0 0;
}

.state p{
  margin:0;
  color:var(--muted);
  line-height:1.7;
}

.state button,
.state a{
  margin-top:5px;
  padding:10px 17px;
  border:none;
  border-radius:999px;
  background:var(--p);
  color:#fff;
  text-decoration:none;
  font-weight:700;
}

.spinner{
  width:36px;
  height:36px;
  border:4px solid #dff2fc;
  border-top-color:var(--pd);
  border-radius:50%;
  animation:spin .8s linear infinite;
}

@keyframes spin{
  to{
    transform:rotate(360deg);
  }
}

@media(max-width:600px){

  .topbar{
    min-height:64px;
    padding:9px 11px;
  }

  .topbar h1{
    font-size:17px;
  }

  .container{
    padding:14px 10px 36px;
  }

  .product{
    grid-template-columns:82px minmax(0,1fr);
    gap:11px;
  }

  .product-image,
  .image-placeholder{
    width:82px;
    height:82px;
  }

  .detail-row{
    gap:10px;
  }

}

</style>

</head>

<body>

<header class="topbar">

<button
type="button"
onclick="goBack()"
aria-label="กลับ"
>
←
</button>

<h1>
รายละเอียดออเดอร์เก่า
</h1>

<a
href="account.html"
aria-label="บัญชี"
>
👤
</a>

</header>


<main class="container">

<section
id="content"
class="state"
>

<div class="spinner"></div>

<h2>
กำลังโหลดออเดอร์
</h2>

<p>
กำลังค้นหาข้อมูลจากระบบเก่า...
</p>

</section>

</main>


<script>

const API =
  "https://script.google.com/macros/s/AKfycbxKjVvn8AXrK0wDvKqN-A9yS2Vk8R-w25ar1b9ftiIdUgUvFaShunLnFnAyIDuaTWj76w/exec";


const customer =
  safeJson(
    localStorage.getItem(
      "customer"
    ),
    {}
  );


const sessionToken =
  String(
    customer.session_token ||
    localStorage.getItem(
      "session_token"
    ) ||
    ""
  ).trim();


const params =
  new URLSearchParams(
    location.search
  );


const legacyId =
  String(
    params.get("id") || ""
  ).trim();


document.addEventListener(
  "DOMContentLoaded",
  () => {

    if(!sessionToken){

      location.replace(
        "login.html"
      );

      return;

    }


    if(!legacyId){

      showError(
        "ไม่พบรหัสรายการออเดอร์"
      );

      return;

    }


    loadLegacyOrder();

  }
);


/*
=========================================
LOAD
=========================================
*/

async function loadLegacyOrder(){

  try{

    const query =
      new URLSearchParams({

        action:
          "legacyOrder",

        session_token:
          sessionToken,

        legacy_id:
          legacyId

      });


    const response =
      await fetch(
        API +
        "?" +
        query.toString()
      );


    if(!response.ok){

      throw new Error(
        "HTTP " +
        response.status
      );

    }


    const result =
      await response.json();


    if(
      !result ||
      result.success !== true
    ){

      throw new Error(
        result &&
        (
          result.error ||
          result.message
        )
          ? (
              result.error ||
              result.message
            )
          : "ไม่พบข้อมูลออเดอร์"
      );

    }


    if(!result.order){

      throw new Error(
        "ไม่พบข้อมูลออเดอร์"
      );

    }


    renderLegacyOrder(
      result.order
    );


  }catch(error){

    console.error(
      error
    );


    showError(
      error.message ||
      String(error)
    );

  }

}


/*
=========================================
RENDER
=========================================
*/

function renderLegacyOrder(
  order
){

  const box =
    document.getElementById(
      "content"
    );


  const name =
    String(
      order.product_name ||
      "สินค้า"
    );


  const fandom =
    String(
      order.fandom ||
      "ระบบเดิม"
    );


  const image =
    String(
      order.image || ""
    ).trim();


  const qty =
    Math.max(
      0,
      Number(
        order.qty || 0
      )
    );


  const paymentType =
    String(
      order.payment_type || ""
    ).trim();


  const status =
    String(
      order.status || ""
    ).trim();


  const shippingDate =
    String(
      order.shop_shipping_date ||
      ""
    ).trim();


  const paid =
    Number(
      order.paid || 0
    );


  const remaining =
    Number(
      order.remaining || 0
    );


  const importFee =
    Number(
      order.import_fee || 0
    );


  const domesticFee =
    Number(
      order.domestic_shipping_fee ||
      0
    );


  box.className = "";


  box.innerHTML = `

    <div class="legacy-notice">

      🗃️ รายการนี้เป็นข้อมูลจากระบบออเดอร์เดิมของร้าน
      จึงอาจมีรูปแบบสถานะและรายละเอียดต่างจากออเดอร์ระบบปัจจุบัน

    </div>


    <section class="card">

      <h2>
        🛍️ รายการสินค้า
      </h2>


      <div class="product">


        ${
          image

            ? `

              <img
                class="product-image"
                src="${attr(image)}"
                alt="${attr(name)}"
                loading="lazy"
                onerror="
                  this.style.display='none';
                  this.nextElementSibling.style.display='flex';
                "
              >

              <div
                class="image-placeholder"
                style="display:none"
              >
                📦
              </div>

            `

            : `

              <div class="image-placeholder">
                📦
              </div>

            `
        }


        <div>

          <div class="product-name">
            ${esc(name)}
          </div>


          <div class="fandom">
            ${esc(fandom)}
          </div>


          <div class="badges">

            <span class="badge badge-old">
              ออเดอร์เก่า
            </span>


            <span class="badge badge-qty">
              × ${qty}
            </span>


            ${
              status
                ? `

                  <span class="badge badge-status">
                    ${esc(status)}
                  </span>

                `
                : ""
            }

          </div>

        </div>

      </div>

    </section>


    <section class="card">

      <h2>
        🧾 รายละเอียด
      </h2>


      <div class="detail-list">


        <div class="detail-row">

          <div class="detail-label">
            Fandom
          </div>

          <div class="detail-value">
            ${esc(fandom)}
          </div>

        </div>


        <div class="detail-row">

          <div class="detail-label">
            จำนวน
          </div>

          <div class="detail-value">
            ${qty} ชิ้น
          </div>

        </div>


        <div class="detail-row">

          <div class="detail-label">
            การชำระ
          </div>

          <div class="detail-value">
            ${esc(
              paymentType ||
              "-"
            )}
          </div>

        </div>


        <div class="detail-row">

          <div class="detail-label">
            สถานะ
          </div>

          <div class="detail-value">
            ${esc(
              status ||
              "-"
            )}
          </div>

        </div>


        <div class="detail-row">

          <div class="detail-label">
            วันที่ร้านจัดส่ง
          </div>

          <div class="detail-value">
            ${esc(
              shippingDate ||
              "-"
            )}
          </div>

        </div>


      </div>

    </section>


    <section class="card">

      <h2>
        💳 การชำระเงิน
      </h2>


      <div class="total-box">


        <div class="total-row">

          <span>
            ชำระแล้ว
          </span>

          <strong class="money-paid">
            ฿${money(paid)}
          </strong>

        </div>


        <div class="total-row">

          <span>
            คงเหลือ
          </span>

          <strong
            class="${
              remaining > 0
                ? "money-remaining"
                : "money-paid"
            }"
          >
            ฿${money(
              remaining
            )}
          </strong>

        </div>


        <div class="total-row">

          <span>
            ค่านำเข้า
          </span>

          <strong>
            ${
              importFee
                ? "฿" +
                  money(
                    importFee
                  )
                : "-"
            }
          </strong>

        </div>


        <div class="total-row">

          <span>
            ค่าส่งในไทย
          </span>

          <strong>
            ${
              domesticFee
                ? "฿" +
                  money(
                    domesticFee
                  )
                : "-"
            }
          </strong>

        </div>


      </div>

    </section>

  `;

}


/*
=========================================
ERROR
=========================================
*/

function showError(
  message
){

  const box =
    document.getElementById(
      "content"
    );


  box.className =
    "state";


  box.innerHTML = `

    <div
      style="
        font-size:50px;
      "
    >
      ⚠️
    </div>

    <h2>
      เปิดออเดอร์ไม่สำเร็จ
    </h2>

    <p>
      ${esc(
        message ||
        "ไม่พบข้อมูล"
      )}
    </p>

    <a href="orders.html">
      กลับรายการออเดอร์
    </a>

  `;

}


/*
=========================================
HELPERS
=========================================
*/

function money(
  value
){

  return Number(
    value || 0
  ).toLocaleString(
    "th-TH",
    {
      minimumFractionDigits:0,
      maximumFractionDigits:2
    }
  );

}


function goBack(){

  if(
    document.referrer &&
    document.referrer !==
    location.href
  ){

    history.back();

  }else{

    location.href =
      "orders.html";

  }

}


function safeJson(
  value,
  fallback
){

  try{

    return JSON.parse(
      value || ""
    );

  }catch(error){

    return fallback;

  }

}


function esc(
  value
){

  return String(
    value ?? ""
  )
    .replaceAll(
      "&",
      "&amp;"
    )
    .replaceAll(
      "<",
      "&lt;"
    )
    .replaceAll(
      ">",
      "&gt;"
    )
    .replaceAll(
      '"',
      "&quot;"
    )
    .replaceAll(
      "'",
      "&#039;"
    );

}


function attr(
  value
){

  return esc(
    value
  );

}

</script>

</body>

</html>
