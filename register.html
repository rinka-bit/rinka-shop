<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>สมัครสมาชิก | Rinka Shop</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;600;700&family=Noto+Serif+Thai:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="site-header"></div>

<section class="section">
  <div class="wrap" style="max-width:420px;">
    <h2 class="center">สมัครสมาชิก</h2>
    <form id="registerForm" class="panel stack">
      <div class="field"><label>ชื่อผู้ใช้ *</label><input name="username" required></div>
      <div class="field"><label>อีเมล *</label><input type="email" name="email" required></div>
      <div class="field"><label>Twitter/X (ไม่ต้องใส่ @) *</label><input name="twitter" required></div>
      <div class="field"><label>รหัสผ่าน (อย่างน้อย 8 ตัวอักษร) *</label><input type="password" name="password" required minlength="8"></div>
      <div class="field"><label>ยืนยันรหัสผ่าน *</label><input type="password" name="confirm_password" required minlength="8"></div>
      <button class="btn btn-primary btn-block" id="registerBtn">สมัครสมาชิก</button>
    </form>
    <p class="center hint">มีบัญชีอยู่แล้ว? <a href="login.html" style="font-weight:700;">เข้าสู่ระบบ</a></p>
  </div>
</section>

<div id="site-footer"></div>
<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/cart.js"></script>
<script src="js/common.js"></script>
<script>
document.getElementById("registerForm").addEventListener("submit", async e => {
  e.preventDefault();
  const fd = new FormData(e.target);
  if(fd.get("password") !== fd.get("confirm_password")){
    toast("รหัสผ่านไม่ตรงกัน", true); return;
  }
  const btn = document.getElementById("registerBtn");
  btn.disabled = true; btn.textContent = "กำลังสมัครสมาชิก...";
  try{
    const res = await RinkaAPI.registerCustomer({
      username: fd.get("username"),
      email: fd.get("email"),
      twitter: fd.get("twitter"),
      password: fd.get("password"),
      confirm_password: fd.get("confirm_password")
    });
    if(res && res.success){
      RinkaAuth.set(res);
      toast("สมัครสมาชิกสำเร็จ");
      location.href = "account.html";
    } else {
      toast(res.error || "สมัครสมาชิกไม่สำเร็จ", true);
      btn.disabled = false; btn.textContent = "สมัครสมาชิก";
    }
  }catch(e){ toast("เกิดข้อผิดพลาด", true); btn.disabled = false; btn.textContent = "สมัครสมาชิก"; }
});
</script>
</body>
</html>
