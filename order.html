<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1">

<title>
ตรวจสอบคำสั่งซื้อ
</title>

<style>

body{
  font-family:Arial,sans-serif;
  max-width:800px;
  margin:auto;
  padding:20px;
}

.card{

background:white;

border-radius:16px;

padding:20px;

box-shadow:
0 2px 10px rgba(0,0,0,.05);

}

table{
  width:100%;
  border-collapse:collapse;
}

th,
td{
  border:1px solid #ddd;
  padding:10px;
}

.badge{
display:inline-block;
padding:6px 12px;
border-radius:999px;
font-size:14px;
font-weight:bold;
}

.badge-paid{
background:#dcfce7;
color:#166534;
}

.badge-pending{
background:#fef3c7;
color:#92400e;
}

.badge-processing{
background:#dbeafe;
color:#1d4ed8;
}

.badge-completed{
background:#dcfce7;
color:#166534;
}

.badge-shipping-unpaid{
background:#fef3c7;
color:#92400e;
}

.badge-shipping-paid{
background:#dcfce7;
color:#166534;
}

.badge-shipping-combine{
background:#dbeafe;
color:#1d4ed8;
}
  
.copy-btn{
background:#4f46e5;
color:white;
border:none;
padding:10px 16px;
border-radius:8px;
cursor:pointer;
margin-top:10px;
}

.topbar{

display:flex;
justify-content:space-between;

margin-bottom:20px;

}

.topbar button,
.topbar a{

width:44px;
height:44px;

border:none;

border-radius:999px;

background:white;

display:flex;
align-items:center;
justify-content:center;

text-decoration:none;

font-size:20px;

box-shadow:
0 2px 8px rgba(0,0,0,.08);

}
  
</style>

</head>

<body>

<div class="topbar">

<button
onclick="history.back()">

←

</button>

<a
href="cart.html">

🛒

</a>

</div>
  
<h1>
ตรวจสอบคำสั่งซื้อ
</h1>

<div
id="orderBox"
class="card">

กำลังโหลด...

</div>

<script>

const API =
"https://script.google.com/macros/s/AKfycbxKjVvn8AXrK0wDvKqN-A9yS2Vk8R-w25ar1b9ftiIdUgUvFaShunLnFnAyIDuaTWj76w/exec";

const params =
new URLSearchParams(
window.location.search
);

const orderId =
params.get("id");

async function loadOrder(){

  const response =
    await fetch(
      API +
      "?action=order&id=" +
      orderId
    );

  const result =
    await response.json();

  if(!result.success){

    document
      .getElementById(
        "orderBox"
      )
      .innerHTML =
      "ไม่พบออเดอร์";

    return;

  }

  const order =
    result.order;

  let html = `
    <p>
    เลขออเดอร์:
    <b>
    ${order.order_id}
    </b>
    </p>

    <p>
สถานะ:
${getStatusBadge(order.status)}
</p>

${getOrderTimeline(order.status)}

    <p>
    การชำระเงิน:
    ${order.payment_status === "paid"
    ? '<span class="badge badge-paid">ชำระเงินแล้ว</span>'
    : '<span class="badge badge-pending">รอชำระเงิน</span>'}
    </p>

    <div
    style="
    margin:20px 0;
    padding:15px;
    background:#f8fafc;
    border-radius:12px;
    ">

    <h3>
    🚚 ข้อมูลการจัดส่ง
    </h3>

    <p>
    <b>ขนส่ง:</b>
    ${order.courier || "-"}
    </p>

    <p>
    <b>สถานะจัดส่ง:</b>
    ${order.shipping_status || "-"}
    </p>

    <p>
<b>สถานะค่าส่ง:</b>
${getShippingPaymentBadge(order.shipping_payment_status)}
</p>

${
  order.status === "ready_to_ship" &&
  order.shipping_payment_status === "unpaid"

  ?

  `

  <button
  class="copy-btn"
  onclick="
  window.location.href=
  'shipping-payment.html?id=${order.order_id}'
  ">
  💳 ยืนยันที่อยู่ / ชำระค่าส่ง
  </button>

  `

  :

  ""

}

<p>
<b>เลขพัสดุ:</b>
${order.tracking_no || "-"}
</p>

    ${
    order.tracking_no
    
    ?
    
    `

    <button
class="copy-btn"
onclick="
copyTracking(
'${order.tracking_no}'
)
">

Copy Tracking Number

</button>

    `

    :

    ""

    }

    </div>

    <table>

      <tr>

        <th>
        สินค้า
        </th>

        <th>
        จำนวน
        </th>

        <th>
        ราคารวม
        </th>

      </tr>
  `;

 order.items.forEach(item=>{

  let optionHtml = "";

  if(item.selected_option){

    try{

      const options =

      JSON.parse(
        item.selected_option
      );

      optionHtml =

      Object.entries(options)

      .map(
        ([key,value])=>

        `<div style="
        font-size:13px;
        color:#666;
        margin-top:4px;
        ">

        ${key} :

        ${
          Array.isArray(value)
          ? value.join(", ")
          : value
        }

        </div>`

      )

      .join("");

    }
    catch(e){}

  }

  html += `
<tr>

<td>

<div
style="
display:flex;
gap:10px;
align-items:flex-start;
">

<img
src="${item.image}"
style="
width:60px;
height:60px;
object-fit:cover;
border-radius:10px;
">

<div>

<b>
${item.name}
</b>

${optionHtml}

</div>

</div>

</td>

      <td>
      ${item.qty}
      </td>

<td>
${
Number(item.price)
*
Number(item.qty)
}
</td>

    </tr>
  `;

});

let giftHtml = "";

if(
  order.gifts &&
  order.gifts.length
){

  giftHtml += `

<h3>
🎁 ของแถม
</h3>

`;

  order.gifts.forEach(gift=>{

  giftHtml += `

<div
style="
display:flex;
gap:12px;
align-items:center;
margin-bottom:10px;
padding:10px;
border:1px solid #eee;
border-radius:10px;
">

<img
src="${gift.gift_image}"
style="
width:60px;
height:60px;
object-fit:cover;
border-radius:8px;
">

<div>

${gift.gift_name}

${
gift.character_name

?

`<div
style="
font-size:13px;
color:#666;
margin-top:4px;
">

ตัวละคร:
${gift.character_name}

</div>`

:

""

}

</div>

</div>

`;  

  });

}

html += `

</table>

${giftHtml}

<h3>
รวม
${order.total}
บาท
</h3>

`;

  document
    .getElementById(
      "orderBox"
    )
    .innerHTML =
      html;

}

loadOrder();

function getStatusBadge(status){

switch(status){

case "pending":

return `
<span class="badge badge-pending">
📦 รอจัดการ
</span>
`;

case "china_arrived":

return `
<span class="badge badge-processing">
🏭 ถึงโกดังจีนแล้ว
</span>
`;

case "shipping_to_th":

return `
<span class="badge badge-processing">
🚚 กำลังมาไทย
</span>
`;

case "ready_to_ship":

return `
<span class="badge badge-processing">
📬 เตรียมจัดส่ง
</span>
`;

case "shipped":

return `
<span class="badge badge-completed">
✅ จัดส่งแล้ว
</span>
`;

default:

return status;

}

}

function getShippingPaymentBadge(status){

  switch(status){

    case "paid":
      return `
      <span class="badge badge-shipping-paid">
      ชำระค่าส่งแล้ว
      </span>
      `;

    case "combine_later":
      return `
      <span class="badge badge-shipping-combine">
      รอส่งรวม
      </span>
      `;

    default:
      return `
      <span class="badge badge-shipping-unpaid">
      รอชำระค่าส่ง
      </span>
      `;

  }

}

function getOrderTimeline(currentStatus){

  const steps = [

    ["pending","📦","รอจัดการ"],

    ["china_arrived","🏭","ถึงโกดังจีนแล้ว"],

    ["shipping_to_th","🚚","กำลังมาไทย"],

    ["ready_to_ship","📬","เตรียมจัดส่ง"],

    ["shipped","✅","จัดส่งแล้ว"]

  ];

  const currentIndex =
    steps.findIndex(
      step => step[0] === currentStatus
    );

  let html = `

<div style="
margin:20px 0;
padding:18px;
background:#f8fbff;
border-radius:16px;
border:1px solid #e5eefc;
">

<h3 style="margin-top:0;">
📍 ติดตามสถานะออเดอร์
</h3>

`;

  steps.forEach((step,index)=>{

    const done =
      index <= currentIndex;

    html += `

<div style="
display:flex;
align-items:flex-start;
">

<div
style="
width:28px;
text-align:center;
font-size:18px;
">

${done ? "🟢" : "⚪"}

</div>

<div
style="
flex:1;
padding-left:12px;
padding-bottom:${
index !== steps.length-1
? "18px"
: "0"
};
border-left:${
index !== steps.length-1
? "2px solid #cbd5e1"
: "none"
};
margin-left:-15px;
">

<div style="
font-weight:${
done
? "700"
: "400"
};
color:${
done
? "#166534"
: "#64748b"
};
">

${step[1]}
${step[2]}

</div>

</div>

</div>

`;

  });

  html += "</div>";

  return html;

}

function copyTracking(no){

navigator.clipboard.writeText(no);

alert(
"คัดลอกเลขพัสดุแล้ว"
);

}
  
</script>

</body>

</html>
