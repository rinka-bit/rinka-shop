<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1">

<title>
ตรวจสอบคำสั่งซื้อ
</title>

<style>

body{
  font-family:Arial,sans-serif;
  max-width:800px;
  margin:auto;
  padding:20px;
}

.card{
  background:white;
  border-radius:12px;
  padding:20px;
  box-shadow:0 2px 8px rgba(0,0,0,.1);
}

table{
  width:100%;
  border-collapse:collapse;
}

th,
td{
  border:1px solid #ddd;
  padding:10px;
}

.badge{
display:inline-block;
padding:6px 12px;
border-radius:999px;
font-size:14px;
font-weight:bold;
}

.badge-paid{
background:#dcfce7;
color:#166534;
}

.badge-pending{
background:#fef3c7;
color:#92400e;
}

.badge-processing{
background:#dbeafe;
color:#1d4ed8;
}

.badge-completed{
background:#dcfce7;
color:#166534;
}

.copy-btn{
background:#4f46e5;
color:white;
border:none;
padding:10px 16px;
border-radius:8px;
cursor:pointer;
margin-top:10px;
}
  
</style>

</head>

<body>

<h1>
ตรวจสอบคำสั่งซื้อ
</h1>

<div
id="orderBox"
class="card">

กำลังโหลด...

</div>

<script>

const API =
"https://script.google.com/macros/s/AKfycbxKjVvn8AXrK0wDvKqN-A9yS2Vk8R-w25ar1b9ftiIdUgUvFaShunLnFnAyIDuaTWj76w/exec";

const params =
new URLSearchParams(
window.location.search
);

const orderId =
params.get("id");

async function loadOrder(){

  const response =
    await fetch(
      API +
      "?action=order&id=" +
      orderId
    );

  const result =
    await response.json();

  if(!result.success){

    document
      .getElementById(
        "orderBox"
      )
      .innerHTML =
      "ไม่พบออเดอร์";

    return;

  }

  const order =
    result.order;

  let html = `
    <p>
    เลขออเดอร์:
    <b>
    ${order.order_id}
    </b>
    </p>

    <p>
    สถานะ:
    ${getStatusBadge(order.status)}
    </p>

    <p>
    การชำระเงิน:
    ${order.payment_status === "paid"
    ? '<span class="badge badge-paid">ชำระเงินแล้ว</span>'
    : '<span class="badge badge-pending">รอชำระเงิน</span>'}
    </p>

    <div
    style="
    margin:20px 0;
    padding:15px;
    background:#f8fafc;
    border-radius:12px;
    ">

    <h3>
    🚚 ข้อมูลการจัดส่ง
    </h3>

    <p>
    <b>ขนส่ง:</b>
    ${order.courier || "-"}
    </p>

    <p>
    <b>สถานะจัดส่ง:</b>
    ${order.shipping_status || "-"}
    </p>
    
    <p>
    <b>เลขพัสดุ:</b>
    ${order.tracking_no || "-"}
    </p>

    ${
    order.tracking_no
    
    ?
    
    `

    <button
    onclick="
    copyTracking(
    '${order.tracking_no}'
    )
    ">

    copy tracking number

    </button>

    `

    :

    ""

    }

    </div>

    <table>

      <tr>

        <th>
        สินค้า
        </th>

        <th>
        จำนวน
        </th>

        <th>
        ราคา
        </th>

      </tr>
  `;

  order.items.forEach(item=>{

    html += `
      <tr>

        <td>
        ${item.name}
        </td>

        <td>
        ${item.qty}
        </td>

        <td>
        ${item.price}
        </td>

      </tr>
    `;

  });

  html += `
    </table>

    <h3>
    รวม
    ${order.total}
    บาท
    </h3>
  `;

  document
    .getElementById(
      "orderBox"
    )
    .innerHTML =
      html;

}

loadOrder();

function getStatusBadge(status){

switch(status){

case "pending":
return `
<span class="badge badge-pending">
รอจัดการ
</span>
`;

case "processing":
return `
<span class="badge badge-processing">
กำลังดำเนินการ
</span>
`;

case "completed":
return `
<span class="badge badge-completed">
จัดส่งแล้ว
</span>
`;

default:
return status;

}

}

function copyTracking(no){

navigator.clipboard.writeText(no);

alert(
"คัดลอกเลขพัสดุแล้ว"
);

}

</script>

</body>

</html>
