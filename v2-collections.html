<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rinka Shop V2 — Collections DEV</title><link href="https://fonts.googleapis.com/css2?family=Kodchasan:wght@400;500;600;700&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}body{font-family:Kodchasan,sans-serif;background:#f5faff;color:#183c63;margin:0}a{color:#1465a5;text-decoration:none}header{background:#d9ecff;padding:16px max(16px,calc((100vw - 1100px)/2));display:flex;gap:14px;justify-content:space-between;align-items:center;flex-wrap:wrap}nav{display:flex;gap:14px}.tag{background:white;border:1px solid #a8cef3;border-radius:25px;padding:5px 9px;font-size:12px}.wrap{max-width:1100px;margin:auto;padding:25px 16px 65px}.muted{color:#6683a2;font-size:13px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(245px,1fr));gap:18px;margin:24px 0}.card{display:block;border:1px solid #d2e4f8;background:white;border-radius:17px;overflow:hidden;color:inherit}.image{height:190px;background:#e8f2ff;display:grid;place-items:center;color:#7899b6}.image img{width:100%;height:100%;object-fit:cover}.body{padding:17px}.body h2{font-size:17px;margin:0 0 10px}.empty{padding:22px;background:#fff;border:1px dashed #bdd8ef;border-radius:12px}.error{background:#fff0f0;color:#9c2929;padding:15px;border-radius:12px}</style></head><body><header><strong>☁️ Rinka Shop V2</strong><span class="tag">DEV Preview · ไม่รับคำสั่งซื้อ</span><nav><a href="v2-home.html">Home</a><a href="v2-browse.html">Browse</a></nav></header><main class="wrap"><h1>🔥 Collections / รอบพรี</h1><p class="muted">เลือก Collection เพื่อดูสินค้าที่อยู่ในรอบนั้น · ข้อมูลจาก Supabase DEV เท่านั้น</p><div id="status" role="status">กำลังโหลด Collections…</div><div id="grid" class="grid"></div></main><script src="rinka-v2-api.js"></script><script>'use strict';const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function load(){try{if(!window.RinkaV2API)throw Error('ไม่พบ API Client');const [collections,products]=await Promise.all([RinkaV2API.collections(),RinkaV2API.products()]);document.getElementById('status').textContent=`พบ ${collections.length} Collections`;document.getElementById('grid').innerHTML=collections.length?collections.map(c=>{const count=products.filter(p=>p.collection_id===c.id).length;return `<a class="card" href="v2-browse.html?collection=${encodeURIComponent(c.id)}"><div class="image">${c.banner_url?`<img src="${esc(c.banner_url)}" alt="${esc(c.name)}" loading="lazy">`:'ยังไม่มีรูป Collection'}</div><div class="body"><h2>${esc(c.name)}</h2><div class="muted">${esc(c.description||'รอบพรีออเดอร์')}</div><p class="muted">สินค้าในข้อมูลที่โหลด ${count} รายการ · กดเพื่อดูสินค้า</p></div></a>`}).join(''):'<div class="empty">ยังไม่มี Collection ที่เผยแพร่</div>'}catch(e){document.getElementById('status').innerHTML=`<div class="error">โหลดไม่สำเร็จ: ${esc(e.message)}</div>`}}load();</script></body></html>
