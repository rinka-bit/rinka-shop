<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rinka Shop V2 — Cart DEV</title><link href="https://fonts.googleapis.com/css2?family=Kodchasan:wght@400;500;600;700&display=swap" rel="stylesheet"><style>
*{box-sizing:border-box}body{font-family:Kodchasan,sans-serif;background:#f5faff;color:#183c63;margin:0}header{background:#d9ecff;padding:20px max(16px,calc((100vw - 1050px)/2));display:flex;gap:20px;align-items:center;flex-wrap:wrap}a{color:#1666a4;text-decoration:none}.wrap{max-width:1050px;margin:26px auto;padding:0 16px 70px}h1{font-size:25px}.card{background:white;border:1px solid #d4e5f7;border-radius:16px;padding:18px;margin:12px 0}.item{display:grid;grid-template-columns:84px 1fr auto;gap:16px;align-items:center}.image{height:84px;background:#e9f3ff;border-radius:10px;display:grid;place-items:center;color:#7591ab;overflow:hidden}.image img{width:100%;height:100%;object-fit:contain}.muted{color:#6383a3;font-size:13px}.price{font-weight:700;color:#1168ae}.qty{display:flex;gap:10px;align-items:center;margin-top:10px}.qty button,.remove{font:inherit;border:1px solid #b6d2eb;border-radius:9px;background:#f4f9ff;color:#245d8a;cursor:pointer;padding:6px 11px}.qty button:disabled{opacity:.4;cursor:not-allowed}.remove{color:#b02929}.summary{text-align:right;font-size:20px;font-weight:700}.notice{background:#fff8e9;border:1px solid #ffdfab;border-radius:12px;padding:15px;color:#855a1a;margin:15px 0}.error{color:#a52727}.actions{display:flex;gap:12px;flex-wrap:wrap}.button{display:inline-block;background:#d7ebff;border:1px solid #9ac4ed;border-radius:10px;padding:10px 15px}.button.disabled{opacity:.5;cursor:not-allowed}button{font-family:inherit}@media(max-width:600px){.item{grid-template-columns:70px 1fr}.item .right{grid-column:2;text-align:left}.image{height:70px}.summary{text-align:left}}
</style></head><body><header><strong>☁️ Rinka Shop V2</strong><a href="v2-home.html">Home</a><a href="v2-browse.html">Browse</a><span class="muted">DEV · ไม่มีการสั่งซื้อจริง</span></header><main class="wrap"><h1>🛒 ตะกร้าสินค้า V2</h1><div class="notice">ตะกร้านี้แยกจากร้าน Production โดยใช้พื้นที่จัดเก็บข้อมูลเฉพาะ V2 ในเบราว์เซอร์ ยังไม่เปิด Checkout หรือส่งคำสั่งซื้อ</div><div id="status" role="status">กำลังตรวจสอบราคาและสต็อกจาก Supabase DEV…</div><div id="items"></div><div id="total" class="card" hidden></div><div class="actions"><a class="button" href="v2-browse.html">← เลือกสินค้าต่อ</a><button class="button disabled" disabled title="Checkout V2 ยังไม่เปิด">ไป Checkout (ยังไม่เปิด)</button></div></main><script src="rinka-v2-api.js"></script><script src="rinka-v2-cart.js"></script><script>
'use strict';
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),baht=n=>'฿'+Number(n).toLocaleString('th-TH',{minimumFractionDigits:2,maximumFractionDigits:2});
const effective=v=>{const t=Date.now(),on=v.sale_price_thb!=null&&(!v.sale_start||Date.parse(v.sale_start)<=t)&&(!v.sale_end||Date.parse(v.sale_end)>=t);return Number(on?v.sale_price_thb:v.price_thb)};
let details=new Map();
async function load(){const cart=RinkaV2Cart.read();$('items').innerHTML='';$('total').hidden=true;if(!cart.length){$('status').textContent='ตะกร้ายังว่างอยู่';return;}if(!window.RinkaV2API){$('status').textContent='ไม่พบ API Client';return;}$('status').textContent='กำลังตรวจสอบข้อมูลล่าสุด…';details=new Map();const slugs=[...new Set(cart.map(i=>i.slug))];await Promise.all(slugs.map(async slug=>{try{details.set(slug,{data:await RinkaV2API.productBySlug(slug)})}catch(e){details.set(slug,{error:e.message})}}));render();}
function render(){const cart=RinkaV2Cart.read();if(!cart.length){$('items').innerHTML='';$('total').hidden=true;$('status').textContent='ตะกร้ายังว่างอยู่';return;}let total=0,issues=0;const parts=cart.map(item=>{const result=details.get(item.slug),p=result?.data,v=p?.product_variants?.find(x=>x.id===item.variantId);const available=Number(v?.stock_quantity||0),price=v?effective(v):NaN,valid=!!p&&!!v&&Number.isFinite(price)&&price>=0&&available>=item.quantity; if(!valid)issues++;if(valid)total+=price*item.quantity;const image=p?.product_images?.[0]?.image_url;const name=p?.name||item.slug;const note=!p?'ไม่สามารถโหลดสินค้านี้ได้':!v?'ไม่พบ Variant นี้แล้ว':available<=0?'สินค้าหมดสต็อก':item.quantity>available?`จำนวนเกินสต็อกล่าสุด (${available})`:!Number.isFinite(price)?'ไม่พบราคาที่ถูกต้อง':'';return `<article class="card item"><div class="image">${image?`<img src="${esc(image)}" alt="">`:'ไม่มีรูป'}</div><div><a href="v2-product.html?slug=${encodeURIComponent(item.slug)}"><strong>${esc(name)}</strong></a><div class="muted">${esc(v?.label||item.variantId)}</div><div class="price">${Number.isFinite(price)?baht(price):'ไม่พบราคา'}</div>${note?`<div class="error">${esc(note)}</div>`:''}<div class="qty"><button data-action="minus" data-slug="${esc(item.slug)}" data-variant="${esc(item.variantId)}">−</button><strong>${item.quantity}</strong><button data-action="plus" data-slug="${esc(item.slug)}" data-variant="${esc(item.variantId)}" ${!v||item.quantity>=available?'disabled':''}>+</button></div></div><div class="right"><div>${valid?baht(price*item.quantity):'ต้องตรวจสอบ'}</div><button class="remove" data-action="remove" data-slug="${esc(item.slug)}" data-variant="${esc(item.variantId)}">ลบ</button></div></article>`}).join('');$('items').innerHTML=parts;$('status').textContent=issues?`พบ ${issues} รายการที่ต้องตรวจสอบก่อนดำเนินการต่อ`:'ตรวจสอบราคากับสต็อกล่าสุดแล้ว';$('total').hidden=false;$('total').innerHTML=`<div class="summary">ยอดรวมรายการที่ตรวจสอบผ่าน: ${baht(total)}</div><div class="muted">ยอดประมาณการ ณ เวลาโหลดข้อมูล ไม่ใช่ราคาที่ล็อกไว้หรือยอดเรียกเก็บ</div>`;}
$('items').addEventListener('click',e=>{const btn=e.target.closest('button[data-action]');if(!btn)return;const {action,slug,variant}=btn.dataset;const item=RinkaV2Cart.read().find(i=>i.slug===slug&&i.variantId===variant);if(!item)return;const max=Number(details.get(slug)?.data?.product_variants?.find(v=>v.id===variant)?.stock_quantity||0);const next=action==='remove'?0:action==='minus'?item.quantity-1:Math.min(item.quantity+1,max);RinkaV2Cart.setQuantity(slug,variant,next);render();});load();
</script></body></html>
