<style>

body{

background:#f8fbff;

}

.container{

}

border-radius:16px;

}

.profile-name{

}

.profile-email{

color:#666;

}

.menu-card{

padding:18px;

display:flex;

justify-content:space-between;

align-items:center;

box-shadow:
0 2px 10px rgba(0,0,0,.05);

}

.menu-card:hover{

transform:translateY(-2px);

}

.count{

font-weight:700;

color:#2563eb;

}

.logout-btn{

width:100%;

padding:14px;

border:none;

border-radius:12px;

background:#ef4444;

color:white;

font-size:15px;

cursor:pointer;

margin-top:20px;

}

.topbar{

display:flex;

align-items:center;

justify-content:space-between;

margin-bottom:20px;

}

.topbar button{

width:44px;
height:44px;

border:none;

border-radius:999px;

background:white;

box-shadow:
0 2px 8px rgba(0,0,0,.08);

font-size:20px;

cursor:pointer;

}

.page-header{
display:flex;
justify-content:space-between;
align-items:center;
padding:16px 24px;
background:#fff;
position:sticky;
top:0;
z-index:100;
box-shadow:0 3px 10px rgba(0,0,0,.05);
margin-bottom:20px;
}

.icon-btn{
width:auto !important;
border:none;
background:none;
font-size:32px;
padding:0;

}

.cart-btn{
position:relative;

text-decoration:none;

}

#cartCount{

right:-8px;

font-size:12px;

}

.overlay{

inset:0;
background:rgba(0,0,0,.35);
z-index:999;
opacity:1;

}

.overlay.hidden{
opacity:0;
pointer-events:none;
}

.side-menu{
position:fixed;
top:0;
left:0;
width:280px;
max-width:80%;
height:100vh;
background:#fff;
z-index:1000;
box-shadow:0 0 30px rgba(0,0,0,.15);
transform:translateX(-100%);
transition:.3s ease;
display:flex;
flex-direction:column;
}

.side-menu.open{
transform:translateX(0);
}

.menu-header{
padding:24px;
border-bottom:1px solid #eee;
}

.side-menu a{
padding:18px 24px;
font-size:16px;
font-weight:600;
text-decoration:none;
color:#333;
}

.side-menu a:hover{
background:#f7f9ff;
}

</style>

</head>

<a href="home.html">🏠 หน้าแรก</a>

<div class="container">

<div
class="profile-card">

<div
id="username"
class="profile-name">

-

</div>

<div
id="email"
class="profile-email">

-

</div>

</div>

<div
class="menu-card"
onclick="

'pending'
)
">

<div>

📦 ออเดอร์ของฉัน

</div>

<div
id="pendingCount"
class="count">

0

</div>

</div>

<div
class="menu-card"
onclick="
openStatus(
'china_arrived'
)
">

<div>

🏭 ถึงโกดังจีนแล้ว

</div>

<div
id="chinaCount"
class="count">

0

</div>

</div>

<div
class="menu-card"
onclick="
openStatus(
'shipping_to_th'
)
">

<div>

🚚 กำลังมาไทย

</div>

<div
id="shippingCount"
class="count">

0

</div>

</div>

<div
class="menu-card"
onclick="
openStatus(
'ready_to_ship'
)
">

<div>

📬 เตรียมจัดส่ง

</div>

id="readyCount"
class="count">

0

</div>

<div
class="menu-card"
onclick="

<div>

<div>

</div>

</div>

<div

onclick="

<div>

🛟 ศูนย์ช่วยเหลือ

</div>

<div>

>

</div>

<button
class="logout-btn"
onclick="logout()">

ออกจากระบบ

</button>

</div>

<script>

const API =
"https://script.google.com/macros/s/AKfycbxKjVvn8AXrK0wDvKqN-A9yS2Vk8R-w25ar1b9ftiIdUgUvFaShunLnFnAyIDuaTWj76w/exec";

const customer =

JSON.parse(
localStorage.getItem(
"customer"
) || "{}"
);

if(!customer.email){

window.location =
"login.html";

}

document.getElementById(
"username"
).textContent =

customer.username;

document.getElementById(
"email"
).textContent =

customer.email;

loadOrders();

async function loadOrders(){

const response =
await fetch(

API +
"?action=customerOrders&email="
+
encodeURIComponent(
customer.email
)

);

const orders =
await response.json();

const pending =

orders.filter(
o => o.status === "pending"
).length;

const china =

orders.filter(
o => o.status === "china_arrived"
).length;

const shipping =

orders.filter(
o => o.status === "shipping_to_th"
).length;

const ready =

orders.filter(
o => o.status === "ready_to_ship"
).length;

document.getElementById(
"pendingCount"
).textContent =
pending;

document.getElementById(
"chinaCount"
).textContent =
china;

document.getElementById(
"shippingCount"
).textContent =
shipping;

document.getElementById(
"readyCount"
).textContent =
ready;

}

function openStatus(status){

window.location.href =

"orders.html?status=" +
status;

}

function logout(){

localStorage.removeItem(
"customer"
);

window.location =
"login.html";

}

updateCartCount();

function updateCartCount(){

const cart =
JSON.parse(
localStorage.getItem(
"cart"
) || "[]"
);

const count =
cart.reduce(
(sum,item)=>sum + Number(item.qty || 0),
0
);

const cartCount =
document.getElementById(
"cartCount"
);

if(cartCount){
cartCount.textContent = count;
}

}

</script>

<script src="menu.js"></script>
  
</body>

</html>
