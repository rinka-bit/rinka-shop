<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>บัญชีของฉัน | Rinka Shop</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;600;700&family=Noto+Serif+Thai:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="site-header"></div>

<section class="section">
  <div class="wrap" style="max-width:760px;">
    <div class="section-head">
      <h2 id="hello">บัญชีของฉัน</h2>
      <button class="btn btn-ghost" onclick="logout()">ออกจากระบบ</button>
    </div>
    <div id="ordersMount"><div class="spinner"></div></div>
  </div>
</section>

<div id="site-footer"></div>
<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/cart.js"></script>
<script src="js/common.js"></script>
<script>
const session = RinkaAuth.get();
if(!session || !session.session_token){
  location.href = "login.html";
}

document.getElementById("hello").textContent = "สวัสดี " + (session?.username || "");

function statusLabel(status){
  const map = { pending:["รอดำเนินการ","pill-pending"], ready_to_ship:["เตรียมจัดส่ง","pill-pending"],
    shipped:["จัดส่งแล้ว","pill-shipped"], completed:["สำเร็จ","pill-completed"] };
  const [label, cls] = map[status] || [status || "-", "pill-pending"];
  return `<span class="pill ${cls}">${label}</span>`;
}

async function loadOrders(){
  try{
    const orders = await RinkaAPI.getCustomerOrders(session.session_token);
    const mount = document.getElementById("ordersMount");
    if(!Array.isArray(orders) || !orders.length){
      mount.innerHTML = `<div class="empty-state"><div class="icon">📭</div>ยังไม่มีคำสั่งซื้อ<br><a href="index.html" class="btn btn-outline" style="margin-top:14px;">เริ่มพรีออเดอร์</a></div>`;
      return;
    }
    mount.innerHTML = orders.map(o => `
      <div class="panel" style="margin-bottom:14px; cursor:pointer;" onclick="toggleDetail('${o.order_id}')">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <div>
            <div style="font-weight:700; font-family:monospace;">${o.order_id}</div>
            <div class="muted" style="font-size:.8rem;">${o.created_at ? new Date(o.created_at).toLocaleDateString('th-TH') : ""}</div>
          </div>
          <div style="text-align:right;">
            ${statusLabel(o.status)}
            <div style="font-weight:700; margin-top:4px;">${money(o.total)}</div>
          </div>
        </div>
        <div id="detail-${o.order_id}" style="display:none; margin-top:14px; border-top:1px dashed var(--mist-dark); padding-top:14px;"></div>
      </div>`).join("");
  }catch(e){
    document.getElementById("ordersMount").innerHTML = `<div class="empty-state">โหลดข้อมูลไม่สำเร็จ</div>`;
  }
}

async function toggleDetail(orderId){
  const box = document.getElementById("detail-" + orderId);
  const isOpen = box.style.display === "block";
  document.querySelectorAll('[id^="detail-"]').forEach(d => d.style.display = "none");
  if(isOpen) return;
  box.style.display = "block";
  box.innerHTML = `<div class="spinner"></div>`;
  try{
    const res = await RinkaAPI.getOrderAuthenticated(session.session_token, orderId);
    if(!res || !res.success){ box.innerHTML = `<p class="muted">ไม่พบรายละเอียดออเดอร์</p>`; return; }
    const order = res.order;
    box.innerHTML = `
      ${(order.items||[]).map(i => `
        <div class="summary-row"><span>${i.name} ${i.option_value ? '('+i.option_value+')' : ''} × ${i.qty}</span><span>${money(i.final_price)}</span></div>
      `).join("")}
      ${order.tracking_no ? `<p class="hint" style="margin-top:10px;">🚚 ${order.courier || ''} เลขพัสดุ: <b>${order.tracking_no}</b></p>` : ""}
      <a href="track.html?id=${encodeURIComponent(order.order_id)}" class="btn btn-outline" style="margin-top:10px;">ดูสถานะค่านำเข้า/ค่าส่ง</a>
    `;
  }catch(e){ box.innerHTML = `<p class="muted">เกิดข้อผิดพลาด</p>`; }
}

async function logout(){
  try{ await RinkaAPI.logoutCustomer({ session_token: session.session_token }); }catch(e){}
  RinkaAuth.clear();
  location.href = "index.html";
}

loadOrders();
</script>
</body>
</html>
