async function saveProductFromAdmin(){
  const btn =
    document.getElementById("saveProductBtn");

  const loading =
    document.getElementById("saveProductLoading");

  const payload = {
    name: document.getElementById("p_name").value,
    price: Number(document.getElementById("p_price").value || 0),
    sale_price: Number(document.getElementById("p_sale_price").value || 0),
    sale_start:
  document.getElementById(
    "p_sale_start"
  ).value,

sale_end:
  document.getElementById(
    "p_sale_end"
  ).value,
    main_category: document.getElementById("p_main_category").value,
    fandom: document.getElementById("p_fandom").value,
    sub_category: document.getElementById("p_sub_category").value,
    round: document.getElementById("p_round").value,
    description: document.getElementById("p_description").value,
    product_type: document.getElementById("p_product_type").value,
    stock: Number(document.getElementById("p_stock").value || 0),
    preorder_deadline: document.getElementById("p_preorder_deadline").value,
    estimated_arrival: document.getElementById("p_estimated_arrival").value,
    featured: document.getElementById("p_featured").checked ? "yes" : "",
    new_arrival: document.getElementById("p_new_arrival").checked ? "yes" : "",
    status: "active"
  };

  if(!payload.name){
    alert("กรุณากรอกชื่อสินค้า");
    return;
  }

  if(!payload.price){
    alert("กรุณากรอกราคา");
    return;
  }

  const imageFile =
  document.getElementById("p_image_file").files[0];

const image2File =
  document.getElementById("p_image2_file").files[0];

const image3File =
  document.getElementById("p_image3_file").files[0];

const image4File =
  document.getElementById("p_image4_file").files[0];

if(imageFile){
  payload.image_base64 =
    await fileToBase64(imageFile);
}

if(image2File){
  payload.image2_base64 =
    await fileToBase64(image2File);
}

if(image3File){
  payload.image3_base64 =
    await fileToBase64(image3File);
}

if(image4File){
  payload.image4_base64 =
    await fileToBase64(image4File);
}

  btn.disabled = true;
  btn.textContent = "กำลังบันทึก...";
  loading.style.display = "block";

  try{

    const formData =
      new FormData();

    formData.append(
      "action",
      "saveProduct"
    );

    formData.append(
      "payload",
      JSON.stringify(payload)
    );

    const response =
      await fetch(
        API,
        {
          method:"POST",
          body:formData
        }
      );

    const result =
      await response.json();

    alert(
      result.success
        ? "เพิ่มสินค้าแล้ว: " + result.product_id
        : result.error || "เพิ่มสินค้าไม่สำเร็จ"
    );
if(result.success){
  renderProductManager();
  loadAdminProducts();
}

  }catch(error){

    console.error(error);
    alert("เกิดข้อผิดพลาด กรุณาลองใหม่");

  }finally{

    const newBtn =
      document.getElementById("saveProductBtn");

    const newLoading =
      document.getElementById("saveProductLoading");

    if(newBtn){
      newBtn.disabled = false;
      newBtn.textContent = "บันทึกสินค้า";
    }

    if(newLoading){
      newLoading.style.display = "none";
    }

  }

}

async function loadOrders(){

  const response =
    await fetch(API + "?action=orders");

  const result =
    await response.json();

  let html = "";

  result.orders.reverse();

  result.orders.forEach(order=>{

    if(
      order.payment_status !== "paid" ||
      order.status === "completed"
    ){
      return;
    }

    html += renderOrderCard(order);

  });

  document.getElementById("orders").innerHTML = html;

  result.orders.forEach(order=>{

    const select =
      document.getElementById("status_" + order.order_id);

    if(select){
      select.value = order.status;
      toggleOrderFields(order.order_id);
    }

  });

}

function toggleOrderFields(orderId){

  const status =
    document.getElementById("status_" + orderId).value;

  const feeBox =
    document.getElementById("feeBox_" + orderId);

  const trackingBox =
    document.getElementById("trackingBox_" + orderId);

  if(!feeBox || !trackingBox){
    return;
  }

  feeBox.style.display =
    status === "ready_to_ship"
      ? "block"
      : "none";

  trackingBox.style.display =
    status === "shipped"
      ? "block"
      : "none";

}

async function updateOrderStatus(orderId){

  const status =
    document.getElementById("status_" + orderId).value;

  const payload = {
    order_id: orderId,
    status: status
  };

  if(status === "ready_to_ship"){

    payload.import_fee_round2 =
      Number(
        document.getElementById("import_" + orderId).value || 0
      );

    payload.domestic_shipping_fee =
      Number(
        document.getElementById("domestic_" + orderId).value || 0
      );

  }

  if(status === "shipped"){

    payload.courier =
      document.getElementById("courier_" + orderId).value;

    payload.tracking_no =
      document.getElementById("tracking_" + orderId).value;

  }

  const formData =
    new FormData();

  formData.append(
    "payload",
    JSON.stringify(payload)
  );

  const response =
    await fetch(
      API + "?action=updateOrderStatus",
      {
        method:"POST",
        body:formData
      }
    );

  const result =
    await response.json();

  alert(
    result.success
      ? "อัปเดตสถานะแล้ว"
      : result.error || "อัปเดตไม่สำเร็จ"
  );

  loadOrders();

}

    html += `

        <p>Social: ${req.social}</p>

        ✅ ดำเนินการแล้ว

async function completeAddressRequest(requestId){

  const formData =
    new FormData();

  formData.append(
    "payload",
    JSON.stringify({
      request_id: requestId
    })
  );

  const response =
    await fetch(
      API + "?action=completeAddressRequest",
      {
        method:"POST",
        body:formData
      }
    );

  const result =
    await response.json();

  alert(
    result.success
      ? "อัปเดตแล้ว"
      : "ผิดพลาด"
  );

  loadAddressRequests();

}

function fileToBase64(file){

  return new Promise((resolve,reject)=>{

    const reader =
      new FileReader();

    reader.onload =
      () => resolve(reader.result);

    reader.onerror =
      reject;

    reader.readAsDataURL(file);

  });

}

}

function escapeHtml(value){

  return String(value || "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}

function formatDateInput(value){

  if(!value){
    return "";
  }

  const date =
    new Date(value);

  if(isNaN(date.getTime())){
    return "";
  }

  return date
    .toISOString()
    .split("T")[0];

}

function isCheckedValue(value){

  const normalized =
    String(value || "")
      .trim()
      .toLowerCase();

  return (
    normalized === "yes" ||
    normalized === "true" ||
    normalized === "1"
  );

}

    sale_price:

          "e_sale_price"
        ).value || 0
      ),

    main_category:
      document.getElementById(
        "e_main_category"
      ).value.trim(),

    fandom:
      document.getElementById(
        "e_fandom"
      ).value.trim(),

    sub_category:
      document.getElementById(
        "e_sub_category"
      ).value.trim(),

    round:
      document.getElementById(
        "e_round"
      ).value.trim(),

    description:
      document.getElementById(
        "e_description"
      ).value,

      ).value,

    stock:
      Number(

        : ""

  };

  if(!payload.name){
    alert("กรุณากรอกชื่อสินค้า");
    return;
  }

  if(!payload.price){
    alert("กรุณากรอกราคา");

  btn.disabled = true;
  btn.textContent = "กำลังบันทึก...";
  loading.style.display = "block";

  try{

    const imageFiles = [

      [
        "image2_base64",

      ],
      [

          "e_image3_file"
        ).files[0]
      ],
      [
        "image4_base64",
        document.getElementById(
          "e_image4_file"
        ).files[0]
      ]
    ];

    for(const [field,file] of imageFiles){

      if(file){
        payload[field] =
          await fileToBase64(file);
      }

    }

    const formData =
      new FormData();

    formData.append(
      "action",
      "updateProduct"
    );

    formData.append(
      "payload",
      JSON.stringify(payload)
    );

    const response =
      await fetch(
        API,
        {
          method:"POST",
          body:formData
        }
      );

    const result =
      await response.json();

    if(!result.success){

      alert(
        result.error ||
        "บันทึกไม่สำเร็จ"
      );

      return;

    }

    alert("แก้ไขสินค้าเรียบร้อยแล้ว");

        API +
        "?action=adminCollections"

      box.textContent =
