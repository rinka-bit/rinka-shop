<!DOCTYPE html>

</head>

<body>

<div id="loginBox">

เข้าสู่ระบบ

<div

<h1>
📊 Dashboard

<div id="stats"></div>

<h1>อัปเดตเลขพัสดุ</h1>

<div id="orders"></div>

<hr>

<h2>
📍 คำขอเปลี่ยนที่อยู่
</h2>

<div id="addressRequests"></div>

<script>

const API =
"https://script.google.com/macros/s/AKfycbxKjVvn8AXrK0wDvKqN-A9yS2Vk8R-w25ar1b9ftiIdUgUvFaShunLnFnAyIDuaTWj76w/exec";

async function loadOrders(){

const response =
await fetch(
API + "?action=orders"
);

const result =
await response.json();

let html = "";
result.orders.reverse();
result.orders.forEach(order=>{

if(
order.payment_status !== "paid" ||
order.status === "completed"
){
return;
}

html += `
<div style="
border:1px solid #ddd;
padding:15px;
margin-bottom:10px;
border-radius:10px;
">

<h3>
${order.order_id}
</h3>

<p>
ลูกค้า:
${order.customer_name}
</p>

<p>
${order.email}
</p>

<p>
สถานะ:
${order.status}
</p>

<p>
ยอดรวม:
${order.total}
 บาท
</p>

<input
id="courier_${order.order_id}"
placeholder="ขนส่ง">

<br><br>

<input
id="tracking_${order.order_id}"
placeholder="เลขพัสดุ">

<br><br>

<button
onclick="saveTrackingById('${order.order_id}')">
บันทึก Tracking
</button>

</div>
`;

});

document
.getElementById("orders")
.innerHTML =
html;

}

async function saveTrackingById(orderId){

const formData =
new FormData();

formData.append(
"payload",
JSON.stringify({

order_id:
orderId,

courier:
document.getElementById(
"courier_" + orderId
).value,

tracking_no:
document.getElementById(
"tracking_" + orderId
).value

})
);

const response =
await fetch(
API + "?action=tracking",
{
method:"POST",
body:formData
}
);

const result =
await response.json();

alert(
result.success
? "บันทึกสำเร็จ"
: "ผิดพลาด"
);

loadOrders();

}

"addressRequests"

loadOrders();

loadAddressRequests();

async function completeAddressRequest(
requestId
){

const formData =
new FormData();

formData.append(
"payload",
JSON.stringify({

request_id:
requestId

})
);

const response =
await fetch(

API +
"?action=completeAddressRequest",

{
method:"POST",
body:formData
}

);

const result =
await response.json();

alert(
result.success
? "อัปเดตแล้ว"
: "ผิดพลาด"
);

loadAddressRequests();

}
