<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rinka Admin</title>

<style>
body{
margin:0;
font-family:sans-serif;
background:#f8fbff;
color:#334155;
}

button{
cursor:pointer;
border:none;
border-radius:12px;
padding:10px 14px;
background:#7dcfff;
color:white;
font-weight:700;
}

input,
textarea,
select{
width:100%;
box-sizing:border-box;
padding:10px;
border:1px solid #ddd;
border-radius:10px;
}

#loginBox{
max-width:360px;
margin:80px auto;
background:white;
padding:24px;
border-radius:18px;
box-shadow:0 2px 12px rgba(0,0,0,.08);
}

.admin-layout{
display:flex;
min-height:100vh;
}

.sidebar{
width:240px;
background:white;
border-right:1px solid #e5e7eb;
padding:20px;
box-sizing:border-box;
position:sticky;
top:0;
height:100vh;
}

.sidebar h2{
margin-top:0;
}

.nav-btn{
width:100%;
margin-bottom:10px;
background:#f1f5f9;
color:#334155;
text-align:left;
}

.nav-btn.active{
background:#7dcfff;
color:white;
}

.main{
flex:1;
padding:24px;
box-sizing:border-box;
}

.topbar{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:20px;
}

.card{
background:white;
padding:18px;
border-radius:16px;
box-shadow:0 2px 10px rgba(0,0,0,.05);
border:1px solid #e5eefc;
margin-bottom:16px;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
gap:15px;
}

.hidden{
display:none;
}

.section-title{
margin-top:0;
}

.product-form{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
gap:14px;
}

.full{
grid-column:1/-1;
}

.order-card{
border:1px solid #ddd;
padding:15px;
margin-bottom:10px;
border-radius:12px;
background:white;
}

.warning-card{
border:1px solid #f59e0b;
background:#fffbeb;
padding:15px;
margin-bottom:10px;
border-radius:12px;
}

.logout-btn{
background:#ef4444;
}

.loading-text{
margin-top:10px;
color:#2563eb;
font-weight:700;
}
</style>
</head>

<body>

<div id="loginBox">
<h2>🔒 Admin Login</h2>

<input
type="password"
id="adminPassword"
placeholder="รหัสผ่าน">

<br><br>

<button onclick="login()">
เข้าสู่ระบบ
</button>
</div>

<div
id="adminContent"
style="display:none;">

<div class="admin-layout">

<aside class="sidebar">

<h2>☁️ Rinka Admin</h2>

<button
class="nav-btn active"
id="nav_dashboard"
onclick="showAdminTab('dashboard')">
📊 Dashboard
</button>

<button
class="nav-btn"
id="nav_products"
onclick="showAdminTab('products')">
🛍️ เพิ่มสินค้า
</button>

<button
class="nav-btn"
id="nav_options"
onclick="showAdminTab('options')">
🎭 ตัวเลือกสินค้า
</button>

<button
class="nav-btn"
id="nav_orders"
onclick="showAdminTab('orders')">
📦 จัดการคำสั่งซื้อ
</button>

<button
class="nav-btn"
id="nav_address"
onclick="showAdminTab('address')">
📍 คำขอเปลี่ยนที่อยู่
</button>

<button
class="nav-btn"
id="nav_collections"
onclick="showAdminTab('collections')">
🖼️ Collections
</button>

<button
class="nav-btn"
id="nav_gifts"
onclick="showAdminTab('gifts')">
🎁 ของแถม
</button>

<hr>

<button
class="logout-btn"
onclick="logout()">
🚪 ออกจากระบบ
</button>

</aside>

<main class="main">

<section id="tab_dashboard">

<div class="topbar">
<h1>📊 Dashboard</h1>
</div>

<div id="stats"></div>
<div id="topProducts"></div>
<div id="topFandoms"></div>

</section>

<section
id="tab_options"
class="hidden">

<h1 class="section-title">
🎭 Product Option Manager
</h1>

<div id="optionManager">
กำลังโหลด...
</div>

</section>

<section
id="tab_products"
class="hidden">

<h1 class="section-title">
🛍️ เพิ่มสินค้า
</h1>

<div id="productManager"></div>

</section>

<section
id="tab_orders"
class="hidden">

<h1 class="section-title">
📦 จัดการคำสั่งซื้อ
</h1>

<div id="orders"></div>

</section>

<section
id="tab_address"
class="hidden">

<h1 class="section-title">
📍 คำขอเปลี่ยนที่อยู่
</h1>

<div id="addressRequests"></div>

</section>

<section
id="tab_collections"
class="hidden">

<h1 class="section-title">
🖼️ Collections Manager
</h1>

<div id="collectionManager">
กำลังโหลด...
</div>

</section>

<section
id="tab_gifts"
class="hidden">

<h1 class="section-title">
🎁 Gift Manager
</h1>

<div id="giftManager">
กำลังโหลด...
</div>

</section>

</main>

</div>
</div>

<div
id="editProductModal"
class="hidden"
style="
position:fixed;
inset:0;
background:rgba(15,23,42,.55);
z-index:9999;
padding:20px;
overflow:auto;
">

<div
class="card"
style="
max-width:850px;
margin:30px auto;
">

<div style="
display:flex;
justify-content:space-between;
align-items:center;
">

<h2>
✏️ แก้ไขสินค้า
</h2>

<button
type="button"
onclick="closeEditProductModal()"
style="background:#64748b;">
✕
</button>

</div>

<div
id="editProductForm"
class="product-form">
</div>

<br>

<button
id="updateProductBtn"
onclick="submitProductEdit()">
💾 บันทึกการแก้ไข
</button>

<div
id="updateProductLoading"
class="loading-text"
style="display:none;">
⏳ กำลังบันทึก...
</div>

</div>

</div>

<div
id="editCollectionModal"
class="hidden"
style="
position:fixed;
inset:0;
background:rgba(15,23,42,.55);
z-index:9999;
padding:20px;
overflow:auto;
">

<div
class="card"
style="
max-width:850px;
margin:30px auto;
">

<div style="
display:flex;
justify-content:space-between;
align-items:center;
">

<h2>
✏️ แก้ไข Collection
</h2>

<button
type="button"
onclick="closeEditCollectionModal()"
style="background:#64748b;">
✕
</button>

</div>

<div
id="editCollectionForm"
class="product-form">
</div>

<br>

<button
id="updateCollectionBtn"
onclick="submitCollectionEdit()">
💾 บันทึกการแก้ไข
</button>

<div
id="updateCollectionLoading"
class="loading-text"
style="display:none;">
⏳ กำลังบันทึก Collection...
</div>

</div>

</div>

<script src="js/admin-gifts.js"></script>
<script src="js/admin-collections.js"></script>
<script src="js/admin.js"></script>

</body>
</html>
