function showAdminTab(tab){

const tabs = [
  "dashboard",
  "products",
  "options",
  "orders",
  "address",
  "collections",
  "gifts"
];
  
  tabs.forEach(name=>{

    document
      .getElementById("tab_" + name)
      .classList.toggle(
        "hidden",
        name !== tab
      );

    document
      .getElementById("nav_" + name)
      .classList.toggle(
        "active",
        name === tab
      );

  });

 if(tab === "gifts"){

  renderGiftManager();

  loadGiftCampaigns();

}

}

async function saveProductFromAdmin(){
  const btn =
    document.getElementById("saveProductBtn");

  const loading =
    document.getElementById("saveProductLoading");

  const payload = {
    name: document.getElementById("p_name").value,
    price: Number(document.getElementById("p_price").value || 0),
    sale_price: Number(document.getElementById("p_sale_price").value || 0),
    sale_start:
  document.getElementById(
    "p_sale_start"
  ).value,

sale_end:
  document.getElementById(
    "p_sale_end"
  ).value,
    main_category: document.getElementById("p_main_category").value,
    fandom: document.getElementById("p_fandom").value,
    sub_category: document.getElementById("p_sub_category").value,
    round:
  document.getElementById(
    "p_round"
  ).value,

collection_id:
  document.getElementById(
    "p_collection_id"
  ).value,
    description: document.getElementById("p_description").value,
    product_type: document.getElementById("p_product_type").value,
    stock: Number(document.getElementById("p_stock").value || 0),
    preorder_deadline: document.getElementById("p_preorder_deadline").value,
    estimated_arrival: document.getElementById("p_estimated_arrival").value,
    featured: document.getElementById("p_featured").checked ? "yes" : "",
    new_arrival: document.getElementById("p_new_arrival").checked ? "yes" : "",
    status: "active"
  };

  if(!payload.name){
    alert("กรุณากรอกชื่อสินค้า");
    return;
  }

  if(!payload.price){
    alert("กรุณากรอกราคา");
    return;
  }

  if(
  payload.sale_price > 0 &&
  (
    !payload.sale_start ||
    !payload.sale_end
  )
){
  alert(
    "กรุณากรอกวันเริ่มและวันสิ้นสุดลดราคา"
  );
  return;
}

if(
  payload.sale_start &&
  payload.sale_end &&
  payload.sale_start >
  payload.sale_end
){
  alert(
    "วันเริ่มลดราคาต้องไม่เกินวันสิ้นสุด"
  );
  return;
}

  const imageFile =
  document.getElementById("p_image_file").files[0];

const image2File =
  document.getElementById("p_image2_file").files[0];

const image3File =
  document.getElementById("p_image3_file").files[0];

const image4File =
  document.getElementById("p_image4_file").files[0];

if(imageFile){
  payload.image_base64 =
    await fileToBase64(imageFile);
}

if(image2File){
  payload.image2_base64 =
    await fileToBase64(image2File);
}

if(image3File){
  payload.image3_base64 =
    await fileToBase64(image3File);
}

if(image4File){
  payload.image4_base64 =
    await fileToBase64(image4File);
}

  btn.disabled = true;
  btn.textContent = "กำลังบันทึก...";
  loading.style.display = "block";

  try{

    const formData =
      new FormData();

    formData.append(
      "action",
      "saveProduct"
    );

    formData.append(
      "payload",
      JSON.stringify(payload)
    );

    const response =
      await fetch(
        API,
        {
          method:"POST",
          body:formData
        }
      );

    const result =
      await response.json();

    alert(
      result.success
        ? "เพิ่มสินค้าแล้ว: " + result.product_id
        : result.error || "เพิ่มสินค้าไม่สำเร็จ"
    );
if(result.success){

  renderProductManager();

  await loadAdminProducts();

}

  }catch(error){

    console.error(error);
    alert("เกิดข้อผิดพลาด กรุณาลองใหม่");

  }finally{

    const newBtn =
      document.getElementById("saveProductBtn");

    const newLoading =
      document.getElementById("saveProductLoading");

    if(newBtn){
      newBtn.disabled = false;
      newBtn.textContent = "บันทึกสินค้า";
    }

    if(newLoading){
      newLoading.style.display = "none";
    }

  }

}

async function loadTopFandoms(){

  const container =
    document.getElementById(
      "topFandoms"
    );

  if(!container){

    return;

  }

  try{

    const response =
      await fetch(
        API + "?action=topFandoms"
      );

    const result =
      await response.json();

    const fandoms =
      Array.isArray(
        result.fandoms
      )
        ? result.fandoms
        : [];

    let html = `
      <div class="card">

        <h2>
          🌟 Fandom ยอดนิยม
        </h2>
    `;

    if(
      fandoms.length === 0
    ){

      html += `

        <p
        style="
        color:#777;
        ">
          ยังไม่มีข้อมูล Fandom
        </p>

      `;

    }
    else{

      fandoms.forEach(
        (
          fandom,
          index
        ) => {

          const fandomName =
            fandom.fandom ||
            fandom.name ||
            "";

          const qty =
            fandom.qty ||
            fandom.quantity ||
            0;

          html += `

            <p
            style="
            display:flex;
            justify-content:space-between;
            align-items:center;
            gap:10px;
            ">

              <span>

                ${index + 1}.

                ${escapeHtml(
                  fandomName
                )}

                (${qty} ชิ้น)

              </span>

              <button
              style="
              width:auto;
              padding:5px 10px;
              font-size:13px;
              "
              onclick="
              openProductSearch(
                '${escapeJsString(
                  fandomName
                )}'
              )
              ">
                เปิดสินค้า
              </button>

            </p>

          `;

        }
      );

    }

    html += `
      </div>
    `;

    container.innerHTML =
      html;

  }
  catch(error){

    console.error(
      "loadTopFandoms error:",
      error
    );

    container.innerHTML = `

      <div class="card">

        <h2>
          🌟 Fandom ยอดนิยม
        </h2>

        <p
        style="
        color:#d9534f;
        ">
          โหลดข้อมูลไม่สำเร็จ
        </p>

      </div>

    `;

  }

}
async function loadOrders(){

  const response =
    await fetch(API + "?action=orders");

  const result =
    await response.json();

  let html = "";

  result.orders.reverse();

  result.orders.forEach(order=>{

    if(
      order.payment_status !== "paid" ||
      order.status === "completed"
    ){
      return;
    }

    html += renderOrderCard(order);

  });

  document.getElementById("orders").innerHTML = html;

  result.orders.forEach(order=>{

    const select =
      document.getElementById("status_" + order.order_id);

    if(select){
      select.value = order.status;
      toggleOrderFields(order.order_id);
    }

  });

}

async function updateOrderStatus(orderId){

  const status =
    document.getElementById("status_" + orderId).value;

  const payload = {
    order_id: orderId,
    status: status
  };

  if(status === "ready_to_ship"){

    payload.import_fee_round2 =
      Number(
        document.getElementById("import_" + orderId).value || 0
      );

    payload.domestic_shipping_fee =
      Number(
        document.getElementById("domestic_" + orderId).value || 0
      );

  }

  if(status === "shipped"){

    payload.courier =
      document.getElementById("courier_" + orderId).value;

    payload.tracking_no =
      document.getElementById("tracking_" + orderId).value;

  }

  const formData =
    new FormData();

  formData.append(
    "payload",
    JSON.stringify(payload)
  );

  const response =
    await fetch(
      API + "?action=updateOrderStatus",
      {
        method:"POST",
        body:formData
      }
    );

  const result =
    await response.json();

  alert(
    result.success

  );

}

function fileToBase64(file){

  return new Promise((resolve,reject)=>{

    const reader =
      new FileReader();

    reader.onload =
      () => resolve(reader.result);

    reader.onerror =
      reject;

    reader.readAsDataURL(file);

  });

}

function escapeHtml(value){

  return String(value || "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}

function formatDateInput(value){

  if(!value){
    return "";
  }

  const date =
    new Date(value);

  if(isNaN(date.getTime())){
    return "";
  }

  return date
    .toISOString()
    .split("T")[0];

}

function isCheckedValue(value){

  const normalized =
    String(value || "")
      .trim()
      .toLowerCase();

  return (
    normalized === "yes" ||
    normalized === "true" ||
    normalized === "1"
  );

}

async function loadAdminProductOptions(){

  const box =
    document.getElementById(
      "adminOptionList"
    );

  if(
    !box ||
    !selectedOptionProductId
  ){
    return;
  }

  box.innerHTML =
    "⏳ กำลังโหลดตัวเลือก...";

  try{

    const response =
      await fetch(

        API +

        "?action=adminProductOptions" +

        "&product_id=" +

        encodeURIComponent(
          selectedOptionProductId
        )

      );

    const result =
      await response.json();

    if(!result.success){

      box.textContent =
        result.error ||
        "โหลดตัวเลือกไม่สำเร็จ";

      return;

    }

    adminProductOptions =
      result.options || [];

    renderAdminProductOptions();

  }catch(error){

    console.error(error);

    box.textContent =
      "โหลดตัวเลือกไม่สำเร็จ";

  }

}

async function saveCollectionFromAdmin(){

  const btn =
    document.getElementById(
      "saveCollectionBtn"
    );

  const loading =
    document.getElementById(
      "saveCollectionLoading"
    );

  const payload = {

    name:
      document
        .getElementById("c_name")
        .value
        .trim(),

    fandom:
      document
        .getElementById("c_fandom")
        .value
        .trim(),

    collection_type:
      document
        .getElementById("c_type")
        .value
        .trim(),

    preorder_deadline:
      document
        .getElementById("c_deadline")
        .value,

    description:
      document
        .getElementById(
          "c_description"
        )
        .value,

    featured:
      document
        .getElementById("c_featured")
        .checked
        ? "yes"
        : "",

    status:"active"

  };

  if(!payload.name){
    alert(
      "กรุณากรอกชื่อ Collection"
    );
    return;
  }

  const imageFile =
    document
      .getElementById(
        "c_image_file"
      )
      .files[0];

  const bannerFile =
    document
      .getElementById(
        "c_banner_file"
      )
      .files[0];

  btn.disabled = true;
  btn.textContent =
    "กำลังบันทึก...";

  loading.style.display =
    "block";

  try{

    if(imageFile){

      payload.image_base64 =
        await fileToBase64(
          imageFile
        );

    }

    if(bannerFile){

      payload.banner_base64 =
        await fileToBase64(
          bannerFile
        );

    }

    const formData =
      new FormData();

    formData.append(
      "action",
      "saveCollection"
    );

    formData.append(
      "payload",
      JSON.stringify(payload)
    );

    const response =
      await fetch(
        API,
        {
          method:"POST",
          body:formData
        }
      );

    const result =
      await response.json();

    if(!result.success){

      alert(
        result.error ||
        "เพิ่ม Collection ไม่สำเร็จ"
      );

      return;

    }

    alert(
      "เพิ่ม Collection แล้ว: " +
      result.collection_id
    );

    renderCollectionManager();

    await loadAdminCollections();

  }catch(error){

    console.error(error);

    alert(
      "เกิดข้อผิดพลาด กรุณาลองใหม่"
    );

  }finally{

    const newBtn =
      document.getElementById(
        "saveCollectionBtn"
      );

    const newLoading =
      document.getElementById(
        "saveCollectionLoading"
      );

    if(newBtn){

      newBtn.disabled = false;

      newBtn.textContent =
        "บันทึก Collection";

    }

    if(newLoading){

      newLoading.style.display =
        "none";

    }

  }

}

function escapeJsString(
  value
){

  return String(
    value || ""
  )
    .replaceAll(
      "\\",
      "\\\\"
    )
    .replaceAll(
      "'",
      "\\'"
    )
    .replaceAll(
      "\n",
      "\\n"
    )
    .replaceAll(
      "\r",
      ""
    );

}

 function getGiftRule(
  collectionId,
  tierName
){

  const normalizedTier =
    String(
      tierName || ""
    )
      .trim()
      .toLowerCase();

  return adminGiftRules.find(
    rule => {

      const ruleCollectionId =
        String(
          rule.collection_id || ""
        );

      const ruleTierName =
        String(
          rule.tier_name || ""
        )
          .trim()
          .toLowerCase();

      return (
        ruleCollectionId ===
          String(collectionId) &&
        ruleTierName ===
          normalizedTier
      );

    }
  ) || null;

}

        API,
        {
          method:"POST",
          body:formData
        }
      );

    const result =
      await response.json();

    if(!result.success){

      throw new Error(
        result.error ||
        result.message ||
        "บันทึก Gift Rule ไม่สำเร็จ"
      );

    }

    await loadGiftCampaigns();

    const newCollectionSelect =
      document.getElementById(
        "gr_collection_id"
      );

    if(newCollectionSelect){

      newCollectionSelect.value =
        collectionId;

    }

    updateGiftRuleTierOptions();

    const newTierSelect =
      document.getElementById(
        "gr_tier_name"
      );

    if(newTierSelect){

      newTierSelect.value =
        tierName;

    }

    fillGiftRuleForm();

    alert(
      existingRule
        ? "แก้ไข Gift Rule เรียบร้อยแล้ว"
        : "เพิ่ม Gift Rule เรียบร้อยแล้ว"
    );

  }
  catch(error){

    console.error(
      "submitGiftRule error:",
      error
    );

    alert(
      "บันทึก Gift Rule ไม่สำเร็จ\n" +
      error.message
    );

  }
  finally{

    const currentBtn =
      document.getElementById(
        "saveGiftRuleBtn"
      );

    const currentLoading =
      document.getElementById(
        "saveGiftRuleLoading"
      );

    if(currentBtn){

      currentBtn.disabled = false;

      currentBtn.textContent =
        "💾 บันทึกเงื่อนไขของแถม";

    }

    if(currentLoading){

      currentLoading.style.display =
        "none";

    }

  }

}
  
  async function submitGiftCampaign(){

  const btn =
    document.getElementById(
      "saveGiftBtn"
    );

  const loading =
    document.getElementById(
      "saveGiftLoading"
    );

  const collectionId =
    document
      .getElementById(
        "g_collection_id"
      )
      ?.value || "";

  const tierName =
    document
      .getElementById(
        "g_tier_name"
      )
      ?.value
      .trim() || "";

  const giftName =
    document
      .getElementById(
        "g_gift_name"
      )
      ?.value
      .trim() || "";

  const active =
    document
      .getElementById(
        "g_active"
      )
      ?.value || "";

  const imageFile =
    document
      .getElementById(
        "g_gift_image_file"
      )
      ?.files[0];

  if(!collectionId){

    alert(
      "กรุณาเลือก Collection"
    );

    return;

  }

  if(!tierName){

    alert(
      "กรุณากรอกชื่อระดับของแถม"
    );

    return;

  }

  if(!giftName){

    alert(
      "กรุณากรอกชื่อของแถม"
    );

    return;

  }

  if(
    !editingGiftId &&
    !imageFile
  ){

    alert(
      "กรุณาเลือกรูปของแถม"
    );

    return;

  }

  const payload = {

    gift_id:
      editingGiftId || "",

    collection_id:
      collectionId,

    tier_name:
      tierName,

    gift_name:
      giftName,

    active:
      active

  };

  if(btn){

    btn.disabled = true;

    btn.textContent =
      editingGiftId
        ? "กำลังบันทึกการแก้ไข..."
        : "กำลังบันทึก...";

  }

  if(loading){

    loading.style.display =
      "block";

  }

  try{

    if(imageFile){

      payload.gift_image_base64 =
        await fileToBase64(
          imageFile
        );

    }

    const formData =
      new FormData();

    formData.append(
      "action",
      "saveGiftCampaign"
    );

    formData.append(
      "payload",
      JSON.stringify(payload)
    );

    const response =
      await fetch(
        API,
        {
          method:"POST",
          body:formData
        }
      );

    const result =
      await response.json();

    if(!result.success){

      throw new Error(
        result.error ||
        "บันทึกของแถมไม่สำเร็จ"
      );

    }

    const wasEditing =
      Boolean(editingGiftId);

    cancelGiftEdit();

    await loadGiftCampaigns();

    alert(
      wasEditing
        ? "แก้ไขของแถมเรียบร้อยแล้ว"
        : "เพิ่มของแถมเรียบร้อยแล้ว"
    );

  }
  catch(error){

    console.error(
      "submitGiftCampaign error:",
      error
    );

    alert(
      "บันทึกของแถมไม่สำเร็จ\n" +
      error.message
    );

  }
  finally{

    const currentBtn =
      document.getElementById(
        "saveGiftBtn"
      );

    const currentLoading =
      document.getElementById(
        "saveGiftLoading"
      );

    if(currentBtn){

      currentBtn.disabled = false;

      currentBtn.textContent =
        editingGiftId
          ? "💾 บันทึกการแก้ไข"
          : "💾 บันทึกของแถม";

    }

    if(currentLoading){

      currentLoading.style.display =
        "none";

    }

  }

}

  function editGiftCampaign(
  giftId
){

  const gift =
    adminGiftCampaigns.find(item=>

      String(
        item.gift_id
      ) ===
      String(giftId)

    );

  if(!gift){

    alert(
      "ไม่พบข้อมูลของแถม"
    );

    return;

  }

  editingGiftId =
    gift.gift_id;

  document
    .getElementById(
      "g_collection_id"
    )
    .value =
      gift.collection_id || "";

  document
    .getElementById(
      "g_tier_name"
    )
    .value =
      gift.tier_name || "";

  document
    .getElementById(
      "g_gift_name"
    )
    .value =
      gift.gift_name || "";

  document
    .getElementById(
      "g_active"
    )
    .value =
      String(
        gift.active || ""
      ).toLowerCase() === "yes"
        ? "yes"
        : "";

  document
    .getElementById(
      "saveGiftBtn"
    )
    .textContent =
      "💾 บันทึกการแก้ไข";

  document
    .getElementById(
      "cancelGiftEditBtn"
    )
    .classList.remove(
      "hidden"
    );

  document
    .getElementById(
      "g_collection_id"
    )
    .scrollIntoView({
      behavior:"smooth",
      block:"center"
    });

}

  function cancelGiftEdit(){

  editingGiftId = "";

  const collection =
    document.getElementById(
      "g_collection_id"
    );

  if(!collection){
    return;
  }

  collection.value = "";

  document
    .getElementById(
      "g_tier_name"
    )
    .value = "";

  document
    .getElementById(
      "g_gift_name"
    )
    .value = "";

  document
    .getElementById(
      "g_gift_image_file"
    )
    .value = "";

  document
    .getElementById(
      "g_active"
    )
    .value = "yes";

  document
    .getElementById(
      "saveGiftBtn"
    )
    .textContent =
      "💾 บันทึกของแถม";

  document
    .getElementById(
      "cancelGiftEditBtn"
    )
    .classList.add(
      "hidden"
    );

}

 async function removeGiftCampaign(
  giftId
){

  const gift =
    adminGiftCampaigns.find(item=>

      String(
        item.gift_id
      ) ===
      String(giftId)

    );

  const giftName =
    gift
      ? gift.gift_name
      : giftId;

  const ok =
    confirm(
      "ต้องการลบของแถม \"" +
      giftName +
      "\" ใช่ไหม?"
    );

  if(!ok){
    return;
  }

  try{

    const formData =
      new FormData();

    formData.append(
      "action",
      "deleteGiftCampaign"
    );

    formData.append(
      "payload",
      JSON.stringify({
        gift_id:giftId
      })
    );

    const response =
      await fetch(
        API,
        {
          method:"POST",
          body:formData
        }
      );

    const result =
      await response.json();

    if(!result.success){

      throw new Error(
        result.error ||
        "ลบของแถมไม่สำเร็จ"
      );

    }

    if(
      String(editingGiftId) ===
      String(giftId)
    ){

      cancelGiftEdit();

    }

    await loadGiftCampaigns();

    alert(
      "ลบของแถมเรียบร้อยแล้ว"
    );

  }catch(error){

    console.error(
      "removeGiftCampaign error:",
      error
    );

    alert(
      "ลบของแถมไม่สำเร็จ\n" +
      error.message
    );

  }

} 

 function fillGiftRuleForm(){

  const collectionSelect =
    document.getElementById(
      "gr_collection_id"
    );

  const tierNameInput =
    document.getElementById(
      "gr_tier_name"
    );

  const minAmountInput =
    document.getElementById(
      "gr_min_amount"
    );

  const maxSelectInput =
    document.getElementById(
      "gr_max_select"
    );

  const allowDuplicateSelect =
    document.getElementById(
      "gr_allow_duplicate"
    );

  const ruleModeSelect =
    document.getElementById(
      "gr_rule_mode"
    );

  const activeSelect =
    document.getElementById(
      "gr_active"
    );

  if(
    !collectionSelect ||
    !tierNameInput ||
    !minAmountInput ||
    !maxSelectInput ||
    !allowDuplicateSelect ||
    !ruleModeSelect ||
    !activeSelect
  ){

    return;

  }

  const collectionId =
    collectionSelect.value;

  const tierName =
    tierNameInput.value.trim();

  if(
    !collectionId ||
    !tierName
  ){

    minAmountInput.value =
      0;

    maxSelectInput.value =
      1;

    allowDuplicateSelect.value =
      "no";

    ruleModeSelect.value =
      "stack";

    activeSelect.value =
      "yes";

    return;

  }

  const rule =
    getGiftRule(
      collectionId,
      tierName
    );

  minAmountInput.value =
    rule
      ? Number(
          rule.min_amount || 0
        )
      : 0;

  maxSelectInput.value =
    rule
      ? Number(
          rule.max_select || 1
        )
      : 1;

  allowDuplicateSelect.value =
    rule &&
    String(
      rule.allow_duplicate || ""
    )
      .trim()
      .toLowerCase() ===
    "yes"
      ? "yes"
      : "no";

  ruleModeSelect.value =
    rule &&
    String(
      rule.rule_mode || ""
    )
      .trim()
      .toLowerCase() ===
    "replace"
      ? "replace"
      : "stack";

  activeSelect.value =
    rule &&
    String(
      rule.active || ""
    )
      .trim()
      .toLowerCase() ===
    "yes"
      ? "yes"
      : "";

}

  function openGiftRule(
  collectionId,
  tierName
){

  const collectionSelect =
    document.getElementById(
      "gr_collection_id"
    );

  const tierSelect =
    document.getElementById(
      "gr_tier_name"
    );

  if(
    !collectionSelect ||
    !tierSelect
  ){

    alert(
      "ไม่พบฟอร์ม Gift Rule"
    );

    return;

  }

  collectionSelect.value =
    String(
      collectionId || ""
    );

  updateGiftRuleTierOptions(
    tierName
  );

  const ruleForm =
    document.getElementById(
      "saveGiftRuleBtn"
    )
      ?.closest(
        ".card"
      );

  if(ruleForm){

    ruleForm.scrollIntoView({

      behavior:"smooth",

      block:"start"

    });

  }

}

  function getGiftTiersByCollection(
  collectionId
){

  const tierMap =
    new Map();

  adminGiftCampaigns
    .filter(
      gift =>
        String(
          gift.collection_id
        ) ===
        String(
          collectionId
        )
    )
    .forEach(
      gift => {

        const tierName =
          String(
            gift.tier_name || ""
          ).trim();

        if(tierName){

          tierMap.set(
            tierName.toLowerCase(),
            tierName
          );

        }

      }
    );

  return Array.from(
    tierMap.values()
  );

}

  function updateGiftRuleTierOptions(
  preferredTierName = ""
){

  const collectionSelect =
    document.getElementById(
      "gr_collection_id"
    );

  const tierSelect =
    document.getElementById(
      "gr_tier_name"
    );

  if(
    !collectionSelect ||
    !tierSelect
  ){

    return;

  }

  const collectionId =
    String(
      collectionSelect.value || ""
    );

  const previousTierName =
    String(
      preferredTierName ||
      tierSelect.value ||
      ""
    ).trim();

  if(!collectionId){

    tierSelect.innerHTML = `

      <option value="">
        เลือก Tier
      </option>

    `;

    fillGiftRuleForm();

    return;

  }

  const tierNames =
    getGiftTiersByCollection(
      collectionId
    );

  tierSelect.innerHTML = `

    <option value="">
      เลือก Tier
    </option>

    ${tierNames
      .map(
        tierName => `

          <option
          value="${escapeHtml(
            tierName
          )}"
          >

            ${escapeHtml(
              tierName
            )}

          </option>

        `
      )
      .join("")}

  `;

  const matchingTier =
    tierNames.find(
      tierName =>

        String(
          tierName
        )
          .trim()
          .toLowerCase() ===

        previousTierName
          .toLowerCase()

    );

  tierSelect.value =
    matchingTier || "";

  fillGiftRuleForm();

}
  
</script>
