<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Rinka Admin</title>
</head>

<body>

<h1>อัปเดตเลขพัสดุ</h1>

<div id="orders"></div>

<hr>

<h2>
📍 คำขอเปลี่ยนที่อยู่
</h2>

<div id="addressRequests"></div>
  
<input
id="orderId"
placeholder="Order ID">

<br><br>

<input
id="courier"
placeholder="Flash / Kerry">

<br><br>

<input
id="tracking"
placeholder="Tracking Number">

<br><br>

<button onclick="saveTracking()">
บันทึก
</button>

<script>

const API =
"https://script.google.com/macros/s/AKfycbxKjVvn8AXrK0wDvKqN-A9yS2Vk8R-w25ar1b9ftiIdUgUvFaShunLnFnAyIDuaTWj76w/exec";

async function loadOrders(){

const response =
await fetch(
API + "?action=orders"
);

const result =
await response.json();

let html = "";
result.orders.reverse();
result.orders.forEach(order=>{

if(
order.payment_status !== "paid" ||
order.status === "completed"
){
return;
}

html += `
<div style="
border:1px solid #ddd;
padding:15px;
margin-bottom:10px;
border-radius:10px;
">

<h3>
${order.order_id}
</h3>

<p>
ลูกค้า:
${order.customer_name}
</p>

<p>
${order.email}
</p>

<p>
สถานะ:
${order.status}
</p>

<p>
ยอดรวม:
${order.total}
 บาท
</p>

<input
id="courier_${order.order_id}"
placeholder="ขนส่ง">

<br><br>

<input
id="tracking_${order.order_id}"
placeholder="เลขพัสดุ">

<br><br>

<button
onclick="saveTrackingById('${order.order_id}')">
บันทึก Tracking
</button>

</div>
`;

});

document
.getElementById("orders")
.innerHTML =
html;

}

async function saveTrackingById(orderId){

const formData =
new FormData();

formData.append(
"payload",
JSON.stringify({

order_id:
orderId,

courier:
document.getElementById(
"courier_" + orderId
).value,

tracking_no:
document.getElementById(
"tracking_" + orderId
).value

})
);

const response =
await fetch(
API + "?action=tracking",
{
method:"POST",
body:formData
}
);

const result =
await response.json();

alert(
result.success
? "บันทึกสำเร็จ"
: "ผิดพลาด"
);

loadOrders();

}

async function loadAddressRequests(){

const response =
await fetch(
API +
"?action=addressChanges"
);

const result =
await response.json();

let html = "";

result.requests.reverse();

result.requests.forEach(req=>{

html += `
<div
style="
border:1px solid #f59e0b;
padding:15px;
margin-bottom:10px;
border-radius:10px;
background:#fffbeb;
">

<h3>
${req.request_id}
</h3>

<p>
Order:
${req.order_id}
</p>

<p>
ชื่อ:
${req.customer_name}
</p>

<p>
โทร:
${req.phone}
</p>

<p>
Social:
${req.social}
</p>

<p>
ที่อยู่ใหม่:
${req.address}
</p>

<p>
สถานะ:
${req.status}
</p>

</div>
`;

});

document
.getElementById(
"addressRequests"
)
.innerHTML =
html;

}

loadOrders();

loadAddressRequests();

</script>

</body>
</html>
