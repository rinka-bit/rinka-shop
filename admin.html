<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Rinka Admin</title>
</head>

<body>

<div id="loginBox">
<h2>🔒 Admin Login</h2>

<input
type="password"
id="adminPassword"
placeholder="รหัสผ่าน">

<br><br>

<button onclick="login()">
เข้าสู่ระบบ
</button>
</div>

<div id="adminContent" style="display:none;">

<div style="display:flex;justify-content:space-between;align-items:center;">
<h1>📊 Dashboard</h1>

<button onclick="logout()">
🚪 ออกจากระบบ
</button>
</div>

<div id="stats"></div>
<div id="topProducts"></div>
<div id="topFandoms"></div>

<hr>

<h1>🛍️ เพิ่มสินค้า</h1>

<div id="productManager"></div>

<h1>จัดการคำสั่งซื้อ</h1>
<div id="orders"></div>

<hr>

<h2>📍 คำขอเปลี่ยนที่อยู่</h2>
<div id="addressRequests"></div>

</div>

<script>

const API =
"https://script.google.com/macros/s/AKfycbxKjVvn8AXrK0wDvKqN-A9yS2Vk8R-w25ar1b9ftiIdUgUvFaShunLnFnAyIDuaTWj76w/exec";

function login(){

  const password =
    document.getElementById("adminPassword").value;

  if(password === "Rin@Saeh13579"){

    document.getElementById("loginBox").style.display = "none";
    document.getElementById("adminContent").style.display = "block";

    sessionStorage.setItem("adminLoggedIn","true");

    loadAdminData();

  }else{
    alert("รหัสผ่านไม่ถูกต้อง");
  }

}

function logout(){
  sessionStorage.removeItem("adminLoggedIn");
  location.reload();
}

if(sessionStorage.getItem("adminLoggedIn") === "true"){
  document.getElementById("loginBox").style.display = "none";
  document.getElementById("adminContent").style.display = "block";
  loadAdminData();
}

function renderProductManager(){

  document
    .getElementById("productManager")
    .innerHTML = `

<div style="
border:1px solid #ddd;
padding:15px;
border-radius:12px;
margin-bottom:20px;
">

<input id="p_name" placeholder="ชื่อสินค้า">
<br><br>

<input id="p_price" type="number" placeholder="ราคา">
<br><br>

<input id="p_sale_price" type="number" placeholder="ราคาลด">
<br><br>

<input id="p_main_category" placeholder="หมวดหลัก">
<br><br>

<input id="p_fandom" placeholder="Fandom">
<br><br>

<input id="p_sub_category" placeholder="หมวดย่อย">
<br><br>

<input id="p_round" placeholder="รอบพรี">
<br><br>

<textarea
id="p_description"
placeholder="รายละเอียดสินค้า"
style="width:100%;height:100px;">
</textarea>

<br><br>

<input id="p_image" placeholder="ลิงก์รูปหลัก">
<br><br>

<input id="p_image2" placeholder="ลิงก์รูป 2">
<br><br>

<input id="p_image3" placeholder="ลิงก์รูป 3">
<br><br>

<input id="p_image4" placeholder="ลิงก์รูป 4">
<br><br>

<select id="p_product_type">
<option value="preorder">Preorder</option>
<option value="instock">พร้อมส่ง</option>
</select>

<br><br>

<input
id="p_stock"
type="number"
placeholder="จำนวนสต็อก">

<br><br>

<input
id="p_preorder_deadline"
type="date"
placeholder="วันปิดพรี">

<br><br>

<input
id="p_estimated_arrival"
placeholder="กำหนดถึงโดยประมาณ">

<br><br>

<label>
<input id="p_featured" type="checkbox">
แสดงในสินค้าแนะนำ
</label>

<br><br>

<label>
<input id="p_new_arrival" type="checkbox">
สินค้าใหม่
</label>

<br><br>

<button onclick="saveProductFromAdmin()">
บันทึกสินค้า
</button>

</div>

`;

}
  
function loadAdminData(){
  loadStats();
  loadTopProducts();
  loadTopFandoms();
  renderProductManager();
  loadOrders();
  loadAddressRequests();
}

async function loadStats(){

  const response =
    await fetch(API + "?action=stats");

  const stats =
    await response.json();

  document.getElementById("stats").innerHTML = `
    <div style="
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
    gap:15px;
    margin-bottom:20px;
    ">

      <div style="padding:15px;border:1px solid #ddd;border-radius:12px;">
      📦<br>${stats.totalOrders} ออเดอร์
      </div>

      <div style="padding:15px;border:1px solid #ddd;border-radius:12px;">
      💰<br>${stats.totalSales} บาท
      </div>

      <div style="padding:15px;border:1px solid #ddd;border-radius:12px;">
      🚚<br>${stats.pendingShipping} รอส่ง
      </div>

      <div style="padding:15px;border:1px solid #ddd;border-radius:12px;">
      📍<br>${stats.pendingAddress} คำขอ
      </div>

      <div style="padding:15px;border:1px solid #ddd;border-radius:12px;">
      💸<br>${stats.todaySales} บาท<br>วันนี้
      </div>

      <div style="padding:15px;border:1px solid #ddd;border-radius:12px;">
      📅<br>${stats.monthSales} บาท<br>เดือนนี้
      </div>

    </div>
  `;

}

async function loadTopProducts(){

  const response =
    await fetch(API + "?action=topProducts");

  const result =
    await response.json();

  let html = `
    <h2>🏆 สินค้าขายดีที่สุด</h2>
    <div style="border:1px solid #ddd;padding:15px;border-radius:12px;margin-bottom:20px;">
  `;

  result.products.forEach((product,index)=>{
    html += `
      <p>
      ${index + 1}. ${product.name}
      (${product.qty} ชิ้น)
      </p>
    `;
  });

  html += "</div>";

  document.getElementById("topProducts").innerHTML = html;

}

async function loadTopFandoms(){

  const response =
    await fetch(API + "?action=topFandoms");

  const result =
    await response.json();

  let html = `
    <h2>🎮 แฟนด้อมขายดีที่สุด</h2>
    <div style="border:1px solid #ddd;padding:15px;border-radius:12px;margin-bottom:20px;">
  `;

  result.fandoms.forEach((fandom,index)=>{
    html += `
      <p>
      ${index + 1}. ${fandom.fandom}
      (${fandom.qty} ชิ้น)
      </p>
    `;
  });

  html += "</div>";

  document.getElementById("topFandoms").innerHTML = html;

}

async function loadOrders(){

  const response =
    await fetch(API + "?action=orders");

  const result =
    await response.json();

  let html = "";

  result.orders.reverse();

  result.orders.forEach(order=>{

    if(
      order.payment_status !== "paid" ||
      order.status === "completed"
    ){
      return;
    }

    html += renderOrderCard(order);

  });

  document.getElementById("orders").innerHTML = html;

  result.orders.forEach(order=>{

    const select =
      document.getElementById("status_" + order.order_id);

    if(select){
      select.value = order.status;
      toggleOrderFields(order.order_id);
    }

  });

}

function renderOrderCard(order){

  return `
    <div style="
    border:1px solid #ddd;
    padding:15px;
    margin-bottom:10px;
    border-radius:10px;
    ">

      <h3>${order.order_id}</h3>

      <p>ลูกค้า: ${order.customer_name}</p>
      <p>${order.email}</p>
      <p>สถานะปัจจุบัน: ${order.status}</p>

      <select
      id="status_${order.order_id}"
      onchange="toggleOrderFields('${order.order_id}')"
      >
        <option value="pending">รอจัดการ</option>
        <option value="china_arrived">ถึงโกดังจีนแล้ว</option>
        <option value="shipping_to_th">กำลังมาไทย</option>
        <option value="ready_to_ship">เตรียมจัดส่ง</option>
        <option value="shipped">จัดส่งแล้ว</option>
      </select>

      <br><br>

      <div
      id="feeBox_${order.order_id}"
      style="display:none;"
      >
        <p>ค่านำเข้า / ค่าส่งในไทย</p>

        <input
        id="import_${order.order_id}"
        type="number"
        placeholder="ค่านำเข้า">

        <br><br>

        <input
        id="domestic_${order.order_id}"
        type="number"
        placeholder="ค่าส่งในไทย">

        <br><br>
      </div>

      <div
      id="trackingBox_${order.order_id}"
      style="display:none;"
      >
        <input
        id="courier_${order.order_id}"
        placeholder="ขนส่ง">

        <br><br>

        <input
        id="tracking_${order.order_id}"
        placeholder="เลขพัสดุ">

        <br><br>
      </div>

      <button onclick="updateOrderStatus('${order.order_id}')">
      อัปเดตสถานะ
      </button>

    </div>
  `;

}

function toggleOrderFields(orderId){

  const status =
    document.getElementById("status_" + orderId).value;

  const feeBox =
    document.getElementById("feeBox_" + orderId);

  const trackingBox =
    document.getElementById("trackingBox_" + orderId);

  if(!feeBox || !trackingBox){
    return;
  }

  feeBox.style.display =
    status === "ready_to_ship"
      ? "block"
      : "none";

  trackingBox.style.display =
    status === "shipped"
      ? "block"
      : "none";

}

async function updateOrderStatus(orderId){

  const status =
    document.getElementById("status_" + orderId).value;

  const payload = {
    order_id: orderId,
    status: status
  };

  if(status === "ready_to_ship"){

    payload.import_fee_round2 =
      Number(
        document.getElementById("import_" + orderId).value || 0
      );

    payload.domestic_shipping_fee =
      Number(
        document.getElementById("domestic_" + orderId).value || 0
      );

  }

  if(status === "shipped"){

    payload.courier =
      document.getElementById("courier_" + orderId).value;

    payload.tracking_no =
      document.getElementById("tracking_" + orderId).value;

  }

  const formData =
    new FormData();

  formData.append(
    "payload",
    JSON.stringify(payload)
  );

  const response =
    await fetch(
      API + "?action=updateOrderStatus",
      {
        method:"POST",
        body:formData
      }
    );

  const result =
    await response.json();

  alert(
    result.success
      ? "อัปเดตสถานะแล้ว"
      : result.error || "อัปเดตไม่สำเร็จ"
  );

  loadOrders();

}

async function loadAddressRequests(){

  const response =
    await fetch(API + "?action=addressChanges");

  const result =
    await response.json();

  let html = "";

  result.requests.reverse();

  result.requests.forEach(req=>{

    if(req.status === "completed"){
      return;
    }

    html += `
      <div style="
      border:1px solid #f59e0b;
      padding:15px;
      margin-bottom:10px;
      border-radius:10px;
      background:#fffbeb;
      ">

        <h3>${req.request_id}</h3>

        <p>Order: ${req.order_id}</p>
        <p>ชื่อ: ${req.customer_name}</p>
        <p>โทร: ${req.phone}</p>
        <p>Social: ${req.social}</p>
        <p>ที่อยู่ใหม่: ${req.address}</p>

        <p>
        สถานะ: ${req.status}
        <br><br>

        <button onclick="completeAddressRequest('${req.request_id}')">
        ✅ ดำเนินการแล้ว
        </button>
        </p>

      </div>
    `;

  });

  document.getElementById("addressRequests").innerHTML = html;

}

async function completeAddressRequest(requestId){

  const formData =
    new FormData();

  formData.append(
    "payload",
    JSON.stringify({
      request_id: requestId
    })
  );

  const response =
    await fetch(
      API + "?action=completeAddressRequest",
      {
        method:"POST",
        body:formData
      }
    );

  const result =
    await response.json();

  alert(
    result.success
      ? "อัปเดตแล้ว"
      : "ผิดพลาด"
  );

  loadAddressRequests();

}

async function saveProductFromAdmin(){

  const payload = {
    name: document.getElementById("p_name").value,
    price: Number(document.getElementById("p_price").value || 0),
    sale_price: Number(document.getElementById("p_sale_price").value || 0),
    main_category: document.getElementById("p_main_category").value,
    fandom: document.getElementById("p_fandom").value,
    sub_category: document.getElementById("p_sub_category").value,
    round: document.getElementById("p_round").value,
    description: document.getElementById("p_description").value,
    image: document.getElementById("p_image").value,
    image2: document.getElementById("p_image2").value,
    image3: document.getElementById("p_image3").value,
    image4: document.getElementById("p_image4").value,
    product_type: document.getElementById("p_product_type").value,
    stock: Number(document.getElementById("p_stock").value || 0),
    preorder_deadline: document.getElementById("p_preorder_deadline").value,
    estimated_arrival: document.getElementById("p_estimated_arrival").value,
    featured: document.getElementById("p_featured").checked ? "yes" : "",
    new_arrival: document.getElementById("p_new_arrival").checked ? "yes" : "",
    status: "active"
  };

  if(!payload.name){
    alert("กรุณากรอกชื่อสินค้า");
    return;
  }

  if(!payload.price){
    alert("กรุณากรอกราคา");
    return;
  }

  const formData =
    new FormData();

  formData.append(
    "action",
    "saveProduct"
  );

  formData.append(
    "payload",
    JSON.stringify(payload)
  );

  const response =
    await fetch(
      API,
      {
        method:"POST",
        body:formData
      }
    );

  const result =
    await response.json();

  alert(
    result.success
    ? "เพิ่มสินค้าแล้ว: " + result.product_id
    : result.error || "เพิ่มสินค้าไม่สำเร็จ"
  );

  if(result.success){
    renderProductManager();
  }

}
  
</script>

</body>
</html>
