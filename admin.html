<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Rinka Admin</title>
</head>

<body>

<div id="loginBox">

<h2>
🔒 Admin Login
</h2>

<input
type="password"
id="adminPassword"
placeholder="รหัสผ่าน">

<br><br>

<button onclick="login()">
เข้าสู่ระบบ
</button>

</div>

<div
id="adminContent"
style="display:none;">

<div
style="
display:flex;
justify-content:space-between;
align-items:center;
">

<h1>
📊 Dashboard
</h1>

<button
onclick="logout()">
🚪 ออกจากระบบ
</button>

</div>

<div id="stats"></div>
<div id="topProducts"></div>
<div id="topFandoms"></div>

<hr>

<h1>อัปเดตเลขพัสดุ</h1>

<div id="orders"></div>

<hr>

<h2>
📍 คำขอเปลี่ยนที่อยู่
</h2>

<div id="addressRequests"></div>

<script>

const API =
"https://script.google.com/macros/s/AKfycbxKjVvn8AXrK0wDvKqN-A9yS2Vk8R-w25ar1b9ftiIdUgUvFaShunLnFnAyIDuaTWj76w/exec";

async function loadStats(){

const response =
await fetch(
API + "?action=stats"
);

const stats =
await response.json();

document
.getElementById("stats")
.innerHTML = `

<div style="
display:grid;
grid-template-columns:
repeat(auto-fit,minmax(200px,1fr));
gap:15px;
margin-bottom:20px;
">

<div style="
padding:15px;
border:1px solid #ddd;
border-radius:12px;
">
📦<br>
${stats.totalOrders}
ออเดอร์
</div>

<div style="
padding:15px;
border:1px solid #ddd;
border-radius:12px;
">
💰<br>
${stats.totalSales}
บาท
</div>

<div style="
padding:15px;
border:1px solid #ddd;
border-radius:12px;
">
🚚<br>
${stats.pendingShipping}
รอส่ง
</div>

<div style="
padding:15px;
border:1px solid #ddd;
border-radius:12px;
">
📍<br>
${stats.pendingAddress}
คำขอ
</div>

<div style="
padding:15px;
border:1px solid #ddd;
border-radius:12px;
">
💸<br>
${stats.todaySales}
บาท
<br>
วันนี้
</div>

<div style="
padding:15px;
border:1px solid #ddd;
border-radius:12px;
">
📅<br>
${stats.monthSales}
บาท
<br>
เดือนนี้
</div>

</div>

`;

}

async function loadTopProducts(){

const response =
await fetch(
API +
"?action=topProducts"
);

const result =
await response.json();

let html = `
<h2>
🏆 สินค้าขายดีที่สุด
</h2>

<div
style="
border:1px solid #ddd;
padding:15px;
border-radius:12px;
margin-bottom:20px;
">
`;

result.products.forEach(
(product,index)=>{
html += `
<p>
${index+1}.
${product.name}

(${product.qty} ชิ้น)
</p>
`;
}
);

html += "</div>";

document
.getElementById(
"topProducts"
)
.innerHTML =
html;

}

async function loadTopFandoms(){

const response =
await fetch(
API +
"?action=topFandoms"
);

const result =
await response.json();

let html = `
<h2>
🎮 แฟนด้อมขายดีที่สุด
</h2>

<div
style="
border:1px solid #ddd;
padding:15px;
border-radius:12px;
margin-bottom:20px;
">
`;

result.fandoms.forEach(
(fandom,index)=>{

html += `
<p>

${index+1}.

${fandom.fandom}

(${fandom.qty} ชิ้น)

</p>
`;

});

html += "</div>";

document
.getElementById(
"topFandoms"
)
.innerHTML =
html;

}
 
async function loadOrders(){

const response =
await fetch(
API + "?action=orders"
);

const result =
await response.json();

let html = "";
result.orders.reverse();
result.orders.forEach(order=>{

if(
order.payment_status !== "paid" ||
order.status === "completed"
){
return;
}

html += `
<div style="
border:1px solid #ddd;
padding:15px;
margin-bottom:10px;
border-radius:10px;
">

<h3>
${order.order_id}
</h3>

<p>
ลูกค้า:
${order.customer_name}
</p>

<p>
${order.email}
</p>

<p>
สถานะ:
${order.status}
</p>

<select
id="status_${order.order_id}"
>

<option value="pending">
รอจัดการ
</option>

<option value="china_arrived">
ถึงโกดังจีนแล้ว
</option>

<option value="shipping_to_th">
กำลังมาไทย
</option>

<option value="ready_to_ship">
เตรียมจัดส่ง
</option>

<option value="shipped">
จัดส่งแล้ว
</option>

</select>

<br><br>

<button
onclick="updateOrderStatus('${order.order_id}')">
อัปเดตสถานะ
</button>

<br><br>

<p>
ยอดรวม:
${order.total}
 บาท
</p>

<p>
ค่านำเข้า / ค่าส่งในไทย
</p>

<input
id="import_${order.order_id}"
type="number"
placeholder="ค่านำเข้า">

<br><br>

<input
id="domestic_${order.order_id}"
type="number"
placeholder="ค่าส่งในไทย">

<br><br>

<button
onclick="saveShippingFees('${order.order_id}')">
บันทึกค่าส่ง
</button>

<br><br>

<input
id="courier_${order.order_id}"
placeholder="ขนส่ง">

<br><br>

<input
id="tracking_${order.order_id}"
placeholder="เลขพัสดุ">

<br><br>

<button
onclick="saveTrackingById('${order.order_id}')">
บันทึก Tracking
</button>

</div>
`;

});

document
.getElementById("orders")
.innerHTML =
html;

result.orders.forEach(order=>{

const select =
document.getElementById(
"status_" + order.order_id
);

if(select){
select.value = order.status;
}

});

}

async function saveTrackingById(orderId){

const formData =
new FormData();

formData.append(
"payload",
JSON.stringify({

order_id:
orderId,

courier:
document.getElementById(
"courier_" + orderId
).value,

tracking_no:
document.getElementById(
"tracking_" + orderId
).value

})
);

const response =
await fetch(
API + "?action=tracking",
{
method:"POST",
body:formData
}
);

const result =
await response.json();

alert(
result.success
? "บันทึกสำเร็จ"
: "ผิดพลาด"
);

loadOrders();

}

async function loadAddressRequests(){

const response =
await fetch(
API +
"?action=addressChanges"
);

const result =
await response.json();

let html = "";

result.requests.reverse();

result.requests.forEach(req=>{

if(req.status === "completed"){
return;
}

html += `
<div
style="
border:1px solid #f59e0b;
padding:15px;
margin-bottom:10px;
border-radius:10px;
background:#fffbeb;
">

<h3>
${req.request_id}
</h3>

<p>
Order:
${req.order_id}
</p>

<p>
ชื่อ:
${req.customer_name}
</p>

<p>
โทร:
${req.phone}
</p>

<p>
Social:
${req.social}
</p>

<p>
ที่อยู่ใหม่:
${req.address}
</p>

<p>
สถานะ:
${req.status}
<br><br>

<button
onclick="
completeAddressRequest(
'${req.request_id}'
)
">
✅ ดำเนินการแล้ว
</button>
</p>

</div>
`;

});

document
.getElementById(
"addressRequests"
)
.innerHTML =
html;

}

function loadAdminData(){

loadStats();

loadTopProducts();

loadTopFandoms();

loadOrders();

loadAddressRequests();

}

async function completeAddressRequest(
requestId
){

const formData =
new FormData();

formData.append(
"payload",
JSON.stringify({

request_id:
requestId

})
);

const response =
await fetch(

API +
"?action=completeAddressRequest",

{
method:"POST",
body:formData
}

);

const result =
await response.json();

alert(
result.success
? "อัปเดตแล้ว"
: "ผิดพลาด"
);

loadAddressRequests();

}

function login(){

const password =
document
.getElementById(
"adminPassword"
)
.value;

if(
password ===
"Rin@Saeh13579"
){

document
.getElementById(
"loginBox"
)
.style.display =
"none";

document
.getElementById(
"adminContent"
)
.style.display =
"block";

sessionStorage.setItem(
"adminLoggedIn",
"true"
);

loadAdminData();
 
}
else{

alert(
"รหัสผ่านไม่ถูกต้อง"
);

}

}

if(
sessionStorage.getItem(
"adminLoggedIn"
) === "true"
){

document
.getElementById(
"loginBox"
)
.style.display =
"none";

document
.getElementById(
"adminContent"
)
.style.display =
"block";

loadAdminData();

}

async function updateOrderStatus(orderId){

const status =
document.getElementById(
"status_" + orderId
).value;

const formData =
new FormData();

formData.append(
"payload",
JSON.stringify({
order_id:orderId,
status:status
})
);

const response =
await fetch(
API + "?action=updateOrderStatus",
{
method:"POST",
body:formData
}
);

const result =
await response.json();

alert(
result.success
? "อัปเดตสถานะแล้ว"
: "อัปเดตไม่สำเร็จ"
);

loadOrders();

}

async function saveShippingFees(orderId){

const importFee =
Number(
document.getElementById(
"import_" + orderId
).value || 0
);

const domesticFee =
Number(
document.getElementById(
"domestic_" + orderId
).value || 0
);

const formData =
new FormData();

formData.append(
"payload",
JSON.stringify({
order_id:orderId,
import_fee:importFee,
domestic_shipping_fee:domesticFee
})
);

const response =
await fetch(
API + "?action=saveShippingFees",
{
method:"POST",
body:formData
}
);

const result =
await response.json();

alert(
result.success
? "บันทึกค่านำเข้า/ค่าส่งแล้ว"
: "บันทึกไม่สำเร็จ"
);

loadOrders();

}
 
function logout(){

sessionStorage.removeItem(
"adminLoggedIn"
);

location.reload();

}
 
</script>
</div>
</body>
</html>
