<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1">

<title>
ไม่พบหน้า | Rinka Shop
</title>

<link
rel="preconnect"
href="https://fonts.googleapis.com">

<link
rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin>

<link
href="https://fonts.googleapis.com/css2?family=Kodchasan:wght@400;500;600;700&display=swap"
rel="stylesheet">

<style>

:root{

  --primary:#7dcfff;
  --primary-dark:#4ba5db;
  --background:#f6fbff;
  --text:#334155;
  --muted:#64748b;
  --border:#dbe7f1;

}

*{
  box-sizing:border-box;
}

body{

  min-height:100vh;
  margin:0;

  display:flex;
  align-items:center;
  justify-content:center;

  padding:24px;

  font-family:
    'Kodchasan',
    sans-serif;

  color:
    var(--text);

  background:
    radial-gradient(
      circle at top left,
      rgba(125,207,255,.24),
      transparent 38%
    ),
    radial-gradient(
      circle at bottom right,
      rgba(184,232,255,.3),
      transparent 36%
    ),
    linear-gradient(
      180deg,
      #fbfdff 0%,
      var(--background) 100%
    );

}

.error-card{

  position:relative;

  width:min(
    560px,
    100%
  );

  padding:
    42px 28px;

  overflow:hidden;

  text-align:center;

  background:
    rgba(
      255,
      255,
      255,
      .94
    );

  border:
    1px solid
    var(--border);

  border-radius:
    28px;

  box-shadow:
    0 20px 55px
    rgba(
      86,
      142,
      178,
      .14
    );

  backdrop-filter:
    blur(10px);

}

.error-card::before{

  content:
    "☁️";

  position:absolute;

  top:20px;
  left:24px;

  font-size:42px;

  opacity:.13;

}

.error-card::after{

  content:
    "❄️";

  position:absolute;

  right:25px;
  bottom:20px;

  font-size:38px;

  opacity:.12;

}

.error-code{

  margin:0;

  color:
    var(--primary-dark);

  font-size:
    clamp(
      72px,
      18vw,
      126px
    );

  line-height:1;

  font-weight:700;

  letter-spacing:
    -7px;

  text-shadow:
    0 8px 22px
    rgba(
      75,
      165,
      219,
      .14
    );

}

.error-icon{

  margin:
    8px 0 12px;

  font-size:48px;

}

h1{

  margin:
    0 0 10px;

  color:#355a73;

  font-size:
    clamp(
      24px,
      6vw,
      32px
    );

}

.description{

  max-width:430px;

  margin:
    0 auto;

  color:
    var(--muted);

  line-height:1.75;

  font-size:15px;

}

.actions{

  display:grid;

  grid-template-columns:
    repeat(
      2,
      minmax(
        0,
        1fr
      )
    );

  gap:11px;

  margin-top:28px;

}

.action{

  min-height:49px;

  display:flex;
  align-items:center;
  justify-content:center;

  padding:
    11px 16px;

  border:
    1px solid
    transparent;

  border-radius:
    999px;

  text-decoration:none;

  font-size:14px;
  font-weight:700;

  transition:
    transform .18s ease,
    box-shadow .18s ease;

}

.action:hover{

  transform:
    translateY(-2px);

}

.primary-action{

  color:#fff;

  background:
    linear-gradient(
      135deg,
      var(--primary),
      #56b7ed
    );

  box-shadow:
    0 8px 20px
    rgba(
      75,
      165,
      219,
      .21
    );

}

.secondary-action{

  color:#3476a2;

  background:#eef8ff;

  border-color:#cce5f4;

}

.help-link{

  display:inline-block;

  margin-top:20px;

  color:#66879c;

  font-size:13px;
  font-weight:600;

  text-decoration:none;

}

.help-link:hover{

  color:
    var(--primary-dark);

}

@media(
  max-width:520px
){

  body{
    padding:14px;
  }

  .error-card{

    padding:
      34px 18px;

    border-radius:
      22px;

  }

  .actions{

    grid-template-columns:
      1fr;

  }

}

</style>

</head>

<body>

<main class="error-card">

<div
class="error-code"
aria-label="ข้อผิดพลาด 404">

404

</div>

<div
class="error-icon"
aria-hidden="true">

🐈‍⬛

</div>

<h1>

ไม่พบหน้าที่คุณต้องการ

</h1>

<p class="description">

ลิงก์นี้อาจไม่ถูกต้อง หน้าดังกล่าวอาจถูกย้าย
หรือสินค้าที่กำลังค้นหาอาจถูกปิดการขายแล้ว

</p>

<div class="actions">

<a
class="action primary-action"
href="home.html">

🏠 กลับหน้าแรก

</a>

<a
class="action secondary-action"
href="browse.html">

🛍️ ดูสินค้าทั้งหมด

</a>

</div>

<a
class="help-link"
href="help.html">

🛟 ติดต่อศูนย์ช่วยเหลือ

</a>

</main>

</body>

</html>
