<!DOCTYPE html>

<html lang="th">

<head>

<meta charset="UTF-8">

<title>
Rinka Shop
</title>

<style>

body{

  font-family:
    Arial,sans-serif;

  padding:20px;

}

.section{

  margin-bottom:40px;

}

.card{

  display:inline-block;
  vertical-align:top;

  width:220px;

  padding:15px;

  margin:10px;

  border:1px solid #ddd;

  border-radius:10px;

  cursor:pointer;

}

.navbar{
display:flex;
gap:20px;
padding:15px 0;
margin-bottom:20px;
border-bottom:1px solid #ddd;
}

.navbar a{
text-decoration:none;
font-weight:bold;
color:#4f46e5;
}

.navbar a:hover{
opacity:.8;
}

</style>

</head>

<body>

<div class="navbar">

<a href="home.html">
🏠 หน้าแรก
</a>

<a href="lookup.html">
📦 เช็กออเดอร์
</a>

<a href="change-address.html">
📍 เปลี่ยนที่อยู่
</a>

<a href="https://x.com/prewithrinka">
📞 ติดต่อร้าน
</a>

</div>
  
<h1>
Rinka Shop
</h1>

<div
  id="featuredSection"
  class="section">

<h2>
🔥 เปิดพรีอยู่ตอนนี้
</h2>

<div id="featuredProducts">
</div>

</div>

<div
  id="newSection"
  class="section">

<input
id="search"
placeholder="ค้นหาสินค้า"
oninput="searchProducts()">

<h2>
⭐ สินค้าใหม่ล่าสุด
</h2>

<div id="newProducts">
</div>

</div>

<div
  id="fandomSection"
  class="section">

<h2>
🎮 แฟนด้อม
</h2>

<div id="fandomList">
</div>

</div>

<script>

const API =
"https://script.google.com/macros/s/AKfycbxKjVvn8AXrK0wDvKqN-A9yS2Vk8R-w25ar1b9ftiIdUgUvFaShunLnFnAyIDuaTWj76w/exec?action=products";

async function loadHome(){

const response =
await fetch(API);

const products =
await response.json();

loadFeatured(products);

loadNewArrivals(products);

loadFandoms(products);

}

function createCard(product){

return `
<div class="card"
onclick="
window.location.href=
'product.html?id=${product.product_id}'
">

<img
src="${product.image}"
style="
width:100%;
height:200px;
object-fit:cover;
border-radius:8px;
">

<h3>
${product.name}
</h3>

<p>
${product.fandom || ""}
</p>

<p>
฿${product.price}
</p>

</div>
`;

}

function loadFeatured(products){

const featured =
products.filter(
p =>
String(p.featured)
.toUpperCase() === "TRUE"
);

document
.getElementById(
"featuredProducts"
)
.innerHTML =
featured
.map(createCard)
.join("");

}

function loadNewArrivals(products){

const arrivals =
products.filter(
p =>
String(p.new_arrival)
.toUpperCase() === "TRUE"
);

document
.getElementById(
"newProducts"
)
.innerHTML =
arrivals
.map(createCard)
.join("");

}

function loadFandoms(products){

const fandoms =
[
...new Set(
products.map(
p=>p.fandom
)
)
];

let html = "";

fandoms.forEach(fandom=>{

if(!fandom){
return;
}

html += `
<button
onclick="
document
.getElementById('search')
.value='${fandom}';

searchProducts();
"
>

${fandom}

</button>
`;

});

document
.getElementById(
"fandomList"
)
.innerHTML =
html;

}

function searchProducts(){

const keyword =
document
.getElementById(
"search"
)
.value
.toLowerCase();

const cards =
document.querySelectorAll(
"#newProducts .card"
);

cards.forEach(card=>{

const text =
card.innerText
.toLowerCase();

card.style.display =
text.includes(keyword)
? "inline-block"
: "none";

});

}

loadHome();

</script>

</body>

</html>
