}

.hero-content h1{

.hero-content p{

<body>

<h1
style="
font-size:36px;
margin-bottom:10px;
">
</h1>

<p
style="
color:#666;
margin-bottom:25px;
">
</p>

<div class="hero-banner">

<div class="hero-content">

<h1>
☁️ Rinka Shop
</h1>

<p>

Pre-order Game Merchandise miHoYo, KURO GAMES,
PAPERPRESENTED, Ita Bag and more

</p>

<button
onclick="
document
.getElementById('search')
.focus()
">

ค้นหาสินค้า

</button>

</div>

</div>
  
<input
id="search"
placeholder="🔍 ค้นหาสินค้า, แฟนด้อม..."
oninput="searchProducts()">

<div
  id="fandomSection"
  class="section">

<h2>
🎮 Fandom
</h2>

<div id="fandomList">
</div>

</div>
<div
class="section">

<h2>
🏷️ หมวดสินค้า
</h2>

<button
class="browse-category-btn"
onclick="
window.location.href=
'categories.html'
">

เลือกหมวดสินค้า

</button>

</div>
  
<div
id="searchResults"
class="section">
</div>

<div
id="collectionSection"
class="section">

🔥 รอบพรีออเดอร์
</h2>

<div
id="collectionCards"
class="product-grid-home">
</div>

</div>
  
<div
id="featuredSection"
class="section">

<h2>
⏰ พรีออเดอร์จำกัดเวลา
</h2>

<div
id="featuredProducts"
class="product-grid-home">
</div>

</div>
  
<div
  id="newSection"
  class="section">

<h2>
⭐ สินค้าใหม่ล่าสุด
</h2>

<div
id="newProducts"
class="product-grid-home">
</div>

</div>

<script>

const BASE_API =
"https://script.google.com/macros/s/AKfycbxKjVvn8AXrK0wDvKqN-A9yS2Vk8R-w25ar1b9ftiIdUgUvFaShunLnFnAyIDuaTWj76w/exec";

const API =
BASE_API + "?action=products";
  
async function loadHome(){

const response =
await fetch(API);

const products =
await response.json();

window.allProducts =
products;

products.sort(
(a,b)=>
Number(b.sort_order||0)
-
Number(a.sort_order||0)
);

loadFeatured(products);

loadCollections();

loadNewArrivals(products);

loadFandoms(products);
}

async function loadCollections(){

const response =
await fetch(
BASE_API +
"?action=collections"
);

const collections =
await response.json();

let html = "";

collections.forEach(c=>{

let countdown = "";

if(c.preorder_deadline){

const deadline =
new Date(
c.preorder_deadline
);

const today =
new Date();

const diffDays =

Math.ceil(

(deadline - today)

/

(1000*60*60*24)

);

if(diffDays > 0){

countdown =
`⏰ เหลือ ${diffDays} วัน`;

}

}

html += `

<div
class="collection-card"
onclick="window.location.href='collection.html?id=${c.collection_id}'">

<img
src="${c.image}">

<div
class="collection-content">

<div
class="badge-preorder">

PREORDER

</div>

<h3>

${c.name}

</h3>

<p>

${c.fandom}

</p>

${
countdown
?
`
<div class="deadline-badge">

${countdown}

</div>
`
:
""
}

</div>

</div>

`;

});

document
.getElementById(
"collectionCards"
)
.innerHTML = html;

}
  
function getDeadlineText(deadline){

if(
!deadline ||
deadline === "N/A"
){
return "";
}

const today =
new Date();

const end =
new Date(deadline);

const diffDays =

Math.ceil(

(end - today)

/

(1000*60*60*24)

);

if(diffDays < 0){

return "";

}

if(diffDays === 0){

return "🔥 ปิดรับวันนี้";

}

if(diffDays === 1){

return "⏰ เหลือ 1 วัน";

}

return `⏰ เหลือ ${diffDays} วัน`;

}

function createCard(product){

return `
<div
class="card"
onclick="
window.location.href=
'product.html?id=${product.product_id}'
">

<img
src="${product.image}"
alt="${product.name}">

${

product.new_arrival

?

`
<div class="badge-new">
NEW
</div>
`

:

""

}

${

product.product_type ===
"preorder"

?

`
<div class="badge-preorder">
PREORDER
</div>
`

:

""

}

${
getDeadlineText(
product.preorder_deadline
)

?

`
<div class="deadline-badge">

${getDeadlineText(
product.preorder_deadline
)}

</div>
`

:

""
}

<h3>
${product.name}
</h3>

<p>
${product.fandom || ""}
</p>

<p>
฿${product.price}
</p>

</div>
`;

}

function loadFeatured(products){

const featured =
products.filter(

p =>

p.preorder_deadline &&

p.preorder_deadline !== "N/A"

);
  
featured.sort((a,b)=>{

return new Date(
a.preorder_deadline
)

-

new Date(
b.preorder_deadline
);

});
  
document
.getElementById(
"featuredProducts"
)
.innerHTML =
featured
.map(createCard)
.join("");

}

function loadNewArrivals(products){

const today =
new Date();

const arrivals =
products.filter(product=>{

if(
!product.created_at
){
return false;
}

const created =
new Date(
product.created_at
);

const diffDays =

(today - created)

/

(1000*60*60*24);

return diffDays <= 30;

});

document
.getElementById(
"newProducts"
)
.innerHTML =

arrivals
.map(createCard)
.join("");

}

function loadFandoms(products){

const fandoms =

[
...new Set(
products
.map(
p=>p.fandom
)
.filter(Boolean)
)
];

let html = "";

fandoms.forEach(fandom=>{

const count =

products.filter(
p=>p.fandom === fandom
).length;

html += `
<button
class="fandom-btn"
onclick="
filterByFandom(
'${fandom}'
)
">

${fandom}
(${count})

</button>
`;

});

document
.getElementById(
"fandomList"
)
.innerHTML = html;

}

function filterByFandom(fandom){

document
.getElementById(
"search"
)
.value =
fandom;

searchProducts();

}

function searchProducts(){

const keyword =
document
.getElementById(
"search"
)
.value
.toLowerCase()
.trim();

const container =
document.getElementById(
"searchResults"
);

if(!keyword){

container.innerHTML = "";

return;

}

const results =
window.allProducts.filter(

product =>

(product.name || "")
.toLowerCase()
.includes(keyword)

||

(product.fandom || "")
.toLowerCase()
.includes(keyword)

||

(product.sub_category || "")
.toLowerCase()
.includes(keyword)

);

container.innerHTML =

`
<h2>
🔍 ผลการค้นหา
</h2>
`

+

results
.map(createCard)
.join("");

}
  
updateCartCount();

function updateCartCount(){

const cart =

JSON.parse(
localStorage.getItem(
"cart"
) || "[]"
);

const count =

cart.reduce(

(sum,item)=>

sum +
Number(item.qty || 0),

0

);

const cartLink =

document.getElementById(
"cartLink"
);

if(cartLink){

cartLink.textContent =

`🛒 ตะกร้า (${count})`;

}

}

loadHome();

</script>
