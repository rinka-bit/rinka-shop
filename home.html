<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>☁️ Rinka Shop</title>
<link rel="stylesheet" href="shared.css">
<style>
  .rk-hero{
    margin: 14px 18px 4px;
    border-radius: var(--rk-radius-lg);
    padding: 28px 22px;
    background:
      radial-gradient(120% 140% at 100% 0%, rgba(255,255,255,.35), transparent 60%),
      linear-gradient(135deg, var(--rk-primary), #6FC6FF);
    color:#fff;
    position:relative;
    overflow:hidden;
  }
  .rk-hero::after{
    content:"☁️"; position:absolute; font-size:110px; opacity:.18;
    right:-18px; bottom:-30px; transform: rotate(-8deg);
  }
  .rk-hero h1{ font-size:24px; margin-bottom:6px; }
  .rk-hero p{ font-size:13.5px; opacity:.92; margin:0 0 18px; line-height:1.5; max-width: 78%; }
  .rk-hero .rk-btn{ background:#fff; color: var(--rk-primary-dark); }

  .rk-fandom-row{ display:flex; gap:8px; overflow-x:auto; padding: 4px 18px 4px; }
  .rk-fandom-row::-webkit-scrollbar{ display:none; }
  .rk-fandom-chip{
    flex:0 0 auto;
    background: var(--rk-surface);
    border: 1.5px solid var(--rk-border);
    border-radius: 999px;
    padding: 8px 16px;
    font-size:13px; font-weight:600;
    color: var(--rk-ink-soft);
    cursor:pointer;
  }

  .rk-collection-card{
    width: 240px;
    border-radius: var(--rk-radius-md);
    overflow:hidden;
    background: var(--rk-surface);
    box-shadow: var(--rk-shadow);
    cursor:pointer;
  }
  .rk-collection-card .rk-c-img{ aspect-ratio: 16/10; background: var(--rk-surface-2); overflow:hidden; }
  .rk-collection-card .rk-c-img img{ width:100%; height:100%; object-fit:cover; }
  .rk-collection-card .rk-c-body{ padding: 12px 14px 14px; }
  .rk-collection-card h3{ font-size:14.5px; margin:2px 0 4px; }
  .rk-collection-card .rk-c-fandom{ font-size:11.5px; color: var(--rk-ink-faint); margin-bottom:8px; }

  .rk-skel-card{ aspect-ratio: 3/4; }
</style>
</head>
<body>

<div id="rkChrome"></div>

<section class="rk-hero">
  <h1>Rinka Shop</h1>
  <p>พรีออเดอร์ของสะสมเกม miHoYo · KURO GAMES · PAPERPRESENTED · Ita Bag</p>
  <button class="rk-btn" onclick="location.href='browse.html'">🔍 ค้นหาสินค้า</button>
</section>

<section class="rk-section">
  <h2>🎮 Fandom</h2>
</section>
<div id="fandomRow" class="rk-fandom-row"></div>

<section class="rk-section">
  <h2>🔥 รอบพรีออเดอร์</h2>
  <p class="rk-section-sub">แต่ละรอบมีปิดรับ อย่าลืมกดตั๋วก่อนหมดเวลา</p>
</section>
<div id="collectionRow" class="rk-shelf" style="padding-left:18px;padding-right:18px;"></div>

<section class="rk-section">
  <h2>⏰ พรีออเดอร์จำกัดเวลา</h2>
</section>
<div id="featuredGrid" class="rk-grid" style="margin:0 18px;"></div>

<section class="rk-section">
  <h2>⭐ สินค้าใหม่ล่าสุด</h2>
</section>
<div id="newGrid" class="rk-grid" style="margin:0 18px 24px;"></div>

<script src="toast.js"></script>
<script src="shared.js"></script>
<script>
renderChrome("home", "Rinka Shop");

let allProducts = [];

function skeletonCards(n, cls = "") {
  return Array.from({ length: n })
    .map(() => `<div class="rk-skel rk-skel-card ${cls}"></div>`)
    .join("");
}

function ticketBadge(deadline) {
  const info = getDeadlineInfo(deadline);
  if (!info) return "";
  return `<span class="rk-ticket ${info.urgent ? "rk-ticket-urgent" : ""}">⏰ ${info.text}</span>`;
}

function productCard(p) {
  const price = Number(p.final_price ?? p.price ?? 0);
  const oldPrice = Number(p.old_price ?? p.price ?? 0);
  const badge = p.new_arrival
    ? `<span class="rk-badge rk-badge-new">NEW</span>`
    : p.on_sale
    ? `<span class="rk-badge rk-badge-sale">SALE</span>`
    : p.product_type === "preorder"
    ? `<span class="rk-badge rk-badge-preorder">PREORDER</span>`
    : `<span class="rk-badge rk-badge-stock">พร้อมส่ง</span>`;

  return `
    <div class="rk-product-card" onclick="location.href='product.html?id=${p.product_id}'">
      <div class="rk-img-box">
        <img src="${p.image || ""}" alt="${p.name || ""}" loading="lazy">
        ${badge}
      </div>
      <div class="rk-body">
        <h3>${p.name || ""}</h3>
        <div class="rk-fandom">${p.fandom || ""}</div>
        <div>
          <span class="rk-price">${formatBaht(price)}</span>
          ${p.on_sale ? `<span class="rk-price-old">${formatBaht(oldPrice)}</span>` : ""}
        </div>
        <div style="margin-top:6px;">${ticketBadge(p.preorder_deadline)}</div>
      </div>
    </div>
  `;
}

async function loadHome() {
  document.getElementById("featuredGrid").innerHTML = skeletonCards(4);
  document.getElementById("newGrid").innerHTML = skeletonCards(4);
  document.getElementById("collectionRow").innerHTML = skeletonCards(3, "").replace(
    /rk-skel-card/g,
    "rk-skel-card"
  );

  try {
    const result = await RinkaAPI.get("products");
    allProducts = Array.isArray(result)
      ? result
      : Array.isArray(result.products)
      ? result.products
      : [];
    allProducts.sort((a, b) => Number(b.sort_order || 0) - Number(a.sort_order || 0));

    renderFeatured();
    renderNew();
    renderFandoms();
    loadCollections();
  } catch (err) {
    console.error("loadHome error", err);
    showToast("โหลดสินค้าไม่สำเร็จ ลองรีเฟรชอีกครั้ง", "error");
    document.getElementById("featuredGrid").innerHTML =
      `<div class="rk-empty" style="grid-column:1/-1;"><div class="rk-empty-emoji">📡</div>เชื่อมต่อร้านไม่สำเร็จ</div>`;
  }
}

function renderFeatured() {
  const featured = allProducts
    .filter((p) => p.preorder_deadline && p.preorder_deadline !== "N/A")
    .sort((a, b) => new Date(a.preorder_deadline) - new Date(b.preorder_deadline));
  const el = document.getElementById("featuredGrid");
  el.innerHTML = featured.length
    ? featured.map(productCard).join("")
    : `<div class="rk-empty" style="grid-column:1/-1;"><div class="rk-empty-emoji">📦</div>ยังไม่มีรอบพรีออเดอร์ตอนนี้</div>`;
}

function renderNew() {
  const arrivals = allProducts.filter(
    (p) =>
      p.new_arrival === true ||
      Number(p.new_arrival) === 1 ||
      String(p.new_arrival || "").trim().toLowerCase() === "true"
  );
  const el = document.getElementById("newGrid");
  el.innerHTML = arrivals.length
    ? arrivals.map(productCard).join("")
    : `<div class="rk-empty" style="grid-column:1/-1;"><div class="rk-empty-emoji">⭐</div>ยังไม่มีสินค้าใหม่</div>`;
}

function renderFandoms() {
  const fandoms = [...new Set(allProducts.map((p) => p.fandom).filter(Boolean))];
  document.getElementById("fandomRow").innerHTML = fandoms
    .map((f) => {
      const count = allProducts.filter((p) => p.fandom === f).length;
      return `<button class="rk-fandom-chip" onclick="location.href='browse.html?type=fandom&value=${encodeURIComponent(
        f
      )}'">${f} · ${count}</button>`;
    })
    .join("");
}

async function loadCollections() {
  try {
    const result = await RinkaAPI.get("collections");
    const collections = Array.isArray(result)
      ? result
      : Array.isArray(result.collections)
      ? result.collections
      : [];
    const el = document.getElementById("collectionRow");
    el.innerHTML = collections.length
      ? collections
          .map(
            (c) => `
        <div class="rk-collection-card" onclick="location.href='collection.html?id=${c.collection_id}'">
          <div class="rk-c-img"><img src="${c.image || ""}" loading="lazy" alt="${c.name || ""}"></div>
          <div class="rk-c-body">
            <h3>${c.name || ""}</h3>
            <div class="rk-c-fandom">${c.fandom || ""} · ${Number(c.product_count || 0).toLocaleString()} รายการ</div>
            ${ticketBadge(c.preorder_deadline)}
          </div>
        </div>`
          )
          .join("")
      : `<div class="rk-empty">ยังไม่มีรอบพรีออเดอร์</div>`;
  } catch (err) {
    console.error("loadCollections error", err);
  }
}

loadHome();
</script>
</body>
</html>
