<!DOCTYPE html>

<html lang="th">

<head>

<meta charset="UTF-8">

<title>
Rinka Shop
</title>

<link
rel="preconnect"
href="https://fonts.googleapis.com">

<link
rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin>

<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700&display=swap" rel="stylesheet">
  
<style>

:root{

--primary:#7dcfff;

--secondary:#b8e8ff;

--background:#f6fbff;

--card:#ffffff;

--text:#3f4b5a;

}

body{

font-family:
'M PLUS Rounded 1c',
sans-serif;

}

background:

linear-gradient(
180deg,
#f8fcff 0%,
#eef8ff 100%
);

color:#3f4b5a;

padding:20px;

}

.section{

  margin-bottom:40px;

}

h2{

color:#5faee3;

font-weight:700;

}
  
.card{

display:inline-block;

width:220px;

background:white;

border-radius:20px;

overflow:hidden;

margin:10px;

vertical-align:top;

}

.card img{

width:100%;

height:220px;

object-fit:cover;

display:block;

}

.card h3{
font-size:16px;
margin:10px 0 5px;
}

.card p{
margin:5px 0;
}

.card:hover{

transform:
translateY(-6px);

box-shadow:
0 10px 30px
rgba(
125,
207,
255,
0.25
);

}

.navbar{

display:flex;
gap:20px;

padding:15px 20px;

background:

rgba(
255,
255,
255,
0.9
);

backdrop-filter:
blur(8px);

border-radius:20px;

box-shadow:
0 4px 15px
rgba(
125,
207,
255,
0.15
);

margin-bottom:30px;

}

.navbar a{

text-decoration:none;

font-weight:700;

color:#4a6fa5;

}

.navbar a:hover{

color:#2563eb;

}

#search{

background:white;

border:none;

border-radius:18px;

padding:14px 18px;

box-shadow:
0 3px 12px
rgba(
125,
207,
255,
0.15
);

}

  .shop-title{

font-size:42px;

font-weight:700;

margin-bottom:5px;

}

.shop-subtitle{

color:#6b7280;

font-size:14px;

margin-bottom:25px;

}
  
</style>

</head>

<body>

<div class="navbar">

<a href="home.html">
🏠 หน้าแรก
</a>

<a href="lookup.html">
📦 เช็กออเดอร์
</a>

<a href="change-address.html">
📍 เปลี่ยนที่อยู่
</a>

<a href="https://x.com/prewithrinka">
📞 ติดต่อร้าน
</a>

</div>
  
<h1
style="
font-size:36px;
margin-bottom:10px;
">

<h1 class="shop-title">
❄️ Rinka Shop ❄️
</h1>

<p class="shop-subtitle">
Pre-order miHoYo, KURO GAMES,
PAPERPRESENTED, Ita Bag and more
</p>

</h1>

<p
style="
color:#666;
margin-bottom:25px;
">
</p>

<input
id="search"
placeholder="🔍 ค้นหาสินค้า, แฟนด้อม..."
oninput="searchProducts()">

<div
id="searchResults"
class="section">
</div>

<div
id="featuredSection"
class="section">

<h2>
🔥 เปิดพรีอยู่ตอนนี้
</h2>

<div id="featuredProducts">
</div>

</div>

<div
  id="newSection"
  class="section">

<h2>
⭐ สินค้าใหม่ล่าสุด
</h2>

<div id="newProducts">
</div>

</div>

<div
  id="fandomSection"
  class="section">

<h2>
🎮 แฟนด้อม
</h2>

<div id="fandomList">
</div>

</div>

<script>

const API =
"https://script.google.com/macros/s/AKfycbxKjVvn8AXrK0wDvKqN-A9yS2Vk8R-w25ar1b9ftiIdUgUvFaShunLnFnAyIDuaTWj76w/exec?action=products";

async function loadHome(){

const response =
await fetch(API);

const products =
await response.json();

window.allProducts =
products;

products.sort(
(a,b)=>
Number(b.sort_order||0)
-
Number(a.sort_order||0)
);

loadFeatured(products);

loadNewArrivals(products);

loadFandoms(products);

}

function createCard(product){

return `
<div
class="card"
onclick="
window.location.href=
'product.html?id=${product.product_id}'
">

<img
src="${product.image || (product.images ? product.images[0] : '')}"
alt="${product.name}">

<h3>
${product.name}
</h3>

<p>
${product.fandom || ""}
</p>

<p>
฿${product.price}
</p>

</div>
`;

}

function loadFeatured(products){

const featured =
products.filter(
p =>
String(
p.featured
).toUpperCase() ===
"TRUE"
);

document
.getElementById(
"featuredProducts"
)
.innerHTML =
featured
.map(createCard)
.join("");

}

function loadNewArrivals(products){

const arrivals =
products.filter(
p =>
String(
p.new_arrival
).toUpperCase() ===
"TRUE"
);

document
.getElementById(
"newProducts"
)
.innerHTML =
arrivals
.map(createCard)
.join("");

}

function loadFandoms(products){

const fandoms =
[
...new Set(
products
.map(
p=>p.fandom
)
.filter(Boolean)
)
];

let html = "";

fandoms.forEach(fandom=>{

html += `
<button
style="
margin:5px;
padding:8px 12px;
cursor:pointer;
"
onclick="
filterByFandom(
'${fandom}'
)
">
${fandom}
</button>
`;

});

document
.getElementById(
"fandomList"
)
.innerHTML =
html;

}

function filterByFandom(fandom){

document
.getElementById(
"search"
)
.value =
fandom;

searchProducts();

}

function searchProducts(){

const keyword =
document
.getElementById(
"search"
)
.value
.toLowerCase()
.trim();

const container =
document.getElementById(
"searchResults"
);

if(!keyword){

container.innerHTML = "";

return;

}

const results =
window.allProducts.filter(

product =>

(product.name || "")
.toLowerCase()
.includes(keyword)

||

(product.fandom || "")
.toLowerCase()
.includes(keyword)

||

(product.sub_category || "")
.toLowerCase()
.includes(keyword)

);

container.innerHTML =

`
<h2>
🔍 ผลการค้นหา
</h2>
`

+

results
.map(createCard)
.join("");

}

loadHome();

</script>

</body>

</html>
