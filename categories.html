<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1">

<title>
หมวดสินค้า
</title>

<style>

body{

font-family:
'Kodchasan',
sans-serif;

background:#f6fbff;

padding:20px;

}

h1{

color:#4a6fa5;

margin-bottom:20px;

}

.category-grid{

display:grid;

grid-template-columns:
repeat(
auto-fill,
minmax(
220px,
1fr
)
);

gap:20px;

}

.category-card{

background:white;

padding:25px;

border-radius:20px;

cursor:pointer;

text-align:center;

box-shadow:
0 3px 15px
rgba(
125,
207,
255,
0.15
);

transition:.2s;

}

.category-card:hover{

transform:
translateY(-4px);

}

.category-card h2{

margin:0;

color:#4a6fa5;

}

.category-card p{

margin-top:10px;

color:#6b7280;

font-size:14px;

}

.navbar{

display:flex;

flex-wrap:wrap;

gap:12px;

padding:15px 20px;

margin-bottom:25px;

background:white;

border-radius:20px;

box-shadow:
0 3px 15px
rgba(
125,
207,
255,
0.15
);

}

.navbar a{

text-decoration:none;

font-weight:700;

color:#4a6fa5;

}

.navbar a:hover{

color:#2563eb;

}
  
</style>

</head>

<body>

<div class="navbar">

<a href="home.html">
🏠 หน้าแรก
</a>

<a href="categories.html">
🏷️ หมวดสินค้า
</a>

<a href="lookup.html">
📦 เช็กออเดอร์
</a>

<a href="change-address.html">
📍 เปลี่ยนที่อยู่
</a>

<a
href="cart.html"
id="cartLink">

🛒 ตะกร้า (0)

</a>

<a href="https://x.com/prewithrinka">
📞 ติดต่อร้าน
</a>

</div>

<h1>
🏷️ หมวดสินค้า
</h1>

<div
id="categories"
class="category-grid">
</div>

<script>

const API =

"https://script.google.com/macros/s/AKfycbxKjVvn8AXrK0wDvKqN-A9yS2Vk8R-w25ar1b9ftiIdUgUvFaShunLnFnAyIDuaTWj76w/exec?action=products";

loadCategories();

async function loadCategories(){

const response =
await fetch(API);

const products =
await response.json();

const categories =

[
...new Set(
products
.map(
p => p.main_category
)
.filter(Boolean)
)
];

document
.getElementById(
"categories"
)
.innerHTML =

categories.map(category => {

const count =

products.filter(
p=>p.main_category === category
).length;

return `

<div
class="category-card"
onclick="
window.location.href=
'category.html?name=${encodeURIComponent(category)}'
">

<h2>

${category}

</h2>

<p>

${count}
รายการ

</p>

</div>

`;

}).join("");

}

updateCartCount();

function updateCartCount(){

const cart =

JSON.parse(
localStorage.getItem(
"cart"
) || "[]"
);

const count =

cart.reduce(

(sum,item)=>

sum +
Number(item.qty || 0),

0

);

const cartLink =

document.getElementById(
"cartLink"
);

if(cartLink){

cartLink.textContent =

`🛒 ตะกร้า (${count})`;

}

}
loadHome();
</script>

</body>

</html>
