<script>

const API =

"https://script.google.com/macros/s/AKfycbxKjVvn8AXrK0wDvKqN-A9yS2Vk8R-w25ar1b9ftiIdUgUvFaShunLnFnAyIDuaTWj76w/exec?action=products";

loadCategories();

async function loadCategories(){

  try{

    const response =
      await fetch(API);

    const result =
      await response.json();

    const products =
      Array.isArray(result)
        ? result
        : Array.isArray(result.products)
          ? result.products
          : [];

    const categories = [
      ...new Set(
        products
          .map(
            product =>
              product.main_category
          )
          .filter(Boolean)
      )
    ];

    document
      .getElementById(
        "categories"
      )
      .innerHTML =

      categories.map(category=>{

        const count =
          products.filter(
            product =>
              product.main_category ===
              category
          ).length;

        return `

          <div
          class="category-card"
          onclick="
            window.location.href=
            'browse.html?type=main_category&value=${encodeURIComponent(category)}'
          ">

            <h2>
              ${category}
            </h2>

            <p>
              ${count} รายการ
            </p>

          </div>

        `;

      }).join("");

  }catch(error){

    console.error(
      "โหลดหมวดสินค้าไม่สำเร็จ",
      error
    );

    document
      .getElementById(
        "categories"
      )
      .innerHTML = `
        <p>
          โหลดหมวดสินค้าไม่สำเร็จ
        </p>
      `;

  }

}

function updateCartCount(){

const cart =

JSON.parse(
localStorage.getItem(
"cart"
) || "[]"
);

const count =

cart.reduce(

(sum,item)=>

sum +
Number(item.qty || 0),

0

);

const cartCount =
document.getElementById(
"cartCount"
);

if(cartCount){

cartCount.textContent =
count;

}
}
  
</script>
