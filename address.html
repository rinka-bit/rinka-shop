<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1">

<title>เพิ่มที่อยู่</title>

<style>

body{

font-family:sans-serif;

background:#f8fbff;

padding:20px;

}

.container{

max-width:600px;

margin:auto;

}

.card{

background:white;

padding:20px;

border-radius:16px;

box-shadow:
0 2px 10px rgba(0,0,0,.05);

}

input,
textarea{

width:100%;

padding:12px;

margin-bottom:12px;

box-sizing:border-box;

border:1px solid #ddd;

border-radius:10px;

}

button{

width:100%;

padding:14px;

border:none;

border-radius:12px;

background:#7dcfff;

color:white;

font-size:16px;

font-weight:700;

cursor:pointer;

}

h1{

text-align:center;

margin-bottom:20px;

}

@keyframes spin{

from{
transform:rotate(0deg);
}

to{
transform:rotate(360deg);
}

}

</style>

</head>

<body>

<div class="container">

<h1>

📍 เพิ่มที่อยู่จัดส่ง

</h1>

<div class="card">

<input
id="receiver"
placeholder="ชื่อผู้รับ">

<input
id="phone"
placeholder="เบอร์โทร">

<textarea
id="address"
placeholder="ที่อยู่"></textarea>

<input
id="subdistrict"
placeholder="แขวง / ตำบล">

<input
id="district"
placeholder="เขต / อำเภอ">

<input
id="province"
placeholder="จังหวัด">

<input
id="postcode"
placeholder="รหัสไปรษณีย์">

<button
id="saveAddressBtn"
onclick="saveAddress()">

บันทึกที่อยู่

</button>

</div>

</div>

<script>

const API =
"https://script.google.com/macros/s/AKfycbxKjVvn8AXrK0wDvKqN-A9yS2Vk8R-w25ar1b9ftiIdUgUvFaShunLnFnAyIDuaTWj76w/exec";

const customer =

JSON.parse(
localStorage.getItem(
"customer"
) || "{}"
);

if(!customer.email){

window.location =
"login.html";

}

const params =
new URLSearchParams(
window.location.search
);

const addressId =
params.get("id");

if(addressId){

document.querySelector(
"h1"
).textContent =
"📍 แก้ไขที่อยู่จัดส่ง";

loadAddress();

}

async function loadAddress(){

const response =
await fetch(
API +
"?action=customerAddress&id=" +
encodeURIComponent(
addressId
)
);

const result =
  await response.json();

const data =
  result.address || result;

if(
  !data ||
  !data.address_id
){

  alert(
    "ไม่พบที่อยู่"
  );

  return;

}

alert(
"ไม่พบที่อยู่"
);

return;

}

document.getElementById("receiver").value =
data.receiver || "";

document.getElementById("phone").value =
data.phone || "";

document.getElementById("address").value =
data.address || "";

document.getElementById("subdistrict").value =
data.subdistrict || "";

document.getElementById("district").value =
data.district || "";

document.getElementById("province").value =
data.province || "";

document.getElementById("postcode").value =
data.postcode || "";

}

async function saveAddress(){

  const btn =
    document.getElementById(
      "saveAddressBtn"
    );

  if(btn.disabled){
    return;
  }

  btn.disabled = true;

  btn.textContent =
    "กำลังบันทึก...";

  document.getElementById(
    "loadingOverlay"
  ).style.display =
    "flex";

  try{

    const payload = {

      address_id:
        addressId || "",

      email:
        customer.email,

      receiver:
        document.getElementById(
          "receiver"
        ).value,

      phone:
        document.getElementById(
          "phone"
        ).value,

      address:
        document.getElementById(
          "address"
        ).value,

      subdistrict:
        document.getElementById(
          "subdistrict"
        ).value,

      district:
        document.getElementById(
          "district"
        ).value,

      province:
        document.getElementById(
          "province"
        ).value,

      postcode:
        document.getElementById(
          "postcode"
        ).value,

      label:"บ้าน",

      is_default:true

    };

    if(
      !payload.receiver ||
      !payload.phone ||
      !payload.address
    ){

      alert(
        "กรุณากรอกข้อมูลให้ครบ"
      );

      btn.disabled = false;

      btn.textContent =
        "บันทึกที่อยู่";

      document.getElementById(
        "loadingOverlay"
      ).style.display =
        "none";

      return;

    }

    const formData =
      new FormData();

    formData.append(
      "action",
      "saveCustomerAddress"
    );

    formData.append(
      "payload",
      JSON.stringify(payload)
    );

    const response =
      await fetch(
        API,
        {
          method:"POST",
          body:formData
        }
      );

    const result =
      await response.json();

    if(result.success){

      alert(
        "บันทึกที่อยู่เรียบร้อย"
      );

      const from =
        new URLSearchParams(
          window.location.search
        ).get("from");

      if(from === "register"){

        window.location =
          "home.html";

      }else{

        window.location =
          "address-book.html";

      }

    }else{

      alert(
        result.error ||
        "บันทึกที่อยู่ไม่สำเร็จ"
      );

      btn.disabled = false;

      btn.textContent =
        "บันทึกที่อยู่";

      document.getElementById(
        "loadingOverlay"
      ).style.display =
        "none";

    }

  }catch(error){

    console.error(error);

    alert(
      "เกิดข้อผิดพลาด กรุณาลองใหม่"
    );

    btn.disabled = false;

    btn.textContent =
      "บันทึกที่อยู่";

    document.getElementById(
      "loadingOverlay"
    ).style.display =
      "none";

  }

}

</script>

<div
id="loadingOverlay"
style="
display:none;
position:fixed;
inset:0;
background:rgba(0,0,0,.6);
z-index:9999;
justify-content:center;
align-items:center;
">

<div
style="
background:white;
padding:30px;
border-radius:20px;
text-align:center;
">

<div
style="
font-size:50px;
animation:spin 1s linear infinite;
">

📍

</div>

<p>
กำลังบันทึกที่อยู่...
</p>

</div>

</div>
  
</body>

</html>
