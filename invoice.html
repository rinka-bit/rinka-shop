<script>

const API =
  "https://script.google.com/macros/s/AKfycbxKjVvn8AXrK0wDvKqN-A9yS2Vk8R-w25ar1b9ftiIdUgUvFaShunLnFnAyIDuaTWj76w/exec";


let CURRENT_INVOICE = null;

let CURRENT_BANKS = [];

let SELECTED_BANK = null;

let PAYMENT_SUBMITTING = false;


/*
=========================================
GET INVOICE ID
=========================================
*/

function getInvoiceId(){

  const params =
    new URLSearchParams(
      window.location.search
    );

  return String(
    params.get("id") || ""
  ).trim();

}


/*
=========================================
LOAD INVOICE
=========================================
*/

async function loadInvoice(){

  const root =
    document.getElementById(
      "invoiceRoot"
    );

  const invoiceId =
    getInvoiceId();


  if(!invoiceId){

    root.innerHTML = `

      <div class="error">

        ❌ ไม่พบ Invoice ID

      </div>

    `;

    return;

  }


  try{

    const url =
  API +
  "?action=dmInvoice" +
  "&invoice_id=" +
  encodeURIComponent(invoiceId);


    const response =
      await fetch(
        url,
        {
          method:"GET"
        }
      );


    if(!response.ok){

      throw new Error(
        "HTTP " +
        response.status
      );

    }


    const result =
      await response.json();


    if(
      !result ||
      result.success !== true
    ){

      throw new Error(
        result?.error ||
        "ไม่สามารถโหลด Invoice ได้"
      );

    }


    CURRENT_INVOICE =
      result.invoice || {};


    renderInvoice(
      result
    );


    /*
    โหลดบัญชีธนาคารหลังจาก
    Invoice โหลดสำเร็จ
    */

    await loadBanks();


  }catch(error){

    console.error(
      "loadInvoice error:",
      error
    );


    root.innerHTML = `

      <div class="error">

        ❌ ไม่สามารถโหลด Invoice ได้

        <br><br>

        ${escapeHtml(
          error.message ||
          String(error)
        )}

      </div>

    `;

  }

}


/*
=========================================
LOAD BANKS
=========================================
*/

async function loadBanks(){

  const container =
    document.getElementById(
      "bankAccounts"
    );


  if(!container){

    return;

  }


  try{

    const response =
      await fetch(
        API +
        "?action=banks"
      );


    if(!response.ok){

      throw new Error(
        "HTTP " +
        response.status
      );

    }


    const result =
      await response.json();


    /*
    รองรับทั้ง

    [
      {...}
    ]

    และ

    {
      success:true,
      data:[...]
    }
    */

    if(Array.isArray(result)){

      CURRENT_BANKS =
        result;

    }else if(
      Array.isArray(
        result?.data
      )
    ){

      CURRENT_BANKS =
        result.data;

    }else if(
      Array.isArray(
        result?.banks
      )
    ){

      CURRENT_BANKS =
        result.banks;

    }else{

      CURRENT_BANKS = [];

    }


    renderBanks();


  }catch(error){

    console.error(
      "loadBanks error:",
      error
    );


    container.innerHTML = `

      <div class="bank-empty">

        ไม่สามารถโหลดข้อมูลบัญชีธนาคารได้

      </div>

    `;

  }

}


/*
=========================================
RENDER BANKS
=========================================
*/

function renderBanks(){

  const container =
    document.getElementById(
      "bankAccounts"
    );


  if(!container){

    return;

  }


  if(
    !CURRENT_BANKS.length
  ){

    container.innerHTML = `

      <div class="bank-empty">

        ยังไม่มีข้อมูลบัญชีธนาคาร

      </div>

    `;

    return;

  }


  container.innerHTML =
    CURRENT_BANKS
      .map(
        (
          bank,
          index
        ) => {

          const bankId =
            String(
              bank.bank_id ||
              bank.account_id ||
              bank.id ||
              index
            );


          const bankName =
            bank.bank_name ||
            bank.name ||
            "ธนาคาร";


          const accountName =
            bank.account_name ||
            bank.account_holder ||
            bank.holder_name ||
            "";


          const accountNumber =
            bank.account_number ||
            bank.account_no ||
            "";


          const qr =
            bank.qr_url ||
            bank.qr_image ||
            bank.qr ||
            "";


          return `

<div
  class="bank-card"
  data-bank-index="${index}"
  onclick="selectBank(${index})"
>

  <div class="bank-name">

    ${escapeHtml(
      bankName
    )}

  </div>


  <div class="bank-detail">

    ${
      accountName
        ? `
          ชื่อบัญชี:
          ${escapeHtml(
            accountName
          )}
          <br>
        `
        : ""
    }


    ${
      accountNumber
        ? `
          เลขบัญชี:
          <strong>
            ${escapeHtml(
              accountNumber
            )}
          </strong>
        `
        : ""
    }

  </div>


  ${
    qr
      ? `
        <img
          src="${escapeHtml(qr)}"
          alt="QR"
          style="
            width:150px;
            max-width:100%;
            margin-top:12px;
            border-radius:10px;
          "
        >
      `
      : ""
  }

</div>

`;

        }
      )
      .join("");

}


/*
=========================================
SELECT BANK
=========================================
*/

function selectBank(
  index
){

  SELECTED_BANK =
    CURRENT_BANKS[
      index
    ] || null;


  document
    .querySelectorAll(
      ".bank-card"
    )
    .forEach(
      card => {

        card.classList.remove(
          "selected"
        );

      }
    );


  const selected =
    document.querySelector(
      '[data-bank-index="' +
      index +
      '"]'
    );


  if(selected){

    selected.classList.add(
      "selected"
    );

  }

}

/*

ITEM

function renderItem(
  item
){

  const imageUrl =
    String(
      item.image_url || ""
    ).trim();


  const imageHtml =
    imageUrl
      ? `

        <img
          class="item-image"
          src="${escapeHtml(
            imageUrl
          )}"
          alt=""
          onerror="
            this.style.display='none';
            this.nextElementSibling.style.display='flex';
          "
        >

        <div
          class="item-no-image"
          style="display:none;"
        >
          ไม่มีรูป
        </div>

      `
      : `

        <div class="item-no-image">

          ไม่มีรูปสินค้า

        </div>

      `;


  const character =
    String(
      item.character_name || ""
    ).trim();


  return `

    <div class="item">

      <div>

        ${imageHtml}

      </div>


      <div>

        <div class="item-name">

          ${escapeHtml(
            item.product_name || ""
          )}

        </div>


        ${
          character
            ? `

              <div class="item-character">

                ตัวละคร:
                ${escapeHtml(
                  character
                )}

              </div>

            `
            : ""
        }


        <div class="item-meta">

          <span>

            ${money(
              item.unit_price
            )}
            บาท ×
            ${Number(
              item.quantity || 0
            )}

          </span>


          <span class="item-total">

            ${money(
              item.total
            )}
            บาท

          </span>

        </div>

      </div>

    </div>

  `;

}


/*
=========================================
PREVIEW SLIP
=========================================
*/

function previewSlip(
  input
){

  const preview =
    document.getElementById(
      "slipPreview"
    );


  if(
    !preview ||
    !input.files ||
    !input.files[0]
  ){

    if(preview){

      preview.style.display =
        "none";

      preview.removeAttribute(
        "src"
      );

    }

    return;

  }


  const file =
    input.files[0];


  if(
    !file.type.startsWith(
      "image/"
    )
  ){

    alert(
      "กรุณาเลือกไฟล์รูปภาพ"
    );

    input.value = "";

    return;

  }


  const reader =
    new FileReader();


  reader.onload =
    function(event){

      preview.src =
        event.target.result;

      preview.style.display =
        "block";

    };


  reader.readAsDataURL(
    file
  );

}


/*
=========================================
SUBMIT PAYMENT
=========================================
*/

async function submitPayment(){

  if(PAYMENT_SUBMITTING){

    return;

  }


  const message =
    document.getElementById(
      "paymentMessage"
    );


  const button =
    document.getElementById(
      "submitPaymentButton"
    );


  try{

    PAYMENT_SUBMITTING =
      true;


    if(message){

      message.className =
        "message";

      message.textContent = "";

    }


    const data =
      collectCustomerData();


    validateCustomerData(
      data
    );


    if(!SELECTED_BANK){

      throw new Error(
        "กรุณาเลือกบัญชีธนาคารที่โอน"
      );

    }


    const slipInput =
      document.getElementById(
        "paymentSlip"
      );


    if(
      !slipInput ||
      !slipInput.files ||
      !slipInput.files[0]
    ){

      throw new Error(
        "กรุณาแนบสลิปการโอนเงิน"
      );

    }


    const file =
      slipInput.files[0];


    if(
      !file.type.startsWith(
        "image/"
      )
    ){

      throw new Error(
        "ไฟล์สลิปต้องเป็นรูปภาพ"
      );

    }


    if(
      file.size >
      8 * 1024 * 1024
    ){

      throw new Error(
        "ไฟล์สลิปต้องมีขนาดไม่เกิน 8 MB"
      );

    }


    if(button){

      button.disabled =
        true;

      button.textContent =
        "⏳ กำลังส่งข้อมูล...";
    }


    const base64 =
      await fileToBase64(
        file
      );


    /*
    =========================================
    PAYMENT PAYLOAD

    Backend จะรับ action นี้ใน doPost
    =========================================
    */

    const payload = {

      action:
        "submitDMInvoicePayment",

      data:{

        invoice_id:
          getInvoiceId(),

        twitter:
          data.twitter,

        email:
          data.email,

        receiver:
          data.receiver,

        phone:
          data.phone,

        address:
          data.address,

        subdistrict:
          data.subdistrict,

        district:
          data.district,

        province:
          data.province,

        postcode:
          data.postcode,

        bank_account:
          getBankAccountValue(
            SELECTED_BANK
          ),

        transfer_date:
          data.transfer_date,

        transfer_time:
          data.transfer_time,

        slip_name:
          file.name,

        slip_mime_type:
          file.type,

        slip_base64:
          base64

      }

    };


    const response =
      await fetch(
        API,
        {

          method:
            "POST",

          headers:{
            "Content-Type":
              "text/plain;charset=utf-8"
          },

          body:
            JSON.stringify(
              payload
            )

        }
      );


    if(!response.ok){

      throw new Error(
        "HTTP " +
        response.status
      );

    }


    const result =
      await response.json();


    if(
      !result ||
      result.success !== true
    ){

      throw new Error(
        result?.error ||
        "ไม่สามารถแจ้งชำระเงินได้"
      );

    }


    if(message){

      message.className =
        "message success";


      message.innerHTML = `

        ✅ แจ้งชำระเงินเรียบร้อยแล้วค่ะ

        <br><br>

        ทางร้านจะตรวจสอบยอดและสลิป
        แล้วอัปเดตสถานะให้ค่ะ

      `;

    }


    /*
    ป้องกันการแจ้งซ้ำ
    */

    const formElements =
      document.querySelectorAll(
        "#customerTwitter, #customerEmail, #customerReceiver, #customerPhone, #customerAddress, #customerSubdistrict, #customerDistrict, #customerProvince, #customerPostcode, #transferDate, #transferTime, #paymentSlip"
      );


    formElements.forEach(
      element => {

        element.disabled =
          true;

      }
    );


    if(button){

      button.disabled =
        true;

      button.textContent =
        "✅ แจ้งชำระเงินแล้ว";

    }


  }catch(error){

    console.error(
      "submitPayment error:",
      error
    );


    if(message){

      message.className =
        "message error";


      message.innerHTML = `

        ❌ ไม่สามารถแจ้งชำระเงินได้

        <br><br>

        ${escapeHtml(
          error.message ||
          String(error)
        )}

      `;

    }


    if(button){

      button.disabled =
        false;

      button.textContent =
        "💳 แจ้งชำระเงิน";

    }

  }finally{

    PAYMENT_SUBMITTING =
      false;

  }

}

/*

function validateCustomerData(
  data
){

  const required = [

    [
      "Twitter / X",
      data.twitter
    ],

    [
      "Email",
      data.email
    ],

    [
      "ชื่อผู้รับ",
      data.receiver
    ],

    [
      "เบอร์โทร",
      data.phone
    ],

    [
      "ที่อยู่",
      data.address
    ],

    [
      "แขวง / ตำบล",
      data.subdistrict
    ],

    [
      "เขต / อำเภอ",
      data.district
    ],

    [
      "จังหวัด",
      data.province
    ],

    [
      "รหัสไปรษณีย์",
      data.postcode
    ],

    [
      "วันที่โอน",
      data.transfer_date
    ],

    [
      "เวลาโอน",
      data.transfer_time
    ]

  ];


  for(
    const item of required
  ){

    if(
      !String(
        item[1] || ""
      ).trim()
    ){

      throw new Error(
        "กรุณากรอก " +
        item[0]
      );

    }

  }


  if(
    !/^[^\s@]+@[^\s@]+\.[^\s@]+$/
      .test(
        data.email
      )
  ){

    throw new Error(
      "รูปแบบ Email ไม่ถูกต้อง"
    );

  }

}


/*
=========================================
BANK ACCOUNT VALUE
=========================================
*/

function getBankAccountValue(
  bank
){

  if(!bank){

    return "";

  }


  /*
  ถ้า Backend ต้องการ
  ชื่อธนาคาร + เลขบัญชี
  */

  const bankName =
    String(
      bank.bank_name ||
      bank.name ||
      ""
    ).trim();


  const accountNumber =
    String(
      bank.account_number ||
      bank.account_no ||
      ""
    ).trim();


  const accountName =
    String(
      bank.account_name ||
      bank.account_holder ||
      bank.holder_name ||
      ""
    ).trim();


  return [

    bankName,

    accountNumber,

    accountName

  ]
    .filter(Boolean)
    .join(" | ");

}


/*
=========================================
FILE TO BASE64
=========================================
*/

function fileToBase64(
  file
){

  return new Promise(
    (
      resolve,
      reject
    ) => {

      const reader =
        new FileReader();


      reader.onload =
        function(){

          const result =
            String(
              reader.result || ""
            );


          const comma =
            result.indexOf(",");


          if(
            comma === -1
          ){

            reject(
              new Error(
                "ไม่สามารถอ่านไฟล์สลิปได้"
              )
            );

            return;

          }


          resolve(
            result.slice(
              comma + 1
            )
          );

        };


      reader.onerror =
        function(){

          reject(
            new Error(
              "ไม่สามารถอ่านไฟล์สลิปได้"
            )
          );

        };


      reader.readAsDataURL(
        file
      );

    }
  );

}

/*
=========================================
MONEY
=========================================
*/

function money(
  value
){

  return Number(
    value || 0
  ).toLocaleString(
    "th-TH",
    {
      minimumFractionDigits:2,
      maximumFractionDigits:2
    }
  );

}


/*
=========================================
DATE
=========================================
*/

function formatDate(
  value
){

  if(!value){

    return "";

  }


  const date =
    new Date(
      value
    );


  if(
    Number.isNaN(
      date.getTime()
    )
  ){

    return String(
      value
    );

  }


  return date.toLocaleString(
    "th-TH",
    {
      dateStyle:"medium",
      timeStyle:"short"
    }
  );

}


/*
=========================================
ESCAPE
=========================================
*/

function escapeHtml(
  value
){

  return String(
    value ?? ""
  )
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

}
