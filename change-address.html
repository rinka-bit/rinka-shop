📍 ขอเปลี่ยนที่อยู่จัดส่ง
</h1>

<input
id="orderId"
placeholder="เลขออเดอร์">

<input
id="customerName"
placeholder="ชื่อผู้สั่ง">

<input
id="phone"
placeholder="เบอร์โทรศัพท์">

<input
id="social"
placeholder="@Twitter / X">

<textarea
id="address"
rows="5"
placeholder="กรอกที่อยู่ใหม่">
</textarea>

<button
onclick="submitRequest()">

ส่งคำขอเปลี่ยนที่อยู่

</button>

<script>

const API =
"https://script.google.com/macros/s/AKfycbxKjVvn8AXrK0wDvKqN-A9yS2Vk8R-w25ar1b9ftiIdUgUvFaShunLnFnAyIDuaTWj76w/exec";

async function submitRequest(){

  const payload = {

    order_id:
      document.getElementById(
        "orderId"
      ).value.trim(),

    customer_name:
      document.getElementById(
        "customerName"
      ).value.trim(),

    phone:
      document.getElementById(
        "phone"
      ).value.trim(),

    social:
      document.getElementById(
        "social"
      ).value.trim(),

    address:
      document.getElementById(
        "address"
      ).value.trim()

  };

  if(
    !payload.order_id ||
    !payload.customer_name ||
    !payload.address
  ){

    alert(
      "กรุณากรอกข้อมูลให้ครบ"
    );

    return;

  }

  try{

    const formData =
      new FormData();

    formData.append(
      "action",
      "changeAddress"
    );

    formData.append(
      "payload",
      JSON.stringify(payload)
    );

    const response =
      await fetch(
        API,
        {
          method:"POST",
          body:formData
        }
      );

    const result =
      await response.json();

    if(result.success){

      alert(
        "ส่งคำขอเรียบร้อย"
      );

      location.reload();

    }else{

      alert(
        result.error ||
        "เกิดข้อผิดพลาด"
      );

    }

  }catch(error){

    console.error(error);

    alert(
      "ไม่สามารถเชื่อมต่อเซิร์ฟเวอร์ได้"
    );

  }

}

function updateCartCount(){

const cart =

JSON.parse(
localStorage.getItem(
"cart"
) || "[]"
);

const count =

cart.reduce(

(sum,item)=>

sum +
Number(item.qty || 0),

0

);

const cartCount =
document.getElementById(
"cartCount"
);

if(cartCount){

cartCount.textContent =
count;

}

}

</script>
