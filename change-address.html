<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1">

</title>

<style>

body{
font-family:'Kodchasan',sans-serif;
background:#f6fbff;
max-width:800px;
margin:auto;
padding:20px;
}

.navbar{

display:flex;
flex-wrap:wrap;
gap:12px;

padding:15px 20px;

margin-bottom:25px;

background:white;

border-radius:20px;

box-shadow:
0 3px 15px
rgba(
125,
207,
255,
0.15
);

}

.navbar a{

text-decoration:none;

font-weight:700;

color:#4a6fa5;

}

.navbar a:hover{

color:#2563eb;

}

h1{

color:#4a6fa5;

}

input,
textarea{

width:100%;

padding:12px;

box-sizing:border-box;

margin-bottom:12px;

border:1px solid #ddd;

border-radius:10px;

}

button{

padding:12px 20px;

border:none;

border-radius:10px;

background:#7dcfff;

color:white;

font-weight:700;

cursor:pointer;

}

</style>

</head>

<body>

<div class="navbar">

<a href="home.html">
🏠 หน้าแรก
</a>

<a href="categories.html">
🏷️ หมวดสินค้า
</a>

<a href="lookup.html">
📦 เช็กออเดอร์
</a>

<a href="change-address.html">
📍 เปลี่ยนที่อยู่
</a>

<a
href="cart.html"
id="cartLink">

🛒 ตะกร้า (0)

</a>

<a href="https://x.com/prewithrinka">
📞 ติดต่อร้าน
</a>

</div>

<h1>
📍 ขอเปลี่ยนที่อยู่จัดส่ง
</h1>

<input
id="orderId"
placeholder="เลขออเดอร์">

<input
id="customerName"
placeholder="ชื่อผู้สั่ง">

<input
id="phone"
placeholder="เบอร์โทรศัพท์">

<input
id="social"
placeholder="@Twitter / X">

<textarea
id="address"
rows="5"
placeholder="กรอกที่อยู่ใหม่">
</textarea>

<button
onclick="submitRequest()">

ส่งคำขอเปลี่ยนที่อยู่

</button>

<script>

const API =
"https://script.google.com/macros/s/AKfycbxKjVvn8AXrK0wDvKqN-A9yS2Vk8R-w25ar1b9ftiIdUgUvFaShunLnFnAyIDuaTWj76w/exec";

async function submitRequest(){

const payload = {

order_id:
document.getElementById(
"orderId"
).value,

customer_name:
document.getElementById(
"customerName"
).value,

phone:
document.getElementById(
"phone"
).value,

social:
document.getElementById(
"social"
).value,

address:
document.getElementById(
"address"
).value

};

const formData =
new FormData();

formData.append(
"payload",
JSON.stringify(payload)
);

const response =
await fetch(

API +
"?action=changeAddress",

{
method:"POST",
body:formData
}

);

const result =
await response.json();

if(result.success){

alert(
"ส่งคำขอเรียบร้อย"
);

location.reload();

}else{

alert(
"เกิดข้อผิดพลาด"
);

}

}

<script>

updateCartCount();

function updateCartCount(){

const cart =

JSON.parse(
localStorage.getItem(
"cart"
) || "[]"
);

const count =

cart.reduce(

(sum,item)=>

sum +
Number(item.qty || 0),

0

);

const cartLink =

document.getElementById(
"cartLink"
);

if(cartLink){

cartLink.textContent =

`🛒 ตะกร้า (${count})`;

}

}

</script>

</body>
