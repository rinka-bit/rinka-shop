<meta name="viewport"

<style>

body{
font-family:'Kodchasan',sans-serif;
background:#f6fbff;
max-width:800px;
margin:auto;
padding:20px;
padding-top:90px;
}

h1{

color:#4a6fa5;

}

input,
textarea{

width:100%;

padding:12px;

box-sizing:border-box;

margin-bottom:12px;

border:1px solid #ddd;

border-radius:10px;

}

button{

padding:12px 20px;

border:none;

border-radius:10px;

background:#7dcfff;

color:white;

font-weight:700;

cursor:pointer;

}

.page-header{

display:flex;
justify-content:space-between;
align-items:center;

padding:16px 24px;

background:#fff;

position:sticky;

top:0;

z-index:100;

box-shadow:
0 3px 10px
rgba(0,0,0,.05);

}

.icon-btn{

width:auto !important;

border:none;
background:none;

font-size:32px;

padding:0;

cursor:pointer;

}

.cart-btn{

position:relative;

font-size:28px;

text-decoration:none;

width:auto !important;

}

#cartCount{

position:absolute;

top:-8px;

right:-8px;

background:#ff5c7a;

color:white;

font-size:12px;

padding:2px 6px;

border-radius:20px;

}

.overlay{

position:fixed;

inset:0;

background:rgba(0,0,0,.35);

z-index:999;

opacity:1;

transition:.25s;

}

.overlay.hidden{

opacity:0;

pointer-events:none;

}

.side-menu{

position:fixed;

top:0;

left:0;

width:280px;

max-width:80%;

height:100vh;

background:#fff;

z-index:1000;

box-shadow:0 0 30px rgba(0,0,0,.15);

transform:translateX(-100%);

transition:.3s ease;

display:flex;

flex-direction:column;

}

.side-menu.open{

transform:translateX(0);

}

.menu-header{

padding:24px;

border-bottom:1px solid #eee;

}

.side-menu a{

padding:18px 24px;

font-size:16px;

font-weight:600;

text-decoration:none;

color:#333;

}

.side-menu a:hover{

background:#f7f9ff;

}

.back-btn{
margin:16px 0;
padding:10px 16px;
border:none;
border-radius:999px;
background:#e0f2fe;
color:#2563eb;
font-weight:700;
cursor:pointer;
}
  
</style>

</head>

<body>

<header class="page-header">

<button
id="menuButton"
class="icon-btn">

☰

</button>

<h1 id="pageTitle">

</h1>

class="cart-btn">

0

</span>

</a>

</header>

<div
id="overlay"
class="overlay hidden">
</div>

<aside
id="sideMenu"
class="side-menu">

<div class="menu-header">

<h2>
Rinka Shop
</h2>

</div>

<a href="home.html">🏠 หน้าแรก</a>
<a href="browse.html">🛍️ สินค้าทั้งหมด</a>
<a href="categories.html">🏷️ หมวดสินค้า</a>

</aside>

<button
class="back-btn"
onclick="history.back()">

← ย้อนกลับ

</button>
  
<h1>
📍 ขอเปลี่ยนที่อยู่จัดส่ง
</h1>

<input
id="orderId"
placeholder="เลขออเดอร์">

<input
id="customerName"
placeholder="ชื่อผู้สั่ง">

<input
id="phone"
placeholder="เบอร์โทรศัพท์">

<input
id="social"
placeholder="@Twitter / X">

<textarea
id="address"
rows="5"
placeholder="กรอกที่อยู่ใหม่">
</textarea>

<button
onclick="submitRequest()">

ส่งคำขอเปลี่ยนที่อยู่

</button>

<script>

const API =
"https://script.google.com/macros/s/AKfycbxKjVvn8AXrK0wDvKqN-A9yS2Vk8R-w25ar1b9ftiIdUgUvFaShunLnFnAyIDuaTWj76w/exec";

async function submitRequest(){

const payload = {

order_id:
document.getElementById(
"orderId"
).value,

customer_name:
document.getElementById(
"customerName"
).value,

phone:
document.getElementById(
"phone"
).value,

social:
document.getElementById(
"social"
).value,

address:
document.getElementById(
"address"
).value

};

const formData =
new FormData();

formData.append(
"payload",
JSON.stringify(payload)
);

const response =
await fetch(

API +
"?action=changeAddress",

{
method:"POST",
body:formData
}

);

const result =
await response.json();

if(result.success){

alert(
"ส่งคำขอเรียบร้อย"
);

location.reload();

}else{

alert(
"เกิดข้อผิดพลาด"
);

}

}

updateCartCount();

function updateCartCount(){

const cart =

JSON.parse(
localStorage.getItem(
"cart"
) || "[]"
);

const count =

cart.reduce(

(sum,item)=>

sum +
Number(item.qty || 0),

0

);

const cartCount =
document.getElementById(
"cartCount"
);

if(cartCount){

cartCount.textContent =
count;

}

}

</script>

<script src="menu.js"></script>
  
</body>

</html>
